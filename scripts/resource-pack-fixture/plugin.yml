name: ResourcePackDoctorProbe
version: '1.0'
main: io.github.wickidcow.validation.ResourcePackDoctorProbe
api-version: '1.21.11'
folia-supported: true
depend: [Slimefun]
commands:
  rpdoctorprobe:
    permission: rpdoctorprobe.run
    description: Synthetic disposable-server resource-pack migration probe
    usage: /rpdoctorprobe <prepare|preview|checkpoint|installed|deferred|ownership-prepare|ownership-deferred|uninstalled|restarted>
permissions:
  rpdoctorprobe.run:
    default: op

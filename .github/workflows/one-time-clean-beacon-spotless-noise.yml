name: One-time Clean Beacon Spotless Noise

on:
  push:
    branches:
      - feature/adventurers-curios-expansion
    paths:
      - .github/workflows/one-time-clean-beacon-spotless-noise.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/adventurers-curios-expansion
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Restore unrelated files from pre-Beacon source
        shell: bash
        run: |
          set -euo pipefail
          BASE=95b41a5c36be21ec5c14395645f50a4012763513
          git checkout "$BASE" -- \
            src/main/java/io/github/thebusybiscuit/slimefun4/api/player/PlayerProfile.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/core/commands/subcommands/UpgradeDiagnostics.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/core/multiblocks/MultiBlockMachine.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/core/networks/cargo/CargoNetworkTask.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/blocks/BlockPlacer.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/blocks/Composter.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlus.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusAdminCommand.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusChunkLoadingControl.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusConfig.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusEffect.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusEffectListener.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusLegacyDataStore.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusManager.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusProgression.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusPyramid.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/EchoLantern.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/ExpeditionJournal.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/MinersCanary.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/StormGlass.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/TravelersBedroll.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/electric/machines/entities/AbstractEntityAssembler.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/electric/reactors/Reactor.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/elevator/ElevatorPlate.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/gps/GPSTransmitter.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/magical/runes/EnchantmentRune.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/multiblocks/AbstractSmeltery.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/multiblocks/AutomatedPanningMachine.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/multiblocks/MagicWorkbench.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/multiblocks/MakeshiftSmeltery.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/multiblocks/OreWasher.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/multiblocks/Smeltery.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/weapons/ExplosiveBow.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/listeners/CoolerListener.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/setup/AdventurersCuriosSetup.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/tasks/AncientAltarTask.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/utils/VisualEffectUtils.java
          rm -f scripts/__pycache__/check_addon_binary_linkage.cpython-312.pyc

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-clean-beacon-spotless-noise.yml

      - name: Validate cleaned source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_adventurers_curios.py .
          python3 scripts/verify_special_item_correctness.py .
          python3 scripts/verify_legacy.py .
          chmod +x gradlew
          ./gradlew test shadowJar --no-daemon

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove unrelated Beacon formatting changes"
          git push origin HEAD:feature/adventurers-curios-expansion

name: Package Validated Modernized Addons

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/package-modernized-addon-bundle.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  VALIDATED_RUN_ID: '34420391485'

jobs:
  package:
    name: Package AlbionMC validated addon set
    runs-on: ubuntu-latest
    steps:
      - name: Download seven validated Legacy JAR artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: addon-*
          path: release-jars
          merge-multiple: true
          repository: wickidcow/Slimefun-Legacy
          run-id: ${{ env.VALIDATED_RUN_ID }}
          github-token: ${{ github.token }}

      - name: Verify changed JAR set
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            SF_ExtraTools1.2.1.jar
            SF_HotbarPets1.0.0.jar
            SF_SoulJars1.0.0.jar
            SF_SMG1.0.1.jar
            SF_BetterFarming1.0.0.jar
            SF_Magic8Ball1.0.0.jar
            SF_SlimyTreeTaps1.0.2.jar
          )
          for name in "${expected[@]}"; do
            test -s "release-jars/$name"
            unzip -tqq "release-jars/$name"
            jar tf "release-jars/$name" | grep -Fxq 'plugin.yml'
            if jar tf "release-jars/$name" | grep -Eqi '(^|/)guizhan|guizhanlib'; then
              echo "Forbidden utility-library classes found in $name" >&2
              exit 1
            fi
          done
          test "$(find release-jars -maxdepth 1 -type f -name '*.jar' | wc -l)" -eq 7

      - name: Download current v4.1.48 addon bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p base bundle
          gh release download v4.1.48 \
            --repo wickidcow/Slimefun-Legacy \
            --pattern 'SFL_AddonsNDependencies.zip' \
            --dir base
          unzip -q base/SFL_AddonsNDependencies.zip -d bundle

      - name: Replace old builds with validated JARs
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            'bundle/SF_ExtraTools vMODIFIED v0.1.jar' \
            'bundle/SF_HotbarPets-MODIFIED.jar' \
            'bundle/SF_SoulJars-MODIFIED.jar' \
            'bundle/SF_SMG vMODIFIED v0.3.jar' \
            'bundle/SF_betterfarming-Build 1 (git d8b712f).jar' \
            'bundle/SF_Magic8Ball-Dev.jar' \
            'bundle/SF_SlimyTreeTaps1.0.1.jar'
          cp release-jars/*.jar bundle/

          mapfile -t jars < <(find bundle -maxdepth 1 -type f -name '*.jar' -printf '%f\n' | sort)
          if [ "${#jars[@]}" -ne 41 ]; then
            echo "Expected 41 JARs, found ${#jars[@]}" >&2
            printf '%s\n' "${jars[@]}" >&2
            exit 1
          fi
          for jar in "${jars[@]}"; do unzip -tqq "bundle/$jar"; done

      - name: Build deterministic deployment artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -f SFL_AddonsNDependencies.zip SFL_AddonsNDependencies.sha256 AlbionMC-modernized-addon-jars.zip
          (cd bundle && zip -q -9 ../SFL_AddonsNDependencies.zip *.jar)
          (cd release-jars && zip -q -9 ../AlbionMC-modernized-addon-jars.zip *.jar)
          while IFS= read -r file; do
            sha256sum "bundle/$file" | sed 's#  bundle/#  #'
          done < <(find bundle -maxdepth 1 -type f -name '*.jar' -printf '%f\n' | sort) > SFL_AddonsNDependencies.sha256
          test "$(wc -l < SFL_AddonsNDependencies.sha256)" -eq 41
          sha256sum SFL_AddonsNDependencies.zip AlbionMC-modernized-addon-jars.zip release-jars/*.jar

      - name: Publish refreshed v4.1.48 bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v4.1.48 \
            --repo wickidcow/Slimefun-Legacy \
            SFL_AddonsNDependencies.zip SFL_AddonsNDependencies.sha256 \
            --clobber

      - name: Upload changed JARs for AlbionMC
        uses: actions/upload-artifact@v6
        with:
          name: AlbionMC-modernized-addon-jars
          path: |
            release-jars/*.jar
            AlbionMC-modernized-addon-jars.zip
          if-no-files-found: error

      - name: Upload refreshed Slimefun Legacy bundle
        uses: actions/upload-artifact@v6
        with:
          name: SFL_AddonsNDependencies
          path: |
            SFL_AddonsNDependencies.zip
            SFL_AddonsNDependencies.sha256
          if-no-files-found: error

name: Build English Slimefun

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Verify Slimefun Legacy invariants
        run: python3 scripts/verify_legacy.py .

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew spotlessApply --no-daemon
          ./gradlew clean build --no-daemon

      - name: Verify Java 21 bytecode target
        run: |
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$JAR"
          python3 scripts/check_bytecode_target.py "$JAR" --expected-java 21

      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: Slimefun-English-Albion
          path: |
            build/libs/Slimefun-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

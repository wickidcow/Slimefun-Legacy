name: WorldEdit Runtime Dependency Validation

on:
  push:
    branches: ['work/worldedit-required-runtime-validation']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Apply exact existing source edits
        run: |
          set -euo pipefail
          test "$(git hash-object .github/workflows/paper-26.3-full-stack.yml)" = 'de16fb4d68b3ef430c462d3b902c7885b6b2b99b'
          test "$(git hash-object scripts/full_stack_runtime_smoke.sh)" = '5560056611b49426f8c216987742aeb3f418624e'
          git apply --check .audit/worldedit-wiring.patch
          git apply .audit/worldedit-wiring.patch
          test "$(git hash-object .github/workflows/paper-26.3-full-stack.yml)" = '0ae0d9fcb2f8fba0ff5a9f925fb7c413c25d4884'
          test "$(git hash-object scripts/full_stack_runtime_smoke.sh)" = '088f636aa72de8b194efa638cabb0aac6dcb9594'
          git diff --check
      - name: Run dependency and wiring regression tests
        run: |
          set -euo pipefail
          mkdir -p audit-evidence
          python3 -m unittest discover -s scripts -p 'test_*worldedit*.py' -v 2>&1 | tee audit-evidence/offline-tests.txt
      - name: Validate real WorldEdit artifacts for all three lanes
        run: |
          set -euo pipefail
          python3 scripts/prepare_worldedit_runtime.py --minecraft 1.21.11 --output audit-evidence/worldedit-1.21.11
          python3 scripts/prepare_worldedit_runtime.py --minecraft 26.2 --output audit-evidence/worldedit-26.2
          python3 scripts/prepare_worldedit_runtime.py --minecraft 26.3 --allow-prerelease --output audit-evidence/worldedit-26.3
      - name: Preserve exact validated code blobs without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          names = ('.github/workflows/paper-26.3-full-stack.yml', 'scripts/full_stack_runtime_smoke.sh',
                   'scripts/prepare_worldedit_runtime.py', 'scripts/test_prepare_worldedit_runtime.py',
                   'scripts/test_worldedit_stack_integration.py')
          manifest = {}
          for name in names:
              data = Path(name).read_bytes()
              sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              body = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              result = subprocess.run(['gh','api','--method','POST',f"repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs",'--input','-','--jq','.sha'], input=body, text=True, capture_output=True, check=True)
              assert result.stdout.strip() == sha, name
              manifest[name] = sha
          Path('audit-evidence/validated-blobs.json').write_text(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: worldedit-dependency-evidence
          path: |
            audit-evidence/**/*.json
            audit-evidence/*.txt
          if-no-files-found: warn

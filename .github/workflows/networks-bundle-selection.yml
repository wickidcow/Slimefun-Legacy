name: Networks 1.0.47 Bundle Selection
on:
  push:
    branches: ['audit/ecosystem-resume-20261001']
    paths: ['.github/workflows/networks-bundle-selection.yml']
permissions:
  contents: write
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: cf09e5bc04cb912604e65bfeacce9dabeda5014a
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify merged source, actual reports and tested JAR identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import hashlib,io,json,subprocess,xml.etree.ElementTree as ET,zipfile
          from pathlib import Path
          repo='repos/wickidcow/SF_NetworksExp'
          head='a2e10dc92bb348b1b823ea2a45bcff61d6bf26ef'
          merged='ba79e6e36bd4798d37f7b8988efb414e7f041927'
          def api(path):return subprocess.run(['gh','api',path],check=True,capture_output=True,timeout=90).stdout
          pr=json.loads(api(repo+'/pulls/53'))
          assert pr['merged'] and pr['head']['sha']==head and pr['merge_commit_sha']==merged
          tree=json.loads(api(repo+'/git/commits/'+merged))['tree']['sha']
          assert tree==json.loads(api(repo+'/git/commits/'+head))['tree']['sha']=='4a9062f3fd95f892ade078b68cebde2df45b7e4f'
          run=json.loads(api(repo+'/actions/runs/36938589126'))
          assert run['head_sha']==head and run['conclusion']=='success' and run['path']=='.github/workflows/build.yml'
          def artifact(id,expected):
              meta=json.loads(api(f'{repo}/actions/artifacts/{id}'))
              assert not meta['expired'] and meta['workflow_run']['head_sha']==head
              raw=api(f'{repo}/actions/artifacts/{id}/zip')
              assert hashlib.sha256(raw).hexdigest()==expected and meta['digest']=='sha256:'+expected
              return raw
          report=artifact(11199396152,'b13af843b4cadd067a10531605634ff4a8f43051b705fb689a430961e7c928c8')
          roots=[]
          with zipfile.ZipFile(io.BytesIO(report)) as archive:
              assert archive.testzip() is None
              for name in archive.namelist():
                  if not name.endswith('.xml'):continue
                  data=archive.read(name);roots.append(ET.fromstring(data))
                  path=Path('evidence/tests',Path(name).name);path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data)
          totals={key:sum(int(root.attrib[key]) for root in roots) for key in ['tests','failures','errors','skipped']}
          assert totals==dict(tests=98,failures=0,errors=0,skipped=0)
          raw=artifact(11198987720,'4be3409037be07520a65e2100ceca29596742af4e200e4c1a6c21a5ad4be1039')
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              jars=[name for name in archive.namelist() if name.endswith('.jar')];assert len(jars)==1
              core=archive.read(jars[0])
          with zipfile.ZipFile(io.BytesIO(core)) as jar:
              assert jar.testzip() is None
              properties=jar.read('git.properties').decode()
              Path('evidence/tested-core-git.properties').write_text(properties)
          raw=artifact(11199406169,'b9d63570c30f4d0195393b567bddcf48973e1c103302526ecebbb3f67106e9ed')
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              assert archive.testzip() is None
              if 'plugin.yml' in archive.namelist():addon=raw
              else:
                  jars=[name for name in archive.namelist() if name.endswith('.jar')];assert len(jars)==1;addon=archive.read(jars[0])
          with zipfile.ZipFile(io.BytesIO(addon)) as jar:
              descriptor=jar.read('plugin.yml').decode()
              assert 'version: 1.0.47' in descriptor or "version: '1.0.47'" in descriptor or 'version: "1.0.47"' in descriptor
          Path('evidence/Networks.jar').write_bytes(addon)
          record=dict(repository='wickidcow/SF_NetworksExp',tested_commit=head,selected_commit=merged,same_tree=tree,run_id=36938589126,test_artifact=11199396152,totals=totals,jar_sha256=hashlib.sha256(addon).hexdigest(),tested_core_sha256=hashlib.sha256(core).hexdigest(),publication_verified=False)
          Path('evidence/networks-evidence.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
          python3 scripts/verify_addon_bytecode.py evidence/Networks.jar --expected-java 21 --report evidence/bytecode.json
      - name: Update only the intended source pin and its test evidence
        run: |
          python3 - <<'PY'
          import copy,json
          from pathlib import Path
          mf=Path('compatibility/sfl-addon-release-matrix.json');lf=Path('compatibility/maintained-addon-test-ledger.json')
          manifest=json.loads(mf.read_text());ledger=json.loads(lf.read_text())
          assert manifest['bundle_revision']==101 and len(manifest['addons'])==45
          assert ledger['bundle_revision']==100 and len(ledger['addons'])==45
          old_manifest=copy.deepcopy(manifest);old_ledger=copy.deepcopy(ledger)
          proof=json.loads(Path('evidence/networks-evidence.json').read_text())
          target='wickidcow/SF_NetworksExp'
          before={row['repository']:row['source_commit'] for row in manifest['addons']}
          assert before[target]=='5bc81686aa8e98275872d18e0ed39f83a3667c7c'
          for row in manifest['addons']:
              if row['repository']==target:row['source_commit']=proof['selected_commit']
          manifest['bundle_revision']=102
          after={row['repository']:row['source_commit'] for row in manifest['addons']}
          assert {name for name in before if before[name]!=after[name]}=={target}
          for old,new in zip(old_manifest['addons'],manifest['addons']):
              if old['repository']!=target:assert old==new
          for row in ledger['addons']:
              if row['repository']!=target:continue
              row.update(source_commit=proof['selected_commit'],full_build_result='PASS',reported_test_entries=98,failures=0,errors=0,skips=0)
              row['evidence']={'repository':target,'run_id':36938589126,'artifact_id':11199396152,'tested_commit':proof['tested_commit'],'selected_commit_same_tree':proof['same_tree'],'tested_core_sha256':proof['tested_core_sha256'],'kind':'Actual normal cross-core project build XML; merged source tree identical to tested head'}
              row['coverage']='98 passing project tests, including 17 new grid navigation/cache regressions; no live-client or populated-world certificate'
              row['setup_notes']=['Only this row is refreshed in revision102; other addon test evidence retains its original source/core attribution.']
          for old,new in zip(old_ledger['addons'],ledger['addons']):
              if old['repository']!=target:assert old==new
          ledger['bundle_revision']=102
          ledger['summary']['reported_test_entries']=sum(row['reported_test_entries'] for row in ledger['addons'])
          mismatches=[{'repository':row['repository'],'selected_commit':after[row['repository']],'last_tested_commit':row['source_commit']} for row in ledger['addons'] if row['source_commit']!=after[row['repository']]]
          ledger['limitations'].append('Revision102 refreshes only Networks using 98 normal-PR test entries and an identical merged source tree. Other rows retain earlier evidence; pre-existing selected/tested-source differences are recorded in the resume checkpoint and are not relabeled as newly tested.')
          mf.write_text(json.dumps(manifest,indent=2)+'\n');lf.write_text(json.dumps(ledger,indent=2)+'\n')
          Path('evidence/preexisting-ledger-selection-differences.json').write_text(json.dumps(mismatches,indent=2)+'\n')
          Path('evidence/ledger-summary.json').write_text(json.dumps(ledger['summary'],indent=2)+'\n')
          print('Preserved all45 addon members and44 unchanged pins; ledger totals:',ledger['summary'])
          print('Separately retained historical evidence differences:',mismatches)
          PY
          python3 scripts/verify_legacy.py . > evidence/source-invariants.log 2>&1
          git diff --check
      - name: Stage verified metadata files without changing master or release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          records={}
          for name in ['compatibility/sfl-addon-release-matrix.json','compatibility/maintained-addon-test-ledger.json']:
              data=Path(name).read_bytes();sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              result=subprocess.run(['gh','api','--method','POST','repos/wickidcow/Slimefun-Legacy/git/blobs','--input','-'],input=json.dumps(dict(content=data.decode(),encoding='utf-8')),capture_output=True,text=True,check=True)
              assert json.loads(result.stdout)['sha']==sha;records[name]=sha
              path=Path('evidence/reviewed-source')/name;path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data)
          Path('evidence/reviewed-blobs.json').write_text(json.dumps(records,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: networks-bundle-102-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: error

name: Exact-source Release Readiness Validation

on:
  push:
    branches: ['work/release-readiness-20261001']

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preserve exact tracked source for independent review
        run: |
          mkdir -p "$RUNNER_TEMP/source-review"
          git archive --format=zip HEAD > "$RUNNER_TEMP/source-review/source.zip"
          git ls-tree -r HEAD > "$RUNNER_TEMP/source-review/git-blob-manifest.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/source-review/source-commit.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: release-readiness-source
          path: ${{ runner.temp }}/source-review/
          retention-days: 7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Pin actual checked-out source identity
        run: |
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Verify retained invariants
        run: |
          set -euo pipefail
          mkdir -p audit-evidence
          python3 scripts/verify_legacy.py . 2>&1 | tee audit-evidence/invariants.log
      - name: Build and inspect actual release candidate metadata
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew spotlessApply --no-daemon
          ./gradlew clean --no-daemon
          mkdir -p build/reports
          ./gradlew build -PslimefunDeprecationReport=true --console=plain --no-daemon 2>&1 | tee build/reports/deprecation-compile.log
          python3 scripts/summarize_deprecations.py build/reports/deprecation-compile.log --fail-on-warnings --require-successful-build
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          cp "$JAR" audit-evidence/candidate.jar
          python3 scripts/verify_release_artifact.py "$JAR" --root .
      - name: Preserve diagnostic and build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-readiness-evidence
          retention-days: 14
          path: |
            audit-evidence/
            build/reports/deprecation-compile.log
            build/reports/deprecations.md
            build/reports/release-artifact.*
            build/test-results/test/TEST-*.xml
          if-no-files-found: warn

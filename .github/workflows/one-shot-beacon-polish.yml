name: One-shot final Beacon Plus polish

on:
  push:
    branches:
      - 'fix/beacon-plus-dual-power-and-curios'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/beacon-plus-dual-power-and-curios
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Apply final polish and focused regression tests
        run: python3 scripts/one_shot_beacon_polish.py

      - name: Compile and run complete test suite
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon -x spotlessCheck

      - name: Verify focused Beacon Plus tests were executed
        shell: bash
        run: |
          test -f build/test-results/test/TEST-io.github.thebusybiscuit.slimefun4.implementation.items.curios.BeaconPlusPowerModeTest.xml
          test -f build/test-results/test/TEST-io.github.thebusybiscuit.slimefun4.implementation.items.curios.BeaconPlusEffectTest.xml
          test -f build/test-results/test/TEST-io.github.thebusybiscuit.slimefun4.implementation.items.curios.BeaconPlusChunkModeTest.xml
          grep -q 'failures="0"' build/test-results/test/TEST-io.github.thebusybiscuit.slimefun4.implementation.items.curios.BeaconPlusPowerModeTest.xml
          grep -q 'failures="0"' build/test-results/test/TEST-io.github.thebusybiscuit.slimefun4.implementation.items.curios.BeaconPlusEffectTest.xml
          grep -q 'failures="0"' build/test-results/test/TEST-io.github.thebusybiscuit.slimefun4.implementation.items.curios.BeaconPlusChunkModeTest.xml

      - name: Verify Java 21 bytecode
        run: |
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          python3 scripts/check_bytecode_target.py "$JAR" --expected-java 21

      - name: Commit final polished repair
        run: |
          rm -f .github/workflows/one-shot-beacon-polish.yml
          rm -f scripts/one_shot_beacon_polish.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Polish Beacon Plus power modes and regression tests"
          git push origin HEAD:fix/beacon-plus-dual-power-and-curios

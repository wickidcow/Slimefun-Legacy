name: Slimefun 4.1.65 Release Preparation
on:
  push:
    branches: ['audit/release-4.1.65-preparation-20261002']
    paths: ['.github/workflows/release-4.1.65-preparation.yml', 'audit-release/prepare_4_1_65.py']
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Confirm the published previous-stable identity and apply scoped metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          release=json.loads(subprocess.check_output(['gh','api','repos/wickidcow/Slimefun-Legacy/releases/tags/v4.1.64']))
          assert not release['draft'] and not release['prerelease']
          assert release['target_commitish']=='e47a3035b35dfb93325d22ba03b2a69dd6cd6992'
          core=next(a for a in release['assets'] if a['name']=='Slimefun-Legacy4.1.64.jar')
          assert core['id']==604656009 and core['digest']=='sha256:316b308139e90981ed037d82ddc57b62b354d8e0a41804d5ebf3bb2b8f896d80'
          Path('evidence/previous-stable.json').write_text(json.dumps(dict(tag=release['tag_name'],source=release['target_commitish'],core_asset=core['id'],core_sha256=core['digest']),indent=2)+'\n')
          PY
          python3 audit-release/prepare_4_1_65.py
          git diff --check
          git diff --exit-code -- src/main src/test compatibility/sfl-addon-release-matrix.json compatibility/maintained-addon-test-ledger.json
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          python3 scripts/verify_legacy.py . > evidence/invariants.log 2>&1
          git diff -- README.md gradle.properties compatibility > evidence/metadata.patch
      - name: Full versioned working-tree build without publishing
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew spotlessApply --no-daemon --no-build-cache --no-configuration-cache > evidence/format.log 2>&1
          ./gradlew clean build -PslimefunDeprecationReport=true --console=plain --no-daemon --no-build-cache --no-configuration-cache 2>&1 | tee evidence/build.log
          python3 scripts/summarize_deprecations.py evidence/build.log --fail-on-warnings --require-successful-build
          JAR="$(find build/libs -maxdepth 1 -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          python3 scripts/check_bytecode_target.py "$JAR" --expected-java 21
          python3 scripts/verify_release_artifact.py "$JAR" --root .
          mkdir -p evidence/tests
          cp build/test-results/test/TEST-*.xml evidence/tests/
          python3 - <<'PY'
          from pathlib import Path
          import json,xml.etree.ElementTree as ET
          roots=[ET.parse(p).getroot() for p in Path('evidence/tests').glob('TEST-*.xml')]
          totals={k:sum(int(r.get(k,'0')) for r in roots) for k in ['tests','failures','errors','skipped']}
          assert totals==dict(tests=565,failures=0,errors=0,skipped=1),totals
          skips=[c.get('name') for r in roots for c in r.findall('testcase') if c.find('skipped') is not None]
          assert len(skips)==1 and 'migratesAndDeserializesEveryInventoryItem' in skips[0],skips
          Path('evidence/test-summary.json').write_text(json.dumps(dict(totals=totals,skipped=skips),indent=2)+'\n')
          PY
      - name: Stage only the eight reviewed release metadata files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          files=json.loads(Path('evidence/metadata-files.json').read_text());assert len(files)==8
          records={}
          for name in files:
              data=Path(name).read_bytes();sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              result=subprocess.run(['gh','api','--method','POST','repos/wickidcow/Slimefun-Legacy/git/blobs','--input','-'],input=json.dumps(dict(content=data.decode(),encoding='utf-8')),capture_output=True,text=True,check=True)
              assert json.loads(result.stdout)['sha']==sha
              records[name]=sha
              target=Path('evidence/reviewed-source')/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          Path('evidence/reviewed-blobs.json').write_text(json.dumps(records,indent=2)+'\n')
          PY
      - name: Preserve failing reports as well
        if: always()
        run: |
          mkdir -p evidence/last-tests
          if test -d build/test-results/test; then cp build/test-results/test/TEST-*.xml evidence/last-tests/ || true; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-4.1.65-preparation-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: error

name: Paper 26.2 Runtime Smoke

on:
  pull_request:
  push:
    branches: [ master, main ]
    paths:
      - 'src/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'compatibility/**'
      - 'scripts/paper_runtime_smoke.sh'
      - 'scripts/verify_core_platform_phase1l_part4.py'
      - 'scripts/verify_legacy.py'
      - '.github/workflows/runtime-smoke.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 2'

permissions:
  contents: read

env:
  PAPER_MINECRAFT_VERSION: "26.2"
  PAPER_DOWNLOAD_USER_AGENT: "Slimefun-Legacy-CI/4.1.30 (https://github.com/wickidcow/Slimefun-Legacy)"

jobs:
  paper-runtime-smoke:
    name: Boot Slimefun twice on stable Paper 26.2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Pin source identity
        run: |
          echo "SOURCE_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"

      - name: Verify Slimefun Legacy invariants
        run: python3 scripts/verify_legacy.py .

      - name: Build Slimefun Legacy
        run: |
          chmod +x gradlew scripts/paper_runtime_smoke.sh
          ./gradlew spotlessApply --no-daemon
          ./gradlew clean build --no-daemon

      - name: Locate candidate JAR
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          test -s "$JAR"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - name: Boot-test stable Paper 26.2 twice
        run: bash scripts/paper_runtime_smoke.sh "${{ steps.candidate.outputs.jar }}"

      - name: Publish runtime smoke summary
        if: always()
        run: |
          if [[ -f build/paper-runtime-smoke/smoke-result.txt ]]; then
            {
              echo '## Paper 26.2 runtime smoke'
              echo
              echo '```text'
              cat build/paper-runtime-smoke/smoke-result.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f build/paper-runtime-smoke/paper-build.txt ]]; then
            {
              echo
              echo '### Paper build'
              echo
              echo '```text'
              cat build/paper-runtime-smoke/paper-build.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paper-26.2-runtime-smoke
          path: |
            build/paper-runtime-smoke/*.console.log
            build/paper-runtime-smoke/paper-build.txt
            build/paper-runtime-smoke/smoke-result.txt
          if-no-files-found: warn

name: Update IE2 in addon bundle once

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/update-ie2-bundle-once.yml'

permissions:
  contents: write

jobs:
  update-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download release bundle and IE2 v2.0.6
        shell: bash
        run: |
          set -euo pipefail
          curl -fL -o SFL_AddonsNDependencies.zip \
            https://github.com/wickidcow/Slimefun-Legacy/releases/download/v4.1.47/SFL_AddonsNDependencies.zip
          curl -fL -o SF_InfinityExpansion2.0.6.jar \
            https://github.com/wickidcow/SF_InfinityExpansion2/releases/download/v2.0.6/SF_InfinityExpansion2.0.6.jar
          echo '03e6ab6384163f51ab54a02738ddaceff61f3d720ba1cf3be70743d5454dc1f2  SF_InfinityExpansion2.0.6.jar' | sha256sum -c -

      - name: Replace IE2 JAR in bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import zipfile
          from pathlib import PurePosixPath

          bundle = 'SFL_AddonsNDependencies.zip'
          new_jar = 'SF_InfinityExpansion2.0.6.jar'
          temp = bundle + '.new'

          with zipfile.ZipFile(bundle, 'r') as src:
              matches = [
                  info.filename for info in src.infolist()
                  if not info.is_dir()
                  and PurePosixPath(info.filename).name.lower().endswith('.jar')
                  and 'infinityexpansion2' in PurePosixPath(info.filename).name.lower()
              ]
              if len(matches) != 1:
                  raise SystemExit(f'Expected exactly one InfinityExpansion2 JAR in bundle, found {len(matches)}: {matches}')

              old_name = matches[0]
              parent = str(PurePosixPath(old_name).parent)
              target = new_jar if parent == '.' else f'{parent}/{new_jar}'

              with zipfile.ZipFile(temp, 'w') as dst:
                  for info in src.infolist():
                      if info.filename == old_name:
                          continue
                      dst.writestr(info, src.read(info.filename))
                  dst.write(new_jar, target, compress_type=zipfile.ZIP_DEFLATED)

          os.replace(temp, bundle)

          with zipfile.ZipFile(bundle, 'r') as check:
              matches = [
                  name for name in check.namelist()
                  if PurePosixPath(name).name.lower().endswith('.jar')
                  and 'infinityexpansion2' in PurePosixPath(name).name.lower()
              ]
              expected = [target]
              if matches != expected:
                  raise SystemExit(f'Bundle verification failed. Expected {expected}, found {matches}')
              with check.open(target) as jar_file:
                  if jar_file.read(4) != b'PK\x03\x04':
                      raise SystemExit('Replacement IE2 entry is not a valid JAR/ZIP stream')
              print(f'Replaced {old_name} -> {target}')
          PY
          sha256sum SFL_AddonsNDependencies.zip

      - name: Replace bundle asset on v4.1.47
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload v4.1.47 SFL_AddonsNDependencies.zip \
            --clobber \
            --repo wickidcow/Slimefun-Legacy

      - name: Verify published asset metadata
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v4.1.47 \
            --repo wickidcow/Slimefun-Legacy \
            --json assets \
            --jq '.assets[] | select(.name == "SFL_AddonsNDependencies.zip") | [.name, .size, .digest] | @tsv'

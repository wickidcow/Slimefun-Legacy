name: Apply upgrade diagnostics dependency boundary

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/apply-upgrade-diagnostics-boundary.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Approve UpgradeDiagnostics Dough boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/dependency-boundary-baseline.json')
          text = path.read_text(encoding='utf-8')

          doctor = '        "src/main/java/io/github/thebusybiscuit/slimefun4/core/commands/subcommands/DoctorCommand.java": 1,\n'
          upgrade = '        "src/main/java/io/github/thebusybiscuit/slimefun4/core/commands/subcommands/UpgradeDiagnostics.java": 1,\n'

          if upgrade not in text:
              if doctor not in text:
                  raise SystemExit('DoctorCommand Dough baseline anchor missing')
              text = text.replace(doctor, doctor + upgrade, 1)

          if '"max_imports": 283' in text:
              text = text.replace('"max_imports": 283', '"max_imports": 284', 1)
          elif '"max_imports": 284' not in text:
              raise SystemExit('Expected Dough import budget 283 or 284 not found')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify dependency boundary
        run: python3 scripts/check_dependency_boundaries.py

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Run Slimefun Legacy verification
        run: python3 scripts/verify_legacy.py

      - name: Commit reviewed boundary update and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/apply-upgrade-diagnostics-boundary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/dependency-boundary-baseline.json .github/workflows/apply-upgrade-diagnostics-boundary.yml
          git commit -m 'Approve upgrade diagnostics Dough boundary'
          git push origin HEAD:master

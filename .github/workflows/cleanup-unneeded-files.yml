name: One-Time Repository Cleanup

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to remove the audited obsolete files'
        required: true
        type: string

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete obsolete repository files
    if: ${{ github.event.inputs.confirm == 'DELETE' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out selected branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Remove audited obsolete files
        shell: bash
        run: |
          set -euo pipefail

          files=(
            '.github/workflows/apply-compatibility-mode-enabled.yml'
            '.github/workflows/fourth-maintenance-release.yml'
            '.github/workflows/second-maintenance-release.yml'
            '.github/workflows/stability-release.yml'
            '.github/workflows/third-maintenance-release.yml'
            'ALBION_MERGE_NOTES.md'
            'BUILD_VALIDATION.md'
            'CHANGED_FILES.txt'
            'CHANGED_FILES_MANIFEST.txt'
            'CHANGED_FILES_PART4.txt'
            'COMPATIBILITY_MODE_ENABLED.md'
            'DROP-IN.txt'
            'ENHANCED_GUIDE_CHANGED_FILES.txt'
            'ENHANCED_GUIDE_DROP_IN.txt'
            'ENHANCED_GUIDE_PHASE2.md'
            'ENHANCED_GUIDE_PHASE2_CHANGED_FILES.txt'
            'ENHANCED_GUIDE_PHASE2_DROP_IN.txt'
            'ENHANCED_GUIDE_PHASE2_VALIDATION.md'
            'ENHANCED_GUIDE_PHASE3.md'
            'ENHANCED_GUIDE_PHASE3_1.md'
            'ENHANCED_GUIDE_PHASE3_1_CHANGED_FILES.txt'
            'ENHANCED_GUIDE_PHASE3_1_DROP_IN.txt'
            'ENHANCED_GUIDE_PHASE3_1_VALIDATION.md'
            'ENHANCED_GUIDE_PHASE3_CHANGED_FILES.txt'
            'ENHANCED_GUIDE_PHASE3_DROP_IN.txt'
            'ENHANCED_GUIDE_PHASE3_VALIDATION.md'
            'ENHANCED_GUIDE_VALIDATION.md'
            'FILE_MANIFEST.txt'
            'FOLIA_PHASE1_CHANGED_FILES.txt'
            'FOLIA_PHASE1_VALIDATION.md'
            'GRADLE_ATTEMPT.log'
            'HOTFIX_VALIDATION.md'
            'PART2_VALIDATION.md'
            'PART3_VALIDATION.md'
            'PART4_VALIDATION.md'
            'README_FIRST.md'
            'SHA256SUMS.txt'
            'VALIDATION.txt'
            'patches/albion-english.patch'
            'scripts/apply_compatibility_mode_enabled.py'
            'scripts/automatic-translation-log.json'
            'scripts/regenerate_patch.sh'
          )

          deleted=0
          already_missing=0

          for file in "${files[@]}"; do
            if [[ -e "$file" || -L "$file" ]]; then
              rm -rf -- "$file"
              echo "Deleted: $file"
              deleted=$((deleted + 1))
            else
              echo "Already absent: $file"
              already_missing=$((already_missing + 1))
            fi
          done

          # Remove this one-time workflow after it finishes its job.
          rm -f -- '.github/workflows/cleanup-unneeded-files.yml'

          echo "Deleted files: $deleted"
          echo "Already absent: $already_missing"
          echo
          git status --short

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$(git status --porcelain)" ]]; then
            echo 'No cleanup changes were needed.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clean obsolete handoff and patch files'
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Public API Compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build candidate
        run: |
          chmod +x gradlew
          ./gradlew spotlessApply --no-daemon
          ./gradlew clean build --no-daemon
      - name: Record candidate API surface
        run: |
          CANDIDATE="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$CANDIDATE"
          python3 scripts/write_api_surface.py "$CANDIDATE"
      - name: Download released API baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          API_BASELINE_TAG: ${{ vars.API_BASELINE_TAG }}
        run: |
          mkdir -p build/api-baseline
          if [ -n "$API_BASELINE_TAG" ]; then
            DOWNLOAD=(gh release download "$API_BASELINE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'Slimefun-*.jar' --dir build/api-baseline)
          else
            DOWNLOAD=(gh release download --repo "$GITHUB_REPOSITORY" --pattern 'Slimefun-*.jar' --dir build/api-baseline)
          fi
          if "${DOWNLOAD[@]}"; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No prior GitHub release JAR exists; the candidate API surface is still published.'
            echo 'available=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Check removed public signatures
        if: steps.baseline.outputs.available == 'true'
        run: |
          BASELINE="$(find build/api-baseline -name 'Slimefun-*.jar' ! -name '*-sources.jar' -print -quit)"
          CANDIDATE="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$BASELINE"
          test -n "$CANDIDATE"
          python3 scripts/check_api_compatibility.py "$BASELINE" "$CANDIDATE"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-compatibility-report
          path: |
            build/reports/api-compatibility.txt
            build/reports/api-surface-baseline.txt
            build/reports/api-surface-candidate.txt
          if-no-files-found: error

name: Public API Compatibility

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Read previous stable baseline
        id: baseline
        run: |
          python3 scripts/read_release_baselines.py \
            compatibility/release-baselines.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Build candidate
        run: |
          chmod +x gradlew
          ./gradlew spotlessApply --no-daemon
          ./gradlew clean build --no-daemon
      - name: Record candidate API surface
        run: |
          CANDIDATE="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$CANDIDATE"
          python3 scripts/write_api_surface.py "$CANDIDATE"
      - name: Check out previous stable source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.baseline.outputs.previous_ref }}
          path: build/api-baseline-source
      - name: Build previous stable API baseline
        working-directory: build/api-baseline-source
        run: |
          chmod +x gradlew
          echo "Building Slimefun Legacy ${{ steps.baseline.outputs.previous_version }} as the API baseline"
          ./gradlew spotlessApply --no-daemon
          ./gradlew clean build --no-daemon
      - name: Check removed public signatures
        run: |
          BASELINE="$(find build/api-baseline-source/build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' -print -quit)"
          CANDIDATE="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$BASELINE"
          test -n "$CANDIDATE"
          python3 scripts/check_api_compatibility.py "$BASELINE" "$CANDIDATE"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-compatibility-report
          path: |
            build/reports/api-compatibility.txt
            build/reports/api-surface-baseline.txt
            build/reports/api-surface-candidate.txt
          if-no-files-found: error

name: Addon Bundle Bytecode Gate Validation

on:
  push:
    branches: ['work/restart-gate-validation-20260930']
    paths: ['.github/workflows/addon-bytecode-gate-validation.yml']

permissions:
  contents: write
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply exact reviewed bundle and invariant wiring
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          path = Path('.github/workflows/build-sfl-addons-compat-bundle.yml')
          assert blob(path.read_bytes()) == '4b25dc3e1183faae9c5b114b8451a79731321ce2'
          text = path.read_text()
          needle = '          sha256sum "staged/jars/$CANONICAL"\n'
          assert text.count(needle) == 1
          text = text.replace(needle, needle + '          python3 tools/scripts/verify_addon_bytecode.py "staged/jars/$CANONICAL" \\\n            --expected-java 21 --report "staged/evidence/${ADDON_SLUG}-bytecode.json"\n')
          needle = "      - 'scripts/test_paper_candidate_versions.py'\n"
          assert text.count(needle) == 2
          text = text.replace(needle, needle + "      - 'scripts/verify_addon_bytecode.py'\n      - 'scripts/test_verify_addon_bytecode.py'\n")
          path.write_text(text)
          assert blob(path.read_bytes()) == '1be20796b27c29c8845860e6cdae382724f81656'
          path = Path('scripts/verify_legacy.py')
          assert blob(path.read_bytes()) == '14168dca43e90e85350319a9b5c71c38c08a8889'
          text = path.read_text()
          needle = '        "test_verify_runtime_configuration.py",\n'
          assert text.count(needle) == 1
          path.write_text(text.replace(needle, needle + '        "test_verify_addon_bytecode.py",\n'))
          assert blob(path.read_bytes()) == '79fef164241184271d2bea8760006d52a2bf5678'
          PY
          git diff --check
      - name: Run all source invariants including both new regression suites
        run: |
          set -euo pipefail
          mkdir -p gate-evidence
          python3 scripts/verify_legacy.py . 2>&1 | tee gate-evidence/source-invariants.log
      - name: Validate the actual complete candidate bundle and preserve the known negative control
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, subprocess, sys, tempfile, zipfile
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from verify_addon_bytecode import inspect_jar
          raw = subprocess.run(['gh', 'api', 'repos/wickidcow/Slimefun-Legacy/actions/artifacts/11131565448/zip'], capture_output=True, check=True, timeout=120).stdout
          assert hashlib.sha256(raw).hexdigest() == 'dfd20bdbd6e203945949ebf4001dde7f21c9ba32b1aa982faff4f61fecb4a527'
          with zipfile.ZipFile(io.BytesIO(raw)) as outer:
              data = outer.read('SF_Addons_1.21.11-26.3.zip')
          assert hashlib.sha256(data).hexdigest() == '65fb50d7908ebc0d50be946187c50d3cea784fa996e88b8350189259f6059156'
          reports = []
          with zipfile.ZipFile(io.BytesIO(data)) as bundle, tempfile.TemporaryDirectory() as directory:
              manifest = json.loads(bundle.read('SF_ADDON_MANIFEST.json'))
              assert manifest['core_source_commit'] == 'a84755a935aa7a094cb8affde46628cad01eee77'
              assert len(manifest['addons']) == 45
              for entry in manifest['addons']:
                  name = entry['jar']
                  assert Path(name).name == name
                  payload = bundle.read(name)
                  assert hashlib.sha256(payload).hexdigest() == entry['sha256']
                  path = Path(directory) / name
                  path.write_bytes(payload)
                  report = inspect_jar(path, 21)
                  report.update(repository=entry['repository'], commit=entry['commit'], sha256=entry['sha256'])
                  reports.append(report)
                  result = subprocess.run(['python3', 'scripts/verify_addon_bytecode.py', str(path), '--expected-java', '21'], capture_output=True, text=True)
                  assert result.returncode == (0 if report['result'] == 'PASS' else 1)
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == entry['sha256']
              failed = [row for row in reports if row['result'] == 'FAIL']
              assert len(failed) == 1 and failed[0]['repository'] == 'wickidcow/SF_SlimeEasy', failed
              assert len(failed[0]['incompatible_classes']) == 389
              assert failed[0]['class_major_histogram'] == {69: 389}
          Path('gate-evidence/actual-bundle-bytecode.json').write_text(json.dumps(reports, indent=2) + '\n')
          print('Gate validation passed: 44 real addons accepted; the 389-class Java-25-only SlimeEasy JAR was correctly rejected.')
          print('This validates the checker; the original candidate bundle is NOT approved for release.')
          PY
      - name: Stage only reviewed source blobs without moving any branch or publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          files = {
              '.github/workflows/build-sfl-addons-compat-bundle.yml': '1be20796b27c29c8845860e6cdae382724f81656',
              'scripts/verify_legacy.py': '79fef164241184271d2bea8760006d52a2bf5678',
              'scripts/full_stack_runtime_smoke.sh': '5560056611b49426f8c216987742aeb3f418624e',
              'scripts/verify_runtime_configuration.py': '6e19a6916431cd2b84b8d05d923395be7bea436c',
              'scripts/test_verify_runtime_configuration.py': 'f20d474e0c2130c1a34025cf366e2b0d69273db4',
              'scripts/verify_addon_bytecode.py': 'd7d6a14c707af532bfc6422dcb35bec9713b6b7b',
              'scripts/test_verify_addon_bytecode.py': '263ca29921ab454cd646dcc23925e95f563bb30f',
          }
          for name, expected in files.items():
              data = Path(name).read_bytes()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == expected, (name, actual, expected)
              result = subprocess.run(['gh', 'api', '--method', 'POST', 'repos/wickidcow/Slimefun-Legacy/git/blobs', '--input', '-'], input=json.dumps(dict(content=data.decode('utf-8'), encoding='utf-8')), capture_output=True, text=True, check=True)
              assert json.loads(result.stdout)['sha'] == expected
              target = Path('gate-evidence/reviewed-source', name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          Path('gate-evidence/reviewed-blobs.json').write_text(json.dumps(files, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: addon-bundle-gate-evidence
          path: gate-evidence/
          retention-days: 14
          if-no-files-found: warn

name: Refresh Current Addon Bundle Three

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/refresh-current-addon-bundle-three.yml'

permissions:
  contents: write

concurrency:
  group: refresh-current-addon-bundle-three
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Slimefun Legacy
        uses: actions/checkout@v6

      - name: Refresh Networks IE2 and FoxyMachines
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_TAG='v4.1.47'
          NETWORKS_TAG='v1.0.13'
          NETWORKS_ASSET='SF_NetworksExp1.0.13.jar'
          NETWORKS_SHA='06ef150604b428f4d4cdb20958bf84ea087dbfb69d356794fc3f255d07f8e240'
          IE2_TAG='v2.0.6'
          IE2_ASSET='SF_InfinityExpansion2.0.6.jar'
          IE2_SHA='7bf022d7685e99a1181e4250afec5b8b6509c4e2b3c488304e7ac4ed4c0f2271'
          FOXY_TAG='v1.0.1'
          FOXY_ASSET='SF_FoxyMachines1.0.1.jar'
          FOXY_SHA='6648199f1e96ec296b2fae460138d61e4d1be2246a3746398f6c9db6d723f6a4'

          rm -rf bundle work fixed SFL_AddonsNDependencies.zip
          mkdir -p bundle work fixed

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'SFL_AddonsNDependencies.zip' \
            --dir work
          unzip -q work/SFL_AddonsNDependencies.zip -d bundle

          replace_addon() {
            local label="$1"
            local search_pattern="$2"
            local repo="$3"
            local tag="$4"
            local asset="$5"
            local expected_sha="$6"

            local old dest_dir actual_sha
            old="$(find bundle -type f -iname "$search_pattern" -print -quit || true)"
            if [[ -z "$old" ]]; then
              echo "Could not find existing ${label} JAR in bundle." >&2
              exit 1
            fi
            dest_dir="$(dirname "$old")"

            rm -f "fixed/$asset"
            gh release download "$tag" --repo "$repo" --pattern "$asset" --dir fixed
            test -s "fixed/$asset"
            actual_sha="$(sha256sum "fixed/$asset" | awk '{print $1}')"
            if [[ "$actual_sha" != "$expected_sha" ]]; then
              echo "${label} SHA mismatch: expected $expected_sha got $actual_sha" >&2
              exit 1
            fi

            echo "${label}: ${old} -> ${dest_dir}/${asset}"
            find bundle -type f -iname "$search_pattern" -delete
            mkdir -p "$dest_dir"
            cp "fixed/$asset" "$dest_dir/"

            test "$(find bundle -type f -name "$asset" | wc -l)" -eq 1
            if find bundle -type f -iname "$search_pattern" ! -name "$asset" | grep -q .; then
              echo "Stale ${label} JAR remains in bundle." >&2
              find bundle -type f -iname "$search_pattern" -print
              exit 1
            fi
          }

          replace_addon \
            'Networks Expansion' \
            '*NetworksExp*.jar' \
            'wickidcow/SF_NetworksExp' \
            "$NETWORKS_TAG" "$NETWORKS_ASSET" "$NETWORKS_SHA"

          replace_addon \
            'Infinity Expansion 2' \
            '*InfinityExpansion2*.jar' \
            'wickidcow/SF_InfinityExpansion2' \
            "$IE2_TAG" "$IE2_ASSET" "$IE2_SHA"

          replace_addon \
            'FoxyMachines' \
            '*FoxyMachines*.jar' \
            'wickidcow/SF_FoxyMachines' \
            "$FOXY_TAG" "$FOXY_ASSET" "$FOXY_SHA"

          # The Slimefun core remains a separate release asset.
          if find bundle -type f -iname 'Slimefun-Legacy*.jar' | grep -q .; then
            echo 'Slimefun Legacy core JAR found in addon bundle.' >&2
            exit 1
          fi

          rm -f SFL_AddonsNDependencies.zip
          (cd bundle && zip -qr ../SFL_AddonsNDependencies.zip .)

          unzip -Z1 SFL_AddonsNDependencies.zip | grep -Fxq "$NETWORKS_ASSET"
          unzip -Z1 SFL_AddonsNDependencies.zip | grep -Fxq "$IE2_ASSET"
          unzip -Z1 SFL_AddonsNDependencies.zip | grep -Fxq "$FOXY_ASSET"
          if unzip -Z1 SFL_AddonsNDependencies.zip | grep -Ei '(^|/)Slimefun-Legacy[^/]*\.jar$'; then
            echo 'Slimefun Legacy core JAR found in final archive.' >&2
            exit 1
          fi

          echo 'Final refreshed bundle:'
          sha256sum SFL_AddonsNDependencies.zip

          gh release upload "$RELEASE_TAG" SFL_AddonsNDependencies.zip \
            --repo "$GITHUB_REPOSITORY" --clobber

      - name: Remove one-shot workflow
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/refresh-current-addon-bundle-three.yml
          git commit -m 'Remove completed addon bundle refresh workflow'
          git push origin HEAD:master

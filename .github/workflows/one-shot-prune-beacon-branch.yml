name: One-shot prune Beacon Plus repair branch

on:
  push:
    branches:
      - 'fix/beacon-plus-dual-power-and-curios'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/beacon-plus-dual-power-and-curios
          fetch-depth: 0

      - name: Restore all unrelated files from master
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master

          while IFS= read -r path; do
            case "$path" in
              src/main/java/io/github/thebusybiscuit/slimefun4/implementation/setup/AdventurersCuriosSetup.java|\
              src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlus.java|\
              src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusEffect.java|\
              src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusPowerMode.java|\
              src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusPowerSource.java|\
              src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusPowerState.java|\
              src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusRuntime.java|\
              .github/workflows/one-shot-prune-beacon-branch.yml)
                ;;
              *)
                if git cat-file -e "origin/master:$path" 2>/dev/null; then
                  git checkout origin/master -- "$path"
                else
                  git rm -f --ignore-unmatch "$path"
                fi
                ;;
            esac
          done < <(git diff --name-only origin/master...HEAD)

          rm -rf scripts/__pycache__
          rm -f .github/workflows/one-shot-prune-beacon-branch.yml
          git add -A
          git diff --cached --check

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Rebuild clean intended diff
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          python3 scripts/check_bytecode_target.py "$JAR" --expected-java 21

      - name: Commit clean repair branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prune unrelated formatting from Beacon Plus repair"
          git push origin HEAD:fix/beacon-plus-dual-power-and-curios

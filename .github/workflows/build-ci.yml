name: Build Slimefun Legacy

on:
  push:
    branches: ['master']
    tags: ['v*']
  pull_request:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Resolve Slimefun Legacy version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^projectVersion=//p' gradle.properties | head -n 1 | tr -d '\r')"
          test -n "$VERSION"
          echo "LEGACY_ARTIFACT_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "OUTPUT_NAME=Slimefun-Legacy${VERSION}.jar" >> "$GITHUB_ENV"
          echo "Slimefun Legacy artifact version: $VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Pin reproducible source identity
        run: |
          echo "SOURCE_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - name: Verify Slimefun Legacy invariants
        run: python3 scripts/verify_legacy.py .
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew spotlessApply --no-daemon
          ./gradlew clean build --no-daemon
      - name: Verify critical runtime classes are packaged
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          mkdir -p build/reports
          jar tf "$JAR" > build/reports/release-jar-entries.txt
          grep -Fxq 'io/github/thebusybiscuit/slimefun4/implementation/listeners/BackpackListener.class' build/reports/release-jar-entries.txt
          grep -Fxq 'io/github/thebusybiscuit/slimefun4/utils/ThreadUtils.class' build/reports/release-jar-entries.txt
          grep -Fxq 'io/github/thebusybiscuit/slimefun4/implementation/tasks/AsyncRecipeChoiceTask.class' build/reports/release-jar-entries.txt
          grep -Fxq 'io/github/thebusybiscuit/slimefun4/libraries/dough/blocks/Vein.class' build/reports/release-jar-entries.txt
          grep -Fxq 'io/github/thebusybiscuit/slimefun4/libraries/dough/collections/LoopIterator.class' build/reports/release-jar-entries.txt
      - name: Verify Java 21 bytecode target
        shell: bash
        run: |
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          python3 scripts/check_bytecode_target.py "$JAR" --expected-java 21
      - name: Verify release artifact metadata and packaging
        shell: bash
        run: |
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          python3 scripts/verify_release_artifact.py "$JAR" --root .
          cat build/reports/release-artifact.md >> "$GITHUB_STEP_SUMMARY"
      - name: Stage versioned Slimefun Legacy JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          mkdir -p dist
          cp "$JAR" "dist/${OUTPUT_NAME}"
          test -s "dist/${OUTPUT_NAME}"
          sha256sum "dist/${OUTPUT_NAME}"
      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error
      - name: Publish raw JAR release asset
        if: startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${LEGACY_ARTIFACT_VERSION}"; fi
          JAR="dist/${OUTPUT_NAME}"
          RELEASE_TITLE="Slimefun Legacy ${LEGACY_ARTIFACT_VERSION}"
          NOTES_ARGS=(--generate-notes)

          if [[ "$LEGACY_ARTIFACT_VERSION" == "4.1.38" ]]; then
            RELEASE_TITLE="Slimefun Legacy 4.1.38 — Test Notification, Wiki & EnergyNet Update"
            cat > /tmp/release-notes.md <<'EOF'
          # Slimefun Legacy 4.1.38 — Test Notification, Wiki & EnergyNet Update

          This 4.1.38 refresh is a test-oriented release for the GitHub update notification path while also carrying the latest Slimefun Legacy Wiki and EnergyNet improvements.

          ## Highlights

          - **Update notification test:** keeps the clean `4.1.38` version format so servers on 4.1.37 can detect a newer published release.
          - **Beacon Plus Auto Repair hotfix:** respects each item's actual custom maximum damage and clamps invalid damage values before repair, preventing Paper's `Damage cannot exceed max damage` exception with custom gear.
          - **Legacy Wiki links:** Slimefun Guide item Wiki buttons now point to the rendered Slimefun Legacy GitHub Wiki.
          - **EnergyNet powered heads:** player-head EnergyNet components mirror active energy transport to vanilla `powered=true/false` when the underlying head supports that block state.
          - **Electrical visualizer:** EnergyNet uses yellow `INSTANT_EFFECT` particles for a more electrical visual while Cargo and other network visualizers keep their existing appearance.
          - **Chunk-load topology repair:** unloaded EnergyNet discovery frontier positions are preserved and retried after their chunks load, fixing nodes that could report `Connected` but fail to visualize until a neighboring node was broken and replaced.

          ## Compatibility

          - Paper 26.2 primary
          - Purpur 26.2 supported
          - Folia 26.2 experimental
          - Paper/Purpur 1.21.11 compatibility checks passed
          - Built/tested with Java 25 and verified to Java 21 bytecode target

          ## Release asset

          - `Slimefun-Legacy4.1.38.jar`

          > **Testing note:** servers already running a previous 4.1.38 JAR will not receive another update warning because the semantic version is unchanged. Replace the JAR manually to test this refreshed 4.1.38 build. Servers still on 4.1.37 should detect 4.1.38 as newer.
          EOF
            NOTES_ARGS=(--notes-file /tmp/release-notes.md)
          elif [[ "$LEGACY_ARTIFACT_VERSION" == "4.1.39" ]]; then
            RELEASE_TITLE="✨ Slimefun Legacy 4.1.39 — Search & Tick Tools"
            cat > /tmp/release-notes.md <<'EOF'
          # ✨ Slimefun Legacy 4.1.39
          ### Smarter Search • Safer Ticker Diagnostics

          A compact stability update focused on smoother Guide search and better tools for server owners.

          ## 🔎 Search Improvements
          - Smart Search **OFF** now uses classic Slimefun search exactly.
          - Repeated **Search → Back** navigation reuses cached results instead of repeatedly rebuilding them.
          - Search cache/history is bounded and cleaned up to avoid unnecessary growth.

          ## ⏱️ New `/sf tick`
          - Inspect ticker status, machine locations, failing machines, and specific Slimefun blocks/items.
          - Use `/sf tick top` to find expensive machine tickers with the existing profiler.
          - Safely `/sf tick freeze` and `unfreeze` using Legacy's existing pause system.
          - Read the current tick rate without changing live cadence.
          - No heavy queue, executor, or broad ticker-path rewrite.

          ## 🧩 Compatibility
          **Paper 26.2** • **Purpur 26.2** • **Folia 26.2 experimental** • **Java 21+ runtime target**

          📦 `Slimefun-Legacy4.1.39.jar`  
          🔖 Release build: `0c6959b`

          > Keeping the classic Slimefun4 experience alive on modern Minecraft — with stability first.
          EOF
            NOTES_ARGS=(--notes-file /tmp/release-notes.md)
          elif [[ "$LEGACY_ARTIFACT_VERSION" == "4.1.40" ]]; then
            RELEASE_TITLE="Slimefun Legacy 4.1.40 — Performance & Stability"
            cat > /tmp/release-notes.md <<'EOF'
          # Slimefun Legacy 4.1.40 — Performance & Stability

          Slimefun Legacy 4.1.40 is the stable production baseline for the current Legacy line, focused on smoother runtime performance, better diagnostics, and keeping established Slimefun behavior intact on modern servers.

          ## ⚡ Resonance Beacon performance
          - Player beacon potion effects now last **30 seconds** and are refreshed only when roughly **15 seconds remain**, instead of being reapplied every one-second beacon pulse.
          - Expensive furnace/spawner tile-entity discovery is cached for **15 seconds** while boosts continue to operate from live block states on the normal gameplay cadence.
          - Reuses the same loaded-chunk footprint across beacon effect families instead of rebuilding it repeatedly during one pulse.
          - Resonance Beacons receive deterministic startup offsets so multiple loaded beacons do not synchronize their expensive work onto the same tick.
          - Player-state cleanup now runs when a beacon actually transitions from powered to unpowered instead of repeatedly rescanning the same area.
          - Powered beam rendering is bounded to prevent particle dispatch cost from scaling excessively with world height.
          - Existing Gravity Well, furnace, spawner, crop, XP, repair, flight, and other beacon behavior remains active without reducing the normal gameplay pulse rate.

          ## ⏱️ Diagnostics and server-owner tooling
          - `/sf tick top` remains available for profiling high-cost Slimefun machines.
          - Hotspot reports include actionable machine coordinates so expensive chunks can be located quickly.
          - Existing ticker freeze, inspection, circuit-breaker, and compatibility diagnostics remain intact.

          ## 🛡️ Stability and compatibility
          - Paper 26.2 is the primary supported platform.
          - Purpur 26.2 is supported.
          - Folia 26.2 remains experimental.
          - Paper/Purpur 1.21.11 compatibility checks are retained.
          - Built with Java 25 and verified to a Java 21 bytecode target.
          - Existing Slimefun item IDs, saved-world data, machine behavior, and addon-facing compatibility remain the priority.

          ## 📦 Release asset
          - `Slimefun-Legacy4.1.40.jar`

          > 4.1.40 is intended to be the stable baseline for production servers. Future 4.1.x updates can focus on targeted maintenance, compatibility, and measured performance improvements without requiring disruptive migrations.
          EOF
            NOTES_ARGS=(--notes-file /tmp/release-notes.md)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Existing releases are treated as stable snapshots on normal master pushes.
            # Preserve generated notes when the reproducible-release workflow created the
            # release first; gh release edit does not support --generate-notes.
            if [[ "${NOTES_ARGS[0]}" == "--generate-notes" ]]; then
              gh release edit "$TAG" --title "$RELEASE_TITLE"
            else
              gh release edit "$TAG" --title "$RELEASE_TITLE" "${NOTES_ARGS[@]}"
            fi

            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              gh release upload "$TAG" "$JAR" --clobber
            fi
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" "${NOTES_ARGS[@]}"
          fi

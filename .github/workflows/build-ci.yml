name: Build English Slimefun

on:
  push:
    branches: ['master']
    tags: ['v*']
  pull_request:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Resolve Slimefun Legacy version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^projectVersion=//p' gradle.properties | head -n 1 | tr -d '\r')"
          test -n "$VERSION"
          echo "LEGACY_ARTIFACT_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "OUTPUT_NAME=Slimefun-Legacy${VERSION}.jar" >> "$GITHUB_ENV"
          echo "Slimefun Legacy artifact version: $VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Pin reproducible source identity
        run: |
          echo "SOURCE_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - name: Verify Slimefun Legacy invariants
        run: python3 scripts/verify_legacy.py .
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew spotlessApply --no-daemon
          ./gradlew clean build --no-daemon
      - name: Verify critical runtime classes are packaged
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          mkdir -p build/reports
          jar tf "$JAR" > build/reports/release-jar-entries.txt
          grep -Fxq 'io/github/thebusybiscuit/slimefun4/implementation/listeners/BackpackListener.class' build/reports/release-jar-entries.txt
          grep -Fxq 'io/github/thebusybiscuit/slimefun4/utils/ThreadUtils.class' build/reports/release-jar-entries.txt
          grep -Fxq 'io/github/thebusybiscuit/slimefun4/implementation/tasks/AsyncRecipeChoiceTask.class' build/reports/release-jar-entries.txt
          grep -Fxq 'io/github/thebusybiscuit/slimefun4/libraries/dough/blocks/Vein.class' build/reports/release-jar-entries.txt
          grep -Fxq 'io/github/thebusybiscuit/slimefun4/libraries/dough/collections/LoopIterator.class' build/reports/release-jar-entries.txt
      - name: Verify Java 21 bytecode target
        shell: bash
        run: |
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          python3 scripts/check_bytecode_target.py "$JAR" --expected-java 21
      - name: Verify release artifact metadata and packaging
        shell: bash
        run: |
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          python3 scripts/verify_release_artifact.py "$JAR" --root .
          cat build/reports/release-artifact.md >> "$GITHUB_STEP_SUMMARY"
      - name: Stage versioned Slimefun Legacy JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          mkdir -p dist
          cp "$JAR" "dist/${OUTPUT_NAME}"
          test -s "dist/${OUTPUT_NAME}"
          sha256sum "dist/${OUTPUT_NAME}"
      - name: Upload raw JAR artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/${{ env.OUTPUT_NAME }}
          archive: false
          if-no-files-found: error
      - name: Publish raw JAR release asset
        if: startsWith(github.ref, 'refs/tags/') || github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG="v${LEGACY_ARTIFACT_VERSION}"; fi
          JAR="dist/${OUTPUT_NAME}"
          RELEASE_TITLE="Slimefun Legacy ${LEGACY_ARTIFACT_VERSION}"
          NOTES_ARGS=(--generate-notes)

          if [[ "$LEGACY_ARTIFACT_VERSION" == "4.1.38" ]]; then
            RELEASE_TITLE="Slimefun Legacy 4.1.38 — Test Notification, Wiki & EnergyNet Update"
            cat > /tmp/release-notes.md <<'EOF'
          # Slimefun Legacy 4.1.38 — Test Notification, Wiki & EnergyNet Update

          This 4.1.38 refresh is a test-oriented release for the GitHub update notification path while also carrying the latest Slimefun Legacy Wiki and EnergyNet improvements.

          ## Highlights

          - **Update notification test:** keeps the clean `4.1.38` version format so servers on 4.1.37 can detect a newer published release.
          - **Beacon Plus Auto Repair hotfix:** respects each item's actual custom maximum damage and clamps invalid damage values before repair, preventing Paper's `Damage cannot exceed max damage` exception with custom gear.
          - **Legacy Wiki links:** Slimefun Guide item Wiki buttons now point to the rendered Slimefun Legacy GitHub Wiki.
          - **EnergyNet powered heads:** player-head EnergyNet components mirror active energy transport to vanilla `powered=true/false` when the underlying head supports that block state.
          - **Electrical visualizer:** EnergyNet uses yellow `INSTANT_EFFECT` particles for a more electrical visual while Cargo and other network visualizers keep their existing appearance.
          - **Chunk-load topology repair:** unloaded EnergyNet discovery frontier positions are preserved and retried after their chunks load, fixing nodes that could report `Connected` but fail to visualize until a neighboring node was broken and replaced.

          ## Compatibility

          - Paper 26.2 primary
          - Purpur 26.2 supported
          - Folia 26.2 experimental
          - Paper/Purpur 1.21.11 compatibility checks passed
          - Built/tested with Java 25 and verified to Java 21 bytecode target

          ## Release asset

          - `Slimefun-Legacy4.1.38.jar`

          > **Testing note:** servers already running a previous 4.1.38 JAR will not receive another update warning because the semantic version is unchanged. Replace the JAR manually to test this refreshed 4.1.38 build. Servers still on 4.1.37 should detect 4.1.38 as newer.
          EOF
            NOTES_ARGS=(--notes-file /tmp/release-notes.md)
          elif [[ "$LEGACY_ARTIFACT_VERSION" == "4.1.39" ]]; then
            RELEASE_TITLE="⚙️ Slimefun Legacy 4.1.39 — Smart Search + Ticker Diagnostics"
            cat > /tmp/release-notes.md <<'EOF'
          # ⚙️ Slimefun Legacy 4.1.39
          ## Smart Search Stability • Safe `/sf tick` Diagnostics

          Slimefun Legacy 4.1.39 is a stability-focused release that improves Guide search behavior while adding a lightweight server-side diagnostics toolkit for Slimefun ticking — without rewriting the normal machine ticker path.

          ---

          ## 🔎 Smarter Guide Search

          - **True classic fallback:** with `features.smart-search` disabled, the Enhanced Guide now delegates directly to the original `SurvivalSlimefunGuide` search path.
          - **Search → Back performance fix:** Smart Search results are cached per profile, world, and query so returning to a previous result page can reuse the existing result set instead of rescanning the full registry.
          - **Bounded cache:** each profile keeps a maximum of 8 Smart Search result entries and uses weak profile keys to avoid unbounded retention.
          - **Cleaner history:** consecutive duplicate search-history entries are collapsed to prevent repeated Search → Back navigation from continuously growing guide state.
          - **No behavior surprise:** Smart Search ON keeps the enhanced indexed search and filters; Smart Search OFF behaves like classic Slimefun search.

          ## ⏱️ New `/sf tick` Diagnostics

          A new operator-focused `/sf tick` command provides safe runtime visibility into Slimefun machine ticking.

          - **`/sf tick` / `query` / `show` / `status`** — view ticker state, current tick rate, registered machine locations/chunks, paused circuits, and failing machines.
          - **`/sf tick at`** — inspect the Slimefun block you are looking at, including its item ID, location, ticker type, and paused state.
          - **`/sf tick <ITEM_ID>`** — inspect whether a Slimefun item uses a block ticker and whether that ticker is synchronous or asynchronous.
          - **`/sf tick top`** — reuse Slimefun's existing performance profiler to surface the most expensive machine tickers.
          - **`/sf tick freeze` / `unfreeze`** — safely pause or resume Slimefun machine ticking using the existing ticker pause mechanism.
          - **`/sf tick rate`** — report the configured ticker rate without changing live cadence.
          - Protected by **`slimefun.command.tick`**, defaulting to server operators.

          ## 🛡️ Designed to Stay Lightweight

          The diagnostics implementation deliberately avoids the heavier parts of other ticker-debugging approaches:

          - no global waiting queue inserted into every machine tick
          - no unmanaged common thread pool
          - no timeout wrapper around every asynchronous machine
          - no broad `TickerTask` execution-path rewrite
          - no extra per-tick diagnostics cost when the command is not being used

          Normal Paper, Purpur, and Folia machine execution stays on the existing Legacy ticker path.

          ## 🧩 Compatibility

          - **Paper 26.2** — primary target
          - **Purpur 26.2** — supported
          - **Folia 26.2** — experimental support
          - **Paper/Purpur 1.21.11** compatibility checks
          - Built with **Java 25** and verified to a **Java 21 bytecode target**

          ## 📦 Release Build

          - `Slimefun-Legacy4.1.39.jar`
          - Release source: `0c6959b58a5511c313ef0b89b4d0a29e0524c00c`

          ---

          **Slimefun Legacy** keeps the classic Slimefun4 experience alive on modern Minecraft versions while prioritizing compatibility, stability, and practical server-owner tooling.
          EOF
            NOTES_ARGS=(--notes-file /tmp/release-notes.md)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Existing releases are treated as stable snapshots on normal master pushes.
            # This lets us refresh release notes without silently moving the tag or
            # replacing the published JAR with a later same-version development commit.
            gh release edit "$TAG" --title "$RELEASE_TITLE" "${NOTES_ARGS[@]}"

            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              gh release upload "$TAG" "$JAR" --clobber
            fi
          else
            gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" "${NOTES_ARGS[@]}"
          fi

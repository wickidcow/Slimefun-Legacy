name: Slimefun Compatibility

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 6 * * 1'

permissions:
  contents: read

jobs:
  build-slimefun:
    name: Build Slimefun Legacy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Verify Compatibility Foundation
        run: python3 scripts/verify_legacy.py .
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build exact compatibility JAR
        run: |
          ./gradlew spotlessApply --no-daemon
          ./gradlew clean build --no-daemon
      - name: Verify Java 21 bytecode target
        run: |
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$JAR"
          python3 scripts/check_bytecode_target.py "$JAR" --expected-java 21
      - name: Create deprecation report
        run: |
          mkdir -p build/reports
          set -o pipefail
          ./gradlew compileJava -PslimefunDeprecationReport=true --rerun-tasks --no-daemon 2>&1 | tee build/reports/deprecation-compile.log
          python3 scripts/summarize_deprecations.py build/reports/deprecation-compile.log
      - uses: actions/upload-artifact@v7
        with:
          name: slimefun-compatibility-jar
          path: |
            build/libs/Slimefun-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compatibility-foundation-reports
          path: |
            build/reports/compatibility-foundation.txt
            build/reports/dependency-boundaries.txt
            build/reports/bytecode-target.txt
            build/reports/deprecation-compile.log
            build/reports/deprecations.md
          if-no-files-found: warn


  build-baseline-slimefun:
    name: Build 4.1.15 compatibility baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 493587431dc831d4b8bc38649af6e22df74a15b0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build known-good 4.1.15 baseline JAR
        run: ./gradlew clean build --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: slimefun-baseline-jar
          path: |
            build/libs/Slimefun-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

  paper-candidate-api:
    name: Candidate Paper API
    if: ${{ vars.PAPER_API_CANDIDATE != '' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Compile against candidate Paper API
        env:
          PAPER_API_CANDIDATE: ${{ vars.PAPER_API_CANDIDATE }}
        run: |
          chmod +x gradlew
          echo "Compiling against Paper API $PAPER_API_CANDIDATE"
          ./gradlew clean compileJava -PpaperApiVersion="$PAPER_API_CANDIDATE" --no-daemon

  addons:
    name: Addon [${{ matrix.tier }}] - ${{ matrix.repository }}
    needs: [build-baseline-slimefun, build-slimefun]
    continue-on-error: ${{ matrix.advisory }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          # Required compatibility targets maintained for or used by Legacy.
          - repository: wickidcow/SF_FastMachines
            slug: legacy-fastmachines
            tier: required
            advisory: false
          - repository: lijinhong11/Networks-Exp
            ref: b3
            expected-commit: 1a3e3904662dfa1e58169ba90051a98efdaa1f6c
            slug: networks-exp-b3
            tier: required
            advisory: false
          - repository: wickidcow/SF_SlimeTinkerIE2
            slug: legacy-slimetinker-ie2
            tier: required
            advisory: false
          - repository: wickidcow/SF_BetterChests
            slug: legacy-betterchests
            tier: required
            advisory: false

          # Public Gugu addon compatibility probes. These are advisory because
          # archived or independently changing projects must not block a
          # Slimefun Legacy release, but their failures remain visible.
          - repository: SlimefunGuguProject/FluffyMachines
            slug: gugu-fluffymachines
            tier: gugu-advisory
            advisory: true
          - repository: SlimefunGuguProject/FoxyMachines
            slug: gugu-foxymachines
            tier: gugu-advisory
            advisory: true
          - repository: SlimefunGuguProject/Networks
            slug: gugu-networks
            tier: gugu-advisory
            advisory: true
          - repository: SlimefunGuguProject/SlimeTinker
            slug: gugu-slimetinker
            tier: gugu-advisory
            advisory: true
          - repository: SlimefunGuguProject/FlowerPower
            slug: gugu-flowerpower
            tier: gugu-advisory
            advisory: true
          - repository: SlimefunGuguProject/IDreamOfEasy
            slug: gugu-idreamofeasy
            tier: gugu-advisory
            advisory: true
          - repository: SlimefunGuguProject/Gastronomicon
            slug: gugu-gastronomicon
            tier: gugu-advisory
            advisory: true
          - repository: SlimefunGuguProject/Bump
            slug: gugu-bump
            tier: gugu-advisory
            advisory: true
          - repository: SlimefunGuguProject/SlimeCustomizer
            slug: gugu-slimecustomizer
            tier: gugu-advisory
            advisory: true
          - repository: SlimefunGuguProject/EMCTech
            slug: gugu-emctech
            tier: gugu-advisory
            advisory: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/download-artifact@v8
        with:
          name: slimefun-baseline-jar
          path: build/baseline
      - uses: actions/download-artifact@v8
        with:
          name: slimefun-compatibility-jar
          path: build/candidate
      - name: Clone addon
        env:
          GIT_TERMINAL_PROMPT: '0'
          ADDON_REPOSITORY: ${{ matrix.repository }}
          ADDON_REF: ${{ matrix.ref }}
          EXPECTED_COMMIT: ${{ matrix.expected-commit }}
          ADDON_LOG: ${{ runner.temp }}/${{ matrix.slug }}.log
        run: |
          set -o pipefail
          URL="https://github.com/$ADDON_REPOSITORY.git"
          {
            echo "Repository: $ADDON_REPOSITORY"
            echo "Compatibility tier: ${{ matrix.tier }}"
            echo "Checking public repository access: $URL"
            git ls-remote --exit-code "$URL" HEAD >/dev/null

            if [[ -n "$ADDON_REF" ]]; then
              echo "Pinned ref: $ADDON_REF"
              git clone --depth 1 --branch "$ADDON_REF" "$URL" "$RUNNER_TEMP/addon"
            else
              git clone --depth 1 "$URL" "$RUNNER_TEMP/addon"
            fi

            ACTUAL_COMMIT="$(git -C "$RUNNER_TEMP/addon" rev-parse HEAD)"
            echo "Resolved commit: $ACTUAL_COMMIT"
            if [[ -n "$EXPECTED_COMMIT" && "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]]; then
              echo "Expected pinned commit $EXPECTED_COMMIT but resolved $ACTUAL_COMMIT" >&2
              exit 1
            fi
          } 2>&1 | tee "$ADDON_LOG"
      - name: Compare known-good baseline with candidate Legacy JAR
        id: compare
        continue-on-error: true
        env:
          ADDON_REPORT: ${{ runner.temp }}/${{ matrix.slug }}-report
        run: |
          BASELINE_JAR="$(find build/baseline -name 'Slimefun-*.jar' ! -name '*-sources.jar' -print -quit)"
          CANDIDATE_JAR="$(find build/candidate -name 'Slimefun-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$BASELINE_JAR"
          test -n "$CANDIDATE_JAR"
          python3 scripts/compare_addon_slimefun_compatibility.py \
            "$RUNNER_TEMP/addon" \
            "$BASELINE_JAR" \
            "$CANDIDATE_JAR" \
            "$ADDON_REPORT"
      - name: Publish classified compatibility summary
        if: always()
        env:
          ADDON_REPORT: ${{ runner.temp }}/${{ matrix.slug }}-report
        run: |
          if [[ -f "$ADDON_REPORT/summary.md" ]]; then
            cat "$ADDON_REPORT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Addon compatibility comparison"
              echo
              echo "**Result:** `INSTRUMENTATION_ERROR`"
              echo
              echo "The comparison report was not produced. Review the checkout and workflow logs."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: addon-compatibility-${{ matrix.slug }}
          path: |
            ${{ runner.temp }}/${{ matrix.slug }}.log
            ${{ runner.temp }}/${{ matrix.slug }}-report/result.json
            ${{ runner.temp }}/${{ matrix.slug }}-report/status.txt
            ${{ runner.temp }}/${{ matrix.slug }}-report/summary.md
            ${{ runner.temp }}/${{ matrix.slug }}-report/baseline.log
            ${{ runner.temp }}/${{ matrix.slug }}-report/candidate.log
          if-no-files-found: warn
      - name: Enforce classified compatibility result
        if: always()
        env:
          ADDON_REPORT: ${{ runner.temp }}/${{ matrix.slug }}-report
          ADVISORY: ${{ matrix.advisory }}
        run: |
          if [[ ! -f "$ADDON_REPORT/status.txt" ]]; then
            STATUS="INSTRUMENTATION_ERROR"
          else
            STATUS="$(tr -d '\r\n' < "$ADDON_REPORT/status.txt")"
          fi

          echo "Compatibility result for ${{ matrix.repository }}: $STATUS"
          case "$STATUS" in
            PASS)
              exit 0
              ;;
            BASELINE_BUILD_FAILED)
              MESSAGE="Addon does not build against the known-good 4.1.15 baseline; this is not evidence of a new Legacy regression."
              ;;
            LEGACY_COMPATIBILITY_FAILED)
              MESSAGE="Addon builds against 4.1.15 but fails against the candidate JAR; this is a genuine Legacy compatibility regression."
              ;;
            *)
              MESSAGE="Compatibility comparison could not be completed because of checkout or test-harness infrastructure."
              ;;
          esac

          if [[ "$ADVISORY" == "true" ]]; then
            echo "::warning title=Advisory addon compatibility::$MESSAGE"
            exit 0
          fi

          echo "::error title=Required addon compatibility::$MESSAGE"
          exit 1

name: Slimefun Compatibility

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 6 * * 1'

permissions:
  contents: read

jobs:
  prepare-release-baselines:
    name: Prepare release baselines
    runs-on: ubuntu-latest
    outputs:
      candidate_version: ${{ steps.baselines.outputs.candidate_version }}
      previous_version: ${{ steps.baselines.outputs.previous_version }}
      previous_ref: ${{ steps.baselines.outputs.previous_ref }}
      floor_version: ${{ steps.baselines.outputs.floor_version }}
      floor_ref: ${{ steps.baselines.outputs.floor_ref }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate release baseline registry
        id: baselines
        run: |
          python3 scripts/read_release_baselines.py \
            compatibility/release-baselines.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Publish baseline summary
        run: |
          {
            echo "## Release compatibility lifecycle"
            echo
            echo "Candidate: **${{ steps.baselines.outputs.candidate_version }}**"
            echo "Previous stable baseline: **${{ steps.baselines.outputs.previous_version }}** (release blocking)"
            echo "Legacy floor: **${{ steps.baselines.outputs.floor_version }}** (advisory)"
            echo
            echo 'Source: `compatibility/release-baselines.json`'
          } >> "$GITHUB_STEP_SUMMARY"

  build-slimefun:
    name: Build Slimefun Legacy candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Verify Compatibility Foundation
        run: python3 scripts/verify_legacy.py .
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build exact compatibility JAR
        run: |
          ./gradlew spotlessApply --no-daemon
          ./gradlew clean build --no-daemon
      - name: Verify Java 21 bytecode target
        run: |
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$JAR"
          python3 scripts/check_bytecode_target.py "$JAR" --expected-java 21
      - name: Create deprecation report
        run: |
          mkdir -p build/reports
          set -o pipefail
          ./gradlew compileJava -PslimefunDeprecationReport=true --rerun-tasks --no-daemon 2>&1 | tee build/reports/deprecation-compile.log
          python3 scripts/summarize_deprecations.py build/reports/deprecation-compile.log
      - uses: actions/upload-artifact@v7
        with:
          name: slimefun-compatibility-jar
          path: |
            build/libs/Slimefun-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compatibility-foundation-reports
          path: |
            build/reports/compatibility-foundation.txt
            build/reports/dependency-boundaries.txt
            build/reports/bytecode-target.txt
            build/reports/deprecation-compile.log
            build/reports/deprecations.md
            build/reports/core-platform-phase1c.txt
            build/reports/core-platform-phase1d.txt
          if-no-files-found: warn

  build-baseline-slimefun:
    name: Build previous stable ${{ needs.prepare-release-baselines.outputs.previous_version }}
    needs: prepare-release-baselines
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release-baselines.outputs.previous_ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build previous stable baseline JAR
        run: |
          echo "Building Slimefun Legacy ${{ needs.prepare-release-baselines.outputs.previous_version }} as the release-blocking baseline"
          ./gradlew spotlessApply --no-daemon
          ./gradlew clean build --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: slimefun-baseline-jar
          path: |
            build/libs/Slimefun-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

  build-legacy-floor-slimefun:
    name: Build legacy floor ${{ needs.prepare-release-baselines.outputs.floor_version }}
    if: ${{ github.event_name != 'pull_request' }}
    needs: prepare-release-baselines
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release-baselines.outputs.floor_ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Build historical compatibility floor JAR
        run: |
          echo "Building historical Slimefun Legacy ${{ needs.prepare-release-baselines.outputs.floor_version }} compatibility floor"
          ./gradlew spotlessApply --no-daemon
          ./gradlew clean build --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: slimefun-legacy-floor-jar
          path: |
            build/libs/Slimefun-*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

  paper-candidate-api:
    name: Candidate Paper API
    if: ${{ vars.PAPER_API_CANDIDATE != '' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Compile against candidate Paper API
        env:
          PAPER_API_CANDIDATE: ${{ vars.PAPER_API_CANDIDATE }}
        run: |
          chmod +x gradlew
          echo "Compiling against Paper API $PAPER_API_CANDIDATE"
          ./gradlew clean compileJava -PpaperApiVersion="$PAPER_API_CANDIDATE" --no-daemon

  prepare-addon-matrix:
    name: Prepare addon compatibility matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      enabled_count: ${{ steps.matrix.outputs.enabled_count }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate and generate matrix
        id: matrix
        run: |
          python3 scripts/generate_addon_compatibility_matrix.py \
            compatibility/addon-compatibility-matrix.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Publish matrix summary
        run: |
          {
            echo "## Addon compatibility matrix"
            echo
            echo "Enabled targets: **${{ steps.matrix.outputs.enabled_count }}**"
            echo
            echo 'Source: `compatibility/addon-compatibility-matrix.json`'
          } >> "$GITHUB_STEP_SUMMARY"

  prepare-cross-fork-api-matrix:
    name: Prepare cross-fork API probes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      enabled_count: ${{ steps.matrix.outputs.enabled_count }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate cross-fork API matrix
        id: matrix
        run: |
          python3 scripts/generate_cross_fork_api_matrix.py \
            compatibility/cross-fork-api-matrix.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Publish cross-fork probe summary
        run: |
          {
            echo "## Cross-fork API source probes"
            echo
            echo "External core targets: **${{ steps.matrix.outputs.enabled_count }}**"
            echo
            echo 'These probes are advisory drift signals. Protected Legacy API and addon binary/source regression gates remain release blocking.'
          } >> "$GITHUB_STEP_SUMMARY"

  cross-fork-api-probes:
    name: Cross-fork API - ${{ matrix.display_name }}
    needs: prepare-cross-fork-api-matrix
    continue-on-error: ${{ matrix.advisory }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-cross-fork-api-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - name: Clone external core
        env:
          CORE_REPOSITORY: ${{ matrix.repository }}
          CORE_REF: ${{ matrix.ref }}
        run: |
          URL="https://github.com/$CORE_REPOSITORY.git"
          if [[ -n "$CORE_REF" ]]; then
            git clone --depth 1 --branch "$CORE_REF" "$URL" "$RUNNER_TEMP/cross-fork-core"
          else
            git clone --depth 1 "$URL" "$RUNNER_TEMP/cross-fork-core"
          fi
      - name: Probe representative shared API source
        id: probe
        continue-on-error: true
        run: |
          python3 scripts/probe_cross_fork_api.py \
            compatibility/cross-fork-api-matrix.json \
            "${{ matrix.id }}" \
            . \
            "$RUNNER_TEMP/cross-fork-core" \
            --report "build/reports/cross-fork-${{ matrix.id }}.md"
      - name: Publish cross-fork drift report
        if: always()
        run: |
          if [[ -f "build/reports/cross-fork-${{ matrix.id }}.md" ]]; then
            cat "build/reports/cross-fork-${{ matrix.id }}.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cross-fork-api-${{ matrix.id }}
          path: build/reports/cross-fork-${{ matrix.id }}.md
          if-no-files-found: warn
      - name: Mark external API drift
        if: steps.probe.outcome == 'failure'
        run: |
          echo "::warning title=Cross-fork API drift::Representative shared API markers changed for ${{ matrix.display_name }}. Review before intake; no automatic merge is performed."
          exit 1

  addons:
    name: Addon [${{ matrix.tier }}] - ${{ matrix.repository }}
    needs: [prepare-release-baselines, prepare-addon-matrix, build-baseline-slimefun, build-slimefun]
    continue-on-error: ${{ matrix.advisory }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare-addon-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/download-artifact@v8
        with:
          name: slimefun-baseline-jar
          path: build/baseline
      - uses: actions/download-artifact@v8
        with:
          name: slimefun-compatibility-jar
          path: build/candidate
      - name: Clone addon
        env:
          GIT_TERMINAL_PROMPT: '0'
          ADDON_REPOSITORY: ${{ matrix.repository }}
          ADDON_REF: ${{ matrix.ref }}
          EXPECTED_COMMIT: ${{ matrix.expected_commit }}
          TARGET_VERSION: ${{ matrix.target_version }}
          ADDON_LOG: ${{ runner.temp }}/${{ matrix.slug }}.log
        run: |
          set -o pipefail
          URL="https://github.com/$ADDON_REPOSITORY.git"
          {
            echo "Repository: $ADDON_REPOSITORY"
            echo "Compatibility tier: ${{ matrix.tier }}"
            echo "Checking public repository access: $URL"
            git ls-remote --exit-code "$URL" HEAD >/dev/null

            if [[ -n "$ADDON_REF" ]]; then
              echo "Pinned ref: $ADDON_REF"
              git clone --depth 1 --branch "$ADDON_REF" "$URL" "$RUNNER_TEMP/addon"
            else
              git clone --depth 1 "$URL" "$RUNNER_TEMP/addon"
            fi

            ACTUAL_COMMIT="$(git -C "$RUNNER_TEMP/addon" rev-parse HEAD)"
            echo "Resolved commit: $ACTUAL_COMMIT"

            if [[ -n "$TARGET_VERSION" ]]; then
              ACTUAL_VERSION="$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$RUNNER_TEMP/addon/build.gradle.kts" | head -n 1)"
              echo "Target addon version: $TARGET_VERSION"
              echo "Declared addon version: $ACTUAL_VERSION"
              if [[ "$ACTUAL_VERSION" != "$TARGET_VERSION" ]]; then
                echo "Expected addon version $TARGET_VERSION but found ${ACTUAL_VERSION:-<missing>}" >&2
                exit 1
              fi
            fi

            if [[ -n "$EXPECTED_COMMIT" && "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]]; then
              echo "Expected pinned commit $EXPECTED_COMMIT but resolved $ACTUAL_COMMIT" >&2
              exit 1
            fi
          } 2>&1 | tee "$ADDON_LOG"
      - name: Compare previous stable baseline with candidate Legacy JAR
        id: compare
        continue-on-error: true
        env:
          ADDON_REPORT: ${{ runner.temp }}/${{ matrix.slug }}-report
        run: |
          BASELINE_JAR="$(find build/baseline -name 'Slimefun-*.jar' ! -name '*-sources.jar' -print -quit)"
          CANDIDATE_JAR="$(find build/candidate -name 'Slimefun-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$BASELINE_JAR"
          test -n "$CANDIDATE_JAR"
          python3 scripts/compare_addon_slimefun_compatibility.py \
            "$RUNNER_TEMP/addon" \
            "$BASELINE_JAR" \
            "$CANDIDATE_JAR" \
            "$ADDON_REPORT"
      - name: Publish classified compatibility summary
        if: always()
        env:
          ADDON_REPORT: ${{ runner.temp }}/${{ matrix.slug }}-report
        run: |
          if [[ -f "$ADDON_REPORT/summary.md" ]]; then
            cat "$ADDON_REPORT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Addon compatibility comparison"
              echo
              echo '**Result:** `INSTRUMENTATION_ERROR`'
              echo
              echo "The comparison report was not produced. Review the checkout and workflow logs."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: addon-compatibility-${{ matrix.slug }}
          path: |
            ${{ runner.temp }}/${{ matrix.slug }}.log
            ${{ runner.temp }}/${{ matrix.slug }}-report/result.json
            ${{ runner.temp }}/${{ matrix.slug }}-report/status.txt
            ${{ runner.temp }}/${{ matrix.slug }}-report/summary.md
            ${{ runner.temp }}/${{ matrix.slug }}-report/baseline.log
            ${{ runner.temp }}/${{ matrix.slug }}-report/candidate.log
            ${{ runner.temp }}/${{ matrix.slug }}-report/binary-linkage/result.json
            ${{ runner.temp }}/${{ matrix.slug }}-report/binary-linkage/status.txt
            ${{ runner.temp }}/${{ matrix.slug }}-report/binary-linkage/summary.md
          if-no-files-found: warn
      - name: Enforce classified compatibility result
        if: always()
        env:
          ADDON_REPORT: ${{ runner.temp }}/${{ matrix.slug }}-report
          ADVISORY: ${{ matrix.advisory }}
          PREVIOUS_VERSION: ${{ needs.prepare-release-baselines.outputs.previous_version }}
        run: |
          if [[ ! -f "$ADDON_REPORT/status.txt" ]]; then
            STATUS="INSTRUMENTATION_ERROR"
          else
            STATUS="$(tr -d '\r\n' < "$ADDON_REPORT/status.txt")"
          fi

          echo "Compatibility result for ${{ matrix.repository }}: $STATUS"
          case "$STATUS" in
            PASS)
              exit 0
              ;;
            BASELINE_BUILD_FAILED)
              MESSAGE="Addon does not build against the previous stable $PREVIOUS_VERSION baseline; this is not evidence of a new candidate regression."
              ;;
            LEGACY_COMPATIBILITY_FAILED)
              MESSAGE="Addon builds against previous stable $PREVIOUS_VERSION but fails against the candidate JAR; this is a Legacy compatibility regression."
              ;;
            *)
              MESSAGE="Compatibility comparison could not be completed because of checkout or test-harness infrastructure."
              ;;
          esac

          if [[ "$ADVISORY" == "true" ]]; then
            echo "::warning title=Advisory addon compatibility::$MESSAGE"
            exit 0
          fi

          echo "::error title=Required addon compatibility::$MESSAGE"
          exit 1

  legacy-floor-addons:
    name: Legacy floor drift - ${{ matrix.repository }}
    if: ${{ github.event_name != 'pull_request' }}
    needs: [prepare-release-baselines, prepare-addon-matrix, build-legacy-floor-slimefun, build-slimefun]
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare-addon-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/download-artifact@v8
        with:
          name: slimefun-legacy-floor-jar
          path: build/baseline
      - uses: actions/download-artifact@v8
        with:
          name: slimefun-compatibility-jar
          path: build/candidate
      - name: Clone addon for historical drift probe
        env:
          GIT_TERMINAL_PROMPT: '0'
          ADDON_REPOSITORY: ${{ matrix.repository }}
          ADDON_REF: ${{ matrix.ref }}
        run: |
          URL="https://github.com/$ADDON_REPOSITORY.git"
          if [[ -n "$ADDON_REF" ]]; then
            git clone --depth 1 --branch "$ADDON_REF" "$URL" "$RUNNER_TEMP/addon"
          else
            git clone --depth 1 "$URL" "$RUNNER_TEMP/addon"
          fi
      - name: Compare historical floor with candidate
        id: compare
        continue-on-error: true
        env:
          ADDON_REPORT: ${{ runner.temp }}/${{ matrix.slug }}-legacy-floor-report
        run: |
          BASELINE_JAR="$(find build/baseline -name 'Slimefun-*.jar' ! -name '*-sources.jar' -print -quit)"
          CANDIDATE_JAR="$(find build/candidate -name 'Slimefun-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$BASELINE_JAR"
          test -n "$CANDIDATE_JAR"
          python3 scripts/compare_addon_slimefun_compatibility.py \
            "$RUNNER_TEMP/addon" \
            "$BASELINE_JAR" \
            "$CANDIDATE_JAR" \
            "$ADDON_REPORT"
      - name: Publish advisory legacy-floor result
        if: always()
        env:
          ADDON_REPORT: ${{ runner.temp }}/${{ matrix.slug }}-legacy-floor-report
          FLOOR_VERSION: ${{ needs.prepare-release-baselines.outputs.floor_version }}
        run: |
          if [[ -f "$ADDON_REPORT/summary.md" ]]; then
            cat "$ADDON_REPORT/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          STATUS="INSTRUMENTATION_ERROR"
          if [[ -f "$ADDON_REPORT/status.txt" ]]; then
            STATUS="$(tr -d '\r\n' < "$ADDON_REPORT/status.txt")"
          fi
          if [[ "$STATUS" != "PASS" ]]; then
            echo "::warning title=Historical compatibility floor::Legacy floor $FLOOR_VERSION drift probe for ${{ matrix.repository }} returned $STATUS. This probe is advisory and never blocks release."
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: legacy-floor-${{ matrix.slug }}
          path: |
            ${{ runner.temp }}/${{ matrix.slug }}-legacy-floor-report/result.json
            ${{ runner.temp }}/${{ matrix.slug }}-legacy-floor-report/status.txt
            ${{ runner.temp }}/${{ matrix.slug }}-legacy-floor-report/summary.md
            ${{ runner.temp }}/${{ matrix.slug }}-legacy-floor-report/baseline.log
            ${{ runner.temp }}/${{ matrix.slug }}-legacy-floor-report/candidate.log
            ${{ runner.temp }}/${{ matrix.slug }}-legacy-floor-report/binary-linkage/result.json
            ${{ runner.temp }}/${{ matrix.slug }}-legacy-floor-report/binary-linkage/status.txt
            ${{ runner.temp }}/${{ matrix.slug }}-legacy-floor-report/binary-linkage/summary.md
          if-no-files-found: warn

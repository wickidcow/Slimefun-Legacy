name: Clean Slimefun Legacy release assets

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/cleanup-sfl-release-assets.yml'
  workflow_run:
    workflows: ['Build SF Addons 1.21.11-26.3 Bundle']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clean-slimefun-legacy-release-assets
  cancel-in-progress: true

jobs:
  clean:
    name: Keep Slimefun Legacy release core-focused
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Normalize latest Slimefun Legacy release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --json tagName,isDraft --jq '[.[] | select(.isDraft == false)][0].tagName')"
          test -n "$TAG"
          echo "Normalizing Slimefun Legacy release $TAG"

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > assets-before.txt

          REMOVED=0
          while IFS= read -r asset; do
            case "$asset" in
              SF_*.jar|SFL_AddonsNDependencies.zip|SFL_AddonsNDependencies.sha256|SFL_Addons_1.21.11-26.3.zip)
                echo "Removing obsolete/non-core release asset: $asset"
                gh release delete-asset "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" -y
                REMOVED=$((REMOVED + 1))
                ;;
            esac
          done < assets-before.txt

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort > assets-after.txt

          if grep -Eq '^SF_.*\.jar$' assets-after.txt; then
            echo 'Raw SF addon JARs remain on the Slimefun Legacy release:' >&2
            grep -E '^SF_.*\.jar$' assets-after.txt >&2
            exit 1
          fi

          if grep -Eq '^SFL_Addons' assets-after.txt; then
            echo 'An obsolete SFL_Addons* bundle remains on the Slimefun Legacy release:' >&2
            grep -E '^SFL_Addons' assets-after.txt >&2
            exit 1
          fi

          if ! grep -Fxq 'SF_Addons_1.21.11-26.3.zip' assets-after.txt; then
            echo 'Expected canonical compatibility bundle is missing from the latest Slimefun Legacy release.' >&2
            exit 1
          fi

          CORE_COUNT="$(grep -Ec '^Slimefun-Legacy[^/]*\.jar$' assets-after.txt || true)"
          if [[ "$CORE_COUNT" -ne 1 ]]; then
            echo "Expected exactly one Slimefun Legacy core JAR; found ${CORE_COUNT}." >&2
            cat assets-after.txt >&2
            exit 1
          fi

          echo "Removed ${REMOVED} obsolete/non-core assets from ${TAG}"
          cat assets-after.txt

      - name: Publish summary
        shell: bash
        run: |
          {
            echo '## Slimefun Legacy release cleanup'
            echo
            echo '- Exactly one `Slimefun-Legacy*.jar` core asset is required'
            echo '- `SF_Addons_1.21.11-26.3.zip` is retained'
            echo '- Raw `SF_*.jar` addon assets are removed'
            echo '- Obsolete `SFL_Addons*` bundle assets are removed'
            echo '- Individual addon releases remain the responsibility of their own repositories'
          } >> "$GITHUB_STEP_SUMMARY"

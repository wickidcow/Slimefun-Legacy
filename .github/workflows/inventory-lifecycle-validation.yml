name: Legacy Inventory Lifecycle Safety Validation

on:
  push:
    branches: ['work/legacy-inventory-lifecycle-safety']

concurrency:
  group: legacy-inventory-lifecycle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out pinned baseline and reviewed patch
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Apply hash-verified lifecycle protection and isolated event fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-evidence
          python3 - <<'PY'
          import gzip, hashlib, json
          from pathlib import Path
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          compressed = Path('.audit/lifecycle.patch.json.gz').read_bytes()
          assert blob(compressed) == '5694656e99d99d1ccf6a7501d4e0c679e403f1a6'
          changes = json.loads(gzip.decompress(compressed))
          assert len(changes) == 7
          prepared = {}
          for change in changes:
              path = Path(change['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert str(path).startswith(('src/main/java/', 'src/test/java/'))
              if change['old'] is None:
                  assert not path.exists(), path
                  output = change['content'].encode()
              else:
                  original = path.read_bytes()
                  assert blob(original) == change['old'], (path, blob(original))
                  lines = original.decode().splitlines(keepends=True)
                  for start, end, text in reversed(change['edits']):
                      lines[start:end] = [text]
                  output = ''.join(lines).encode()
              assert blob(output) == change['new'], (path, blob(output))
              prepared[path] = output
          for path, output in prepared.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(output)
              print('REVIEWED_SOURCE', blob(output), path)
          fixture = Path('src/test/java/com/xzavier0722/mc/plugin/slimefun4/storage/controller/InventoryLifecycleSafetyTest.java')
          assert blob(fixture.read_bytes()) == '34b80778aac865a24ce0b4e224fbc3309d39e34f'
          before = '        var listener = new BlockListener(Slimefun.instance());'
          after = '''        // Permit listener registration without starting production services. The test
                  // invokes the real handlers directly, then restores the fixture's original state.
                  var plugin = Slimefun.instance();
                  var enabled = field(JavaPlugin.class, "isEnabled");
                  boolean wasEnabled = enabled.getBoolean(plugin);
                  BlockListener listener;
                  try {
                      enabled.setBoolean(plugin, true);
                      listener = new BlockListener(plugin);
                  } finally {
                      enabled.setBoolean(plugin, wasEnabled);
                  }
                  org.bukkit.event.HandlerList.unregisterAll(listener);'''
          # The YAML block removes ten leading spaces. Normalize the embedded Java
          # continuation indentation to the reviewed eight/twelve-space source.
          after = '\n'.join(line[10:] if index else line for index, line in enumerate(after.splitlines()))
          text = fixture.read_text()
          assert text.count(before) == 1
          fixture.write_text(text.replace(before, after))
          assert blob(fixture.read_bytes()) == '5a8caa9263a5c913bb03dfad1fc2e78bebb00fd0', blob(fixture.read_bytes())
          Path('audit-evidence/reviewed-paths.json').write_text(json.dumps([str(p) for p in prepared]))
          Path('audit-evidence/baseline-reference.txt').write_text('Run 36659862162 reproduced the original chunk-cache mutation before guarded deletion. The downloaded original-lifecycle.xml records exactly one expected cache-identity assertion failure.\n')
          PY
          git diff --check
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Run complete source invariants before formatting
        run: |
          set -euo pipefail
          python3 scripts/verify_legacy.py . 2>&1 | tee audit-evidence/invariants.log
      - name: Build and test corrected lifecycle protection
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew spotlessApply --no-daemon
          ./gradlew clean --console=plain --no-daemon
          mkdir -p build/reports
          ./gradlew build -PslimefunDeprecationReport=true --console=plain --no-daemon 2>&1 | tee build/reports/deprecation-compile.log
          python3 scripts/summarize_deprecations.py build/reports/deprecation-compile.log --fail-on-warnings --require-successful-build
          git diff --check
      - name: Record actual test results
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          totals = dict.fromkeys(('tests', 'failures', 'errors', 'skipped'), 0)
          count = 0
          for path in sorted(Path('build/test-results/test').glob('TEST-*.xml')):
              suite = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, '0'))
              if any(name in path.name for name in ('InventoryLifecycleSafetyTest', 'InventoryRecoveryLocationsTest')):
                  print('New lifecycle suite:', suite.attrib)
                  assert all(int(suite.get(key, '0')) == 0 for key in ('failures', 'errors', 'skipped'))
                  count += int(suite.get('tests', '0'))
          assert count == 26, count
          assert totals['failures'] == totals['errors'] == 0, totals
          print('Full JUnit results:', totals)
          Path('audit-evidence/results.txt').write_text(f'New lifecycle tests: {count} passed\nFull JUnit results: {totals}\n')
          PY
      - name: Preserve validated source blobs without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          manifest = {}
          for path in json.loads(Path('audit-evidence/reviewed-paths.json').read_text()):
              data = Path(path).read_bytes()
              expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              request = json.dumps({'content': base64.b64encode(data).decode('ascii'), 'encoding': 'base64'})
              result = subprocess.run(['gh', 'api', '--method', 'POST', f"repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs", '--input', '-', '--jq', '.sha'], input=request, text=True, capture_output=True, check=True)
              actual = result.stdout.strip()
              assert actual == expected, (path, expected, actual)
              manifest[path] = actual
              destination = Path('audit-evidence/validated-source') / path
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
              print('VALIDATED_BLOB', actual, path)
          Path('audit-evidence/validated-blobs.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - name: Upload validation evidence only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: legacy-inventory-lifecycle-evidence
          path: |
            audit-evidence/
            build/test-results/test/TEST-*.xml
            build/reports/deprecation-compile.log
            build/reports/deprecations.md
          if-no-files-found: warn

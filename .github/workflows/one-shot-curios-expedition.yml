name: One-shot expedition utility Curios

on:
  push:
    branches:
      - 'feature/curios-expedition-utilities-release'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/curios-expedition-utilities-release
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Fix registration marker and wire guide, docs, verifier and tests
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('scripts/one_shot_curios_expedition_setup.py')
          text = path.read_text(encoding='utf-8')
          old = '''setup = replace_once(
              setup,
              '        new HazardProtectionArmorPiece(\\n',
              registrations + '        new HazardProtectionArmorPiece(\\n',
              'new Curios registrations',
          )'''
          new = '''setup = replace_once(
              setup,
              ''' + "'''        new HazardProtectionArmorPiece(\n                        containmentArmor,\n                        advancedHazmatHelmet,\n'''" + ''',
              registrations
              + ''' + "'''        new HazardProtectionArmorPiece(\n                        containmentArmor,\n                        advancedHazmatHelmet,\n'''" + ''',
              'new Curios registrations',
          )'''
          if old not in text:
              raise SystemExit('Expected old Curios registration patch block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 scripts/one_shot_curios_expedition_setup.py

      - name: Format only the intended changed files
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew spotlessApply --no-daemon

          TARGETS=(
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/setup/AdventurersCuriosSetup.java
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/WayfarersLodestone.java
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BastionResonator.java
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/EmergencyFlare.java
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/SurveyorsRod.java
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/ChunkStabilizer.java
            src/test/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/CuriosExpeditionUtilityTest.java
            scripts/verify_adventurers_curios.py
            docs/ADVENTURERS_CURIOS.md
          )

          rm -rf "$RUNNER_TEMP/intended-curios"
          mkdir -p "$RUNNER_TEMP/intended-curios"
          for file in "${TARGETS[@]}"; do
            mkdir -p "$RUNNER_TEMP/intended-curios/$(dirname "$file")"
            cp "$file" "$RUNNER_TEMP/intended-curios/$file"
          done

          git reset --hard HEAD
          for file in "${TARGETS[@]}"; do
            mkdir -p "$(dirname "$file")"
            cp "$RUNNER_TEMP/intended-curios/$file" "$file"
          done

          rm -f scripts/one_shot_curios_expedition_setup.py
          rm -f .github/workflows/one-shot-curios-expedition.yml
          rm -rf scripts/__pycache__
          git add -A
          git diff --cached --check

      - name: Run Legacy static verification
        run: python3 scripts/verify_legacy.py .

      - name: Compile and run complete test suite
        run: ./gradlew clean build --no-daemon -x spotlessCheck

      - name: Verify focused Curios test executed
        shell: bash
        run: |
          RESULT=build/test-results/test/TEST-io.github.thebusybiscuit.slimefun4.implementation.items.curios.CuriosExpeditionUtilityTest.xml
          test -f "$RESULT"
          grep -q 'failures="0"' "$RESULT"

      - name: Verify Java 21 bytecode target
        shell: bash
        run: |
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          python3 scripts/check_bytecode_target.py "$JAR" --expected-java 21

      - name: Commit verified Curios implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add expedition utility Curios"
          git push origin HEAD:feature/curios-expedition-utilities-release

name: Reconcile Four Addon Releases
on:
  push:
    branches: ['audit/reconcile-four-addons-r103']
    paths: ['.github/workflows/reconcile-four-addons-r103.yml']
permissions:
  contents: write
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 065c0882145458a9d12dc7982bdbdcd77ba7c347
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Reconcile exact parent selections without overwriting either history
        run: |
          set -euo pipefail
          mkdir -p evidence inputs
          git fetch --depth=2 origin 2909de53b80bfbc0cef72cdb31146fb93c94cd36
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          parent='cf09e5bc04cb912604e65bfeacce9dabeda5014a'
          companion='2909de53b80bfbc0cef72cdb31146fb93c94cd36'
          read=lambda ref,name:subprocess.check_output(['git','show',ref+':'+name])
          path=Path('compatibility/sfl-addon-release-matrix.json')
          base=json.loads(read(parent,str(path)))
          ours=json.loads(path.read_text())
          theirs=json.loads(read(companion,str(path)))
          pins=lambda data:{a['repository']:a['source_commit'] for a in data['addons']}
          bp,op,tp=map(pins,[base,ours,theirs])
          assert len(bp)==len(op)==len(tp)==45 and set(bp)==set(op)==set(tp)
          assert {k for k in bp if bp[k]!=op[k]}=={'wickidcow/SF_NetworksExp'}
          changes={
              'wickidcow/SF_BetterChests':'5c830e845d2849e0d8aea53414be8cba80af6775',
              'wickidcow/SF_BuildingStaff':'9f017f4ca4cec5997c14ccd1e564a21b21ed16a0',
              'wickidcow/SF_FluffyMachines':'91dc76b4e6d2024faeb1cbecace18c0a99b99aee'}
          assert {k:tp[k] for k in bp if bp[k]!=tp[k]}==changes
          assert op['wickidcow/SF_NetworksExp']=='ba79e6e36bd4798d37f7b8988efb414e7f041927'
          for row in ours['addons']:
              if row['repository'] in changes:row['source_commit']=changes[row['repository']]
          ours['bundle_revision']=103
          assert ours['excluded_from_bundle']==base['excluded_from_bundle']==theirs['excluded_from_bundle']
          path.write_text(json.dumps(ours,indent=2)+'\n')
          workflow=Path('.github/workflows/build-sfl-addons-compat-bundle.yml')
          assert workflow.read_bytes()==read(parent,str(workflow))
          workflow.write_bytes(read(companion,str(workflow)))
          Path('evidence/selected-sources.json').write_text(json.dumps(changes,indent=2)+'\n')
          Path('evidence/parent-selection.json').write_text(json.dumps(dict(base=parent,networks_parent='065c0882145458a9d12dc7982bdbdcd77ba7c347',companion=companion,bundle_revision=103,pins=pins(ours)),indent=2)+'\n')
          PY
          git diff --check
      - name: Verify actual standalone releases and stable core bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,io,json,re,subprocess,urllib.request,zipfile
          from pathlib import Path
          entries=[('Slimefun-Legacy','v4.1.63','Slimefun-Legacy4.1.63.jar','4.1.63'),('SF_NetworksExp','v1.0.47','SF_Networks1.0.47.jar','1.0.47'),('SF_BetterChests','v1.0.3','SF_BetterChests1.0.3.jar','1.0.3'),('SF_BuildingStaff','v1.0.35','SF_BuildingStaff1.0.35.jar','1.0.35'),('SF_FluffyMachines','v26.2.13','SF_FluffyMachines26.2.13.jar','26.2.13')]
          results=[]
          for repo,tag,name,version in entries:
              meta=json.loads(subprocess.check_output(['gh','api',f'repos/wickidcow/{repo}/releases/tags/{tag}']))
              assert not meta['draft'] and not meta['prerelease']
              matches=[a for a in meta['assets'] if a['name']==name];assert len(matches)==1,(repo,matches)
              asset=matches[0]
              destination=Path('inputs',name)
              subprocess.run(['curl','-fLsS','--retry','3','--max-time','180',asset['browser_download_url'],'-o',str(destination)],check=True)
              raw=destination.read_bytes();digest=hashlib.sha256(raw).hexdigest()
              assert asset['digest']=='sha256:'+digest and len(raw)==asset['size']
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  assert z.testzip() is None
                  descriptor=z.read('plugin.yml').decode()
                  found=re.search(r'''(?m)^version:\s*['"]?([^'"\s]+)''',descriptor)
                  assert found and found.group(1)==version,(repo,descriptor)
                  assert not any(n.startswith(('org/junit/','org/mockbukkit/','audit/')) for n in z.namelist())
              if repo=='Slimefun-Legacy':assert digest=='993b257c54efe19b58cc8f4946d4d39387f7787fe263c9f27123343159344c42'
              results.append(dict(repository='wickidcow/'+repo,tag=tag,asset_id=asset['id'],name=name,sha256=digest))
          Path('evidence/published-release-checks.json').write_text(json.dumps(results,indent=2)+'\n')
          PY
      - name: Full project builds and tests of all three companion sources
        run: |
          python3 - <<'PY'
          import hashlib,json,os,shutil,subprocess,sys,xml.etree.ElementTree as ET
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          import compare_addon_slimefun_compatibility
          import compare_addon_slimefun_compatibility_base as compatibility
          changes=json.loads(Path('evidence/selected-sources.json').read_text())
          expected={'SF_BetterChests':30,'SF_BuildingStaff':21,'SF_FluffyMachines':20}
          records=[]
          for repo,sha in changes.items():
              slug=repo.split('/')[1];source=Path('sources')/slug;report=Path('evidence')/slug;report.mkdir(parents=True)
              subprocess.run(['git','clone','--depth','1','https://github.com/'+repo+'.git',str(source)],check=True,timeout=120)
              subprocess.run(['git','-C',str(source),'fetch','--depth','1','origin',sha],check=True,timeout=120)
              subprocess.run(['git','-C',str(source),'checkout','--detach',sha],check=True)
              assert subprocess.check_output(['git','-C',str(source),'rev-parse','HEAD'],text=True).strip()==sha
              project=(Path('projects')/slug).resolve();compatibility.copy_project(source,project)
              assert compatibility.detect_build_system(project)=='maven'
              assert compatibility.patch_maven_dependency(project,'Reconciled-Stable-4.1.63')
              with (report/'build.log').open('w') as log:
                  assert compatibility.install_maven_jar(project=project,jar=Path('inputs/Slimefun-Legacy4.1.63.jar').resolve(),version='Reconciled-Stable-4.1.63',env=dict(os.environ),log=log)==0
                  if slug=='SF_BuildingStaff':
                      subprocess.run(['bash','scripts/install_rebar_api.sh'],cwd=project,stdout=log,stderr=subprocess.STDOUT,check=True)
                  status=compatibility.stream_maven_command(['mvn','-B','-ntp','-Dpaper.version=1.21.11-R0.1-SNAPSHOT','clean','verify'],cwd=project,env=dict(os.environ),log=log)
              if status:
                  print((report/'build.log').read_text()[-18000:]);raise SystemExit(status)
              xml=list((project/'target/surefire-reports').glob('TEST-*.xml'));assert xml
              roots=[ET.parse(p).getroot() for p in xml]
              counts={k:sum(int(r.attrib[k]) for r in roots) for k in ['tests','failures','errors','skipped']}
              assert counts==dict(tests=expected[slug],failures=0,errors=0,skipped=0),(repo,counts)
              for p in xml:shutil.copy2(p,report/p.name)
              jar=compatibility.find_built_addon_jar(project);assert jar is not None
              subprocess.run(['python3','scripts/verify_addon_bytecode.py',str(jar),'--expected-java','21','--report',str(report/'bytecode.json')],check=True)
              records.append(dict(repository=repo,source_commit=sha,counts=counts,jar=jar.name,sha256=hashlib.sha256(jar.read_bytes()).hexdigest()))
              Path('evidence/full-project-results.json').write_text(json.dumps(records,indent=2)+'\n')
          PY
      - name: Attribute new ledger rows and enforce retained source contracts
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('compatibility/maintained-addon-test-ledger.json');ledger=json.loads(p.read_text())
          results={r['repository']:r for r in json.loads(Path('evidence/full-project-results.json').read_text())}
          for row in ledger['addons']:
              if row['repository'] not in results:continue
              r=results[row['repository']];n=r['counts']
              row.update(source_commit=r['source_commit'],full_build_result='PASS',reported_test_entries=n['tests'],failures=n['failures'],errors=n['errors'],skips=n['skipped'])
              row['evidence']={'repository':'wickidcow/Slimefun-Legacy','run_id':int(os.environ['GITHUB_RUN_ID']),'artifact_name':'reconciled-r103-evidence','kind':'Full exact-source Maven clean verify; actual XML and Java21 output checks','tested_core_sha256':'993b257c54efe19b58cc8f4946d4d39387f7787fe263c9f27123343159344c42'}
              row['coverage']='Permanent project regressions; separately attributed native runtime fixtures do not imply exhaustive gameplay coverage'
              row['setup_notes']=['Only the Slimefun compile/test dependency was redirected to the checksum-verified published4.1.63 core. BuildingStaff also uses its existing optional-provider API installer. No tests skipped.']
          ledger['bundle_revision']=103
          ledger['summary']['reported_test_entries']=sum(r['reported_test_entries'] for r in ledger['addons'])
          ledger['summary']['addons_with_reported_tests']=sum(r['reported_test_entries']>0 for r in ledger['addons'])
          ledger['summary']['addons_without_reported_tests']=sum(r['reported_test_entries']==0 for r in ledger['addons'])
          ledger['limitations'].append('Revision103 reconciles PR297 and PR298. BetterChests, BuildingStaff and FluffyMachines full project tests were rerun against published4.1.63; Networks retains its independently verified98-test evidence. Other records retain their original attribution. This is not one fresh all45 test run.')
          manifest=json.loads(Path('compatibility/sfl-addon-release-matrix.json').read_text())
          pins={r['repository']:r['source_commit'] for r in manifest['addons']}
          for row in ledger['addons']:
              if row['repository'] in results:assert row['source_commit']==pins[row['repository']]
          p.write_text(json.dumps(ledger,indent=2)+'\n')
          Path('evidence/ledger-summary.json').write_text(json.dumps(ledger['summary'],indent=2)+'\n')
          PY
          python3 scripts/verify_legacy.py . > evidence/core-invariants.log 2>&1
          git diff --check
      - name: Stage only reviewed metadata and provider setup; export source for continuation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          records={}
          for name in ['compatibility/sfl-addon-release-matrix.json','compatibility/maintained-addon-test-ledger.json','.github/workflows/build-sfl-addons-compat-bundle.yml']:
              data=Path(name).read_bytes();sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              r=subprocess.run(['gh','api','--method','POST','repos/wickidcow/Slimefun-Legacy/git/blobs','--input','-'],input=json.dumps(dict(content=data.decode(),encoding='utf-8')),text=True,capture_output=True,check=True)
              assert json.loads(r.stdout)['sha']==sha;records[name]=sha
              target=Path('evidence/reviewed-source')/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          Path('evidence/reviewed-blobs.json').write_text(json.dumps(records,indent=2)+'\n')
          PY
          git archive --format=zip --output=evidence/core-source.zip HEAD
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reconciled-r103-evidence
          path: evidence/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

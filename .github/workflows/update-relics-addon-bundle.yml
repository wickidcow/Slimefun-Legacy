name: Update BetterChests and Relics in Slimefun Addon Bundle

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-relics-addon-bundle.yml'

permissions:
  contents: write

concurrency:
  group: update-selected-addons-bundle
  cancel-in-progress: true

jobs:
  update-addons:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Slimefun Legacy
        uses: actions/checkout@v6

      - name: Resolve current Slimefun Legacy release
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^projectVersion=//p' gradle.properties | head -n 1 | tr -d '\r')"
          test -n "$VERSION"
          echo "sfl_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sfl_tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download current addon bundle and latest maintained addon releases
        env:
          GH_TOKEN: ${{ github.token }}
          SFL_TAG: ${{ steps.meta.outputs.sfl_tag }}
          BETTERCHESTS_REPO: wickidcow/SF_BetterChests
          RELICS_REPO: wickidcow/SF_RelicsOfCthonia
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work bundle betterchests relics

          gh release download "$SFL_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'SFL_AddonsNDependencies.zip' \
            --dir work
          test -s work/SFL_AddonsNDependencies.zip
          unzip -q work/SFL_AddonsNDependencies.zip -d bundle

          resolve_addon() {
            local repo="$1"
            local prefix="$2"
            local out_dir="$3"
            local json_file="$4"
            local env_prefix="$5"

            gh api "repos/${repo}/releases/latest" > "$json_file"
            local tag
            local asset
            tag="$(jq -r '.tag_name' "$json_file")"
            asset="$(jq -r --arg prefix "$prefix" '[.assets[] | select(.state == "uploaded") | select(.name | startswith($prefix)) | select(.name | endswith(".jar"))] | .[0].name // empty' "$json_file")"

            if [[ -z "$tag" || "$tag" == 'null' || -z "$asset" ]]; then
              echo "Could not resolve latest maintained release JAR for ${repo}." >&2
              exit 1
            fi

            gh release download "$tag" \
              --repo "$repo" \
              --pattern "$asset" \
              --dir "$out_dir"

            test -s "${out_dir}/${asset}"
            unzip -tqq "${out_dir}/${asset}"

            local expected_digest
            expected_digest="$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .digest // empty' "$json_file")"
            if [[ "$expected_digest" == sha256:* ]]; then
              local expected_sha="${expected_digest#sha256:}"
              local actual_sha
              actual_sha="$(sha256sum "${out_dir}/${asset}" | awk '{print $1}')"
              if [[ "$actual_sha" != "$expected_sha" ]]; then
                echo "Release digest mismatch for ${repo} ${asset}." >&2
                echo "expected: ${expected_sha}" >&2
                echo "actual:   ${actual_sha}" >&2
                exit 1
              fi
            fi

            echo "${env_prefix}_TAG=${tag}" >> "$GITHUB_ENV"
            echo "${env_prefix}_ASSET=${asset}" >> "$GITHUB_ENV"
          }

          resolve_addon "$BETTERCHESTS_REPO" 'SF_BetterChests' betterchests work/betterchests-release.json BETTERCHESTS
          resolve_addon "$RELICS_REPO" 'SF_RelicsOfCthonia' relics work/relics-release.json RELICS

      - name: Replace BetterChests and Relics without changing other bundle selections
        shell: bash
        run: |
          set -euo pipefail

          FIRST_SF_JAR="$(find bundle -type f -name 'SF_*.jar' -print -quit)"
          if [[ -z "$FIRST_SF_JAR" ]]; then
            echo 'Could not determine the addon JAR directory in the existing bundle.' >&2
            exit 1
          fi
          DEFAULT_DEST_DIR="$(dirname "$FIRST_SF_JAR")"

          replace_addon() {
            local pattern="$1"
            local source_jar="$2"
            local expected_name="$3"
            local label="$4"

            mapfile -t old_entries < <(find bundle -type f -iname "$pattern" -print | sort)
            local dest_dir="$DEFAULT_DEST_DIR"

            if [[ "${#old_entries[@]}" -gt 0 ]]; then
              dest_dir="$(dirname "${old_entries[0]}")"
              echo "Existing ${label} entries:"
              printf '  %s\n' "${old_entries[@]}"
            else
              echo "${label} was not present; adding it beside the existing SF_ addon JARs in ${dest_dir#bundle/}."
            fi

            find bundle -type f -iname "$pattern" -delete
            cp "$source_jar" "$dest_dir/$expected_name"

            mapfile -t final_entries < <(find bundle -type f -iname "$pattern" -print | sort)
            if [[ "${#final_entries[@]}" -ne 1 ]]; then
              echo "Expected exactly one ${label} JAR after replacement; found ${#final_entries[@]}." >&2
              printf '%s\n' "${final_entries[@]}" >&2
              exit 1
            fi

            if [[ "$(basename "${final_entries[0]}")" != "$expected_name" ]]; then
              echo "Final ${label} filename does not match the maintained release asset." >&2
              exit 1
            fi

            unzip -tqq "${final_entries[0]}"
            echo "Installed bundle entry: ${final_entries[0]#bundle/}"
          }

          replace_addon '*BetterChests*.jar' "betterchests/$BETTERCHESTS_ASSET" "$BETTERCHESTS_ASSET" BetterChests
          replace_addon '*RelicsOfCthonia*.jar' "relics/$RELICS_ASSET" "$RELICS_ASSET" 'Relics of Cthonia'

      - name: Rebuild bundle and full checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          rm -f SFL_AddonsNDependencies.zip SFL_AddonsNDependencies.sha256
          (cd bundle && zip -qr ../SFL_AddonsNDependencies.zip .)

          test -s SFL_AddonsNDependencies.zip
          unzip -tqq SFL_AddonsNDependencies.zip

          BETTERCHESTS_COUNT="$(unzip -Z1 SFL_AddonsNDependencies.zip | grep -Ec '(^|/)[^/]*BetterChests[^/]*\.jar$')"
          RELICS_COUNT="$(unzip -Z1 SFL_AddonsNDependencies.zip | grep -Ec '(^|/)[^/]*RelicsOfCthonia[^/]*\.jar$')"
          if [[ "$BETTERCHESTS_COUNT" -ne 1 || "$RELICS_COUNT" -ne 1 ]]; then
            echo "Unexpected addon counts after rebuild: BetterChests=${BETTERCHESTS_COUNT}, Relics=${RELICS_COUNT}." >&2
            exit 1
          fi

          unzip -Z1 SFL_AddonsNDependencies.zip | grep -F "$BETTERCHESTS_ASSET"
          unzip -Z1 SFL_AddonsNDependencies.zip | grep -F "$RELICS_ASSET"

          find bundle -type f -name '*.jar' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  bundle/#  #' \
            > SFL_AddonsNDependencies.sha256

          JAR_COUNT="$(find bundle -type f -name '*.jar' | wc -l | tr -d ' ')"
          test "$(wc -l < SFL_AddonsNDependencies.sha256)" -eq "$JAR_COUNT"
          grep -F "$BETTERCHESTS_ASSET" SFL_AddonsNDependencies.sha256
          grep -F "$RELICS_ASSET" SFL_AddonsNDependencies.sha256

          echo "Bundle SHA-256: $(sha256sum SFL_AddonsNDependencies.zip | awk '{print $1}')"
          echo "JARs checksummed: ${JAR_COUNT}"

      - name: Publish updated bundle to current Slimefun Legacy release
        env:
          GH_TOKEN: ${{ github.token }}
          SFL_TAG: ${{ steps.meta.outputs.sfl_tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$SFL_TAG" \
            SFL_AddonsNDependencies.zip \
            SFL_AddonsNDependencies.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          {
            echo "Updated ${SFL_TAG} addon bundle."
            echo "BetterChests: ${BETTERCHESTS_ASSET} (${BETTERCHESTS_TAG})"
            echo "Relics of Cthonia: ${RELICS_ASSET} (${RELICS_TAG})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verification artifact
        uses: actions/upload-artifact@v7
        with:
          name: SFL-Addon-Bundle-${{ steps.meta.outputs.sfl_version }}-BetterChests-Relics
          path: |
            SFL_AddonsNDependencies.zip
            SFL_AddonsNDependencies.sha256
          if-no-files-found: error

name: Milestone Actions History Cleanup
on:
  push:
    paths:
      - ".github/workflows/actions-history-cleanup.yml"
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Keep one successful release milestone per version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          : > /tmp/releases; : > /tmp/versions; : > /tmp/tags; : > /tmp/keep_tags; : > /tmp/keep_shas
          gh api --paginate "repos/$REPO/releases?per_page=100" --jq '.[] | select(.draft == false) | .tag_name' > /tmp/releases || true
          gh api --paginate "repos/$REPO/tags?per_page=100" --jq '.[] | [.name,.commit.sha] | @tsv' > /tmp/tags || true
          awk -F '\t' '$1 ~ /^v?[0-9]+([.][0-9A-Za-z]+)*([_-][0-9A-Za-z.-]+)?$/ {print $1}' /tmp/tags > /tmp/versions || true
          cat /tmp/releases /tmp/versions | sed '/^$/d' | sort -u > /tmp/keep_tags
          awk -F '\t' 'NR==FNR{k[$1]=1;next}($1 in k){print $2}' /tmp/keep_tags /tmp/tags | sort -u > /tmp/keep_shas

          list_runs(){ gh api --paginate "repos/$REPO/actions/runs?per_page=100" --jq '.workflow_runs[] | [.id,.status,(.conclusion//""),(.head_branch//""),(.head_sha//""),(.name//"")] | @tsv'; }
          milestone_name(){
            [[ "$1" == "Build Slimefun Legacy" || "$1" == "Reproducible Release" || "$1" == Build\ SF\ Addons*Bundle* ]]
          }
          tagged(){
            local branch="$1" sha="$2"
            [[ -n "$branch" ]] && grep -Fxq -- "$branch" /tmp/keep_tags && return 0
            [[ -n "$sha" ]] && grep -Fxq -- "$sha" /tmp/keep_shas && return 0
            return 1
          }

          while IFS=$'\t' read -r id status conclusion branch sha name; do
            [[ -z "$id" || "$id" == "$CURRENT_RUN_ID" ]] && continue
            if [[ "$status" == completed && "$conclusion" == success ]] && milestone_name "$name" && tagged "$branch" "$sha"; then
              continue
            fi
            [[ "$status" == completed ]] || gh api --method POST "repos/$REPO/actions/runs/$id/force-cancel" >/dev/null 2>&1 || true
          done < <(list_runs)

          sleep 20
          declare -A seen=()
          while IFS=$'\t' read -r id status conclusion branch sha name; do
            [[ -z "$id" || "$id" == "$CURRENT_RUN_ID" ]] && continue
            keep=false
            if [[ "$status" == completed && "$conclusion" == success ]] && milestone_name "$name" && tagged "$branch" "$sha"; then
              key="$sha|$name"
              if [[ -z "${seen[$key]+x}" ]]; then
                seen[$key]=1
                keep=true
              fi
            fi
            [[ "$keep" == true ]] && continue
            gh api --method DELETE "repos/$REPO/actions/runs/$id" >/dev/null 2>&1 || true
          done < <(list_runs)

name: Milestone Actions History Cleanup
on:
  push:
    paths:
      - ".github/workflows/actions-history-cleanup.yml"
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Keep only version milestones
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          : > /tmp/releases; : > /tmp/versions; : > /tmp/tags; : > /tmp/keep_tags; : > /tmp/keep_shas
          gh api --paginate "repos/$REPO/releases?per_page=100" --jq '.[] | select(.draft == false) | .tag_name' > /tmp/releases || true
          gh api --paginate "repos/$REPO/tags?per_page=100" --jq '.[] | [.name,.commit.sha] | @tsv' > /tmp/tags || true
          awk -F '\t' '$1 ~ /^v?[0-9]+([.][0-9A-Za-z]+)*([_-][0-9A-Za-z.-]+)?$/ {print $1}' /tmp/tags > /tmp/versions || true
          cat /tmp/releases /tmp/versions | sed '/^$/d' | sort -u > /tmp/keep_tags
          awk -F '\t' 'NR==FNR{k[$1]=1;next}($1 in k){print $2}' /tmp/keep_tags /tmp/tags | sort -u > /tmp/keep_shas
          list(){ gh api --paginate "repos/$REPO/actions/runs?per_page=100" --jq '.workflow_runs[] | [.id,.status,(.conclusion//""),.event,(.head_branch//""),(.head_sha//""),(.name//"")] | @tsv'; }
          keep(){
            local status="$1" conclusion="$2" event="$3" branch="$4" sha="$5" name="$6"
            [[ "$status" == completed && "$conclusion" == success ]] || return 1
            printf '%s\n' "$name" | grep -Eiq 'test|smoke|compat|validat|verif|audit|check|doctor|runtime|regression|lint|benchmark|coverage|matrix|compile|cleanup|clean[[:space:]_-]*asset|(^|[^a-z])ci([^a-z]|$)' && return 1
            [[ "$event" == release ]] && return 0
            local tagged=false
            [[ -n "$branch" ]] && grep -Fxq -- "$branch" /tmp/keep_tags && tagged=true
            [[ -n "$sha" ]] && grep -Fxq -- "$sha" /tmp/keep_shas && tagged=true
            [[ "$tagged" == true ]] || return 1
            printf '%s\n' "$name" | grep -Eiq 'release|publish|version|milestone|build|bundle|package'
          }
          while IFS=$'\t' read -r id status conclusion event branch sha name; do
            [[ -z "$id" || "$id" == "$CURRENT_RUN_ID" ]] && continue
            keep "$status" "$conclusion" "$event" "$branch" "$sha" "$name" && continue
            [[ "$status" == completed ]] || gh api --method POST "repos/$REPO/actions/runs/$id/force-cancel" >/dev/null 2>&1 || true
          done < <(list)
          sleep 20
          while IFS=$'\t' read -r id status conclusion event branch sha name; do
            [[ -z "$id" || "$id" == "$CURRENT_RUN_ID" ]] && continue
            keep "$status" "$conclusion" "$event" "$branch" "$sha" "$name" && continue
            gh api --method DELETE "repos/$REPO/actions/runs/$id" >/dev/null 2>&1 || true
          done < <(list)

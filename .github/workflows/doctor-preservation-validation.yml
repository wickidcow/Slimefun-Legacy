name: Legacy Doctor Item Preservation Validation

on:
  push:
    branches: ['work/legacy-doctor-item-preservation']

permissions:
  contents: read

concurrency:
  group: doctor-item-preservation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Reproduce exact charge mutation through the original Doctor
        id: control
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          mkdir -p audit-evidence
          test "$(git hash-object src/main/java/io/github/thebusybiscuit/slimefun4/core/services/stability/ItemPresentationDoctor.java)" = d1a743aec75d1777bfc4999bbefbb7777baa24e6
          set +e
          ./gradlew test --tests '*ItemDoctorPreservationTest.fractionalChargeSurvivesHistoricalDecodeAndPresentationRepairExactly' --console=plain --no-daemon > audit-evidence/original-doctor.log 2>&1
          RESULT=$?
          set -e
          test "$RESULT" -ne 0
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          path = Path('build/test-results/test/TEST-com.xzavier0722.mc.plugin.slimefun4.storage.controller.ItemDoctorPreservationTest.xml')
          suite = ET.parse(path).getroot()
          assert suite.get('tests') == '1' and suite.get('failures') == '1' and suite.get('skipped') == '0', suite.attrib
          failure = suite.find('testcase/failure')
          assert failure is not None and failure.get('type') == 'org.opentest4j.AssertionFailedError'
          assert 'expected: <1123477973> but was: <1123478405>' in failure.get('message', ''), failure.attrib
          Path('audit-evidence/original-doctor.xml').write_bytes(path.read_bytes())
          print('Confirmed old Doctor changed the stored float from 123.4567 to 123.46 during presentation repair.')
          PY
      - name: Apply the reviewed isolated-presentation correction
        id: patch
        if: ${{ !cancelled() }}
        run: |
          python3 .audit/apply_presentation_safety.py
          git diff --check
      - name: Verify source compatibility without weakening gates
        id: invariants
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 scripts/verify_legacy.py . 2>&1 | tee audit-evidence/invariants.log
      - name: Build corrected source and run all regressions
        id: build
        if: ${{ !cancelled() && steps.invariants.outcome == 'success' }}
        run: |
          set -euo pipefail
          ./gradlew spotlessApply --no-daemon
          ./gradlew clean --console=plain --no-daemon
          mkdir -p build/reports
          ./gradlew build -PslimefunDeprecationReport=true --console=plain --no-daemon 2>&1 | tee build/reports/deprecation-compile.log
          python3 scripts/summarize_deprecations.py build/reports/deprecation-compile.log --fail-on-warnings --require-successful-build
          git diff --check
      - name: Verify actual Doctor-preservation test results
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          totals = dict.fromkeys(('tests', 'failures', 'errors', 'skipped'), 0)
          matches = {}
          for path in Path('build/test-results/test').glob('TEST-*.xml'):
              suite = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, '0'))
              for name, count in (('ItemDoctorPreservationTest', 12), ('InventoryRecoverySnapshotTest', 12), ('InventoryRecoveryDiagnosticsTest', 10)):
                  if path.name.endswith('.' + name + '.xml'):
                      assert int(suite.get('tests', '0')) == count, suite.attrib
                      assert all(int(suite.get(key, '0')) == 0 for key in ('failures', 'errors', 'skipped')), suite.attrib
                      matches[name] = suite.attrib
                      print('Validated Doctor suite:', suite.attrib)
          assert len(matches) == 3, matches
          assert totals['failures'] == totals['errors'] == 0, totals
          Path('audit-evidence/results.json').write_text(json.dumps({'totals': totals, 'required_suites': matches}, indent=2))
          print('Full JUnit reported totals:', totals)
          PY
      - name: Preserve exact validated production and test source
        if: ${{ success() && steps.control.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          names = (
              'src/main/java/io/github/thebusybiscuit/slimefun4/core/services/stability/ItemPresentationDoctor.java',
              'src/test/java/com/xzavier0722/mc/plugin/slimefun4/storage/controller/ItemDoctorPreservationTest.java',
          )
          manifest = {}
          for name in names:
              data = Path(name).read_bytes()
              sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              body = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              result = subprocess.run(['gh', 'api', '--method', 'POST', f"repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs", '--input', '-', '--jq', '.sha'], input=body, text=True, capture_output=True, check=True)
              assert result.stdout.strip() == sha, name
              manifest[name] = sha
              print('VALIDATED_BLOB', sha, name)
          Path('audit-evidence/validated-blobs.json').write_text(json.dumps(manifest, indent=2))
          PY
      - name: Preserve source and failure evidence
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ('src/main/java/io/github/thebusybiscuit/slimefun4/core/services/stability/ItemPresentationDoctor.java', 'src/test/java/com/xzavier0722/mc/plugin/slimefun4/storage/controller/ItemDoctorPreservationTest.java'):
              target = Path('audit-evidence/tested-source') / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(Path(name).read_bytes())
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: doctor-item-preservation-evidence
          retention-days: 14
          path: |
            audit-evidence/
            build/test-results/test/TEST-*.xml
            build/reports/deprecation-compile.log
            build/reports/deprecations.md
          if-no-files-found: warn

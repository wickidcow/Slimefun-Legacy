name: Release 4.1.32 Backpack Hot Fix

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/release-4.1.32-backpack-hotfix.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^projectVersion=//p' gradle.properties | head -n 1 | tr -d '\r')"
          test "$VERSION" = "4.1.32"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=SlimefunLegacy$VERSION" >> "$GITHUB_ENV"

      - name: Verify source
        run: python3 scripts/verify_legacy.py .

      - name: Build release JAR
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean shadowJar -PprojectVersion="${VERSION}" --no-daemon --no-build-cache --no-configuration-cache
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          mkdir -p dist
          OUTPUT="dist/SF_Slimefun_Legacy_v${VERSION}.jar"
          cp "$JAR" "$OUTPUT"
          python3 scripts/check_bytecode_target.py "$OUTPUT" --expected-java 21
          python3 scripts/verify_release_artifact.py "$OUTPUT" --root .
          sha256sum "$OUTPUT" > "dist/SF_Slimefun_Legacy_v${VERSION}.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing release assets."
            gh release upload "$TAG" \
              "dist/SF_Slimefun_Legacy_v${VERSION}.jar" \
              "dist/SF_Slimefun_Legacy_v${VERSION}.sha256" \
              --clobber
            gh release edit "$TAG" \
              --title "Slimefun Legacy ${VERSION} — Backpack Hot Fix" \
              --notes-file - <<'EOF'
## 🎒 Backpack Hot Fix

Slimefun Legacy 4.1.32 is a focused hotfix for backpack renaming.

### Fixed
- Added the missing `backpack.set-name` English localization entry.
- Fixes the missing-string warning shown when the backpack rename prompt is requested.
- Restores the intended rename instruction: hold the backpack and type its new name in chat.

This release contains no gameplay balance changes and is intended as a direct hotfix for 4.1.31.
EOF
          else
            gh release create "$TAG" \
              "dist/SF_Slimefun_Legacy_v${VERSION}.jar" \
              "dist/SF_Slimefun_Legacy_v${VERSION}.sha256" \
              --target "$GITHUB_SHA" \
              --title "Slimefun Legacy ${VERSION} — Backpack Hot Fix" \
              --notes-file - <<'EOF'
## 🎒 Backpack Hot Fix

Slimefun Legacy 4.1.32 is a focused hotfix for backpack renaming.

### Fixed
- Added the missing `backpack.set-name` English localization entry.
- Fixes the missing-string warning shown when the backpack rename prompt is requested.
- Restores the intended rename instruction: hold the backpack and type its new name in chat.

This release contains no gameplay balance changes and is intended as a direct hotfix for 4.1.31.
EOF
          fi

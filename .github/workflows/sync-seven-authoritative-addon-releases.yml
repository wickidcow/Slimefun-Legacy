name: Sync Seven Authoritative Addon Releases

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/sync-seven-authoritative-addon-releases.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-seven-authoritative-addon-releases
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download current Slimefun Legacy addon bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p base bundle authoritative
          gh release download v4.1.48 \
            --repo wickidcow/Slimefun-Legacy \
            --pattern 'SFL_AddonsNDependencies.zip' \
            --dir base
          unzip -q base/SFL_AddonsNDependencies.zip -d bundle

      - name: Download exact authoritative addon release JARs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          fetch() {
            local repo="$1" tag="$2" asset="$3" expected="$4"
            rm -rf "authoritative/${repo##*/}"
            mkdir -p "authoritative/${repo##*/}"
            gh release download "$tag" --repo "$repo" --pattern "$asset" --dir "authoritative/${repo##*/}"
            local jar="authoritative/${repo##*/}/${asset}"
            test -s "$jar"
            unzip -tqq "$jar"
            echo "${expected}  ${jar}" | sha256sum --check --strict
            rm -f "bundle/${asset}"
            cp "$jar" "bundle/${asset}"
          }

          fetch wickidcow/SF_ExtraTools v1.2.1 SF_ExtraTools1.2.1.jar ff60f226d5cadf4354068540ffed05808c7593d7affa18f6e4dcf97d6bdf09c0
          fetch wickidcow/SF_HotbarPets v1.0.0 SF_HotbarPets1.0.0.jar e3c6c1009305383b01837bc91278e67f041684701562bf1391aac67a045d198f
          fetch wickidcow/SF_SoulJars v1.0.0 SF_SoulJars1.0.0.jar 79315684526c3f64158f02283d3a878f2ef232b1809e7c25bb303b912cd3a125
          fetch wickidcow/SF_SMG v1.0.1 SF_SMG1.0.1.jar 2875e54aa16bd68514cd393bd74348f9c8641ac98f4479bc8b1272cc5e03d170
          fetch wickidcow/SF_BetterFarming v1.0.0 SF_BetterFarming1.0.0.jar c99346e9d47be01c18b85468c607df87c25b896df000d888c86f8d42a395edf3
          fetch wickidcow/SF_Magic8Ball v1.0.0 SF_Magic8Ball1.0.0.jar 924d9ba4436c11ad8c12f20d37d5a9f293746bad572b216bd2327825e09e4225
          fetch wickidcow/SF_SlimyTreeTaps v1.0.2 SF_SlimyTreeTaps1.0.2.jar 014fb12f809ea44c26d563473ed66e17fd1eec5441f652574a3ecb114602c350

      - name: Validate and rebuild 41-JAR bundle
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find bundle -maxdepth 1 -type f -name '*.jar' | sort)
          if [[ "${#jars[@]}" -ne 41 ]]; then
            echo "Expected 41 JARs, found ${#jars[@]}" >&2
            printf '%s\n' "${jars[@]}" >&2
            exit 1
          fi
          for jar in "${jars[@]}"; do unzip -tqq "$jar"; done

          rm -f SFL_AddonsNDependencies.zip SFL_AddonsNDependencies.sha256
          (cd bundle && zip -q -9 ../SFL_AddonsNDependencies.zip *.jar)
          while IFS= read -r file; do
            sha256sum "bundle/$file" | sed 's#  bundle/#  #'
          done < <(find bundle -maxdepth 1 -type f -name '*.jar' -printf '%f\n' | sort) > SFL_AddonsNDependencies.sha256
          test "$(wc -l < SFL_AddonsNDependencies.sha256)" -eq 41
          unzip -tqq SFL_AddonsNDependencies.zip
          sha256sum SFL_AddonsNDependencies.zip

      - name: Publish refreshed v4.1.48 bundle assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v4.1.48 \
            SFL_AddonsNDependencies.zip \
            SFL_AddonsNDependencies.sha256 \
            --repo wickidcow/Slimefun-Legacy \
            --clobber

      - name: Upload synchronized bundle
        uses: actions/upload-artifact@v7
        with:
          name: SFL-Authoritative-Addon-Bundle
          path: |
            SFL_AddonsNDependencies.zip
            SFL_AddonsNDependencies.sha256
          if-no-files-found: error

      - name: Upload seven authoritative JARs
        uses: actions/upload-artifact@v7
        with:
          name: AlbionMC-Authoritative-Seven-JARs
          path: authoritative/*/*.jar
          if-no-files-found: error

name: Refresh RykenSlimeCustomizer Legacy5 Bundle

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/refresh-fixed-ryken-legacy5.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-ryken-legacy5-addon-bundle
  cancel-in-progress: true

env:
  RSC_VERSION: '3.1.7-Legacy5'

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Slimefun Legacy
        uses: actions/checkout@v6

      - name: Replace RykenSlimeCustomizer JAR in current bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(sed -n 's/^projectVersion=//p' gradle.properties | head -n 1 | tr -d '\r')"
          CURRENT_TAG="v${CURRENT_VERSION}"
          EXPECTED_JAR="SF_RykenSlimeCustomizer${RSC_VERSION}.jar"

          rm -rf bundle work fixed
          mkdir -p bundle work fixed

          echo "Downloading current addon bundle from ${CURRENT_TAG}"
          gh release download "$CURRENT_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'SFL_AddonsNDependencies.zip' \
            --dir work
          unzip -q work/SFL_AddonsNDependencies.zip -d bundle

          RSC_OLD="$(find bundle -type f -iname '*RykenSlime*Customizer*.jar' -print -quit || true)"
          if [[ -z "$RSC_OLD" ]]; then
            echo 'Could not find the existing RykenSlimeCustomizer JAR in the current bundle.' >&2
            exit 1
          fi
          RSC_DIR="$(dirname "$RSC_OLD")"
          echo "RykenSlimeCustomizer destination: $RSC_DIR"
          echo "Replacing: $RSC_OLD"

          find bundle -type f -iname '*RykenSlime*Customizer*.jar' -delete

          downloaded=false
          for attempt in $(seq 1 90); do
            rm -f "fixed/$EXPECTED_JAR"
            if gh release download "v${RSC_VERSION}" \
              --repo wickidcow/SF_RykenSlimeCustomizer \
              --pattern "$EXPECTED_JAR" \
              --dir fixed; then
              downloaded=true
              break
            fi
            echo "Waiting for RSC v${RSC_VERSION} release asset (attempt ${attempt}/90)"
            sleep 10
          done

          if [[ "$downloaded" != true || ! -f "fixed/$EXPECTED_JAR" ]]; then
            echo "Timed out waiting for $EXPECTED_JAR" >&2
            exit 1
          fi

          cp "fixed/$EXPECTED_JAR" "$RSC_DIR/"

          test "$(find bundle -type f -name "$EXPECTED_JAR" | wc -l)" -eq 1
          if find bundle -type f -iname '*RykenSlime*Customizer*.jar' ! -name "$EXPECTED_JAR" | grep -q .; then
            echo 'A stale RykenSlimeCustomizer JAR remains in the bundle.' >&2
            find bundle -type f -iname '*RykenSlime*Customizer*.jar' -print
            exit 1
          fi

          rm -f SFL_AddonsNDependencies.zip
          (cd bundle && zip -qr ../SFL_AddonsNDependencies.zip .)

          echo 'Verifying final archive:'
          unzip -l SFL_AddonsNDependencies.zip | grep -F "$EXPECTED_JAR"
          if unzip -l SFL_AddonsNDependencies.zip | grep -Ei 'RykenSlime.*Customizer.*\.jar' | grep -Fv "$EXPECTED_JAR"; then
            echo 'A stale RykenSlimeCustomizer JAR is present in the final archive.' >&2
            exit 1
          fi

          sha256sum SFL_AddonsNDependencies.zip

      - name: Publish refreshed ZIP to current Slimefun Legacy release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(sed -n 's/^projectVersion=//p' gradle.properties | head -n 1 | tr -d '\r')"
          CURRENT_TAG="v${CURRENT_VERSION}"
          gh release upload "$CURRENT_TAG" SFL_AddonsNDependencies.zip \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Upload refreshed bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: Slimefun-Legacy-Addons-Ryken-Legacy5
          path: SFL_AddonsNDependencies.zip
          archive: false
          if-no-files-found: error

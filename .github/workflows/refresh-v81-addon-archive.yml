name: Refresh v4.1.81 published addon ZIP (IE2 and Fluffy only)

on:
  pull_request:
    paths:
      - '.github/workflows/refresh-v81-addon-archive.yml'
      - 'scripts/refresh_v81_two_addons.py'
  push:
    branches: [master]
    paths:
      - '.github/workflows/refresh-v81-addon-archive.yml'
      - 'scripts/refresh_v81_two_addons.py'

permissions:
  contents: write

concurrency:
  group: v4.1.81-addon-asset-replacement
  cancel-in-progress: false

jobs:
  verify-and-replace:
    name: Guarded v81 ZIP refresh (write only after master merge)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v4.1.81
      BUNDLE: SF_Addons_1.21.11-26.3.zip
      ORIGINAL_SHA256: dbb3ae33479716bd836dfbd28e5e7eb73be14471e94e99f274946e0fb129189e
    steps:
      - uses: actions/checkout@v4

      - name: Retrieve exact v81 ZIP and newly published official JARs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "wickidcow/Slimefun-Legacy"
          mkdir -p original official dist verified
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$BUNDLE" --dir original
          gh release download v26.2.22 --repo wickidcow/SF_FluffyMachines \
            --pattern 'SF_FluffyMachines26.2.22.jar' --dir official
          gh release download v2.0.21 --repo wickidcow/SF_InfinityExpansion2 \
            --pattern 'SF_InfinityExpansion2.0.21.jar' --dir official
          echo "$ORIGINAL_SHA256  original/$BUNDLE" | sha256sum --check
          echo 'ae3eafe860523ec02b0ba435a790aa38c2dc509352eaf2cf5f7890507ec9e54e  official/SF_FluffyMachines26.2.22.jar' | sha256sum --check
          echo '7c307269b0e3afe9d32a0c0a5f7f742d8f50d4f55a31b0dfd3befdd55debb633  official/SF_InfinityExpansion2.0.21.jar' | sha256sum --check

      - name: Repack exactly two addon JARs and update manifest/checksums
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/refresh_v81_two_addons.py \
            "original/$BUNDLE" \
            official/SF_FluffyMachines26.2.22.jar \
            official/SF_InfinityExpansion2.0.21.jar \
            "dist/$BUNDLE"
          unzip -tqq "dist/$BUNDLE"
          python3 scripts/verify_published_addon_bundle.py "dist/$BUNDLE"
          unzip -Z1 "dist/$BUNDLE" | grep -E '\.jar$' | wc -l | grep -Fx 44
          sha256sum "dist/$BUNDLE"

      - name: Preserve original v81 addon ZIP for recovery before publication
        uses: actions/upload-artifact@v4
        with:
          name: original-v4.1.81-addons-before-fluffy-ie2-refresh
          path: original/SF_Addons_1.21.11-26.3.zip
          retention-days: 90
          if-no-files-found: error

      - name: Upload refreshed bundle as a separate PR validation artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: candidate-v4.1.81-ie2-2.0.21-fluffy-26.2.22
          path: dist/SF_Addons_1.21.11-26.3.zip
          retention-days: 14
          if-no-files-found: error

      - name: Overwrite only the original v4.1.81 addon ZIP and verify byte-for-byte
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: bash
        run: |
          set -eEuo pipefail
          # Never change old tags, core JAR, player/Geyser resource packs, or other asset names.
          actual="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq ".assets[] | select(.name == \"$BUNDLE\") | .digest")"
          test "$actual" = "sha256:$ORIGINAL_SHA256" || {
            echo "Published v81 bundle no longer matches the preserved original; refusing replacement" >&2
            exit 1
          }
          expected="sha256:$(sha256sum "dist/$BUNDLE" | awk '{print $1}')"
          mutating=false
          rollback() {
            status=$?
            trap - ERR
            if test "$mutating" = true; then
              echo "Refreshed bundle failed post-upload verification; restoring backed-up original" >&2
              gh release upload "$TAG" "original/$BUNDLE" \
                --repo "$GITHUB_REPOSITORY" --clobber || {
                  echo "::error::Rollback upload failed. Recover original from this workflow artifact." >&2
                }
            fi
            exit "$status"
          }
          trap rollback ERR
          mutating=true
          gh release upload "$TAG" "dist/$BUNDLE" --repo "$GITHUB_REPOSITORY" --clobber
          published="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq ".assets[] | select(.name == \"$BUNDLE\") | .digest")"
          test "$published" = "$expected"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$BUNDLE" --dir verified
          cmp "dist/$BUNDLE" "verified/$BUNDLE"
          mutating=false
          trap - ERR
          echo "## Verified in-place v4.1.81 addon ZIP refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "- Replaced only FluffyMachines v26.2.21 → v26.2.22 and InfinityExpansion2 v2.0.19 → v2.0.21." >> "$GITHUB_STEP_SUMMARY"
          echo "- All other 42 addon JAR payloads preserved; 44 total JARs." >> "$GITHUB_STEP_SUMMARY"
          echo "- Manifest and SHA256SUMS rewritten, verified full archive and download parity." >> "$GITHUB_STEP_SUMMARY"
          echo "- Core and resource pack assets remain unchanged." >> "$GITHUB_STEP_SUMMARY"
          echo "- New ZIP digest: $expected" >> "$GITHUB_STEP_SUMMARY"

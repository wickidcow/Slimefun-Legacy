name: Update Slimefun Legacy 4.1.31 Stable

on:
  push:
    branches:
      - master

permissions:
  contents: write

env:
  TARGET_SHA: 60a223b22ed5ac19913a8342bc518406303af6b2
  RELEASE_VERSION: 4.1.31
  RELEASE_TAG: SlimefunLegacy4.1.31

jobs:
  update-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact merged containment source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Pin and verify exact release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          VERSION="$(sed -n 's/^projectVersion=//p' gradle.properties | head -n 1 | tr -d '\r')"
          test "$VERSION" = "$RELEASE_VERSION"
          echo "SOURCE_COMMIT=$TARGET_SHA" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$TARGET_SHA")" >> "$GITHUB_ENV"

      - name: Verify all Slimefun Legacy invariants
        run: python3 scripts/verify_legacy.py .

      - name: First clean stable build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean shadowJar -PprojectVersion="$RELEASE_VERSION" --no-daemon --no-build-cache --no-configuration-cache
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          cp "$JAR" "$RUNNER_TEMP/Slimefun-first.jar"

      - name: Verify first stable artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_bytecode_target.py "$RUNNER_TEMP/Slimefun-first.jar" --expected-java 21 --report "$RUNNER_TEMP/bytecode-first.txt"
          python3 scripts/verify_release_artifact.py "$RUNNER_TEMP/Slimefun-first.jar" \
            --root . \
            --json-report "$RUNNER_TEMP/release-artifact-first.json" \
            --summary "$RUNNER_TEMP/release-artifact-first.md"

      - name: Second clean stable build
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean shadowJar -PprojectVersion="$RELEASE_VERSION" --no-daemon --no-build-cache --no-configuration-cache
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          cp "$JAR" "$RUNNER_TEMP/Slimefun-second.jar"

      - name: Verify reproducibility and stage raw release JAR
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_bytecode_target.py "$RUNNER_TEMP/Slimefun-second.jar" --expected-java 21 --report "$RUNNER_TEMP/bytecode-second.txt"
          python3 scripts/verify_release_artifact.py "$RUNNER_TEMP/Slimefun-second.jar" \
            --root . \
            --json-report "$RUNNER_TEMP/release-artifact-second.json" \
            --summary "$RUNNER_TEMP/release-artifact-second.md"
          cmp "$RUNNER_TEMP/Slimefun-first.jar" "$RUNNER_TEMP/Slimefun-second.jar"
          FIRST_SHA="$(sha256sum "$RUNNER_TEMP/Slimefun-first.jar" | awk '{print $1}')"
          SECOND_SHA="$(sha256sum "$RUNNER_TEMP/Slimefun-second.jar" | awk '{print $1}')"
          test "$FIRST_SHA" = "$SECOND_SHA"
          mkdir -p dist
          cp "$RUNNER_TEMP/Slimefun-first.jar" "dist/SF_Slimefun_Legacy_v${RELEASE_VERSION}.jar"
          printf '%s  %s\n' "$FIRST_SHA" "SF_Slimefun_Legacy_v${RELEASE_VERSION}.jar" > "dist/SF_Slimefun_Legacy_v${RELEASE_VERSION}.sha256"
          echo "RELEASE_SHA256=$FIRST_SHA" >> "$GITHUB_ENV"

      - name: Prepare updated 4.1.31 release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > existing-release-notes.md
          python3 - <<'PY'
          from pathlib import Path
          import re
          old = Path("existing-release-notes.md").read_text(encoding="utf-8").strip()
          old = re.sub(r"^## Slimefun Legacy 4\.1\.31 — Stable\s*", "", old, count=1)
          lines = [
              "## Slimefun Legacy 4.1.31 — Stable",
              "",
              "### Netherite Containment Armor update",
              "",
              "- Added **Advanced Hazmat Gear** as a real four-piece protective prerequisite set built from the existing Hazmat/Scuba equipment.",
              "- Added **Netherite Containment Armor** with Helmet, Chestplate, Leggings, and Boots.",
              "- **Adventurer's Curios** now opens organized submenus for **Curiosities**, **Advanced Hazmat Gear**, and **Netherite Containment Armor**.",
              "- Netherite Containment Armor is a full-set protective suit for radiation and bee hazards. The helmet retains water-breathing support and the chestplate retains fire resistance.",
              "- Containment lore describes the set as protection for hostile environments while handling sensitive or hazardous materials, with lead-lined, netherite-reinforced construction.",
              "- Fixed the Paper 26.2 runtime smoke verifier so it reads the active Slimefun Legacy version instead of hard-coding 4.1.30.",
              "",
              "**Containment recipe for each corresponding armor piece:**",
              "",
              "```text",
              "Lead Ingot      | Netherite Ingot                | Lead Ingot",
              "Netherite Ingot | Advanced Hazmat <Armor Piece>  | Netherite Ingot",
              "Lead Ingot      | Netherite Upgrade               | Lead Ingot",
              "```",
              "",
              "New item IDs:",
              "",
              "- `ADVANCED_HAZMAT_HELMET`",
              "- `ADVANCED_HAZMAT_CHESTPLATE`",
              "- `ADVANCED_HAZMAT_LEGGINGS`",
              "- `ADVANCED_HAZMAT_BOOTS`",
              "- `NETHERITE_CONTAINMENT_HELMET`",
              "- `NETHERITE_CONTAINMENT_CHESTPLATE`",
              "- `NETHERITE_CONTAINMENT_LEGGINGS`",
              "- `NETHERITE_CONTAINMENT_BOOTS`",
              "",
              "### Earlier 4.1.31 release notes",
              "",
          ]
          update = "\n".join(lines)
          Path("release-notes.md").write_text(update + old + "\n", encoding="utf-8")
          PY

      - name: Update stable tag, release notes, JAR and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
            -f sha="$TARGET_SHA" -F force=true >/dev/null
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Slimefun Legacy ${RELEASE_VERSION} — Stable" \
            --notes-file release-notes.md \
            --latest
          gh release upload "$RELEASE_TAG" \
            "dist/SF_Slimefun_Legacy_v${RELEASE_VERSION}.jar" \
            "dist/SF_Slimefun_Legacy_v${RELEASE_VERSION}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          echo "Updated stable release $RELEASE_TAG"
          echo "SHA-256: $RELEASE_SHA256"

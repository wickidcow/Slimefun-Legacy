name: Build SF Addons 1.21.11-26.3 Bundle

on:
  push:
    branches: [master]
    paths:
      - 'gradle.properties'
      - 'docs/releases/**'
      - '.github/workflows/build-sfl-addons-compat-bundle.yml'
      - 'compatibility/sfl-addon-release-matrix.json'
      - 'scripts/compile_addon_paper_26_3.py'
      - 'scripts/paper_candidate_versions.py'
      - 'scripts/test_paper_candidate_versions.py'
  pull_request:
    paths:
      - 'gradle.properties'
      - 'docs/releases/**'
      - '.github/workflows/build-sfl-addons-compat-bundle.yml'
      - 'compatibility/sfl-addon-release-matrix.json'
      - 'scripts/compile_addon_paper_26_3.py'
      - 'scripts/paper_candidate_versions.py'
      - 'scripts/test_paper_candidate_versions.py'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: sf-addons-1.21.11-26.3-bundle-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_NAME: SF_Addons_1.21.11-26.3.zip

jobs:
  prepare:
    name: Prepare maintained addon matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
      paper_api: ${{ steps.paper.outputs.paper_api }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate manifest and create matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          p = Path('compatibility/sfl-addon-release-matrix.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          addons = data['addons']
          repos = [row['repository'] for row in addons]
          if len(repos) != len(set(repos)):
              raise SystemExit('duplicate repositories in addon release matrix')
          excluded = set(data.get('excluded_from_bundle', {})) | set(data.get('excluded_archived', []))
          if excluded.intersection(repos):
              raise SystemExit(f'Excluded addons in release matrix: {sorted(excluded.intersection(repos))}')
          allowed_non_sf = {'wickidcow/WorldEditSlimefun'}
          if not all(repo.startswith('wickidcow/SF_') or repo in allowed_non_sf for repo in repos):
              raise SystemExit('release matrix must contain only maintained wickidcow/SF_ repositories or approved naming exceptions')

          def lock_source(row):
              locked = dict(row)
              pinned = (locked.get('source_commit') or '').strip()
              if pinned:
                  if not re.fullmatch(r'[0-9a-f]{40}', pinned):
                      raise SystemExit(f'Invalid pinned source_commit for {locked["repository"]}: {pinned}')
                  locked['source_lock_origin'] = 'matrix'
                  return locked

              repository = locked['repository']
              result = subprocess.run(
                  ['git', 'ls-remote', f'https://github.com/{repository}.git', 'HEAD'],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=False,
                  timeout=45,
              )
              if result.returncode != 0 or not result.stdout.strip():
                  raise SystemExit(
                      f'Unable to resolve source HEAD for {repository}: '
                      f'{result.stderr.strip() or "git ls-remote returned no commit"}'
                  )
              sha = result.stdout.split()[0].strip().lower()
              if not re.fullmatch(r'[0-9a-f]{40}', sha):
                  raise SystemExit(f'Invalid resolved source commit for {repository}: {sha}')
              locked['source_commit'] = sha
              locked['source_lock_origin'] = 'head'
              return locked

          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              locked_addons = list(pool.map(lock_source, addons))

          matrix = {'include': locked_addons}
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('matrix=' + json.dumps(matrix, separators=(',', ':')) + '\n')
              out.write(f'count={len(locked_addons)}\n')

          pinned_count = sum(1 for row in addons if row.get('source_commit'))
          print(
              f'Prepared {len(locked_addons)} maintained addons with exact source locks '
              f'({pinned_count} matrix-pinned, {len(locked_addons) - pinned_count} HEAD-resolved)'
          )
          PY
      - name: Resolve latest Paper 26.3 API
        id: paper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, urllib.request, xml.etree.ElementTree as ET
          from scripts.paper_candidate_versions import latest_candidate

          url='https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml'
          req=urllib.request.Request(url, headers={'User-Agent':'SF-Addon-Bundle/1.0'})
          with urllib.request.urlopen(req, timeout=30) as response:
              root=ET.fromstring(response.read())
          versions=[n.text.strip() for n in root.findall('./versioning/versions/version') if n.text]
          selected=latest_candidate(versions, '26.3')
          if not selected:
              raise SystemExit('Paper 26.3 API is not published yet')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'paper_api={selected}\n')
          print(f'Paper candidate API: {selected}')
          PY

  core:
    name: Build Slimefun Legacy 26.3 candidate core
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build exact candidate core
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean shadowJar -PpaperApiVersion='${{ needs.prepare.outputs.paper_api }}' --no-daemon
          JAR="$(find build/libs -maxdepth 1 -type f -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          test -s "$JAR"
          mkdir -p candidate-core
          cp "$JAR" candidate-core/Slimefun-Legacy-candidate.jar
      - uses: actions/upload-artifact@v7
        with:
          name: sfl-26.3-candidate-core
          path: candidate-core/Slimefun-Legacy-candidate.jar
          if-no-files-found: error

  compile-addons:
    name: Verify ${{ matrix.repository }}
    needs: [prepare, core]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out compatibility tooling
        uses: actions/checkout@v6
        with:
          path: tools
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.slug == 'dracfunreborn'
        with:
          gradle-version: '9.4.1'
      - uses: actions/download-artifact@v8
        with:
          name: sfl-26.3-candidate-core
          path: candidate-core
      - name: Reject stale HEAD-resolved source lock on rerun
        if: github.run_attempt > 1 && matrix.source_lock_origin == 'head'
        env:
          ADDON_REPOSITORY: ${{ matrix.repository }}
          SOURCE_COMMIT: ${{ matrix.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_HEAD="$(git ls-remote "https://github.com/${ADDON_REPOSITORY}.git" HEAD | awk 'NR == 1 { print $1 }')"
          if [[ ! "$CURRENT_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Unable to verify addon source::Could not resolve current HEAD for ${ADDON_REPOSITORY}."
            exit 1
          fi
          if [[ "$CURRENT_HEAD" != "$SOURCE_COMMIT" ]]; then
            echo "::error title=Stale addon source lock::${ADDON_REPOSITORY} moved from ${SOURCE_COMMIT} to ${CURRENT_HEAD} after this workflow run was created."
            echo "Do not reuse this workflow attempt for release validation."
            echo "Start a fresh Build SF Addons 1.21.11-26.3 Bundle run so the prepare job resolves a new exact-source snapshot."
            exit 1
          fi

      - name: Clone maintained addon
        env:
          ADDON_REPOSITORY: ${{ matrix.repository }}
          SOURCE_COMMIT: ${{ matrix.source_commit }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://github.com/${ADDON_REPOSITORY}.git" addon
          if [[ -n "$SOURCE_COMMIT" ]]; then
            [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            git -C addon fetch --depth 1 origin "$SOURCE_COMMIT"
            git -C addon checkout --detach "$SOURCE_COMMIT"
          fi
          git -C addon rev-parse HEAD
      - name: Compile against Paper 26.3 candidate
        if: matrix.slug != 'dracfunreborn'
        env:
          PAPER_API_VERSION: ${{ needs.prepare.outputs.paper_api }}
          ORG_GRADLE_PROJECT_paperDevBundleVersion: ${{ needs.prepare.outputs.paper_api }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/scripts/compile_addon_paper_26_3.py \
            addon \
            "$PWD/candidate-core/Slimefun-Legacy-candidate.jar" \
            "$PAPER_API_VERSION" \
            --report-dir "$PWD/report"
      - name: Verify and build pinned DracFun Reborn
        if: matrix.slug == 'dracfunreborn'
        env:
          PAPER_API_VERSION: ${{ needs.prepare.outputs.paper_api }}
          BASE_PAPER_API_VERSION: 1.21.11-R0.1-SNAPSHOT
        run: |
          set -euo pipefail
          mkdir -p addon/libs

          # Paper 26.3 API artifacts require Java 25. Validate the pinned source
          # against the exact candidate Slimefun core with a Java-25 compiler target.
          cp candidate-core/Slimefun-Legacy-candidate.jar addon/libs/Slimefun-Legacy.jar
          gradle -p addon clean compileJava \
            -Pplatform=paper \
            -PplatformVersion="$PAPER_API_VERSION" \
            -PreleaseJvm=25 \
            --stacktrace --no-daemon

          # The distributable remains universal Java-21 bytecode. Rebuild it against
          # the 1.21.11 baseline and the published 4.1.51 Slimefun Legacy API target,
          # matching SF_DracFun2's own green release workflow.
          curl -fL --retry 3 \
            -o addon/libs/Slimefun-Legacy.jar \
            https://github.com/wickidcow/Slimefun-Legacy/releases/download/v4.1.51/Slimefun-Legacy4.1.51.jar
          test -s addon/libs/Slimefun-Legacy.jar
          gradle -p addon clean shadowJar \
            -Pplatform=paper \
            -PplatformVersion="$BASE_PAPER_API_VERSION" \
            -PreleaseJvm=21 \
            --stacktrace --no-daemon

          JAR="$(find addon/build/libs -maxdepth 1 -type f -name 'SFL_DracFun-Reborn*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort | tail -n1)"
          test -n "$JAR"
          test -s "$JAR"
          javap -verbose -classpath "$JAR" io.github.wickidcow.sfdracfun2.SFDracFun2 \
            | grep -Fq 'major version: 65'
      - name: Collect and canonicalize distributable plugin JAR
        env:
          ADDON_REPOSITORY: ${{ matrix.repository }}
          ADDON_SLUG: ${{ matrix.slug }}
          ARTIFACT_BASE: ${{ matrix.artifact_base }}
          PAPER_API_VERSION: ${{ needs.prepare.outputs.paper_api }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged/jars staged/metadata
          mapfile -t CANDIDATES < <(find addon/build/libs addon/target -maxdepth 2 -type f -name '*.jar' 2>/dev/null \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name 'original-*.jar' | sort)
          SELECTED=''
          for jar in "${CANDIDATES[@]}"; do
            if jar tf "$jar" | grep -Eq '(^|/)(plugin.yml|paper-plugin.yml|paper-plugin.yaml)$'; then
              SELECTED="$jar"
              break
            fi
          done
          if [[ -z "$SELECTED" ]]; then
            echo "No distributable Bukkit/Paper plugin JAR found for ${ADDON_REPOSITORY}" >&2
            printf '%s\n' "${CANDIDATES[@]}" >&2
            exit 1
          fi
          export SELECTED
          export ADDON_REPOSITORY ADDON_SLUG ARTIFACT_BASE PAPER_API_VERSION
          export ADDON_COMMIT="$(git -C addon rev-parse HEAD)"
          python3 - <<'PY'
          import hashlib, json, os, re, shutil, zipfile
          from pathlib import Path
          source = Path(os.environ['SELECTED'])
          repo = os.environ['ADDON_REPOSITORY']
          slug = os.environ['ADDON_SLUG']
          base = os.environ.get('ARTIFACT_BASE', '').strip() or repo.split('/')[-1].removeprefix('SF_')
          if not re.fullmatch(r'[A-Za-z0-9]+', base):
              raise SystemExit(f'Invalid canonical addon name {base!r} for {repo}')
          with zipfile.ZipFile(source) as zf:
              descriptor = None
              for candidate in ('plugin.yml', 'paper-plugin.yml', 'paper-plugin.yaml'):
                  if candidate in zf.namelist():
                      descriptor = zf.read(candidate).decode('utf-8', errors='replace')
                      break
              if descriptor is None:
                  raise SystemExit(f'No plugin descriptor inside {source}')
          match = re.search(r'(?mi)^\s*version\s*:\s*["\']?([^"\'\r\n#]+)', descriptor)
          if not match:
              raise SystemExit(f'No version in plugin descriptor for {repo}')
          version = match.group(1).strip()
          if not re.fullmatch(r'\d+(?:\.\d+)+', version):
              raise SystemExit(f'Public addon version must be numeric only for {repo}; got {version!r}')
          canonical = f'SF_{base}{version}.jar'
          if repo == 'wickidcow/SF_DracFun2':
              canonical = f'SFL_DracFun-Reborn{version}.jar'
          if repo == 'wickidcow/WorldEditSlimefun':
              canonical = f'SF_SFWorldEdit{version}_(1.21.11-26.2).jar'
          if re.search(r'(legacy|english|snapshot)', canonical, re.I):
              raise SystemExit(f'Forbidden public qualifier in {canonical}')
          destination = Path('staged/jars') / canonical
          shutil.copy2(source, destination)
          sha256 = hashlib.sha256(destination.read_bytes()).hexdigest()
          record = {
              'repository': repo,
              'slug': slug,
              'commit': os.environ['ADDON_COMMIT'],
              'jar': canonical,
              'source_jar': source.name,
              'version': version,
              'artifact_base': base,
              'sha256': sha256,
              'paper_26_3_api': os.environ['PAPER_API_VERSION'],
              'production_baseline': '26.2',
              'minimum_supported': '1.21.11',
              'primary_platforms': ['Paper', 'Purpur'],
              'secondary_platforms': ['Folia', 'Leaf'],
          }
          Path(f'staged/metadata/{slug}.json').write_text(json.dumps(record, indent=2) + '\n', encoding='utf-8')
          print(f'Collected {source.name} as canonical {canonical}')
          PY
          CANONICAL="$(python3 -c "import json; print(json.load(open('staged/metadata/${ADDON_SLUG}.json'))['jar'])")"
          test -s "staged/jars/$CANONICAL"
          jar tf "staged/jars/$CANONICAL" >/dev/null
          sha256sum "staged/jars/$CANONICAL"
      - uses: actions/upload-artifact@v7
        with:
          name: sf-addon-${{ matrix.slug }}
          path: staged/
          if-no-files-found: error

  package:
    name: Package canonical addon bundle
    needs: [prepare, compile-addons]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: sf-addon-*
          path: collected
          merge-multiple: true
      - name: Verify complete maintained set and canonical names
        env:
          EXPECTED: ${{ needs.prepare.outputs.count }}
          PAPER_API_VERSION: ${{ needs.prepare.outputs.paper_api }}
          LOCKED_MATRIX: ${{ needs.prepare.outputs.matrix }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle
          mapfile -t JARS < <(find collected/jars -maxdepth 1 -type f -name '*.jar' | sort)
          mapfile -t META < <(find collected/metadata -maxdepth 1 -type f -name '*.json' | sort)
          if [[ "${#JARS[@]}" -ne "$EXPECTED" || "${#META[@]}" -ne "$EXPECTED" ]]; then
            echo "Expected ${EXPECTED} verified addons; found ${#JARS[@]} jars and ${#META[@]} metadata files" >&2
            exit 1
          fi
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          records = [json.loads(p.read_text(encoding='utf-8')) for p in sorted(Path('collected/metadata').glob('*.json'))]
          actual = sorted(p.name for p in Path('collected/jars').glob('*.jar'))
          expected = sorted(r['jar'] for r in records)
          source = json.loads(Path('compatibility/sfl-addon-release-matrix.json').read_text(encoding='utf-8'))
          locked = json.loads(os.environ['LOCKED_MATRIX'])['include']
          approved = sorted((r['repository'], r['slug']) for r in source['addons'])
          received = sorted((r['repository'], r['slug']) for r in records)
          if received != approved:
              raise SystemExit('Collected addon identities do not match the approved release matrix')
          if actual != expected:
              raise SystemExit(f'Canonical JAR set mismatch:\nactual={actual}\nexpected={expected}')
          if len(expected) != len(set(expected)):
              raise SystemExit('Duplicate canonical JAR names detected')
          for record in records:
              name = record['jar']
              approved_record = next(r for r in locked if r['repository'] == record['repository'])
              pinned = approved_record['source_commit']
              if record['commit'] != pinned:
                  raise SystemExit(f'Locked source commit mismatch: {name}: built={record["commit"]}, expected={pinned}')
              if Path(name).name != name:
                  raise SystemExit(f'Unsafe JAR name: {name}')
              digest = hashlib.sha256((Path('collected/jars') / name).read_bytes()).hexdigest()
              if digest != record['sha256']:
                  raise SystemExit(f'Manifest SHA-256 mismatch: {name}')
          for name in expected:
              reborn = re.fullmatch(r'SFL_DracFun-Reborn\d+(?:\.\d+)+\.jar', name)
              if (not name.startswith('SF_') and not reborn) or not name.endswith('.jar'):
                  raise SystemExit(f'Invalid addon JAR name: {name}')
              if re.search(r'(legacy|english|snapshot)', name, re.I):
                  raise SystemExit(f'Forbidden public qualifier in addon JAR name: {name}')
          required_slugs = {
              'betterchests',
              'buildingstaff',
              'crystamaehistoria',
              'dracfunreborn',
              'fastmachines',
              'infinityexpansion2',
              'justenoughguide',
              'magicexpansion',
              'mobcapturer',
              'networksexp',
              'slimehud',
              'slimetinkerie2',
          }
          present_slugs = {r['slug'] for r in records}
          missing_slugs = sorted(required_slugs - present_slugs)
          if missing_slugs:
              raise SystemExit(f'Missing required maintained addons: {missing_slugs}')
          networks_records = [r for r in records if r['slug'] == 'networksexp']
          if len(networks_records) != 1:
              raise SystemExit(f'Expected exactly one Networks metadata record; found: {len(networks_records)}')
          networks_jar = networks_records[0]['jar']
          if networks_jar not in actual:
              raise SystemExit(f'Networks metadata JAR is missing from bundle: {networks_jar}')
          print(f'Canonical naming verified for {len(actual)} addon JARs, including {networks_jar}.')
          PY

          IE2_JAR="$(python3 -c "import json; print(json.load(open('collected/metadata/infinityexpansion2.json'))['jar'])")"
          MAGIC_EXPANSION_JAR="$(python3 -c "import json; print(json.load(open('collected/metadata/magicexpansion.json'))['jar'])")"
          unzip -p "collected/jars/$IE2_JAR" plugin.yml | grep -A10 '^loadbefore:' | grep -Fq 'RykenSlimefunCustomizer'
          if unzip -p "collected/jars/$IE2_JAR" plugin.yml | grep -Fq 'RykenSlimeCustomizer'; then
            echo "InfinityExpansion2 must load before RykenSlimefunCustomizer, not the obsolete RykenSlimeCustomizer name" >&2
            exit 1
          fi
          unzip -p "collected/jars/$MAGIC_EXPANSION_JAR" plugin.yml | grep -Fxq 'loadbefore: [RykenSlimefunCustomizer]'
          unzip -p "collected/jars/$MAGIC_EXPANSION_JAR" plugin.yml | grep -Fxq 'softdepend: [MagicLegacy, Networks, NetworksExpansion]'
          if unzip -p "collected/jars/$MAGIC_EXPANSION_JAR" plugin.yml | grep -Fq 'softdepend: [MagicLegacy, RykenSlimefunCustomizer'; then
            echo "MagicExpansion must load before RSC, not soft-depend on it" >&2
            exit 1
          fi
          cp collected/jars/*.jar bundle/
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          source = json.loads(Path('compatibility/sfl-addon-release-matrix.json').read_text(encoding='utf-8'))
          records = [json.loads(p.read_text(encoding='utf-8')) for p in sorted(Path('collected/metadata').glob('*.json'))]
          out = {
              'bundle': source['bundle_name'],
              'bundle_revision': source['bundle_revision'],
              'core_source_commit': os.environ['GITHUB_SHA'],
              'artifact_naming': source['artifact_naming'],
              'compatibility': source['compatibility'],
              'addons': records,
          }
          Path('bundle/SF_ADDON_MANIFEST.json').write_text(json.dumps(out, indent=2) + '\n', encoding='utf-8')
          PY
          cat > bundle/COMPATIBILITY.txt <<EOF
          Slimefun maintained addon bundle

          Canonical addon filename format:
          - SF_<AddonName><numeric version>.jar
          - DracFun Reborn exception: SFL_DracFun-Reborn<version>.jar
          - WorldEditSlimefun exception: SF_SFWorldEdit<version>_(1.21.11-26.2).jar
          - WorldEditSlimefun requires WorldEdit or FAWE and is explicitly labeled for 1.21.11 through 26.2
          - Magic Legacy is intentionally excluded from this bundle and can be installed separately if needed
          - RykenSlimeCustomizer remains bundled and only probes legacy external recipe types when the matching plugin is installed
          - MagicExpansion remains bundled; its optional MagicLegacy integration is used only when Magic Legacy is installed separately
          - No Legacy, Legacy-English, SNAPSHOT, compatibility suffixes, or repo-only suffixes except the approved WorldEdit support-range suffix

          Supported Minecraft/Paper generations:
          - 1.21.11: minimum/base compatibility
          - 26.1.x: supported
          - 26.2: PRIMARY production baseline
          - 26.3: alpha/pre-release compatibility target; production promotion waits for a stable Paper build, validation, and an explicit decision

          Server platforms:
          - PRIMARY: Paper, Purpur
          - SECONDARY: Folia, Leaf

          Every addon source in this archive was verified against the Paper ${PAPER_API_VERSION}
          / Slimefun Legacy candidate stack. Distributable JARs keep their intended baseline
          bytecode; DracFun Reborn is separately validated on Java 25 / Paper 26.3, then rebuilt
          as Java-21 bytecode against the 1.21.11 baseline for universal deployment.
          EOF
          (cd bundle && sha256sum *.jar | sort > SHA256SUMS.txt)
          (cd bundle && zip -9 -q "../${BUNDLE_NAME}" ./*)
          unzip -tqq "$BUNDLE_NAME"
          test -s "$BUNDLE_NAME"
          echo "Created $BUNDLE_NAME with ${#JARS[@]} verified addons"
      - uses: actions/upload-artifact@v7
        with:
          name: SF_Addons_1.21.11-26.3
          path: SF_Addons_1.21.11-26.3.zip
          if-no-files-found: error
      # Release publication remains owned by reproducible-release.yml so published
      # core releases keep an exact-source addon bundle and are not mutated by later builds.

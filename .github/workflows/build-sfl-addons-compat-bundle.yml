name: Build SF Addons 1.21.11-26.3 Bundle

on:
  push:
    branches: [master]
    paths:
      - 'gradle.properties'
      - 'src/**'
      - 'build.gradle.kts'
      - 'gradle/**'
      - 'scripts/**'
      - '.github/workflows/paper-26.3-full-stack.yml'
      - 'docs/releases/**'
      - '.github/workflows/build-sfl-addons-compat-bundle.yml'
      - 'compatibility/sfl-addon-release-matrix.json'
      - 'scripts/compile_addon_paper_26_3.py'
      - 'scripts/paper_candidate_versions.py'
      - 'scripts/test_paper_candidate_versions.py'
      - 'scripts/verify_addon_bytecode.py'
      - 'scripts/test_verify_addon_bytecode.py'
  pull_request:
    paths:
      - 'gradle.properties'
      - 'src/**'
      - 'build.gradle.kts'
      - 'gradle/**'
      - 'scripts/**'
      - '.github/workflows/paper-26.3-full-stack.yml'
      - 'docs/releases/**'
      - '.github/workflows/build-sfl-addons-compat-bundle.yml'
      - 'compatibility/sfl-addon-release-matrix.json'
      - 'scripts/compile_addon_paper_26_3.py'
      - 'scripts/paper_candidate_versions.py'
      - 'scripts/test_paper_candidate_versions.py'
      - 'scripts/verify_addon_bytecode.py'
      - 'scripts/test_verify_addon_bytecode.py'
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: sf-addons-1.21.11-26.3-bundle-v2-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_NAME: SF_Addons_1.21.11-26.3.zip

jobs:
  prepare:
    name: Prepare maintained addon matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
      paper_api: ${{ steps.paper.outputs.paper_api }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify published and unpublished pair staging rejection controls
        run: |
          python3 -m unittest scripts/test_stage_published_pair.py scripts/test_stage_unpublished_pair_candidate.py -v
      - name: Validate retired addon exclusion
        run: python3 scripts/test_retired_addon_exclusion.py
      - name: Validate manifest and create matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          p = Path('compatibility/sfl-addon-release-matrix.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          addons = data['addons']
          repos = [row['repository'] for row in addons]
          if len(repos) != len(set(repos)):
              raise SystemExit('duplicate repositories in addon release matrix')
          excluded = set(data.get('excluded_from_bundle', {})) | set(data.get('excluded_archived', []))
          if excluded.intersection(repos):
              raise SystemExit(f'Excluded addons in release matrix: {sorted(excluded.intersection(repos))}')
          allowed_non_sf = {'wickidcow/WorldEditSlimefun'}
          if not all(repo.startswith('wickidcow/SF_') or repo in allowed_non_sf for repo in repos):
              raise SystemExit('release matrix must contain only maintained wickidcow/SF_ repositories or approved naming exceptions')

          def lock_source(row):
              locked = dict(row)
              pinned = (locked.get('source_commit') or '').strip()
              if pinned:
                  if not re.fullmatch(r'[0-9a-f]{40}', pinned):
                      raise SystemExit(f'Invalid pinned source_commit for {locked["repository"]}: {pinned}')
                  return locked

              repository = locked['repository']
              result = subprocess.run(
                  ['git', 'ls-remote', f'https://github.com/{repository}.git', 'HEAD'],
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  check=False,
                  timeout=45,
              )
              if result.returncode != 0 or not result.stdout.strip():
                  raise SystemExit(
                      f'Unable to resolve source HEAD for {repository}: '
                      f'{result.stderr.strip() or "git ls-remote returned no commit"}'
                  )
              sha = result.stdout.split()[0].strip().lower()
              if not re.fullmatch(r'[0-9a-f]{40}', sha):
                  raise SystemExit(f'Invalid resolved source commit for {repository}: {sha}')
              locked['source_commit'] = sha
              return locked

          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              locked_addons = list(pool.map(lock_source, addons))

          matrix = {'include': locked_addons}
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('matrix=' + json.dumps(matrix, separators=(',', ':')) + '\n')
              out.write(f'count={len(locked_addons)}\n')

          pinned_count = sum(1 for row in addons if row.get('source_commit'))
          print(
              f'Prepared {len(locked_addons)} maintained addons with exact source locks '
              f'({pinned_count} matrix-pinned, {len(locked_addons) - pinned_count} HEAD-resolved)'
          )
          PY
      - name: Resolve latest Paper 26.3 API
        id: paper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, urllib.request, xml.etree.ElementTree as ET
          from scripts.paper_candidate_versions import latest_candidate

          url='https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml'
          req=urllib.request.Request(url, headers={'User-Agent':'SF-Addon-Bundle/1.0'})
          with urllib.request.urlopen(req, timeout=30) as response:
              root=ET.fromstring(response.read())
          versions=[n.text.strip() for n in root.findall('./versioning/versions/version') if n.text]
          selected=latest_candidate(versions, '26.3')
          if not selected:
              raise SystemExit('Paper 26.3 API is not published yet')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f'paper_api={selected}\n')
          print(f'Paper candidate API: {selected}')
          PY

  core:
    name: Build Slimefun Legacy 26.3 candidate core
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Pin bundle core source identity
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          echo "SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$source_commit")" >> "$GITHUB_ENV"
      - name: Build exact candidate core
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean shadowJar -PpaperApiVersion='${{ needs.prepare.outputs.paper_api }}' --no-daemon --no-build-cache --no-configuration-cache
          JAR="$(find build/libs -maxdepth 1 -type f -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          test -s "$JAR"
          python3 scripts/check_bytecode_target.py "$JAR" --expected-java 21
          python3 scripts/verify_release_artifact.py "$JAR" --root .
          mkdir -p candidate-core
          cp "$JAR" candidate-core/Slimefun-Legacy-candidate.jar
      - uses: actions/upload-artifact@v7
        with:
          name: sfl-26.3-candidate-core
          path: candidate-core/Slimefun-Legacy-candidate.jar
          if-no-files-found: error

  compile-addons:
    name: Verify ${{ matrix.repository }}
    needs: [prepare, core]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out compatibility tooling
        uses: actions/checkout@v6
        with:
          path: tools
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.slug == 'dracfunreborn'
        with:
          gradle-version: '9.4.1'
      - uses: actions/download-artifact@v8
        with:
          name: sfl-26.3-candidate-core
          path: candidate-core
      - name: Clone maintained addon
        env:
          ADDON_REPOSITORY: ${{ matrix.repository }}
          SOURCE_COMMIT: ${{ matrix.source_commit }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://github.com/${ADDON_REPOSITORY}.git" addon
          if [[ -n "$SOURCE_COMMIT" ]]; then
            [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            git -C addon fetch --depth 1 origin "$SOURCE_COMMIT"
            git -C addon checkout --detach "$SOURCE_COMMIT"
          fi
          git -C addon rev-parse HEAD
      - name: Check out verified English MobCapturer source
        if: matrix.slug == 'mobcapturer'
        uses: actions/checkout@v6
        with:
          repository: Slimefun-Addon-Community/MobCapturer
          # Same source used by the successful MobCapturer 1.0.7 validation run.
          ref: b418c2dedd5c582a38821f961616fca7fc6de665
          path: mobcapturer-english
          persist-credentials: false
      - name: Restore MobCapturer release inputs
        if: matrix.slug == 'mobcapturer'
        shell: bash
        run: |
          set -euo pipefail
          cp mobcapturer-english/src/main/java/io/github/thebusybiscuit/mobcapturer/setup/RecipeTypes.java \
             addon/src/main/java/io/github/thebusybiscuit/mobcapturer/setup/RecipeTypes.java
          find mobcapturer-english/src/main/java/io/github/thebusybiscuit/mobcapturer/adapters/mobs \
            -maxdepth 1 -type f -name '*.java' \
            ! -name 'SlimeAdapter.java' ! -name 'AnimalsAdapter.java' ! -name 'FrogAdapter.java' \
            -exec cp {} addon/src/main/java/io/github/thebusybiscuit/mobcapturer/adapters/mobs/ \;
          # Activate the addon's exact-core test dependency as in its own release build.
          mkdir -p addon/libs
          cp candidate-core/Slimefun-Legacy-candidate.jar addon/libs/Slimefun-Legacy.jar
          python3 - <<'PY'
          import re
          from pathlib import Path
          bad = []
          for root in (Path('addon/src/main/java'), Path('addon/src/main/resources')):
              for path in root.rglob('*'):
                  if not path.is_file():
                      continue
                  try:
                      source = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  if re.search(r'[\u3400-\u4dbf\u4e00-\u9fff]', source):
                      bad.append(str(path))
          if bad:
              raise SystemExit('CJK text remains in MobCapturer release source: ' + ', '.join(bad))
          PY
      - name: Compile against Paper 26.3 candidate
        if: matrix.slug != 'dracfunreborn'
        env:
          PAPER_API_VERSION: ${{ needs.prepare.outputs.paper_api }}
          ORG_GRADLE_PROJECT_paperDevBundleVersion: ${{ needs.prepare.outputs.paper_api }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/scripts/compile_addon_paper_26_3.py \
            addon \
            "$PWD/candidate-core/Slimefun-Legacy-candidate.jar" \
            "$PAPER_API_VERSION" \
            --report-dir "$PWD/report"
      - name: Test and rebuild CrystamaeHistoria and MobCapturer against the supported API floor
        if: matrix.slug == 'crystamaehistoria' || matrix.slug == 'mobcapturer'
        env:
          ADDON_SLUG: ${{ matrix.slug }}
        shell: bash
        run: |
          set -euo pipefail
          export SLIMEFUN_COMPATIBILITY_JAR="$PWD/candidate-core/Slimefun-Legacy-candidate.jar"
          export SLIMEFUN_CORE_JAR="$SLIMEFUN_COMPATIBILITY_JAR"
          export SLIMEFUN_LEGACY_JAR="$SLIMEFUN_COMPATIBILITY_JAR"
          # Retain the 26.3 probe, but distribute a tested 1.21.11 / Java 21 rebuild.
          python3 tools/scripts/compile_addon_paper_26_3.py \
            addon "$SLIMEFUN_COMPATIBILITY_JAR" \
            1.21.11-R0.1-SNAPSHOT --report-dir "$PWD/report-native-floor"
          if [[ "$ADDON_SLUG" == 'crystamaehistoria' ]]; then
            (cd addon && mvn --batch-mode --no-transfer-progress clean verify) \
              2>&1 | tee report-native-floor/tests.log
            cp -r addon/target/surefire-reports report-native-floor/test-results
          else
            (cd addon && PAPER_API_VERSION=1.21.11-R0.1-SNAPSHOT ./gradlew clean test shadowJar \
              -Pplatform=paper -PplatformVersion=1.21.11-R0.1-SNAPSHOT -PreleaseJvm=21 \
              --no-daemon --no-build-cache --no-configuration-cache \
              -I .slimefun-paper-26.3.init.gradle) \
              2>&1 | tee report-native-floor/tests.log
            cp -r addon/build/test-results/test report-native-floor/test-results
          fi
      - name: Rebuild native SlimeEasy against the supported floor
        if: matrix.slug == 'slimeeasy'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p addon/libs report-native-floor
          find addon/libs -maxdepth 1 -type f -iname '*slimefun*.jar' -delete
          cp candidate-core/Slimefun-Legacy-candidate.jar addon/libs/Slimefun-Legacy-Core.jar
          chmod +x addon/gradlew
          # The newer-native-API build is a probe only. Never distribute its output.
          (cd addon && ./gradlew clean build cargoRegressionJar \
            -PpaperDevBundleVersion=1.21.11-R0.1-SNAPSHOT \
            --no-daemon --no-build-cache --no-configuration-cache) \
            2>&1 | tee report-native-floor/compile.log
      - name: Rebuild JEG against the supported API floor
        if: matrix.slug == 'justenoughguide'
        shell: bash
        run: |
          set -euo pipefail
          # Keep the same exact-core inputs when invoking the generated Gradle init script directly.
          export SLIMEFUN_COMPATIBILITY_JAR="$PWD/candidate-core/Slimefun-Legacy-candidate.jar"
          export SLIMEFUN_CORE_JAR="$SLIMEFUN_COMPATIBILITY_JAR"
          export SLIMEFUN_LEGACY_JAR="$SLIMEFUN_COMPATIBILITY_JAR"
          # The 26.3 compilation above is a compatibility probe, not the distributable.
          python3 tools/scripts/compile_addon_paper_26_3.py \
            addon "$SLIMEFUN_COMPATIBILITY_JAR" \
            1.21.11-R0.1-SNAPSHOT --report-dir "$PWD/report-native-floor"
          (cd addon && PAPER_API_VERSION=1.21.11-R0.1-SNAPSHOT ./gradlew build \
            --no-daemon --no-build-cache --no-configuration-cache \
            -I .slimefun-paper-26.3.init.gradle) \
            2>&1 | tee report-native-floor/tests.log
          # Resolve an independent floor API classpath, not the addon's transitive compile graph.
          cat > report-native-floor/linkage-pom.xml <<'XML'
          <project xmlns="http://maven.apache.org/POM/4.0.0"><modelVersion>4.0.0</modelVersion><groupId>audit</groupId><artifactId>jeg-floor-linkage</artifactId><version>1</version><repositories><repository><id>paper</id><url>https://repo.papermc.io/repository/maven-public/</url></repository></repositories><dependencies><dependency><groupId>io.papermc.paper</groupId><artifactId>paper-api</artifactId><version>1.21.11-R0.1-SNAPSHOT</version></dependency></dependencies></project>
          XML
          mvn --batch-mode --no-transfer-progress -f report-native-floor/linkage-pom.xml \
            dependency:build-classpath "-Dmdep.outputFile=$PWD/report-native-floor/classpath.txt" \
            > report-native-floor/classpath.log 2>&1
          mapfile -t JEG_JARS < <(find addon/build/libs -maxdepth 1 -type f -name 'SF_JustEnoughGuide*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)
          test "${#JEG_JARS[@]}" -eq 1
          mkdir -p report-native-floor/linkage-classes
          javac --release 21 -cp "$(cat report-native-floor/classpath.txt)" \
            -d report-native-floor/linkage-classes tools/tests/runtime/JegClipboardLinkageProbe.java
          java -cp "report-native-floor/linkage-classes:${JEG_JARS[0]}:candidate-core/Slimefun-Legacy-candidate.jar:$(cat report-native-floor/classpath.txt)" \
            JegClipboardLinkageProbe | tee report-native-floor/linkage.log
          grep -Fxq 'JEG_CLIPBOARD_FLOOR_PASS methods=2 scenarios=6' report-native-floor/linkage.log
      - name: Verify and build pinned DracFun Reborn
        if: matrix.slug == 'dracfunreborn'
        env:
          PAPER_API_VERSION: ${{ needs.prepare.outputs.paper_api }}
          BASE_PAPER_API_VERSION: 1.21.11-R0.1-SNAPSHOT
        run: |
          set -euo pipefail
          mkdir -p addon/libs

          # Paper 26.3 API artifacts require Java 25. Validate the pinned source
          # against the exact candidate Slimefun core with a Java-25 compiler target.
          cp candidate-core/Slimefun-Legacy-candidate.jar addon/libs/Slimefun-Legacy.jar
          gradle -p addon clean compileJava \
            -Pplatform=paper \
            -PplatformVersion="$PAPER_API_VERSION" \
            -PreleaseJvm=25 \
            --stacktrace --no-daemon

          # The distributable remains universal Java-21 bytecode. Rebuild it against
          # the 1.21.11 baseline and the published 4.1.51 Slimefun Legacy API target,
          # matching SF_DracFun2's own green release workflow.
          curl -fL --retry 3 \
            -o addon/libs/Slimefun-Legacy.jar \
            https://github.com/wickidcow/Slimefun-Legacy/releases/download/v4.1.51/Slimefun-Legacy4.1.51.jar
          test -s addon/libs/Slimefun-Legacy.jar
          gradle -p addon clean shadowJar \
            -Pplatform=paper \
            -PplatformVersion="$BASE_PAPER_API_VERSION" \
            -PreleaseJvm=21 \
            --stacktrace --no-daemon

          JAR="$(find addon/build/libs -maxdepth 1 -type f -name 'SFL_DracFun-Reborn*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort | tail -n1)"
          test -n "$JAR"
          test -s "$JAR"
          javap -verbose -classpath "$JAR" io.github.wickidcow.sfdracfun2.SFDracFun2 \
            | grep -Fq 'major version: 65'
      - name: Collect and canonicalize distributable plugin JAR
        env:
          ADDON_REPOSITORY: ${{ matrix.repository }}
          ADDON_SLUG: ${{ matrix.slug }}
          ARTIFACT_BASE: ${{ matrix.artifact_base }}
          PAPER_API_VERSION: ${{ needs.prepare.outputs.paper_api }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staged/jars staged/metadata
          mapfile -t CANDIDATES < <(find addon/build/libs addon/target -maxdepth 2 -type f -name '*.jar' 2>/dev/null \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name 'original-*.jar' | sort)
          SELECTED=''
          for jar in "${CANDIDATES[@]}"; do
            if jar tf "$jar" | grep -Eq '(^|/)(plugin.yml|paper-plugin.yml|paper-plugin.yaml)$'; then
              SELECTED="$jar"
              break
            fi
          done
          if [[ "$ADDON_SLUG" == 'mobcapturer' ]]; then
            # Its plain Gradle JAR sorts first; distribute the shaded release JAR.
            mapfile -t MOB_CAPTURER_JARS < <(find addon/build/libs -maxdepth 1 -type f \
              -name 'SF_MobCapturer*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)
            test "${#MOB_CAPTURER_JARS[@]}" -eq 1
            SELECTED="${MOB_CAPTURER_JARS[0]}"
            jar tf "$SELECTED" | grep -Eq '(^|/)(plugin.yml|paper-plugin.yml|paper-plugin.yaml)$'
          fi
          if [[ -z "$SELECTED" ]]; then
            echo "No distributable Bukkit/Paper plugin JAR found for ${ADDON_REPOSITORY}" >&2
            printf '%s\n' "${CANDIDATES[@]}" >&2
            exit 1
          fi
          if [[ "$ADDON_SLUG" == 'networksexp' || "$ADDON_SLUG" == 'infinityexpansion2' ]]; then
            PAIR_KEY=networks
            if [[ "$ADDON_SLUG" == 'infinityexpansion2' ]]; then PAIR_KEY=ie2; fi
            SOURCE_SHA="$(git -C addon rev-parse HEAD)"
            # The historical published pair stays immutable. Only a PR can
            # separately preview a manifest-pinned, not-yet-published addon JAR.
            # A push/master/release build with different source still fails closed.
            PAIR_MODE="$(python3 tools/scripts/stage_unpublished_pair_candidate.py \
              --manifest tools/compatibility/sfl-addon-release-matrix.json \
              --addon "$ADDON_SLUG" --repository "$ADDON_REPOSITORY" \
              --source "$SOURCE_SHA" --event "$GITHUB_EVENT_NAME" \
              --jar "$SELECTED" \
              --report "staged/evidence/$ADDON_SLUG-unpublished-preview.json")"
            if [[ "$PAIR_MODE" == 'published' ]]; then
              python3 tools/scripts/stage_published_pair.py --addon "$PAIR_KEY" \
                --source "$SOURCE_SHA" --repository "$ADDON_REPOSITORY" \
                --output "published/$PAIR_KEY.jar" --report "staged/evidence/$ADDON_SLUG-published.json"
              SELECTED="published/$PAIR_KEY.jar"
            elif [[ "$PAIR_MODE" == 'unpublished-pr-preview' ]]; then
              echo "CI-only unpublished pair preview for $ADDON_REPOSITORY@$SOURCE_SHA"
            else
              echo "Unexpected pair stage mode: $PAIR_MODE" >&2
              exit 1
            fi
          fi
          export SELECTED
          export ADDON_REPOSITORY ADDON_SLUG ARTIFACT_BASE PAPER_API_VERSION
          export ADDON_COMMIT="$(git -C addon rev-parse HEAD)"
          if [[ "$ADDON_SLUG" == 'mobcapturer' ]]; then
            export MOB_CAPTURER_ENGLISH_SOURCE="$(git -C mobcapturer-english rev-parse HEAD)"
          fi
          python3 - <<'PY'
          import hashlib, json, os, re, shutil, zipfile
          from pathlib import Path
          source = Path(os.environ['SELECTED'])
          repo = os.environ['ADDON_REPOSITORY']
          slug = os.environ['ADDON_SLUG']
          base = os.environ.get('ARTIFACT_BASE', '').strip() or repo.split('/')[-1].removeprefix('SF_')
          if not re.fullmatch(r'[A-Za-z0-9]+', base):
              raise SystemExit(f'Invalid canonical addon name {base!r} for {repo}')
          with zipfile.ZipFile(source) as zf:
              descriptor = None
              for candidate in ('plugin.yml', 'paper-plugin.yml', 'paper-plugin.yaml'):
                  if candidate in zf.namelist():
                      descriptor = zf.read(candidate).decode('utf-8', errors='replace')
                      break
              if descriptor is None:
                  raise SystemExit(f'No plugin descriptor inside {source}')
          match = re.search(r'(?mi)^\s*version\s*:\s*["\']?([^"\'\r\n#]+)', descriptor)
          if not match:
              raise SystemExit(f'No version in plugin descriptor for {repo}')
          version = match.group(1).strip()
          if not re.fullmatch(r'\d+(?:\.\d+)+', version):
              raise SystemExit(f'Public addon version must be numeric only for {repo}; got {version!r}')
          canonical = f'SF_{base}{version}.jar'
          if repo == 'wickidcow/SF_DracFun2':
              canonical = f'SFL_DracFun-Reborn{version}.jar'
          if repo == 'wickidcow/WorldEditSlimefun':
              canonical = f'SF_SFWorldEdit{version}_(1.21.11-26.3).jar'
          if re.search(r'(legacy|english|snapshot)', canonical, re.I):
              raise SystemExit(f'Forbidden public qualifier in {canonical}')
          destination = Path('staged/jars') / canonical
          shutil.copy2(source, destination)
          sha256 = hashlib.sha256(destination.read_bytes()).hexdigest()
          record = {
              'repository': repo,
              'slug': slug,
              'commit': os.environ['ADDON_COMMIT'],
              'jar': canonical,
              'source_jar': source.name,
              'version': version,
              'artifact_base': base,
              'sha256': sha256,
              'paper_26_3_api': os.environ['PAPER_API_VERSION'],
              'distributable_api': '1.21.11-R0.1-SNAPSHOT' if slug in ('slimeeasy', 'dracfunreborn', 'justenoughguide') or slug in ('crystamaehistoria', 'mobcapturer') or slug in ('networksexp', 'infinityexpansion2') else os.environ['PAPER_API_VERSION'],
              'primary_api_target': '26.3',
              'backwards_compatible_through': '1.21.11',
              'minimum_supported': '1.21.11',
              'primary_platforms': ['Paper', 'Purpur'],
              'secondary_platforms': [] if slug in ('networksexp', 'infinityexpansion2') else ['Folia', 'Leaf'],
          }
          if slug in ('networksexp', 'infinityexpansion2'):
              published = Path(f'staged/evidence/{slug}-published.json')
              preview = Path(f'staged/evidence/{slug}-unpublished-preview.json')
              if published.is_file() and not preview.exists():
                  record['published_artifact'] = json.loads(published.read_text(encoding='utf-8'))
              elif preview.is_file() and not published.exists():
                  proof = json.loads(preview.read_text(encoding='utf-8'))
                  if (os.environ.get('GITHUB_EVENT_NAME') != 'pull_request'
                      or proof.get('mode') != 'unpublished-pr-preview'
                      or proof.get('eligible_for_release') is not False
                      or proof.get('source') != record['commit']
                      or proof.get('repository') != repo
                      or proof.get('sha256') != sha256
                      or proof.get('bytes') != destination.stat().st_size
                      or proof.get('version') != version):
                      raise SystemExit('Unpublished addon preview provenance mismatch')
                  record['unpublished_pr_preview'] = proof
              else:
                  raise SystemExit('Exactly one immutable published or PR-only preview proof is required')
          if slug == 'mobcapturer':
              record['english_adapter_source'] = {
                  'repository': 'Slimefun-Addon-Community/MobCapturer',
                  'commit': os.environ['MOB_CAPTURER_ENGLISH_SOURCE'],
              }
          Path(f'staged/metadata/{slug}.json').write_text(json.dumps(record, indent=2) + '\n', encoding='utf-8')
          print(f'Collected {source.name} as canonical {canonical}')
          PY
          CANONICAL="$(python3 -c "import json; print(json.load(open('staged/metadata/${ADDON_SLUG}.json'))['jar'])")"
          test -s "staged/jars/$CANONICAL"
          jar tf "staged/jars/$CANONICAL" >/dev/null
          sha256sum "staged/jars/$CANONICAL"
          python3 tools/scripts/verify_addon_bytecode.py "staged/jars/$CANONICAL" \
            --expected-java 21 --report "staged/evidence/${ADDON_SLUG}-bytecode.json"
      - name: Preserve compile and native-floor evidence
        if: always()
        run: |
          mkdir -p staged/evidence
          if test -d report; then cp -r report "staged/evidence/${{ matrix.slug }}-candidate"; fi
          if test -d report-native-floor; then cp -r report-native-floor "staged/evidence/${{ matrix.slug }}-floor"; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sf-addon-${{ matrix.slug }}
          path: staged/
          if-no-files-found: error
          # A retry must replace any evidence-only artifact from its failed attempt.
          overwrite: true

  package:
    name: Package canonical addon bundle
    needs: [prepare, compile-addons]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: sf-addon-*
          path: collected
          merge-multiple: true
      - name: Verify complete maintained set and canonical names
        env:
          EXPECTED: ${{ needs.prepare.outputs.count }}
          PAPER_API_VERSION: ${{ needs.prepare.outputs.paper_api }}
          LOCKED_MATRIX: ${{ needs.prepare.outputs.matrix }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle
          mapfile -t JARS < <(find collected/jars -maxdepth 1 -type f -name '*.jar' | sort)
          mapfile -t META < <(find collected/metadata -maxdepth 1 -type f -name '*.json' | sort)
          if [[ "${#JARS[@]}" -ne "$EXPECTED" || "${#META[@]}" -ne "$EXPECTED" ]]; then
            echo "Expected ${EXPECTED} verified addons; found ${#JARS[@]} jars and ${#META[@]} metadata files" >&2
            exit 1
          fi
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          records = [json.loads(p.read_text(encoding='utf-8')) for p in sorted(Path('collected/metadata').glob('*.json'))]
          actual = sorted(p.name for p in Path('collected/jars').glob('*.jar'))
          expected = sorted(r['jar'] for r in records)
          source = json.loads(Path('compatibility/sfl-addon-release-matrix.json').read_text(encoding='utf-8'))
          locked = json.loads(os.environ['LOCKED_MATRIX'])['include']
          approved = sorted((r['repository'], r['slug']) for r in source['addons'])
          received = sorted((r['repository'], r['slug']) for r in records)
          if received != approved:
              raise SystemExit('Collected addon identities do not match the approved release matrix')
          if actual != expected:
              raise SystemExit(f'Canonical JAR set mismatch:\nactual={actual}\nexpected={expected}')
          if len(expected) != len(set(expected)):
              raise SystemExit('Duplicate canonical JAR names detected')
          for record in records:
              name = record['jar']
              approved_record = next(r for r in locked if r['repository'] == record['repository'])
              pinned = approved_record['source_commit']
              if record['commit'] != pinned:
                  raise SystemExit(f'Locked source commit mismatch: {name}: built={record["commit"]}, expected={pinned}')
              if Path(name).name != name:
                  raise SystemExit(f'Unsafe JAR name: {name}')
              digest = hashlib.sha256((Path('collected/jars') / name).read_bytes()).hexdigest()
              if digest != record['sha256']:
                  raise SystemExit(f'Manifest SHA-256 mismatch: {name}')
          for name in expected:
              reborn = re.fullmatch(r'SFL_DracFun-Reborn\d+(?:\.\d+)+\.jar', name)
              if (not name.startswith('SF_') and not reborn) or not name.endswith('.jar'):
                  raise SystemExit(f'Invalid addon JAR name: {name}')
              if re.search(r'(legacy|english|snapshot)', name, re.I):
                  raise SystemExit(f'Forbidden public qualifier in addon JAR name: {name}')
          required_slugs = {
              'betterchests',
              'crystamaehistoria',
              'dracfunreborn',
              'fastmachines',
              'infinityexpansion2',
              'justenoughguide',
              'magicexpansion',
              'mobcapturer',
              'networksexp',
              'slimehud',
              'slimetinkerie2',
          }
          present_slugs = {r['slug'] for r in records}
          missing_slugs = sorted(required_slugs - present_slugs)
          if missing_slugs:
              raise SystemExit(f'Missing required maintained addons: {missing_slugs}')
          networks_records = [r for r in records if r['slug'] == 'networksexp']
          if len(networks_records) != 1:
              raise SystemExit(f'Expected exactly one Networks metadata record; found: {len(networks_records)}')
          networks_jar = networks_records[0]['jar']
          if networks_jar not in actual:
              raise SystemExit(f'Networks metadata JAR is missing from bundle: {networks_jar}')
          print(f'Canonical naming verified for {len(actual)} addon JARs, including {networks_jar}.')
          PY

          IE2_JAR="$(python3 -c "import json; print(json.load(open('collected/metadata/infinityexpansion2.json'))['jar'])")"
          MAGIC_EXPANSION_JAR="$(python3 -c "import json; print(json.load(open('collected/metadata/magicexpansion.json'))['jar'])")"
          unzip -p "collected/jars/$IE2_JAR" plugin.yml | grep -A10 '^loadbefore:' | grep -Fq 'RykenSlimefunCustomizer'
          if unzip -p "collected/jars/$IE2_JAR" plugin.yml | grep -Fq 'RykenSlimeCustomizer'; then
            echo "InfinityExpansion2 must load before RykenSlimefunCustomizer, not the obsolete RykenSlimeCustomizer name" >&2
            exit 1
          fi
          unzip -p "collected/jars/$MAGIC_EXPANSION_JAR" plugin.yml | grep -Fxq 'loadbefore: [RykenSlimefunCustomizer]'
          unzip -p "collected/jars/$MAGIC_EXPANSION_JAR" plugin.yml | grep -Fxq 'softdepend: [MagicLegacy, Networks, NetworksExpansion]'
          if unzip -p "collected/jars/$MAGIC_EXPANSION_JAR" plugin.yml | grep -Fq 'softdepend: [MagicLegacy, RykenSlimefunCustomizer'; then
            echo "MagicExpansion must load before RSC, not soft-depend on it" >&2
            exit 1
          fi
          cp collected/jars/*.jar bundle/
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          source = json.loads(Path('compatibility/sfl-addon-release-matrix.json').read_text(encoding='utf-8'))
          records = [json.loads(p.read_text(encoding='utf-8')) for p in sorted(Path('collected/metadata').glob('*.json'))]
          out = {
              'bundle': source['bundle_name'],
              'bundle_revision': source['bundle_revision'],
              'core_source_commit': os.environ['GITHUB_SHA'],
              'artifact_naming': source['artifact_naming'],
              'compatibility': source['compatibility'],
              'addons': records,
          }
          previews = [row for row in records if 'unpublished_pr_preview' in row]
          if previews:
              if os.environ.get('GITHUB_EVENT_NAME') != 'pull_request':
                  raise SystemExit('Unpublished addon previews cannot enter a release bundle')
              for row in previews:
                  proof = row['unpublished_pr_preview']
                  candidate = Path('collected/jars') / row['jar']
                  if (proof.get('mode') != 'unpublished-pr-preview'
                      or proof.get('eligible_for_release') is not False
                      or proof.get('event') != 'pull_request'
                      or proof.get('source') != row['commit']
                      or proof.get('repository') != row['repository']
                      or proof.get('sha256') != row['sha256']
                      or proof.get('version') != row['version']
                      or proof.get('bytes') != candidate.stat().st_size):
                      raise SystemExit('Invalid final unpublished-addon preview receipt')
              out['build_mode'] = 'unpublished-pr-preview'
              out['eligible_for_release'] = False
              out['unpublished_addons'] = [row['repository'] for row in previews]
          Path('bundle/SF_ADDON_MANIFEST.json').write_text(json.dumps(out, indent=2) + '\n', encoding='utf-8')
          PY
          cat > bundle/COMPATIBILITY.txt <<EOF
          Slimefun maintained addon bundle

          Canonical addon filename format:
          - SF_<AddonName><numeric version>.jar
          - DracFun Reborn exception: SFL_DracFun-Reborn<version>.jar
          - WorldEditSlimefun exception: SF_SFWorldEdit<version>_(1.21.11-26.3).jar
          - WorldEditSlimefun requires WorldEdit or FAWE and is explicitly labeled for 1.21.11 through 26.3
          - Magic Legacy is intentionally excluded from this bundle and can be installed separately if needed
          - RykenSlimeCustomizer remains bundled and only probes legacy external recipe types when the matching plugin is installed
          - MagicExpansion remains bundled; its optional MagicLegacy integration is used only when Magic Legacy is installed separately
          - No Legacy, Legacy-English, SNAPSHOT, compatibility suffixes, or repo-only suffixes except the approved WorldEdit support-range suffix

          Supported Minecraft/Paper generations:
          - 1.21.11: minimum/base compatibility
          - 26.1.x: supported
          - 26.2: supported backwards-compatibility line
          - 26.3: PRIMARY API/support target; bundle compile validation is required

          Server platforms:
          - PRIMARY: Paper, Purpur
          - SECONDARY: Folia, Leaf only for addons with separately verified runtime support
          - Networks and InfinityExpansion2 do not support Folia runtime operation

          Every addon source in this archive was verified against the Paper ${PAPER_API_VERSION}
          / Slimefun Legacy candidate stack. Distributable JARs keep their intended baseline
          bytecode; DracFun Reborn is separately validated on Java 25 / Paper 26.3, then rebuilt
          as Java-21 bytecode against the 1.21.11 baseline for universal deployment.
          Networks and InfinityExpansion2 carry exact-source proof in SF_ADDON_MANIFEST.json.
          Published builds use checksum-pinned universal JARs; PR-only CI previews may
          contain source-locked unpublished candidates with release-ineligible receipts.
          A green CI preview is NOT proof that an official addon release was published.
          EOF
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('bundle/SF_ADDON_MANIFEST.json').read_text(encoding='utf-8'))
          if manifest.get('build_mode') == 'unpublished-pr-preview':
              names = ', '.join(manifest['unpublished_addons'])
              notice = (
                  'WARNING: CI-ONLY UNPUBLISHED ADDON PREVIEW — NOT A RELEASE.\n'
                  'Contains unapproved source-locked addon JARs: ' + names + '\n'
                  'Do not distribute, publish or install this as an official release.\n\n'
              )
              file = Path('bundle/COMPATIBILITY.txt')
              file.write_text(notice + file.read_text(encoding='utf-8'), encoding='utf-8')
          PY
          (cd bundle && sha256sum *.jar | sort > SHA256SUMS.txt)
          (cd bundle && zip -9 -q "../${BUNDLE_NAME}" ./*)
          unzip -tqq "$BUNDLE_NAME"
          test -s "$BUNDLE_NAME"
          echo "Created $BUNDLE_NAME with ${#JARS[@]} verified addons"
      - uses: actions/upload-artifact@v7
        with:
          name: SF_Addons_1.21.11-26.3
          path: SF_Addons_1.21.11-26.3.zip
          if-no-files-found: error
      # Release publication remains owned by reproducible-release.yml so published
      # core releases keep an exact-source addon bundle and are not mutated by later builds.

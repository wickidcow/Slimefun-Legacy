name: Paper 26.3 Primary API

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/paper-26.3-advisory.yml'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'scripts/paper_candidate_versions.py'
      - 'scripts/test_paper_candidate_versions.py'
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read

concurrency:
  group: paper-26-3-primary-api
  cancel-in-progress: true

jobs:
  paper-26-3-api:
    name: Discover and compile against Paper 26.3
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out Slimefun Legacy
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Verify Paper candidate resolver
        run: python3 scripts/test_paper_candidate_versions.py

      - name: Discover latest published Paper 26.3 API
        id: paper
        shell: bash
        run: |
          set -euo pipefail
          METADATA='https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml'
          XML="$(curl --fail --silent --show-error --location --retry 3 "$METADATA")"
          VERSION="$(printf '%s' "$XML" | python3 scripts/paper_candidate_versions.py --target 26.3)"

          if [[ -z "$VERSION" ]]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            {
              echo '## Paper 26.3 primary API'
              echo
              echo 'Paper 26.3 API is not published in the official Paper Maven repository yet.'
              echo 'Paper 26.3 is the primary API target, so a missing API is a compatibility failure.'
              exit 1
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo 'available=true' >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo '## Paper 26.3 advisory'
            echo
            echo "Detected official Paper API: \`$VERSION\`"
            echo 'Paper 26.3 is the primary compile/support target. The distributable remains Java 21 bytecode for 1.21.11+ compatibility.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compile Slimefun Legacy against Paper 26.3
        if: steps.paper.outputs.available == 'true'
        shell: bash
        env:
          PAPER_26_3_API: ${{ steps.paper.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          echo "Compiling Slimefun Legacy against Paper API ${PAPER_26_3_API}"
          ./gradlew clean compileJava \
            -PpaperApiVersion="${PAPER_26_3_API}" \
            -PslimefunDeprecationReport=true \
            --warning-mode all \
            --no-daemon 2>&1 | tee paper-26.3-compile.log
          python3 scripts/summarize_deprecations.py paper-26.3-compile.log --fail-on-warnings

      - name: Publish compile result
        if: steps.paper.outputs.available == 'true' && always()
        shell: bash
        env:
          PAPER_26_3_API: ${{ steps.paper.outputs.version }}
        run: |
          {
            echo
            echo "Primary API checked: \`${PAPER_26_3_API}\`"
            echo 'A compile failure in this lane is a primary compatibility regression.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Paper 26.3 compile log
        if: steps.paper.outputs.available == 'true' && always()
        uses: actions/upload-artifact@v7
        with:
          name: paper-26.3-primary-compile
          path: |
            paper-26.3-compile.log
            build/reports/deprecations.md
          if-no-files-found: warn

name: Pinned Legacy Source Snapshot

on:
  push:
    branches: ['work/legacy-core-289-validation']

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact audited PR source
        uses: actions/checkout@v6
        with:
          ref: 24baa82eb4667965a621a0960a80af286597986f
          persist-credentials: false
      - name: Export tracked sources and blob manifest only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '24baa82eb4667965a621a0960a80af286597986f'
          mkdir -p "$RUNNER_TEMP/legacy-source"
          git archive --format=zip --output="$RUNNER_TEMP/legacy-source/source.zip" HEAD
          git ls-tree -r HEAD > "$RUNNER_TEMP/legacy-source/git-blob-manifest.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/legacy-source/source-commit.txt"
          sha256sum "$RUNNER_TEMP/legacy-source/source.zip"
      - name: Upload source audit snapshot
        uses: actions/upload-artifact@v7
        with:
          name: legacy-source-24baa82
          path: ${{ runner.temp }}/legacy-source/
          if-no-files-found: error
          retention-days: 7

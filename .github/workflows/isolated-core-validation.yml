name: Isolated Legacy Core Validation

on:
  push:
    branches: ['work/legacy-core-289-validation']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out exact PR source without persisted credentials
        uses: actions/checkout@v6
        with:
          ref: b44106d1b78297e66843660023930be796752c46
          persist-credentials: false
      - name: Prepare exact source correction
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path('src/main/java/io/github/thebusybiscuit/slimefun4/implementation/setup/SlimefunItemSetup.java')
          original = path.read_bytes()
          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode('ascii') + b'\0' + data).hexdigest()
          expected = '3bfa9dd6f2e9ba053e7af6c1c3a328740f3f8ea3'
          if blob_sha(original) != expected:
              raise SystemExit('Refusing to modify an unexpected recipe-registration source blob')
          obsolete = b'import io.github.thebusybiscuit.slimefun4.utils.compatibility.VersionedPotionEffectType;\n'
          if original.count(obsolete) != 1 or original.count(b'VersionedPotionEffectType') != 1:
              raise SystemExit('Refusing to remove an import unless it is the only alias reference')
          corrected = original.replace(obsolete, b'', 1)
          path.write_bytes(corrected)
          request = Path(os.environ['RUNNER_TEMP']) / 'legacy-corrected-blob.json'
          request.write_text(json.dumps({'content': base64.b64encode(corrected).decode('ascii'), 'encoding': 'base64'}))
          new_sha = blob_sha(corrected)
          print(f'Original source blob: {expected}')
          print(f'Corrected source blob: {new_sha}')
          print(f'Change: exactly one unused import removed ({len(original) - len(corrected)} bytes); all recipe bytes preserved')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'blob_sha={new_sha}\n')
          PY
          git diff --check
          git diff -- src/main/java/io/github/thebusybiscuit/slimefun4/implementation/setup/SlimefunItemSetup.java
      - name: Store corrected source blob without updating any branch
        if: steps.patch.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BLOB: ${{ steps.patch.outputs.blob_sha }}
        shell: bash
        run: |
          set -euo pipefail
          BLOB="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input "${RUNNER_TEMP}/legacy-corrected-blob.json" --jq .sha)"
          test "$BLOB" = "$EXPECTED_BLOB"
          echo "Validated source blob available for consolidated PR commit: $BLOB"
          echo "Corrected source blob: \`$BLOB\`. No branch, tag or release was changed by this job." >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Java 25 for the real project build
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Run all registered core invariants
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_legacy.py .
      - name: Run real formatting, compilation and tests
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew spotlessApply --no-daemon
          ./gradlew clean --no-daemon
          mkdir -p build/reports
          ./gradlew build -PslimefunDeprecationReport=true --no-daemon 2>&1 | tee build/reports/deprecation-compile.log
          python3 scripts/summarize_deprecations.py build/reports/deprecation-compile.log --fail-on-warnings
      - name: Report actual test evidence
        if: ${{ !cancelled() && steps.patch.outcome == 'success' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          reports = sorted(Path('build/test-results/test').glob('TEST-*.xml'))
          if not reports:
              print('No JUnit XML reports were produced; no tests are claimed as passed.')
          totals = dict.fromkeys(('tests', 'failures', 'errors', 'skipped'), 0)
          for path in reports:
              suite = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(suite.get(key, '0'))
              if 'BlockDataConfigWrapperTest' in path.name:
                  print('Storage bridge suite:', suite.attrib)
          print('Actual JUnit totals:', totals)
          PY
      - name: Upload validation evidence only, not a release JAR
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: isolated-core-validation-evidence
          path: |
            build/reports/deprecation-compile.log
            build/reports/deprecations.md
            build/test-results/test/TEST-*.xml
          if-no-files-found: warn

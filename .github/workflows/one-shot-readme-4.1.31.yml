name: One-shot README 4.1.31 rollover

on:
  push:
    branches:
      - release/4.1.31-beacon-plus

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/4.1.31-beacon-plus

      - name: Update only the current release version strings
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/Current development release: \*\*4\.1\.30/Current development release: **4.1.31/' README.md
          sed -i 's/Slimefun Legacy 4\.1\.30 is tested primarily/Slimefun Legacy 4.1.31 is tested primarily/' README.md

          if git diff --quiet -- README.md; then
            echo "README is already on 4.1.31; no commit needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README release line to 4.1.31"
          git push origin HEAD:release/4.1.31-beacon-plus

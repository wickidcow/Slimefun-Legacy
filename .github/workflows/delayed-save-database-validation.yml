name: Delayed Save Real Database Restart
on:
  push:
    branches: ['audit/delayed-save-replacement-20261001']
    paths: ['.audit/delayed-save/DelayedSaveProbe.java', '.github/workflows/delayed-save-database-validation.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build the exact reviewed candidate implementation
        run: |
          set -euo pipefail
          mkdir -p evidence inputs
          python3 .audit/delayed-save/apply.py
          python3 scripts/verify_legacy.py . > evidence/source-invariants.log 2>&1
          export SOURCE_COMMIT="$(git rev-parse HEAD)"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          chmod +x gradlew
          ./gradlew spotlessApply clean shadowJar --no-daemon --no-build-cache --no-configuration-cache > evidence/core-build.log 2>&1
          JAR="$(find build/libs -maxdepth 1 -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          python3 scripts/check_bytecode_target.py "$JAR" --expected-java 21
          python3 scripts/verify_release_artifact.py "$JAR" --root .
          cp "$JAR" inputs/candidate.jar
          cat > inputs/probe-classpath.gradle <<'GRADLE'
          allprojects {
              tasks.register('writeDelayedProbeClasspath') {
                  doLast {
                      def sources = project.extensions.getByType(org.gradle.api.tasks.SourceSetContainer)
                      file('inputs/classpath.txt').text = sources.getByName('main').compileClasspath.asPath
                  }
              }
          }
          GRADLE
          ./gradlew -I inputs/probe-classpath.gradle writeDelayedProbeClasspath --no-daemon > evidence/classpath.log 2>&1
          mkdir -p probe-classes
          javac --release 21 -cp "inputs/candidate.jar:$(cat inputs/classpath.txt)" -d probe-classes .audit/delayed-save/DelayedSaveProbe.java > evidence/probe-build.log 2>&1
          printf "name: DelayedSaveProbe\nmain: audit.DelayedSaveProbe\nversion: '1'\napi-version: '1.21.11'\ndepend: [Slimefun]\n" > probe-classes/plugin.yml
          jar --create --file inputs/probe.jar -C probe-classes .
          cp .audit/delayed-save/DelayedSaveProbe.java evidence/
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          names=['src/main/java/com/xzavier0722/mc/plugin/slimefun4/storage/controller/BlockDataController.java','src/main/java/com/xzavier0722/mc/plugin/slimefun4/storage/task/DelayedSavingLooperTask.java']
          records={}
          for name in names:
              data=Path(name).read_bytes()
              records[name]=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          Path('inputs/production-blobs.json').write_text(json.dumps(records,indent=2)+'\n')
          PY
      - name: Retrieve and verify the unchanged published original core
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --max-time 180 https://github.com/wickidcow/Slimefun-Legacy/releases/download/v4.1.63/Slimefun-Legacy4.1.63.jar -o inputs/original.jar
          printf '%s  inputs/original.jar\n' 993b257c54efe19b58cc8f4946d4d39387f7787fe263c9f27123343159344c42 | sha256sum --check
          sha256sum inputs/*.jar > inputs/jar-sha256.txt
          cp inputs/production-blobs.json inputs/jar-sha256.txt evidence/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: delayed-save-database-build-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: delayed-save-database-inputs
          path: |
            inputs/original.jar
            inputs/candidate.jar
            inputs/probe.jar
            inputs/production-blobs.json
            inputs/jar-sha256.txt
          retention-days: 14
          if-no-files-found: error
  runtime:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.21.11'
            build: 132
            java: '21'
            server_sha: 5ffef465eeeb5f2a3c23a24419d97c51afd7dbb4923ff42df9a3f58bba1ccfba
          - minecraft: '26.2'
            build: 129
            java: '25'
            server_sha: b1d8f6bfa1b6101fa8e947b53041cb3bdf5540e7b83b6547ca19ba7edefeb083
          - minecraft: '26.3'
            build: 140
            java: '25'
            server_sha: 98aabc113a80b9b5e183475e839a17cf99c39c915a1f46b8f35a5e89fd5de0f1
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/download-artifact@v8
        with:
          name: delayed-save-database-inputs
          path: inputs
      - name: Reproduce original loss and verify corrected durable values in separate processes
        env:
          MC: ${{ matrix.minecraft }}
          BUILD: ${{ matrix.build }}
          SHA: ${{ matrix.server_sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          sha256sum --check inputs/jar-sha256.txt
          URL="https://fill-data.papermc.io/v1/objects/${SHA}/paper-${MC}-${BUILD}.jar"
          curl -fLsS --retry 3 --max-time 120 -H 'User-Agent: Slimefun-Legacy-Storage-Validation (https://github.com/wickidcow/Slimefun-Legacy)' "$URL" -o server.jar
          printf '%s  server.jar\n' "$SHA" | sha256sum --check
          printf 'minecraft=%s\nbuild=%s\nurl=%s\nsha256=%s\n' "$MC" "$BUILD" "$URL" "$SHA" > evidence/server-provenance.txt
          cp inputs/production-blobs.json inputs/jar-sha256.txt evidence/
          for KIND in original candidate; do
            ROOT="$PWD/server-$KIND"
            mkdir -p "$ROOT/plugins"
            cp server.jar "$ROOT/server.jar"
            cp "inputs/$KIND.jar" "$ROOT/plugins/Slimefun.jar"
            cp inputs/probe.jar "$ROOT/plugins/DelayedSaveProbe.jar"
            printf 'eula=true\n' > "$ROOT/eula.txt"
            printf 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=0\nview-distance=2\nsimulation-distance=2\nspawn-protection=0\npause-when-empty-seconds=-1\n' > "$ROOT/server.properties"
            ORIGINAL=false; MARKER=DELAYED_REPLACEMENT_PRESERVED
            if [[ "$KIND" == original ]]; then ORIGINAL=true; MARKER=DELAYED_ORIGINAL_REPRODUCED; fi
            for PHASE in write read; do
              READ=false; if [[ "$PHASE" == read ]]; then READ=true; fi
              STATUS=0
              (cd "$ROOT" && timeout --kill-after=20s 240s java -Xms512M -Xmx2G -Ddelayed.audit.original="$ORIGINAL" -Ddelayed.audit.read="$READ" -jar server.jar --nogui > "$PHASE.log" 2>&1) || STATUS=$?
              mkdir -p "evidence/$KIND/$PHASE"
              cp "$ROOT/$PHASE.log" "evidence/$KIND/$PHASE/"
              find "$ROOT" -maxdepth 1 -name 'delayed-*.txt' -exec cp {} "evidence/$KIND/$PHASE/" \;
              if [[ "$STATUS" != 0 ]] || ! grep -Fxq "$MARKER" "$ROOT/delayed-$PHASE-result.txt"; then tail -n 120 "$ROOT/$PHASE.log"; exit 1; fi
              if grep -Eq 'DELAYED_REPLACEMENT_PROBE_FAILED|Error occurred while enabling|NoSuchMethodError|NoClassDefFoundError|SQLITE_CONSTRAINT|InvalidConfigurationException' "$ROOT/$PHASE.log"; then tail -n 120 "$ROOT/$PHASE.log"; exit 1; fi
            done
          done
          printf 'PASS: original delayed write and deletion loss reproduced; corrected updates persist through separate server processes with block identity and neighboring data unchanged\n' > evidence/runtime-result.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: delayed-save-database-${{ matrix.minecraft }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error

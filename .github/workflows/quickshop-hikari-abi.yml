name: QuickShop-Hikari Public API Contract

on:
  pull_request:
    paths:
      - 'src/main/java/io/github/thebusybiscuit/slimefun4/core/commands/subcommands/DoctorQuickShopReadOnly.java'
      - 'src/test/java/io/github/thebusybiscuit/slimefun4/core/commands/subcommands/TestDoctorQuickShopReadOnly.java'
      - 'scripts/verify_quickshop_hikari_api.py'
      - '.github/workflows/quickshop-hikari-abi.yml'
  push:
    branches: [master]
    paths:
      - 'src/main/java/io/github/thebusybiscuit/slimefun4/core/commands/subcommands/DoctorQuickShopReadOnly.java'
      - 'src/test/java/io/github/thebusybiscuit/slimefun4/core/commands/subcommands/TestDoctorQuickShopReadOnly.java'
      - 'scripts/verify_quickshop_hikari_api.py'
      - '.github/workflows/quickshop-hikari-abi.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quickshop-hikari-abi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-pinned-hikari-public-api:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Download official QuickShop-Hikari 6.3.0.4 (no version fallback)
        shell: bash
        run: |
          set -euo pipefail
          source scripts/runtime_download.sh
          runtime_download \
            https://github.com/QuickShop-Community/QuickShop-Hikari/releases/download/6.3.0.4/QuickShop-Hikari-6.3.0.4.jar \
            "$RUNNER_TEMP/QuickShop-Hikari-6.3.0.4.jar"
          # SHA-256 published in the upstream GitHub Release's asset digest.
          printf '%s  %s\n' \
            ce1e36d4bd6081b1258a9943ed28416b3e26c3bf0bbca6ec69cf0a397e320b5d \
            "$RUNNER_TEMP/QuickShop-Hikari-6.3.0.4.jar" | sha256sum --check --strict
      - name: Verify public ABI used by Doctor against official upstream JAR
        run: |
          python3 scripts/verify_quickshop_hikari_api.py \
            --jar "$RUNNER_TEMP/QuickShop-Hikari-6.3.0.4.jar"
          echo 'Official QuickShop-Hikari 6.3.0.4 ABI verified; this does not test a live shop.' >> "$GITHUB_STEP_SUMMARY"

name: One-shot Gravity Well 4.1.31 tuning

on:
  push:
    branches:
      - release/4.1.31-beacon-plus

permissions:
  contents: write

jobs:
  tune-gravity-well:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/4.1.31-beacon-plus

      - name: Apply deterministic Gravity Well and pulse-cadence edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          beacon_path = Path('src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlus.java')
          runtime_path = Path('src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusRuntime.java')
          lifecycle_path = Path('src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusLifecycleListener.java')
          docs_path = Path('docs/ADVENTURERS_CURIOS.md')
          verify_path = Path('scripts/verify_adventurers_curios.py')

          beacon = beacon_path.read_text()
          beacon = beacon.replace(
              'import java.util.List;\nimport java.util.Set;\nimport java.util.UUID;\n',
              'import java.util.List;\nimport java.util.Map;\nimport java.util.Set;\nimport java.util.UUID;\nimport java.util.concurrent.ConcurrentHashMap;\n'
          )
          beacon = beacon.replace(
              '    private static final int POWER_PULSE_INTERVAL_TICKS = 20;\n    private static final double EXTRA_RANGE_BLOCKS = 20.0D;\n',
              '    private static final int POWER_PULSE_INTERVAL_TICKS = 20;\n    private static final Map<PulseKey, Long> LAST_FIELD_PULSE_TICKS = new ConcurrentHashMap<>();\n    private static final double EXTRA_RANGE_BLOCKS = 20.0D;\n'
          )
          beacon = beacon.replace(
              '                BeaconPlusPowerState.markUnpowered(block.getLocation());\n                BeaconPlusRuntime.forget(block.getLocation());\n',
              '                BeaconPlusPowerState.markUnpowered(block.getLocation());\n                LAST_FIELD_PULSE_TICKS.remove(PulseKey.from(block.getLocation()));\n                BeaconPlusRuntime.forget(block.getLocation());\n'
          )
          beacon = beacon.replace(
              '''                if (!isFieldPulse(block)) {\n                    BeaconPlusRuntime.tick(block, data);\n                    return;\n                }\n\n                int energyCost = calculateFieldEnergyCost(BeaconPlusEffect.parse(data.getData(BeaconPlusRuntime.EFFECTS_KEY)));\n                if (!hasPoweredPyramid(block) || energyCost <= 0) {\n                    BeaconPlusPowerState.markUnpowered(block.getLocation());\n                    BeaconPlusRuntime.tick(block, data);\n                    return;\n                }\n''',
              '''                if (!isFieldPulse(block)) {\n                    return;\n                }\n\n                int energyCost = calculateFieldEnergyCost(BeaconPlusEffect.parse(data.getData(BeaconPlusRuntime.EFFECTS_KEY)));\n                if (!hasPoweredPyramid(block) || energyCost <= 0) {\n                    BeaconPlusPowerState.markUnpowered(block.getLocation());\n                    BeaconPlusPowerState.reconcileNearbyPlayerStates(block, PLAYER_STATE_RECONCILE_RANGE);\n                    return;\n                }\n'''
          )
          beacon = beacon.replace(
              '''    private static boolean isFieldPulse(Block block) {\n        long gameTime = block.getWorld().getGameTime();\n        return Math.floorMod(gameTime + block.getX() * 31L + block.getZ() * 17L, POWER_PULSE_INTERVAL_TICKS) == 0L;\n    }\n\n    private static boolean hasPoweredPyramid(Block block) {\n''',
              '''    private static boolean isFieldPulse(Block block) {\n        PulseKey key = PulseKey.from(block.getLocation());\n        long gameTime = block.getWorld().getGameTime();\n        Long previous = LAST_FIELD_PULSE_TICKS.get(key);\n\n        if (previous == null) {\n            long stagger = Math.floorMod(block.getX() * 31L + block.getZ() * 17L, POWER_PULSE_INTERVAL_TICKS);\n            LAST_FIELD_PULSE_TICKS.put(key, gameTime - stagger);\n            return stagger == 0L;\n        }\n\n        if (gameTime - previous < POWER_PULSE_INTERVAL_TICKS) {\n            return false;\n        }\n\n        LAST_FIELD_PULSE_TICKS.put(key, gameTime);\n        return true;\n    }\n\n    static void clearPulseState() {\n        LAST_FIELD_PULSE_TICKS.clear();\n    }\n\n    private static boolean hasPoweredPyramid(Block block) {\n'''
          )
          beacon = beacon.replace(
              '''    private static UUID ownerOrPlayer(UUID owner, Player player) {\n        return owner == null ? player.getUniqueId() : owner;\n    }\n}\n''',
              '''    private static UUID ownerOrPlayer(UUID owner, Player player) {\n        return owner == null ? player.getUniqueId() : owner;\n    }\n\n    private record PulseKey(UUID worldId, int x, int y, int z) {\n        private static PulseKey from(Location location) {\n            return new PulseKey(\n                    location.getWorld().getUID(),\n                    location.getBlockX(),\n                    location.getBlockY(),\n                    location.getBlockZ());\n        }\n    }\n}\n'''
          )
          beacon_path.write_text(beacon)

          runtime = runtime_path.read_text()
          runtime = runtime.replace(
              '''        long gameTime = block.getWorld().getGameTime();\n        long phase = Math.floorMod(gameTime + block.getX() * 31L + block.getZ() * 17L, PULSE_INTERVAL_TICKS);\n        if (phase != 0L) {\n            return;\n        }\n\n        double range = getRange(block);\n''',
              '''        long gameTime = block.getWorld().getGameTime();\n\n        double range = getRange(block);\n'''
          )
          runtime = runtime.replace(
              '        Vector pull = delta.normalize().multiply(0.10D + 0.04D * power);\n        pull.setY(Math.max(-0.20D, Math.min(0.20D, pull.getY())));\n',
              '        Vector pull = delta.normalize().multiply(0.30D + 0.12D * power);\n        pull.setY(Math.max(-0.60D, Math.min(0.60D, pull.getY())));\n'
          )
          runtime_path.write_text(runtime)

          lifecycle = lifecycle_path.read_text()
          lifecycle = lifecycle.replace(
              '            BeaconPlusPowerState.shutdown();\n            BeaconPlusRuntime.shutdown();\n',
              '            BeaconPlusPowerState.shutdown();\n            BeaconPlus.clearPulseState();\n            BeaconPlusRuntime.shutdown();\n'
          )
          lifecycle_path.write_text(lifecycle)

          docs = docs_path.read_text()
          docs = docs.replace(
              '**Gravity Well** — gently pulls hostile mobs and loose item entities toward the beacon.',
              '**Gravity Well** — pulls hostile mobs and loose item entities toward the beacon at roughly 3× the original native-port force, on a resilient once-per-second cadence.'
          )
          docs = docs.replace(
              '- Periodic pulses are staggered by beacon location rather than all firing on the same server tick.\n',
              '- Periodic pulses keep their initial location-based staggering, then use elapsed-tick tracking so a missed exact modulo tick cannot skip a whole one-second field pulse.\n- Gravity Well therefore receives one pull on the first eligible ticker at least 20 game ticks after its previous pull instead of requiring one exact server tick.\n'
          )
          docs_path.write_text(docs)

          verify = verify_path.read_text()
          verify = verify.replace(
              '            "BASE_ENERGY_PER_EFFECT_PER_PULSE = 16",\n',
              '            "BASE_ENERGY_PER_EFFECT_PER_PULSE = 16",\n            "LAST_FIELD_PULSE_TICKS",\n            "gameTime - previous < POWER_PULSE_INTERVAL_TICKS",\n'
          )
          verify = verify.replace(
              '            "boostSpawner(",\n            "applyCropBoost(",\n',
              '            "boostSpawner(",\n            "applyCropBoost(",\n            "0.30D + 0.12D * power",\n            "Math.max(-0.60D, Math.min(0.60D, pull.getY()))",\n'
          )
          verify = verify.replace(
              '        require("BeaconPlusPowerState.shutdown()" in lifecycle, "Beacon Plus paid-power cleanup is missing", failures)\n',
              '        require("BeaconPlusPowerState.shutdown()" in lifecycle, "Beacon Plus paid-power cleanup is missing", failures)\n        require("BeaconPlus.clearPulseState()" in lifecycle, "Beacon Plus field-pulse cleanup is missing", failures)\n'
          )
          verify_path.write_text(verify)
          PY

          if git diff --quiet; then
            echo "Gravity Well tuning is already present; no commit needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlus.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusRuntime.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusLifecycleListener.java \
            docs/ADVENTURERS_CURIOS.md \
            scripts/verify_adventurers_curios.py
          git commit -m "Strengthen Gravity Well and harden one-second beacon pulses"
          git push origin HEAD:release/4.1.31-beacon-plus

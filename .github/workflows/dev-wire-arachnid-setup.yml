name: Wire Arachnid Ward Setup

on:
  push:
    branches: [feature/4.1.46-arachnid-ward]

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/4.1.46-arachnid-ward
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Register Arachnid Ward setup
        run: >-
          python3 -c "from pathlib import Path; p=Path('src/main/java/io/github/thebusybiscuit/slimefun4/implementation/setup/PostSetup.java'); s=p.read_text(); old='        AdventurersCuriosSetup.setup(Slimefun.instance());\n'; new=old+'        ArachnidWardTorchSetup.setup(Slimefun.instance());\n'; assert 'ArachnidWardTorchSetup.setup' in s or old in s; p.write_text(s if 'ArachnidWardTorchSetup.setup' in s else s.replace(old,new,1))"
      - name: Compile and test
        run: |
          chmod +x gradlew
          ./gradlew clean test shadowJar --no-daemon
      - name: Commit setup hook
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/dev-wire-arachnid-setup.yml
          git add src/main/java/io/github/thebusybiscuit/slimefun4/implementation/setup/PostSetup.java .github/workflows/dev-wire-arachnid-setup.yml
          git commit -m 'Register Arachnid Ward Torch during post setup'
          git push origin HEAD:feature/4.1.46-arachnid-ward

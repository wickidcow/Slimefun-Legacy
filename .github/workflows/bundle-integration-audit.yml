name: Bundle Integration and Maintained Source Audit
on:
  push:
    branches: ['work/bundle-integration-20260930']
    paths: ['.github/workflows/bundle-integration-audit.yml']
permissions:
  contents: write
  actions: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Reproduce premature capture and apply reviewed integration
        run: python3 .audit/apply_bundle_integration.py
      - name: Run all retained guards and actual capture regression
        run: |
          set -euo pipefail
          git diff --check
          bash -n scripts/proxy_runtime_smoke.sh
          python3 scripts/verify_legacy.py . 2>&1 | tee audit-evidence/invariants.log
      - name: Stage only verified blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          for name,sha in json.loads(Path('audit-evidence/reviewed-blobs.json').read_text()).items():
              data=Path(name).read_bytes()
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              result=subprocess.run(['gh','api','--method','POST','repos/wickidcow/Slimefun-Legacy/git/blobs','--input','-'],input=json.dumps({'content':data.decode(),'encoding':'utf-8'}),text=True,capture_output=True,check=True)
              assert json.loads(result.stdout)['sha']==sha
              target=Path('audit-evidence/reviewed-source')/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bundle-integration-evidence
          path: audit-evidence/
          include-hidden-files: true
          retention-days: 14
      - name: Inventory all maintained sources without executing addon code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import concurrent.futures,hashlib,json,subprocess,tarfile
          matrix=json.loads(Path('compatibility/sfl-addon-release-matrix.json').read_text())
          out=Path('maintained-sources');out.mkdir()
          def collect(row):
              repo=row['repository']; slug=row['slug']; target=Path('source-checkouts')/slug
              subprocess.run(['git','clone','--depth','1',f'https://github.com/{repo}.git',str(target)],check=True,timeout=180)
              sha=row.get('source_commit')
              if sha:
                  subprocess.run(['git','-C',str(target),'fetch','--depth','1','origin',sha],check=True,timeout=90)
                  subprocess.run(['git','-C',str(target),'checkout','--detach',sha],check=True,timeout=30)
              actual=subprocess.check_output(['git','-C',str(target),'rev-parse','HEAD'],text=True).strip()
              assert not sha or actual==sha
              names=subprocess.check_output(['git','-C',str(target),'ls-files','-z']).decode().split('\0')
              names=[n for n in names if n and (Path(n).suffix in {'.java','.kt','.kts','.gradle','.xml','.yml','.yaml','.toml','.properties','.md','.py','.sh'} or n=='gradlew')]
              archive=out/(slug+'.tar.gz')
              with tarfile.open(archive,'w:gz') as t:
                  for name in names:
                      path=target/name
                      if path.is_file() and not path.is_symlink(): t.add(path,arcname=name,recursive=False)
              return dict(repository=repo,slug=slug,commit=actual,files=len(names),sha256=hashlib.sha256(archive.read_bytes()).hexdigest())
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              records=list(pool.map(collect,matrix['addons']))
          assert len(records)==45
          (out/'source-lock.json').write_text(json.dumps(records,indent=2)+'\n')
          print('Archived all 45 exact maintained source trees for code review; no addon code executed.')
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: maintained-addon-sources
          path: maintained-sources/
          retention-days: 14
          if-no-files-found: error

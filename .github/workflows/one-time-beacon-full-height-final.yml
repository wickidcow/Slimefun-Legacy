name: One-time Beacon Full-height Final

on:
  push:
    branches:
      - feature/adventurers-curios-expansion
    paths:
      - .github/workflows/one-time-beacon-full-height-final.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/adventurers-curios-expansion
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Reuse patch without version bump
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/one-time-beacon-full-height-4-1-30b.yml').read_text(encoding='utf-8').splitlines()
          inside = False
          extracted = []
          for line in source:
              if "python3 - <<'PY'" in line:
                  inside = True
                  continue
              if inside and line == '          PY':
                  break
              if inside:
                  extracted.append(line[10:] if line.startswith('          ') else line)
          extracted = [line for line in extracted if "gradle = ROOT / 'gradle.properties'" not in line and 'replace_once(gradle,' not in line]
          Path('/tmp/apply_beacon_field.py').write_text('\n'.join(extracted) + '\n', encoding='utf-8')
          PY
          python3 /tmp/apply_beacon_field.py

      - name: Remove temporary workflows
        run: |
          rm .github/workflows/one-time-beacon-full-height-4-1-30b.yml
          rm .github/workflows/one-time-beacon-full-height-retry.yml
          rm .github/workflows/one-time-beacon-full-height-final.yml

      - name: Validate source and build
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_adventurers_curios.py .
          python3 scripts/verify_legacy.py .
          chmod +x gradlew
          ./gradlew spotlessApply test shadowJar --no-daemon

      - name: Commit final field update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Make Resonance Beacon fields full-height chunk squares"
          git push origin HEAD:feature/adventurers-curios-expansion

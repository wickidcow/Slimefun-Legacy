name: Refresh Resonance Beacon Release Asset

on:
  push:
    branches:
      - automation/refresh-beacon-release-asset

permissions:
  actions: read
  contents: write

jobs:
  refresh-release-asset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download validated Slimefun Legacy JAR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/9246833365/zip" \
            -o SF_Slimefun_Legacy_v4.1.30.jar
          file SF_Slimefun_Legacy_v4.1.30.jar
          test "$(sha256sum SF_Slimefun_Legacy_v4.1.30.jar | awk '{print $1}')" = "f18a4189a8c6ba165bd1ec8edf8a0ca7b6082002cc5ac5fb95a986696d4ad64e"

      - name: Replace Beacon release JAR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload beacon-upgrade-addon-chunk-loader-v1.0.0 \
            SF_Slimefun_Legacy_v4.1.30.jar \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release view beacon-upgrade-addon-chunk-loader-v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[] | select(.name == "SF_Slimefun_Legacy_v4.1.30.jar") | {name: .name, size: .size, digest: .digest}'

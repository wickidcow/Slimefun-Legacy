name: Record Key Collection Ownership Validation
on:
  push:
    branches: ['audit/record-key-input-ownership']
    paths: ['.github/workflows/record-key-ownership-validation.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Stage the permanent regression class and pin the actual source identity
        run: |
          mkdir -p evidence src/test/java/com/xzavier0722/mc/plugin/slimefun4/storage/common
          git rev-parse HEAD > evidence/validation-source.txt
          cp .audit/RecordKeyCollectionOwnershipTest.java src/test/java/com/xzavier0722/mc/plugin/slimefun4/storage/common/RecordKeyCollectionOwnershipTest.java
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          chmod +x gradlew
      - name: Require the original ownership defect to fail assertions, not setup
        run: |
          set +e
          ./gradlew test --tests 'com.xzavier0722.mc.plugin.slimefun4.storage.common.RecordKeyCollectionOwnershipTest' --no-daemon --no-build-cache --no-configuration-cache > evidence/original-tests.log 2>&1
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          mkdir -p evidence/original-tests
          cp build/test-results/test/TEST-*RecordKeyCollectionOwnershipTest.xml evidence/original-tests/
          python3 - <<'PY'
          import json,xml.etree.ElementTree as ET
          from pathlib import Path
          paths=list(Path('evidence/original-tests').glob('*.xml'));assert len(paths)==1
          root=ET.parse(paths[0]).getroot()
          totals={k:int(root.attrib[k]) for k in ['tests','failures','errors','skipped']}
          assert totals==dict(tests=13,failures=8,errors=0,skipped=0),totals
          Path('evidence/negative-control.json').write_text(json.dumps(totals,indent=2)+'\n')
          print(totals)
          PY
      - name: Apply only the constructor ownership correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          path=Path('src/main/java/com/xzavier0722/mc/plugin/slimefun4/storage/common/RecordKey.java')
          original=path.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(original)).encode()+b'\0'+original).hexdigest()=='90d409a68c02a02a80ed2f837fb2637504356671'
          text=original.decode()
          replacements={
            'this(scope, new HashSet<>());':'this(scope, Collections.emptySet());',
            'this(scope, fields, new LinkedList<>());':'this(scope, fields, Collections.emptyList());',
            'this.fields = fields.isEmpty() ? fields : new HashSet<>(fields);':'// Own both collections even when a caller supplies an empty or immutable input.\n        this.fields = fields.isEmpty() ? new HashSet<>() : new HashSet<>(fields);',
            'this.conditions = conditions.isEmpty() ? conditions : new LinkedList<>(conditions);':'this.conditions = conditions.isEmpty() ? new LinkedList<>() : new LinkedList<>(conditions);',
          }
          for old,new in replacements.items():
              assert text.count(old)==1,old
              text=text.replace(old,new)
          path.write_text(text)
          PY
          git diff --check
          python3 scripts/verify_legacy.py . > evidence/source-invariants.log 2>&1
      - name: Full corrected project build and existing artifact checks
        run: |
          set -euo pipefail
          ./gradlew spotlessApply --no-daemon --no-build-cache --no-configuration-cache > evidence/format.log 2>&1
          ./gradlew clean --no-daemon --no-build-cache --no-configuration-cache > evidence/clean.log 2>&1
          ./gradlew build -PslimefunDeprecationReport=true --console=plain --no-daemon --no-build-cache --no-configuration-cache 2>&1 | tee evidence/corrected-build.log
          python3 scripts/summarize_deprecations.py evidence/corrected-build.log --fail-on-warnings --require-successful-build
          JAR="$(find build/libs -maxdepth 1 -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -s "$JAR"
          python3 scripts/check_bytecode_target.py "$JAR" --expected-java 21
          python3 scripts/verify_release_artifact.py "$JAR" --root .
          mkdir -p evidence/corrected-tests
          cp build/test-results/test/TEST-*.xml evidence/corrected-tests/
          python3 - <<'PY'
          import json,xml.etree.ElementTree as ET
          from pathlib import Path
          roots=[ET.parse(p).getroot() for p in Path('evidence/corrected-tests').glob('TEST-*.xml')]
          selected=[r for r in roots if r.attrib['name'].endswith('.RecordKeyCollectionOwnershipTest')]
          assert len(selected)==1
          totals={k:int(selected[0].attrib[k]) for k in ['tests','failures','errors','skipped']}
          assert totals==dict(tests=13,failures=0,errors=0,skipped=0),totals
          aggregate={k:sum(int(r.attrib[k]) for r in roots) for k in ['tests','failures','errors','skipped']}
          assert aggregate['failures']==aggregate['errors']==0
          Path('evidence/results.json').write_text(json.dumps(dict(new_tests=totals,full_report=aggregate,report_files=len(roots)),indent=2)+'\n')
          print(aggregate)
          PY
      - name: Stage only tested production and regression blobs, without advancing release refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          records={}
          names=['src/main/java/com/xzavier0722/mc/plugin/slimefun4/storage/common/RecordKey.java','src/test/java/com/xzavier0722/mc/plugin/slimefun4/storage/common/RecordKeyCollectionOwnershipTest.java']
          for name in names:
              data=Path(name).read_bytes();sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              response=subprocess.run(['gh','api','--method','POST','repos/wickidcow/Slimefun-Legacy/git/blobs','--input','-'],input=json.dumps(dict(content=data.decode(),encoding='utf-8')),capture_output=True,text=True,check=True)
              assert json.loads(response.stdout)['sha']==sha
              records[name]=sha
              target=Path('evidence/reviewed-source')/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          Path('evidence/reviewed-blobs.json').write_text(json.dumps(records,indent=2)+'\n')
          PY
      - name: Retain failed test evidence too
        if: always()
        run: |
          mkdir -p evidence/last-tests
          if test -d build/test-results/test; then cp build/test-results/test/TEST-*.xml evidence/last-tests/ || true; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: record-key-ownership-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: error

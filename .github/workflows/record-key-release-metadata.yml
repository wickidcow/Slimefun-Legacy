name: Record Key Release Metadata Validation
on:
  push:
    branches: ['audit/record-key-reconciliation-20261002']
    paths: ['.github/workflows/record-key-release-metadata.yml']
permissions:
  contents: write
  actions: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Restore verified formatter output and retain actual control evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence/source
          git fetch --depth=1 origin 6a927285cb2d7a73e72818289d7b0cd5f9e05b8f
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,io,json,subprocess,zipfile
          raw=subprocess.run(['gh','api','repos/wickidcow/Slimefun-Legacy/actions/artifacts/11237716976/zip'],capture_output=True,check=True,timeout=120).stdout
          assert hashlib.sha256(raw).hexdigest()=='0023918d9898ab87934ce5080f57754dbc85a22e026271af58aa2fb7da42876f'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None
              assert json.loads(z.read('negative-result.json'))==dict(tests=8,failures=4,errors=0,skipped=0)
              assert json.loads(z.read('corrected-result.json'))==dict(tests=40,failures=0,errors=0,skipped=0)
              Path('evidence/source/RecordKeyConditionViewTest.java').write_bytes(z.read('source/RecordKeyConditionViewTest.java'))
              for name in ['negative-result.json','corrected-result.json']:
                  Path('evidence',name).write_bytes(z.read(name))
          Path('evidence/control-attribution.txt').write_text('Actual controls are from run37032138566, artifact11237716976. That run passed both test stages but stopped before metadata checks because its shallow checkout lacked the comparison commit. This run supplies that exact commit and does not claim a test rerun.\n')
          PY
      - name: Verify metadata and untouched implementation/addon selection
        run: |
          set -euo pipefail
          python3 audit-release/prepare_record_release.py
          python3 scripts/verify_legacy.py . > evidence/release-invariants.log 2>&1
          git diff --check
          git diff -- README.md gradle.properties compatibility/ > evidence/metadata.patch
      - name: Stage checked plain source blobs without ref changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          paths=json.loads(Path('evidence/release-paths.json').read_text())
          records={}
          for name in paths+['src/test/java/com/xzavier0722/mc/plugin/slimefun4/storage/common/RecordKeyConditionViewTest.java']:
              path=Path('evidence/source/RecordKeyConditionViewTest.java') if name.startswith('src/test/') else Path(name)
              data=path.read_bytes()
              sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              r=subprocess.run(['gh','api','--method','POST','repos/wickidcow/Slimefun-Legacy/git/blobs','--input','-'],input=json.dumps(dict(content=data.decode(),encoding='utf-8')),capture_output=True,text=True,check=True)
              assert json.loads(r.stdout)['sha']==sha
              records[name]=sha
          Path('evidence/reviewed-blobs.json').write_text(json.dumps(records,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: record-key-release-metadata-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: error

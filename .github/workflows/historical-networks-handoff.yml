name: Published Networks Historical Item Handoff

on:
  pull_request:
    paths:
      - 'scripts/runtime/historical_networks_handoff/**'
      - '.github/workflows/historical-networks-handoff.yml'
      - 'docs/old-item-compatibility-contract.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-networks:
    name: Published Networks v1.0.65 to v1.0.66 saved world on Paper 1.21.11
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Download exact published old/current Networks and baseline Slimefun
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p candidate
          gh release download v1.0.65 --repo wickidcow/SF_NetworksExp \
            --pattern 'SF_Networks1.0.65.jar' --dir candidate
          gh release download v1.0.66 --repo wickidcow/SF_NetworksExp \
            --pattern 'SF_Networks1.0.66.jar' --dir candidate
          gh release download v4.1.81 --repo wickidcow/Slimefun-Legacy \
            --pattern 'Slimefun-Legacy4.1.81.jar' --dir candidate
          printf '%s\n' \
            '114bfa0d2bc5a12f65e320640691bfa075470ddc9ff021969ade85e92333277f  candidate/SF_Networks1.0.65.jar' \
            '1769bdb6fc941c4c01d893bb0c3f0f2288598403c2c86b0368a16dffe2acc215  candidate/SF_Networks1.0.66.jar' \
            '9d0e436658cb426ecf3468ab55f698fb7e41e23c46e26f9153ffe19a7fa901d1  candidate/Slimefun-Legacy4.1.81.jar' | sha256sum --check --strict
      - name: Download exactly pinned Paper 1.21.11
        run: |
          set -euo pipefail
          source scripts/runtime_download.sh
          runtime_download \
            'https://fill-data.papermc.io/v1/objects/5ffef465eeeb5f2a3c23a24419d97c51afd7dbb4923ff42df9a3f58bba1ccfba/paper-1.21.11-132.jar' \
            candidate/server.jar
          echo '5ffef465eeeb5f2a3c23a24419d97c51afd7dbb4923ff42df9a3f58bba1ccfba  candidate/server.jar' | sha256sum --check --strict
      - name: Compile exact unreleased Doctor candidate (never publish)
        run: |
          set -euo pipefail
          ./gradlew shadowJar --no-daemon
          jar="$(find build/libs -maxdepth 1 -type f -name 'Slimefun-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$jar" && test -s "$jar"
          cp "$jar" candidate/Slimefun-Legacy-unreleased-Doctor.jar
          git rev-parse HEAD > candidate/doctor-source-commit.txt
          sha256sum candidate/Slimefun-Legacy-unreleased-Doctor.jar > candidate/doctor-jar.sha256
      - name: Verify old-world typed identity and Doctor across 5 JVM boots
        run: |
          set -euo pipefail
          python3 scripts/runtime/historical_networks_handoff/run_probe.py \
            --server-jar candidate/server.jar \
            --server-sha256 5ffef465eeeb5f2a3c23a24419d97c51afd7dbb4923ff42df9a3f58bba1ccfba \
            --baseline-core candidate/Slimefun-Legacy4.1.81.jar \
            --candidate-core candidate/Slimefun-Legacy-unreleased-Doctor.jar \
            --old-addon candidate/SF_Networks1.0.65.jar \
            --new-addon candidate/SF_Networks1.0.66.jar \
            --java-home "$JAVA_HOME" \
            --work-dir "$RUNNER_TEMP/sfl-networks-history"
      - name: Display redacted real-addon acceptance result
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/sfl-networks-history/PASS.txt"; then
            cat "$RUNNER_TEMP/sfl-networks-history/PASS.txt" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain only redacted logs and public item-ID classification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: historical-networks-1065-to-1066
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/sfl-networks-history/bootstrap.log
            ${{ runner.temp }}/sfl-networks-history/console-*.log
            ${{ runner.temp }}/sfl-networks-history/PASS.txt
            ${{ runner.temp }}/sfl-networks-history/plugins/SFLNetworksHistoryProbe/classification.tsv

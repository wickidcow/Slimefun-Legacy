name: Update Slimefun Legacy 4.1.31 Beacon repair

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/one-shot-update-4.1.31-beacon-containment.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_COMMIT: 17b04ef34f03e41e5b419f0156ed9de5bc57f619
      LEGACY_VERSION: 4.1.31
      RELEASE_TAG: SlimefunLegacy4.1.31
      RELEASE_JAR: SF_Slimefun_Legacy_v4.1.31.jar
    steps:
      - name: Check out exact repaired source
        uses: actions/checkout@v6
        with:
          ref: 17b04ef34f03e41e5b419f0156ed9de5bc57f619
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Verify exact 4.1.31 source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          VERSION="$(sed -n 's/^projectVersion=//p' gradle.properties | head -n 1 | tr -d '\r')"
          test "$VERSION" = "$LEGACY_VERSION"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$SOURCE_COMMIT")" >> "$GITHUB_ENV"
          echo "Publishing Slimefun Legacy $LEGACY_VERSION from $SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Slimefun Legacy invariants
        run: python3 scripts/verify_legacy.py .

      - name: First clean release build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean shadowJar -PprojectVersion="$LEGACY_VERSION" --no-daemon --no-build-cache --no-configuration-cache
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          cp "$JAR" "$RUNNER_TEMP/Slimefun-first.jar"
          sha256sum "$RUNNER_TEMP/Slimefun-first.jar"

      - name: Verify first release artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_bytecode_target.py "$RUNNER_TEMP/Slimefun-first.jar" --expected-java 21
          python3 scripts/verify_release_artifact.py "$RUNNER_TEMP/Slimefun-first.jar" --root . --json-report "$RUNNER_TEMP/artifact-first.json" --summary "$RUNNER_TEMP/artifact-first.md"

      - name: Second clean release build
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean shadowJar -PprojectVersion="$LEGACY_VERSION" --no-daemon --no-build-cache --no-configuration-cache
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          cp "$JAR" "$RUNNER_TEMP/Slimefun-second.jar"
          sha256sum "$RUNNER_TEMP/Slimefun-second.jar"

      - name: Verify second release artifact and reproducibility
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_bytecode_target.py "$RUNNER_TEMP/Slimefun-second.jar" --expected-java 21
          python3 scripts/verify_release_artifact.py "$RUNNER_TEMP/Slimefun-second.jar" --root . --json-report "$RUNNER_TEMP/artifact-second.json" --summary "$RUNNER_TEMP/artifact-second.md"
          FIRST_SHA="$(sha256sum "$RUNNER_TEMP/Slimefun-first.jar" | awk '{print $1}')"
          SECOND_SHA="$(sha256sum "$RUNNER_TEMP/Slimefun-second.jar" | awk '{print $1}')"
          test "$FIRST_SHA" = "$SECOND_SHA"
          cmp "$RUNNER_TEMP/Slimefun-first.jar" "$RUNNER_TEMP/Slimefun-second.jar"
          echo "Verified reproducible SHA-256: $FIRST_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Stage release JAR and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$RUNNER_TEMP/Slimefun-first.jar" "dist/$RELEASE_JAR"
          cd dist
          sha256sum "$RELEASE_JAR" > "${RELEASE_JAR%.jar}.sha256"
          cat "${RELEASE_JAR%.jar}.sha256" >> "$GITHUB_STEP_SUMMARY"

      - name: Update 4.1.31 tag to exact repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$RELEASE_TAG" "$SOURCE_COMMIT"
          git push origin "refs/tags/$RELEASE_TAG" --force

      - name: Update release notes and replace raw release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json body --jq '.body' > "$RUNNER_TEMP/existing-release-notes.md"
          cat > "$RUNNER_TEMP/repaired-release-notes.md" <<'EOF'
          ### Beacon Plus dual-power + Containment Armor repair

          - Restored the Beacon Plus **Power Source** control with a toggle between **Slimefun Electricity** and **Beacon Blocks**.
          - Existing Beacon Plus blocks without a saved power-mode setting default safely to **Slimefun Electricity**.
          - Slimefun Electricity mode no longer requires a vanilla beacon pyramid; it consumes the configured field Energy once per second.
          - Beacon Blocks mode follows vanilla beacon pyramid/range activation and consumes no Slimefun Energy.
          - Fixed Strength and the shared powered-state path used by player, persistent and event-driven Beacon Plus effects.
          - Gravity Well now pulls nearby Bukkit mobs, including Endermen, plus loose items once per second while excluding players and armor stands.
          - Locked the Status, Power Source, all 30 effect controls, Disable All, Activator Coverage and Close buttons so GUI items cannot be picked up or moved.
          - Made Beacon Plus effect lore power-source aware so Beacon Blocks mode no longer advertises an electricity cost.
          - Added focused regression tests for all 30 registered effects, persistence round-trips, power-source aliases/defaults/toggling and electricity-cost rules.
          - Adventurer's Curios now contains only **Curiosities** and **Containment Armor** submenus.
          - **Containment Armor** contains both Advanced Hazmat Gear and Netherite Containment Armor.
          - Netherite Containment Armor now crafts in the **Armor Forge**, using the approved Lead / Netherite / Advanced Hazmat / Netherite Upgrade recipe grid.
          - Verified with the full build/test suite, Runtime Gameplay Correctness, Paper 26.2 Runtime Smoke, Public API Compatibility and Slimefun Compatibility gates.

          EOF
          cat "$RUNNER_TEMP/existing-release-notes.md" >> "$RUNNER_TEMP/repaired-release-notes.md"
          gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/repaired-release-notes.md"
          gh release upload "$RELEASE_TAG" "dist/$RELEASE_JAR" "dist/${RELEASE_JAR%.jar}.sha256" --clobber

      - name: Verify published tag and assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REMOTE_TAG="$(git ls-remote origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
          test "$REMOTE_TAG" = "$SOURCE_COMMIT"
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,assets --jq '.tagName, .isDraft, .isPrerelease, (.assets[] | [.name, .size] | @tsv)' | tee "$RUNNER_TEMP/published-assets.txt"
          grep -q "$RELEASE_JAR" "$RUNNER_TEMP/published-assets.txt"
          grep -q "${RELEASE_JAR%.jar}.sha256" "$RUNNER_TEMP/published-assets.txt"
          echo "4.1.31 release tag and raw assets verified." >> "$GITHUB_STEP_SUMMARY"

name: Slimefun 4.1.38 Energy Test Build

on:
  push:
    branches:
      - build/4.1.38-energy-test

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build 4.1.38
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon
      - name: Stage JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          mkdir -p dist
          cp "$JAR" dist/Slimefun-Legacy4.1.38-current.jar
          sha256sum dist/Slimefun-Legacy4.1.38-current.jar
      - name: Upload raw JAR
        uses: actions/upload-artifact@v7
        with:
          name: Slimefun-Legacy4.1.38-current
          path: dist/Slimefun-Legacy4.1.38-current.jar
          archive: false
          if-no-files-found: error

name: Refresh Slimefun Legacy Addon Bundle

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/refresh-addon-bundle.yml'
  workflow_run:
    workflows: ['Reproducible Release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-slimefun-addon-bundle
  cancel-in-progress: true

env:
  BASE_BUNDLE_TAG: v4.1.45
  MILITARY_VERSION: '1.1.6'
  WARFARE_VERSION: '1.0.5'
  RSC_VERSION: '3.1.7-Legacy5'
  FLUFFY_VERSION: '26.2.11'
  MOB_CAPTURER_VERSION: '1.0.4'
  FAST_MACHINES_VERSION: '1.0.3'
  GENETIC_CHICK_VERSION: '1.0.1'
  NETWORKS_VERSION: '1.0.14'
  # v1.0.14 asset refreshed in place with modular Networks Expansion feature toggles.
  SUPREME_VERSION: '1.0.3'

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Refresh validated addon files in bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(sed -n 's/^projectVersion=//p' gradle.properties | head -n 1 | tr -d '\r')"
          CURRENT_TAG="v${CURRENT_VERSION}"

          rm -rf bundle work fixed
          mkdir -p bundle work fixed

          download_with_retry() {
            local repo="$1"
            local tag="$2"
            local asset="$3"
            local dest="$4"
            local attempt

            for attempt in $(seq 1 90); do
              rm -f "$dest/$asset" 2>/dev/null || true
              if gh release download "$tag" --repo "$repo" --pattern "$asset" --dir "$dest"; then
                return 0
              fi
              echo "Waiting for $repo $tag asset $asset (attempt $attempt/90)"
              sleep 10
            done

            echo "Timed out waiting for $repo $tag asset $asset" >&2
            return 1
          }

          # Reuse the current release bundle when it exists so maintenance refreshes never
          # roll newer addon builds back to the older seed bundle. A brand-new release falls
          # back to the last known-good seed until its own bundle exists.
          SOURCE_TAG="$BASE_BUNDLE_TAG"
          if gh release view "$CURRENT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && \
             gh release view "$CURRENT_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq 'SFL_AddonsNDependencies.zip'; then
            SOURCE_TAG="$CURRENT_TAG"
          fi

          echo "Using addon bundle seed: ${SOURCE_TAG}"
          gh release download "$SOURCE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'SFL_AddonsNDependencies.zip' \
            --dir work
          unzip -q work/SFL_AddonsNDependencies.zip -d bundle

          # Core Slimefun is a separate release asset and must NEVER be inside the addon bundle.
          find bundle -type f -iname 'Slimefun-Legacy*.jar' -print -delete

          replace_simple() {
            local label="$1"
            local pattern="$2"
            local repo="$3"
            local tag="$4"
            local asset="$5"
            local old
            local dest_dir

            old="$(find bundle -type f -iname "$pattern" -print -quit || true)"
            if [[ -z "$old" ]]; then
              echo "Could not find existing ${label} JAR in bundle seed." >&2
              exit 1
            fi

            dest_dir="$(dirname "$old")"
            echo "${label}: ${old} -> ${dest_dir}/${asset}"
            find bundle -type f -iname "$pattern" -delete
            download_with_retry "$repo" "$tag" "$asset" fixed
            mkdir -p "$dest_dir"
            cp "fixed/$asset" "$dest_dir/"

            test "$(find bundle -type f -name "$asset" | wc -l)" -eq 1
            if find bundle -type f -iname "$pattern" ! -name "$asset" | grep -q .; then
              echo "A stale ${label} JAR remains in the bundle." >&2
              find bundle -type f -iname "$pattern" -print
              exit 1
            fi
          }

          replace_simple 'Military Arsenal' '*MilitaryArsenal*.jar' \
            wickidcow/SF_MilitaryArsenal "v${MILITARY_VERSION}" "SF_MilitaryArsenal${MILITARY_VERSION}.jar"
          replace_simple 'Slimefun Warfare' '*SlimefunWarfare*.jar' \
            wickidcow/SF_SlimefunWarfare "v${WARFARE_VERSION}" "SF_SlimefunWarfare${WARFARE_VERSION}.jar"
          replace_simple 'RykenSlimeCustomizer' '*RykenSlime*Customizer*.jar' \
            wickidcow/SF_RykenSlimeCustomizer "v${RSC_VERSION}" "SF_RykenSlimeCustomizer${RSC_VERSION}.jar"
          replace_simple 'FluffyMachines' '*FluffyMachines*.jar' \
            wickidcow/SF_FluffyMachines "v${FLUFFY_VERSION}" "SF_FluffyMachines${FLUFFY_VERSION}.jar"
          replace_simple 'MobCapturer' '*MobCapturer*.jar' \
            wickidcow/SF_MobCapturer "v${MOB_CAPTURER_VERSION}" "SF_MobCapturer${MOB_CAPTURER_VERSION}.jar"
          replace_simple 'FastMachines' '*FastMachines*.jar' \
            wickidcow/SF_FastMachines "v${FAST_MACHINES_VERSION}" "SF_FastMachines${FAST_MACHINES_VERSION}.jar"
          replace_simple 'Genetic ChickEngineering' '*Genetic*Chick*.jar' \
            wickidcow/SF_GeneticChickEngineering "v${GENETIC_CHICK_VERSION}" "SF_GeneticChickEngineering${GENETIC_CHICK_VERSION}.jar"

          NETWORKS_OLD="$(find bundle -type f \( -iname '*NetworksExp*.jar' -o -iname 'Networks-Legacy*.jar' \) -print -quit || true)"
          if [[ -z "$NETWORKS_OLD" ]]; then
            echo 'Could not find existing Networks Expansion JAR in bundle seed.' >&2
            exit 1
          fi
          NETWORKS_DIR="$(dirname "$NETWORKS_OLD")"
          find bundle -type f \( -iname '*NetworksExp*.jar' -o -iname 'Networks-Legacy*.jar' \) -delete
          download_with_retry wickidcow/SF_NetworksExp "v${NETWORKS_VERSION}" "SF_NetworksExp${NETWORKS_VERSION}.jar" fixed
          cp "fixed/SF_NetworksExp${NETWORKS_VERSION}.jar" "$NETWORKS_DIR/"

          SUPREME_OLD="$(find bundle -type f \( -iname 'SF_Supreme*.jar' -o -iname 'Supreme-Legacy*.jar' -o -iname 'Supreme-*.jar' \) -print -quit || true)"
          if [[ -z "$SUPREME_OLD" ]]; then
            echo 'Could not find existing Supreme JAR in bundle seed.' >&2
            exit 1
          fi
          SUPREME_DIR="$(dirname "$SUPREME_OLD")"
          find bundle -type f \( -iname 'SF_Supreme*.jar' -o -iname 'Supreme-Legacy*.jar' -o -iname 'Supreme-*.jar' \) -delete
          download_with_retry wickidcow/SF_Supreme "v${SUPREME_VERSION}" "SF_Supreme${SUPREME_VERSION}.jar" fixed
          cp "fixed/SF_Supreme${SUPREME_VERSION}.jar" "$SUPREME_DIR/"

          # Magic Expansion is intentionally distributed separately from this bundle.
          find bundle -type f -iname '*MagicExpansion*.jar' -delete
          find bundle -type f -iname 'Magic*.zip' -delete
          MAGIC_INFO="$(grep -rl --include='info.yml' '^id:[[:space:]]*Magic[[:space:]]*$' bundle 2>/dev/null | head -n 1 || true)"
          if [[ -n "$MAGIC_INFO" ]]; then
            rm -rf "$(dirname "$MAGIC_INFO")"
          fi
          rm -rf bundle/RykenSlimefunCustomizer/addons/Magic

          # Exact-version and stale-copy validation.
          test "$(find bundle -type f -name "SF_MilitaryArsenal${MILITARY_VERSION}.jar" | wc -l)" -eq 1
          test "$(find bundle -type f -name "SF_SlimefunWarfare${WARFARE_VERSION}.jar" | wc -l)" -eq 1
          test "$(find bundle -type f -name "SF_RykenSlimeCustomizer${RSC_VERSION}.jar" | wc -l)" -eq 1
          test "$(find bundle -type f -name "SF_FluffyMachines${FLUFFY_VERSION}.jar" | wc -l)" -eq 1
          test "$(find bundle -type f -name "SF_MobCapturer${MOB_CAPTURER_VERSION}.jar" | wc -l)" -eq 1
          test "$(find bundle -type f -name "SF_FastMachines${FAST_MACHINES_VERSION}.jar" | wc -l)" -eq 1
          test "$(find bundle -type f -name "SF_GeneticChickEngineering${GENETIC_CHICK_VERSION}.jar" | wc -l)" -eq 1
          test "$(find bundle -type f -name "SF_NetworksExp${NETWORKS_VERSION}.jar" | wc -l)" -eq 1
          test "$(find bundle -type f -name "SF_Supreme${SUPREME_VERSION}.jar" | wc -l)" -eq 1

          if find bundle -type f \( -iname '*NetworksExp*.jar' -o -iname 'Networks-Legacy*.jar' \) ! -name "SF_NetworksExp${NETWORKS_VERSION}.jar" | grep -q .; then
            echo 'Old Networks JAR remains in bundle.' >&2; exit 1
          fi
          if find bundle -type f \( -iname 'SF_Supreme*.jar' -o -iname 'Supreme-Legacy*.jar' -o -iname 'Supreme-*.jar' \) ! -name "SF_Supreme${SUPREME_VERSION}.jar" | grep -q .; then
            echo 'Old Supreme JAR remains in bundle.' >&2; exit 1
          fi
          if find bundle -type f -iname '*MagicExpansion*.jar' | grep -q . || \
             find bundle -type f -iname 'Magic*.zip' | grep -q . || \
             grep -rl --include='info.yml' '^id:[[:space:]]*Magic[[:space:]]*$' bundle 2>/dev/null | grep -q . || \
             [[ -e bundle/RykenSlimefunCustomizer/addons/Magic ]]; then
            echo 'Magic Expansion content must not be included in the addon bundle.' >&2
            exit 1
          fi
          if find bundle -type f -iname 'Slimefun-Legacy*.jar' | grep -q .; then
            echo 'Slimefun Legacy core JAR must not be included in SFL_AddonsNDependencies.zip.' >&2
            exit 1
          fi

          rm -f SFL_AddonsNDependencies.zip
          (cd bundle && zip -qr ../SFL_AddonsNDependencies.zip .)

          # Final archive-level invariant checks.
          unzip -l SFL_AddonsNDependencies.zip | grep -F "SF_RykenSlimeCustomizer${RSC_VERSION}.jar"
          unzip -l SFL_AddonsNDependencies.zip | grep -F "SF_SlimefunWarfare${WARFARE_VERSION}.jar"
          unzip -l SFL_AddonsNDependencies.zip | grep -F "SF_Supreme${SUPREME_VERSION}.jar"
          if unzip -Z1 SFL_AddonsNDependencies.zip | grep -Ei '(^|/)Slimefun-Legacy[^/]*\.jar$'; then
            echo 'Slimefun Legacy core JAR found in final addon/dependency archive.' >&2
            exit 1
          fi
          if unzip -l SFL_AddonsNDependencies.zip | grep -Ei 'MagicExpansion.*\.jar|RykenSlimefunCustomizer/addons/Magic/|Magic[^/]*\.zip'; then
            echo 'Magic Expansion or Magic addon content found in final archive.' >&2
            exit 1
          fi
          sha256sum SFL_AddonsNDependencies.zip

      - name: Publish refreshed bundle to current release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(sed -n 's/^projectVersion=//p' gradle.properties | head -n 1 | tr -d '\r')"
          CURRENT_TAG="v${CURRENT_VERSION}"

          if gh release view "$CURRENT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$CURRENT_TAG" SFL_AddonsNDependencies.zip \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "Release $CURRENT_TAG does not exist yet; reproducible release will publish the validated bundle first."
          fi

      - name: Upload refreshed bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: Slimefun-Legacy-Addons
          path: SFL_AddonsNDependencies.zip
          archive: false
          if-no-files-found: error

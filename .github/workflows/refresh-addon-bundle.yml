name: Refresh Slimefun Legacy Addon Bundle

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/refresh-addon-bundle.yml'
  workflow_run:
    workflows: ['Reproducible Release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-slimefun-addon-bundle
  cancel-in-progress: true

env:
  BASE_BUNDLE_TAG: v4.1.45
  MILITARY_VERSION: '1.1.6'
  WARFARE_VERSION: '1.0.3'
  RSC_VERSION: '3.1.7-Legacy4'
  MAGIC_VERSION: 'Legacy-1.1.21'
  MAGIC_TAG: 'legacy-1.1.21'
  MAGIC_EXPANSION_VERSION: '1.1.3'
  FLUFFY_VERSION: '26.2.11'
  MOB_CAPTURER_VERSION: '1.0.4'
  FAST_MACHINES_VERSION: '1.0.3'
  GENETIC_CHICK_VERSION: '1.0.1'
  NETWORKS_VERSION: '1.0.7'
  SUPREME_VERSION: '1.0.1'

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Refresh fixed addon files in bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bundle work fixed magic-fixed
          mkdir -p bundle work fixed magic-fixed

          download_with_retry() {
            local repo="$1"
            local tag="$2"
            local pattern="$3"
            local dest="$4"
            local attempt
            for attempt in $(seq 1 90); do
              rm -f "$dest"/$(basename "$pattern") 2>/dev/null || true
              if gh release download "$tag" --repo "$repo" --pattern "$pattern" --dir "$dest"; then
                return 0
              fi
              echo "Waiting for $repo $tag asset $pattern (attempt $attempt/90)"
              sleep 10
            done
            echo "Timed out waiting for $repo $tag asset $pattern" >&2
            return 1
          }

          gh release download "$BASE_BUNDLE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'SFL_AddonsNDependencies.zip' \
            --dir work
          unzip -q work/SFL_AddonsNDependencies.zip -d bundle

          MA_OLD="$(find bundle -type f -iname '*MilitaryArsenal*.jar' -print -quit || true)"
          WF_OLD="$(find bundle -type f -iname '*SlimefunWarfare*.jar' -print -quit || true)"
          RSC_OLD="$(find bundle -type f -iname '*RykenSlime*Customizer*.jar' -print -quit || true)"
          ME_OLD="$(find bundle -type f -iname '*MagicExpansion*.jar' -print -quit || true)"
          FLUFFY_OLD="$(find bundle -type f -iname '*FluffyMachines*.jar' -print -quit || true)"
          MOB_OLD="$(find bundle -type f -iname '*MobCapturer*.jar' -print -quit || true)"
          FAST_OLD="$(find bundle -type f -iname '*FastMachines*.jar' -print -quit || true)"
          GCE_OLD="$(find bundle -type f -iname '*Genetic*Chick*.jar' -print -quit || true)"
          NETWORKS_OLD="$(find bundle -type f \( -iname '*NetworksExp*.jar' -o -iname 'Networks-Legacy*.jar' \) -print -quit || true)"
          SUPREME_OLD="$(find bundle -type f \( -iname 'SF_Supreme*.jar' -o -iname 'Supreme-Legacy*.jar' -o -iname 'Supreme-*.jar' \) -print -quit || true)"
          MAGIC_INFO="$(grep -rl --include='info.yml' '^id:[[:space:]]*Magic[[:space:]]*$' bundle 2>/dev/null | head -n 1 || true)"

          MA_DIR="${MA_OLD:+$(dirname "$MA_OLD")}"; MA_DIR="${MA_DIR:-bundle}"
          WF_DIR="${WF_OLD:+$(dirname "$WF_OLD")}"; WF_DIR="${WF_DIR:-bundle}"
          RSC_DIR="${RSC_OLD:+$(dirname "$RSC_OLD")}"; RSC_DIR="${RSC_DIR:-bundle}"
          ME_DIR="${ME_OLD:+$(dirname "$ME_OLD")}"; ME_DIR="${ME_DIR:-bundle}"
          FLUFFY_DIR="${FLUFFY_OLD:+$(dirname "$FLUFFY_OLD")}"; FLUFFY_DIR="${FLUFFY_DIR:-bundle}"
          MOB_DIR="${MOB_OLD:+$(dirname "$MOB_OLD")}"; MOB_DIR="${MOB_DIR:-bundle}"
          FAST_DIR="${FAST_OLD:+$(dirname "$FAST_OLD")}"; FAST_DIR="${FAST_DIR:-bundle}"
          GCE_DIR="${GCE_OLD:+$(dirname "$GCE_OLD")}"; GCE_DIR="${GCE_DIR:-bundle}"
          NETWORKS_DIR="${NETWORKS_OLD:+$(dirname "$NETWORKS_OLD")}"; NETWORKS_DIR="${NETWORKS_DIR:-bundle}"
          SUPREME_DIR="${SUPREME_OLD:+$(dirname "$SUPREME_OLD")}"; SUPREME_DIR="${SUPREME_DIR:-bundle}"
          MAGIC_ADDON_DIR="bundle/RykenSlimefunCustomizer/addons/Magic"

          echo "Military Arsenal destination: $MA_DIR"
          echo "SlimefunWarfare destination: $WF_DIR"
          echo "RSC destination: $RSC_DIR"
          echo "MagicExpansion destination: $ME_DIR"
          echo "FluffyMachines destination: $FLUFFY_DIR"
          echo "MobCapturer destination: $MOB_DIR"
          echo "FastMachines destination: $FAST_DIR"
          echo "Genetic ChickEngineering destination: $GCE_DIR"
          echo "Networks destination: $NETWORKS_DIR"
          echo "Supreme destination: $SUPREME_DIR"
          echo "Magic RSC drop-in destination: $MAGIC_ADDON_DIR"

          find bundle -type f -iname '*MilitaryArsenal*.jar' -delete
          find bundle -type f -iname '*SlimefunWarfare*.jar' -delete
          find bundle -type f -iname '*RykenSlime*Customizer*.jar' -delete
          find bundle -type f -iname '*MagicExpansion*.jar' -delete
          find bundle -type f -iname '*FluffyMachines*.jar' -delete
          find bundle -type f -iname '*MobCapturer*.jar' -delete
          find bundle -type f -iname '*FastMachines*.jar' -delete
          find bundle -type f -iname '*Genetic*Chick*.jar' -delete
          find bundle -type f \( -iname '*NetworksExp*.jar' -o -iname 'Networks-Legacy*.jar' \) -delete
          find bundle -type f \( -iname 'SF_Supreme*.jar' -o -iname 'Supreme-Legacy*.jar' -o -iname 'Supreme-*.jar' \) -delete
          find bundle -type f -iname 'Magic*.zip' -delete

          if [[ -n "$MAGIC_INFO" ]]; then
            rm -rf "$(dirname "$MAGIC_INFO")"
          fi
          rm -rf "$MAGIC_ADDON_DIR"

          download_with_retry wickidcow/SF_MilitaryArsenal "v${MILITARY_VERSION}" "SF_MilitaryArsenal${MILITARY_VERSION}.jar" fixed
          download_with_retry wickidcow/SF_SlimefunWarfare "v${WARFARE_VERSION}" "SF_SlimefunWarfare${WARFARE_VERSION}.jar" fixed
          download_with_retry wickidcow/SF_RykenSlimeCustomizer "v${RSC_VERSION}" "SF_RykenSlimeCustomizer${RSC_VERSION}.jar" fixed
          download_with_retry wickidcow/SF_Magic_RSC "$MAGIC_TAG" "Magic-${MAGIC_VERSION}.zip" fixed
          download_with_retry wickidcow/SF_MagicExpansion "v${MAGIC_EXPANSION_VERSION}" "SF_MagicExpansion${MAGIC_EXPANSION_VERSION}.jar" fixed
          download_with_retry wickidcow/SF_FluffyMachines "v${FLUFFY_VERSION}" "SF_FluffyMachines${FLUFFY_VERSION}.jar" fixed
          download_with_retry wickidcow/SF_MobCapturer "v${MOB_CAPTURER_VERSION}" "SF_MobCapturer${MOB_CAPTURER_VERSION}.jar" fixed
          download_with_retry wickidcow/SF_FastMachines "v${FAST_MACHINES_VERSION}" "SF_FastMachines${FAST_MACHINES_VERSION}.jar" fixed
          download_with_retry wickidcow/SF_GeneticChickEngineering "v${GENETIC_CHICK_VERSION}" "SF_GeneticChickEngineering${GENETIC_CHICK_VERSION}.jar" fixed
          download_with_retry wickidcow/SF_NetworksExp "v${NETWORKS_VERSION}" "SF_NetworksExp${NETWORKS_VERSION}.jar" fixed
          download_with_retry wickidcow/SF_Supreme "v${SUPREME_VERSION}" "SF_Supreme${SUPREME_VERSION}.jar" fixed

          mkdir -p "$MA_DIR" "$WF_DIR" "$RSC_DIR" "$ME_DIR" "$FLUFFY_DIR" "$MOB_DIR" "$FAST_DIR" "$GCE_DIR" "$NETWORKS_DIR" "$SUPREME_DIR"
          cp "fixed/SF_MilitaryArsenal${MILITARY_VERSION}.jar" "$MA_DIR/"
          cp "fixed/SF_SlimefunWarfare${WARFARE_VERSION}.jar" "$WF_DIR/"
          cp "fixed/SF_RykenSlimeCustomizer${RSC_VERSION}.jar" "$RSC_DIR/"
          cp "fixed/SF_MagicExpansion${MAGIC_EXPANSION_VERSION}.jar" "$ME_DIR/"
          cp "fixed/SF_FluffyMachines${FLUFFY_VERSION}.jar" "$FLUFFY_DIR/"
          cp "fixed/SF_MobCapturer${MOB_CAPTURER_VERSION}.jar" "$MOB_DIR/"
          cp "fixed/SF_FastMachines${FAST_MACHINES_VERSION}.jar" "$FAST_DIR/"
          cp "fixed/SF_GeneticChickEngineering${GENETIC_CHICK_VERSION}.jar" "$GCE_DIR/"
          cp "fixed/SF_NetworksExp${NETWORKS_VERSION}.jar" "$NETWORKS_DIR/"
          cp "fixed/SF_Supreme${SUPREME_VERSION}.jar" "$SUPREME_DIR/"

          unzip -q "fixed/Magic-${MAGIC_VERSION}.zip" -d magic-fixed
          test -f magic-fixed/Magic/info.yml
          grep -q "^version:[[:space:]]*${MAGIC_VERSION}$" magic-fixed/Magic/info.yml
          mkdir -p "$(dirname "$MAGIC_ADDON_DIR")"
          cp -a magic-fixed/Magic "$MAGIC_ADDON_DIR"

          test "$(find bundle -type f -name "SF_MilitaryArsenal${MILITARY_VERSION}.jar" | wc -l)" -eq 1
          test "$(find bundle -type f -name "SF_SlimefunWarfare${WARFARE_VERSION}.jar" | wc -l)" -eq 1
          test "$(find bundle -type f -name "SF_RykenSlimeCustomizer${RSC_VERSION}.jar" | wc -l)" -eq 1
          test "$(find bundle -type f -name "SF_MagicExpansion${MAGIC_EXPANSION_VERSION}.jar" | wc -l)" -eq 1
          test "$(find bundle -type f -name "SF_FluffyMachines${FLUFFY_VERSION}.jar" | wc -l)" -eq 1
          test "$(find bundle -type f -name "SF_MobCapturer${MOB_CAPTURER_VERSION}.jar" | wc -l)" -eq 1
          test "$(find bundle -type f -name "SF_FastMachines${FAST_MACHINES_VERSION}.jar" | wc -l)" -eq 1
          test "$(find bundle -type f -name "SF_GeneticChickEngineering${GENETIC_CHICK_VERSION}.jar" | wc -l)" -eq 1
          test "$(find bundle -type f -name "SF_NetworksExp${NETWORKS_VERSION}.jar" | wc -l)" -eq 1
          test "$(find bundle -type f -name "SF_Supreme${SUPREME_VERSION}.jar" | wc -l)" -eq 1
          test -f "$MAGIC_ADDON_DIR/info.yml"
          grep -q "^version:[[:space:]]*${MAGIC_VERSION}$" "$MAGIC_ADDON_DIR/info.yml"

          if find bundle -type f -iname '*MilitaryArsenal*.jar' ! -name "SF_MilitaryArsenal${MILITARY_VERSION}.jar" | grep -q .; then
            echo 'Old Military Arsenal JAR remains in bundle.' >&2; exit 1
          fi
          if find bundle -type f -iname '*SlimefunWarfare*.jar' ! -name "SF_SlimefunWarfare${WARFARE_VERSION}.jar" | grep -q .; then
            echo 'Old SlimefunWarfare JAR remains in bundle.' >&2; exit 1
          fi
          if find bundle -type f -iname '*RykenSlime*Customizer*.jar' ! -name "SF_RykenSlimeCustomizer${RSC_VERSION}.jar" | grep -q .; then
            echo 'Old RykenSlimefunCustomizer JAR remains in bundle.' >&2; exit 1
          fi
          if find bundle -type f -iname '*MagicExpansion*.jar' ! -name "SF_MagicExpansion${MAGIC_EXPANSION_VERSION}.jar" | grep -q .; then
            echo 'Old MagicExpansion JAR remains in bundle.' >&2; exit 1
          fi
          if find bundle -type f -iname '*FluffyMachines*.jar' ! -name "SF_FluffyMachines${FLUFFY_VERSION}.jar" | grep -q .; then
            echo 'Old FluffyMachines JAR remains in bundle.' >&2; exit 1
          fi
          if find bundle -type f -iname '*MobCapturer*.jar' ! -name "SF_MobCapturer${MOB_CAPTURER_VERSION}.jar" | grep -q .; then
            echo 'Old MobCapturer JAR remains in bundle.' >&2; exit 1
          fi
          if find bundle -type f -iname '*FastMachines*.jar' ! -name "SF_FastMachines${FAST_MACHINES_VERSION}.jar" | grep -q .; then
            echo 'Old FastMachines JAR remains in bundle.' >&2; exit 1
          fi
          if find bundle -type f -iname '*Genetic*Chick*.jar' ! -name "SF_GeneticChickEngineering${GENETIC_CHICK_VERSION}.jar" | grep -q .; then
            echo 'Old Genetic ChickEngineering JAR remains in bundle.' >&2; exit 1
          fi
          if find bundle -type f \( -iname '*NetworksExp*.jar' -o -iname 'Networks-Legacy*.jar' \) ! -name "SF_NetworksExp${NETWORKS_VERSION}.jar" | grep -q .; then
            echo 'Old Networks JAR remains in bundle.' >&2; exit 1
          fi
          if find bundle -type f \( -iname 'SF_Supreme*.jar' -o -iname 'Supreme-Legacy*.jar' -o -iname 'Supreme-*.jar' \) ! -name "SF_Supreme${SUPREME_VERSION}.jar" | grep -q .; then
            echo 'Old Supreme JAR remains in bundle.' >&2; exit 1
          fi
          if find bundle -type f -iname 'Magic*.zip' | grep -q .; then
            echo 'Nested Magic ZIP remains in bundle; Magic must be deployed as RykenSlimefunCustomizer/addons/Magic.' >&2; exit 1
          fi

          rm -f SFL_AddonsNDependencies.zip
          (cd bundle && zip -qr ../SFL_AddonsNDependencies.zip .)
          unzip -l SFL_AddonsNDependencies.zip | grep -F "SF_RykenSlimeCustomizer${RSC_VERSION}.jar"
          unzip -l SFL_AddonsNDependencies.zip | grep -F "SF_MagicExpansion${MAGIC_EXPANSION_VERSION}.jar"
          unzip -l SFL_AddonsNDependencies.zip | grep -F "RykenSlimefunCustomizer/addons/Magic/info.yml"
          unzip -l SFL_AddonsNDependencies.zip | grep -F "SF_FluffyMachines${FLUFFY_VERSION}.jar"
          unzip -l SFL_AddonsNDependencies.zip | grep -F "SF_MobCapturer${MOB_CAPTURER_VERSION}.jar"
          unzip -l SFL_AddonsNDependencies.zip | grep -F "SF_FastMachines${FAST_MACHINES_VERSION}.jar"
          unzip -l SFL_AddonsNDependencies.zip | grep -F "SF_GeneticChickEngineering${GENETIC_CHICK_VERSION}.jar"
          unzip -l SFL_AddonsNDependencies.zip | grep -F "SF_NetworksExp${NETWORKS_VERSION}.jar"
          unzip -l SFL_AddonsNDependencies.zip | grep -F "SF_Supreme${SUPREME_VERSION}.jar"
          if unzip -l SFL_AddonsNDependencies.zip | grep -Ei 'Magic[^/]*\.zip'; then
            echo 'Nested Magic ZIP found in final archive.' >&2; exit 1
          fi
          sha256sum SFL_AddonsNDependencies.zip

      - name: Publish refreshed bundle to current release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(sed -n 's/^projectVersion=//p' gradle.properties | head -n 1 | tr -d '\r')"
          CURRENT_TAG="v${CURRENT_VERSION}"

          if gh release view "$CURRENT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$CURRENT_TAG" SFL_AddonsNDependencies.zip \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "Release $CURRENT_TAG does not exist yet; reproducible release will publish the validated bundle first."
          fi
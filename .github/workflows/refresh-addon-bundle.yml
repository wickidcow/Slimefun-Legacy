name: Refresh Slimefun Legacy Addon Bundle

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/refresh-addon-bundle.yml'
  workflow_run:
    workflows: ['Reproducible Release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-slimefun-addon-bundle
  cancel-in-progress: true

env:
  # Refresh marker: Networks Expansion 1.0.15 pusher scheduling performance.
  BASE_BUNDLE_TAG: v4.1.48
  FAWE_BUILD: '1385'
  FAWE_ASSET: FastAsyncWorldEdit-Paper-2.15.5-SNAPSHOT.jar
  FAWE_URL: https://ci.athion.net/job/FastAsyncWorldEdit/1385/artifact/artifacts/FastAsyncWorldEdit-Paper-2.15.5-SNAPSHOT.jar
  WED_REPO: TWME-TW/WorldEditDisplay

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Refresh and verify addon bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(sed -n 's/^projectVersion=//p' gradle.properties | head -n 1 | tr -d '\r')"
          CURRENT_TAG="v${CURRENT_VERSION}"

          rm -rf bundle work latest
          mkdir -p bundle work latest

          SOURCE_TAG="$BASE_BUNDLE_TAG"
          if gh release view "$CURRENT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && \
             gh release view "$CURRENT_TAG" --repo "$GITHUB_REPOSITORY" --json assets \
               --jq '.assets[].name' | grep -Fxq 'SFL_AddonsNDependencies.zip'; then
            SOURCE_TAG="$CURRENT_TAG"
          fi

          echo "Using addon bundle seed: ${SOURCE_TAG}"
          gh release download "$SOURCE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'SFL_AddonsNDependencies.zip' \
            --dir work
          unzip -q work/SFL_AddonsNDependencies.zip -d bundle

          # Core Slimefun ships separately.
          find bundle -type f -iname 'Slimefun-Legacy*.jar' -print -delete

          # Magic Expansion is intentionally distributed separately from this bundle.
          find bundle -type f -iname '*MagicExpansion*.jar' -delete
          find bundle -type f -iname 'Magic*.zip' -delete
          MAGIC_INFO="$(grep -rl --include='info.yml' '^id:[[:space:]]*Magic[[:space:]]*$' bundle 2>/dev/null | head -n 1 || true)"
          if [[ -n "$MAGIC_INFO" ]]; then
            rm -rf "$(dirname "$MAGIC_INFO")"
          fi
          rm -rf bundle/RykenSlimefunCustomizer/addons/Magic

          # These are deliberately retained custom/manual builds. They have no matching
          # maintained GitHub Release that can be safely substituted automatically.
          manual_bundle_jar() {
            case "$1" in
              'SF_ExtraTools vMODIFIED v0.1.jar'|\
              'SF_HotbarPets-MODIFIED.jar'|\
              'SF_SMG vMODIFIED v0.3.jar'|\
              'SF_betterfarming-Build 1 (git d8b712f).jar'|\
              'SF_Magic8Ball-Dev.jar'|\
              'SF_SoulJars-MODIFIED.jar')
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          mapfile -t SF_REPOS < <(
            gh api --paginate 'users/wickidcow/repos?per_page=100&type=owner' \
              --jq '.[] | select(.archived == false and (.name | startswith("SF_"))) | .name' \
              | sort -u
          )

          if [[ "${#SF_REPOS[@]}" -eq 0 ]]; then
            echo 'No maintained wickidcow SF_ repositories were returned by GitHub.' >&2
            exit 1
          fi

          repo_for_jar() {
            local base="$1"
            local best=""
            local candidate

            case "$base" in
              SF_Glactifun*.jar)
                printf '%s\n' 'SF_Galactifun'
                return 0
                ;;
              SF_SFLWorldEdit_*.jar)
                printf '%s\n' 'WorldEditSlimefun'
                return 0
                ;;
            esac

            for candidate in "${SF_REPOS[@]}"; do
              if [[ "$base" == "${candidate}"*.jar && ${#candidate} -gt ${#best} ]]; then
                best="$candidate"
              fi
            done

            printf '%s\n' "$best"
          }

          latest_jar_asset() {
            local repo="$1"
            local json="$2"
            local asset_count
            local asset

            asset_count="$(jq '[.assets[] | select(.state == "uploaded") | select(.name | endswith(".jar")) | select((.name | ascii_downcase | contains("sources")) | not) | select((.name | ascii_downcase | contains("javadoc")) | not)] | length' "$json")"
            if [[ "$asset_count" -eq 0 ]]; then
              echo "Latest release for ${repo} has no distributable JAR asset." >&2
              return 1
            fi

            asset="$(jq -r --arg prefix "$(basename "$repo")" '
              [.assets[]
                | select(.state == "uploaded")
                | select(.name | endswith(".jar"))
                | select((.name | ascii_downcase | contains("sources")) | not)
                | select((.name | ascii_downcase | contains("javadoc")) | not)
                | select(.name | startswith($prefix))]
              | .[0].name // empty
            ' "$json")"

            if [[ -z "$asset" && "$repo" == 'wickidcow/SF_Galactifun' ]]; then
              asset="$(jq -r '[.assets[] | select(.state == "uploaded") | select(.name | startswith("SF_Glactifun")) | select(.name | endswith(".jar"))] | .[0].name // empty' "$json")"
            fi

            if [[ -z "$asset" && "$repo" == 'wickidcow/WorldEditSlimefun' ]]; then
              asset="$(jq -r '[.assets[] | select(.state == "uploaded") | select(.name | startswith("SF_SFLWorldEdit_")) | select(.name | endswith(".jar"))] | .[0].name // empty' "$json")"
            fi

            if [[ -z "$asset" && "$asset_count" -eq 1 ]]; then
              asset="$(jq -r '[.assets[] | select(.state == "uploaded") | select(.name | endswith(".jar")) | select((.name | ascii_downcase | contains("sources")) | not) | select((.name | ascii_downcase | contains("javadoc")) | not)] | .[0].name' "$json")"
            fi

            if [[ -z "$asset" ]]; then
              echo "Could not choose an unambiguous latest JAR for ${repo}." >&2
              jq -r '.assets[].name' "$json" >&2
              return 1
            fi

            printf '%s\n' "$asset"
          }

          verify_release_download() {
            local repo="$1"
            local json="$2"
            local tag="$3"
            local asset="$4"
            local out_dir="$5"
            local downloaded="${out_dir}/${asset}"
            local expected_digest

            rm -rf "$out_dir"
            mkdir -p "$out_dir"
            gh release download "$tag" --repo "$repo" --pattern "$asset" --dir "$out_dir"
            test -s "$downloaded"
            unzip -tqq "$downloaded"

            expected_digest="$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .digest // empty' "$json")"
            if [[ "$expected_digest" == sha256:* ]]; then
              expected_sha="${expected_digest#sha256:}"
              actual_sha="$(sha256sum "$downloaded" | awk '{print $1}')"
              if [[ "$actual_sha" != "$expected_sha" ]]; then
                echo "GitHub digest mismatch for ${repo} ${asset}" >&2
                echo "expected ${expected_sha}" >&2
                echo "actual   ${actual_sha}" >&2
                exit 1
              fi
            fi
          }

          declare -A SEEN_REPOS=()
          MANUAL_COUNT=0

          while IFS= read -r -d '' jar; do
            base="$(basename "$jar")"
            [[ "$base" == SF_*.jar ]] || continue

            repo_name="$(repo_for_jar "$base")"
            if [[ -z "$repo_name" ]]; then
              if manual_bundle_jar "$base"; then
                echo "MANUAL/PINNED: preserving ${base} (no maintained release mapping)"
                unzip -tqq "$jar"
                MANUAL_COUNT=$((MANUAL_COUNT + 1))
                continue
              fi
              echo "UNVERIFIED SF_-named JAR has no repository mapping: $jar" >&2
              exit 1
            fi

            if [[ -n "${SEEN_REPOS[$repo_name]:-}" ]]; then
              echo "Duplicate JARs map to wickidcow/${repo_name}: ${SEEN_REPOS[$repo_name]} and $jar" >&2
              exit 1
            fi
            SEEN_REPOS[$repo_name]="$jar"

            release_json="latest/${repo_name}.json"
            if ! gh api "repos/wickidcow/${repo_name}/releases/latest" > "$release_json" 2>/dev/null; then
              if manual_bundle_jar "$base"; then
                echo "MANUAL/PINNED: preserving ${base}; wickidcow/${repo_name} has no published GitHub Release"
                unzip -tqq "$jar"
                MANUAL_COUNT=$((MANUAL_COUNT + 1))
                continue
              fi
              echo "wickidcow/${repo_name} has no latest GitHub Release; refusing an unapproved snapshot." >&2
              exit 1
            fi

            tag="$(jq -r '.tag_name' "$release_json")"
            asset="$(latest_jar_asset "wickidcow/${repo_name}" "$release_json")"
            dest_dir="$(dirname "$jar")"
            out_dir="latest/${repo_name}-download"

            echo "${repo_name}: ${base} -> ${asset} (${tag})"
            verify_release_download "wickidcow/${repo_name}" "$release_json" "$tag" "$asset" "$out_dir"

            rm -f "$jar"
            mkdir -p "$dest_dir"
            cp "${out_dir}/${asset}" "$dest_dir/$asset"
          done < <(find bundle -type f -name 'SF_*.jar' -print0)

          # WorldEditDisplay is the second external WorldEdit-related dependency in the bundle.
          WED_OLD="$(find bundle -type f -iname 'WorldEditDisplay-*-paper.jar' -print -quit || true)"
          if [[ -z "$WED_OLD" ]]; then
            echo 'WorldEditDisplay Paper JAR is missing from the bundle.' >&2
            exit 1
          fi
          WED_DIR="$(dirname "$WED_OLD")"
          gh api "repos/${WED_REPO}/releases/latest" > latest/worldeditdisplay.json
          WED_TAG="$(jq -r '.tag_name' latest/worldeditdisplay.json)"
          WED_ASSET="$(jq -r '[.assets[] | select(.state == "uploaded") | select(.name | test("^WorldEditDisplay-.*-paper\\.jar$"))] | .[0].name // empty' latest/worldeditdisplay.json)"
          if [[ -z "$WED_ASSET" ]]; then
            echo 'Latest WorldEditDisplay release has no Paper JAR.' >&2
            exit 1
          fi
          echo "WorldEditDisplay: $(basename "$WED_OLD") -> ${WED_ASSET} (${WED_TAG})"
          verify_release_download "$WED_REPO" latest/worldeditdisplay.json "$WED_TAG" "$WED_ASSET" latest/worldeditdisplay-download
          find bundle -type f -iname 'WorldEditDisplay-*-paper.jar' -delete
          cp "latest/worldeditdisplay-download/${WED_ASSET}" "$WED_DIR/$WED_ASSET"

          # FAWE: pin the exact latest successful Jenkins Paper artifact requested for this bundle.
          FAWE_OLD="$(find bundle -type f -iname 'FastAsyncWorldEdit-Paper-*.jar' -print -quit || true)"
          if [[ -z "$FAWE_OLD" ]]; then
            echo 'FastAsyncWorldEdit Paper JAR is missing from the addon/dependency bundle.' >&2
            exit 1
          fi
          FAWE_DIR="$(dirname "$FAWE_OLD")"
          find bundle -type f -iname 'FastAsyncWorldEdit-Paper-*.jar' -delete

          echo "FAWE: installing Jenkins #${FAWE_BUILD} ${FAWE_ASSET}"
          curl --fail --location --retry 5 --retry-delay 2 \
            --output "latest/${FAWE_ASSET}" \
            "$FAWE_URL"
          test -s "latest/${FAWE_ASSET}"
          # FAWE's shaded JAR intentionally contains overlapping ZIP components; Java can read it normally,
          # while modern Info-ZIP rejects it as a possible zip bomb. Validate with the JDK instead.
          jar tf "latest/${FAWE_ASSET}" >/dev/null
          mkdir -p "$FAWE_DIR"
          cp "latest/${FAWE_ASSET}" "$FAWE_DIR/"

          # Every bundled JAR must at least be structurally readable, including manual pins.
          while IFS= read -r -d '' jar; do
            if [[ "$(basename "$jar")" == "$FAWE_ASSET" ]]; then
              jar tf "$jar" >/dev/null
            else
              unzip -tqq "$jar"
            fi
          done < <(find bundle -type f -name '*.jar' -print0)

          test "$(find bundle -type f -name "$FAWE_ASSET" | wc -l)" -eq 1
          if find bundle -type f -iname 'FastAsyncWorldEdit-Paper-*.jar' ! -name "$FAWE_ASSET" | grep -q .; then
            echo 'A stale FastAsyncWorldEdit Paper JAR remains in the bundle.' >&2
            exit 1
          fi
          test "$(find bundle -type f -name "$WED_ASSET" | wc -l)" -eq 1
          if find bundle -type f -iname 'WorldEditDisplay-*-paper.jar' ! -name "$WED_ASSET" | grep -q .; then
            echo 'A stale WorldEditDisplay Paper JAR remains in the bundle.' >&2
            exit 1
          fi

          if find bundle -type f -iname '*MagicExpansion*.jar' | grep -q . || \
             find bundle -type f -iname 'Magic*.zip' | grep -q . || \
             grep -rl --include='info.yml' '^id:[[:space:]]*Magic[[:space:]]*$' bundle 2>/dev/null | grep -q . || \
             [[ -e bundle/RykenSlimefunCustomizer/addons/Magic ]]; then
            echo 'Magic Expansion content must not be included in the addon bundle.' >&2
            exit 1
          fi
          if find bundle -type f -iname 'Slimefun-Legacy*.jar' | grep -q .; then
            echo 'Slimefun Legacy core JAR must not be included in SFL_AddonsNDependencies.zip.' >&2
            exit 1
          fi

          echo "Manual/pinned legacy JARs retained: ${MANUAL_COUNT}"
          echo 'Final JAR inventory:'
          find bundle -type f -name '*.jar' -printf '%P\n' | sort

          rm -f SFL_AddonsNDependencies.zip
          (cd bundle && zip -qr ../SFL_AddonsNDependencies.zip .)

          unzip -Z1 SFL_AddonsNDependencies.zip | grep -F "$FAWE_ASSET"
          unzip -Z1 SFL_AddonsNDependencies.zip | grep -F "$WED_ASSET"
          if unzip -Z1 SFL_AddonsNDependencies.zip | grep -Ei '(^|/)Slimefun-Legacy[^/]*\.jar$'; then
            echo 'Slimefun Legacy core JAR found in final addon/dependency archive.' >&2
            exit 1
          fi
          if unzip -l SFL_AddonsNDependencies.zip | grep -Ei 'MagicExpansion.*\.jar|RykenSlimefunCustomizer/addons/Magic/|Magic[^/]*\.zip'; then
            echo 'Magic Expansion or Magic addon content found in final archive.' >&2
            exit 1
          fi

          sha256sum SFL_AddonsNDependencies.zip

      - name: Publish refreshed bundle to current release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(sed -n 's/^projectVersion=//p' gradle.properties | head -n 1 | tr -d '\r')"
          CURRENT_TAG="v${CURRENT_VERSION}"

          if gh release view "$CURRENT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$CURRENT_TAG" SFL_AddonsNDependencies.zip \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "Release $CURRENT_TAG does not exist yet; reproducible release will publish the validated bundle first."
          fi

      - name: Upload refreshed bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: Slimefun-Legacy-Addons
          path: SFL_AddonsNDependencies.zip
          archive: false
          if-no-files-found: error

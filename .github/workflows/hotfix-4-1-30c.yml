name: Apply Slimefun Legacy 4.1.30C Hotfix

on:
  push:
    branches:
      - "feature/adventurers-curios-expansion"

jobs:
  apply-hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/adventurers-curios-expansion
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Apply 4.1.30C source patch
        run: python3 scripts/apply_4130c_hotfix.py

      - name: Format and build
        run: |
          chmod +x gradlew
          ./gradlew spotlessApply --no-daemon
          ./gradlew clean build --no-daemon
          JAR="$(find build/libs -name 'Slimefun-4.1.30C.jar' -print -quit)"
          test -n "$JAR"
          python3 scripts/check_bytecode_target.py "$JAR" --expected-java 21

      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/SlimefunItems.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/setup/SlimefunItemSetup.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/armor/AdvancedHazmatArmorPiece.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlus.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusRuntimeEffects.java
          git diff --cached --exit-code && exit 0
          git commit -m "feat(curios): ship 4.1.30C safety and armor fixes"
          git push origin HEAD:feature/adventurers-curios-expansion

name: Legacy Doctor Recovery Validation

on:
  push:
    branches: ['work/legacy-doctor-recovery']

permissions:
  contents: read

concurrency:
  group: doctor-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Apply the exact reviewed diagnostic patch
        run: |
          set -euo pipefail
          mkdir -p audit-evidence
          python3 - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          transport = Path('.audit/doctor-recovery-transport.gz').read_bytes()
          assert blob(transport) == '1c3121ae74d9d08db303398a91253a2088528506'
          text = base64.b64encode(transport).decode()
          assert text.count('LOKKzuSdg') == text.count('AV9tbGG85') == 1
          text = text.replace('LOKKzuSdg', 'LOKzuSdg').replace('AV9tbGG85', 'AV9tbG85')
          text += '=' * (-len(text) % 4)
          packed = base64.b64decode(text)
          assert blob(packed) == 'cac0b39008ab101b84b8727b789f7040f81f036c'
          changes = json.loads(gzip.decompress(packed))
          assert len(changes) == 10
          prepared = {}
          for change in changes:
              path = Path(change['path'])
              assert not path.is_absolute() and '..' not in path.parts
              assert str(path).startswith(('src/main/java/', 'src/test/java/'))
              if change['sha'] is None:
                  assert not path.exists(), path
                  output = change['content']
              else:
                  assert blob(path.read_bytes()) == change['sha'], (path, blob(path.read_bytes()))
                  output = path.read_text()
                  for before, after in change['replacements']:
                      assert output.count(before) == 1, (path, before)
                      output = output.replace(before, after)
              prepared[path] = output.encode()
          for path, output in prepared.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(output)
              print('REVIEWED_SOURCE', blob(output), path)
          helper = Path('src/main/java/io/github/thebusybiscuit/slimefun4/core/commands/InventoryRecoveryDiagnostics.java')
          assert blob(helper.read_bytes()) == 'e12bab6b58607dc0fc717d10e9396a78f21580ed'
          text = helper.read_text()
          replacements = (
              ('import io.github.bakedlibs.dough.common.ChatColors;', 'import net.kyori.adventure.text.serializer.legacy.LegacyComponentSerializer;'),
              ('sender.sendMessage(ChatColors.color(text));', 'sender.sendMessage(LegacyComponentSerializer.legacyAmpersand().deserialize(text));'),
              ("|| Character.getType(character) == Character.FORMAT ? '?' : character);", "|| Character.getType(character) == Character.FORMAT\n                    || Character.getType(character) == Character.LINE_SEPARATOR\n                    || Character.getType(character) == Character.PARAGRAPH_SEPARATOR ? '?' : character);"),
          )
          for before, after in replacements:
              assert text.count(before) == 1, before
              text = text.replace(before, after)
          helper.write_text(text)
          assert blob(helper.read_bytes()) == 'c4f242d0ac460284d585f916332b67528d4c4f37'
          test = Path('src/test/java/io/github/thebusybiscuit/slimefun4/core/commands/InventoryRecoveryDiagnosticsTest.java')
          assert blob(test.read_bytes()) == 'fe5f3e4e0de3b31be3b6dfa0bcb36304061498f7'
          text = test.read_text()
          replacements = (
              ('import org.bukkit.command.CommandSender;', 'import net.kyori.adventure.text.Component;\nimport net.kyori.adventure.text.serializer.plain.PlainTextComponentSerializer;\nimport org.bukkit.command.CommandSender;'),
              ('String original = "world&a\\u00a7c\\n\\t\\u202e;1:64:2";', 'String original = "world&a\\u00a7c\\n\\t\\u202e\\u2028\\u2029;1:64:2";'),
              ('report.contains("world?a?c???;1:64:2")', 'report.contains("world?a?c?????;1:64:2")'),
              ('                            for (Object value : values) {\n                                if (value instanceof String text) messages.add(text);\n                                else if (value instanceof String[] lines) messages.addAll(List.of(lines));\n                            }',
               '                            assertEquals(1, values.length);\n                            Component message = assertInstanceOf(Component.class, values[0]);\n                            messages.add(PlainTextComponentSerializer.plainText().serialize(message));'),
          )
          for before, after in replacements:
              assert text.count(before) == 1, before
              text = text.replace(before, after)
          test.write_text(text)
          assert blob(test.read_bytes()) == 'ecfb9b615ac6719f7298a032d04b5a3d638e7d4f'
          Path('audit-evidence/paths.json').write_text(json.dumps([str(path) for path in prepared]))
          PY
          git diff --check
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Run all source compatibility gates
        run: |
          set -euo pipefail
          python3 scripts/verify_legacy.py . 2>&1 | tee audit-evidence/invariants.log
      - name: Build the real project and run the complete test suite
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew spotlessApply --no-daemon
          ./gradlew clean --console=plain --no-daemon
          mkdir -p build/reports
          ./gradlew build -PslimefunDeprecationReport=true --console=plain --no-daemon 2>&1 | tee build/reports/deprecation-compile.log
          python3 scripts/summarize_deprecations.py build/reports/deprecation-compile.log --fail-on-warnings --require-successful-build
          git diff --check
      - name: Require actual Doctor and recovery tests
        run: |
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          totals = dict.fromkeys(('tests', 'failures', 'errors', 'skipped'), 0)
          suites = {}
          for path in Path('build/test-results/test').glob('TEST-*.xml'):
              suite = ET.parse(path).getroot()
              suites[suite.get('name')] = suite
              for key in totals:
                  totals[key] += int(suite.get(key, '0'))
          for name, count in (
              ('com.xzavier0722.mc.plugin.slimefun4.storage.controller.InventoryRecoverySnapshotTest', 12),
              ('io.github.thebusybiscuit.slimefun4.core.commands.InventoryRecoveryDiagnosticsTest', 10),
              ('com.xzavier0722.mc.plugin.slimefun4.storage.controller.InventoryReadFailureTest', 10),
          ):
              suite = suites[name]
              assert int(suite.get('tests', '0')) == count, suite.attrib
              assert all(int(suite.get(key, '0')) == 0 for key in ('failures', 'errors', 'skipped')), suite.attrib
              print('Required recovery suite:', suite.attrib)
          assert totals['failures'] == totals['errors'] == 0, totals
          print('Full JUnit reported totals:', totals)
          Path('audit-evidence/results.json').write_text(json.dumps(totals, indent=2))
          PY
      - name: Preserve only the validated source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          manifest = {}
          for name in json.loads(Path('audit-evidence/paths.json').read_text()):
              data = Path(name).read_bytes()
              sha = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              body = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'})
              result = subprocess.run(['gh', 'api', '--method', 'POST', f"repos/{os.environ['GITHUB_REPOSITORY']}/git/blobs", '--input', '-', '--jq', '.sha'], input=body, text=True, capture_output=True, check=True)
              assert result.stdout.strip() == sha, name
              manifest[name] = sha
              print('VALIDATED_BLOB', sha, name)
          Path('audit-evidence/validated-blobs.json').write_text(json.dumps(manifest, indent=2))
          PY
      - name: Save source and test evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = Path('audit-evidence/paths.json')
          if manifest.exists():
              for name in json.loads(manifest.read_text()):
                  target = Path('audit-evidence/tested-source') / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(Path(name).read_bytes())
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: doctor-recovery-evidence
          retention-days: 14
          path: |
            audit-evidence/
            build/reports/deprecation-compile.log
            build/reports/deprecations.md
            build/test-results/test/TEST-*.xml
          if-no-files-found: warn

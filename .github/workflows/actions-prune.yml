name: Legacy JAR Actions Prune
on:
  push:
    paths:
      - ".github/workflows/actions-prune.yml"
permissions:
  actions: write
  contents: read
jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      CURRENT_RUN_ID: ${{ github.run_id }}
      KEEP_NAME: "Build Slimefun Legacy"
    steps:
      - name: Keep newest successful primary JAR build only
        shell: bash
        run: |
          set -euo pipefail
          list_runs() {
            gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | [.id,.status,(.conclusion//""),(.name//""),(.created_at//"")] | @tsv'
          }

          if [[ -n "$KEEP_NAME" ]]; then
            for _ in $(seq 1 80); do
              active=0
              while IFS=$'\t' read -r id status conclusion name created; do
                if [[ "$name" == "$KEEP_NAME" && "$status" != "completed" ]]; then
                  active=1
                  break
                fi
              done < <(list_runs)
              [[ "$active" == 0 ]] && break
              sleep 15
            done
          fi

          keep_id=""
          if [[ -n "$KEEP_NAME" ]]; then
            while IFS=$'\t' read -r id status conclusion name created; do
              if [[ "$name" == "$KEEP_NAME" && "$status" == "completed" && "$conclusion" == "success" ]]; then
                keep_id="$id"
                break
              fi
            done < <(list_runs)
          fi

          echo "Primary workflow: $KEEP_NAME"
          echo "Keeping run: ${keep_id:-none}"

          while IFS=$'\t' read -r id status conclusion name created; do
            [[ -z "$id" || "$id" == "$CURRENT_RUN_ID" || "$id" == "$keep_id" ]] && continue
            if [[ "$status" != "completed" ]]; then
              gh api --method POST "repos/$REPO/actions/runs/$id/force-cancel" >/dev/null 2>&1 \
                || gh api --method POST "repos/$REPO/actions/runs/$id/cancel" >/dev/null 2>&1 \
                || true
            fi
          done < <(list_runs)

          sleep 15

          while IFS=$'\t' read -r id status conclusion name created; do
            [[ -z "$id" || "$id" == "$CURRENT_RUN_ID" || "$id" == "$keep_id" ]] && continue
            gh api --method DELETE "repos/$REPO/actions/runs/$id" >/dev/null 2>&1 || true
          done < <(list_runs)

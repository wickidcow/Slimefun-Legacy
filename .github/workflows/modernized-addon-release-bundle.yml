name: Validate Modernized Legacy Addons

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/modernized-addon-release-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-legacy:
    name: Legacy - ${{ matrix.addon }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - addon: ExtraTools
            repo: wickidcow/SF_ExtraTools
            ref: master
            jar: SF_ExtraTools1.2.1.jar
          - addon: HotbarPets
            repo: wickidcow/SF_HotbarPets
            ref: master
            jar: SF_HotbarPets1.0.0.jar
          - addon: SoulJars
            repo: wickidcow/SF_SoulJars
            ref: master
            jar: SF_SoulJars1.0.0.jar
          - addon: SMG
            repo: wickidcow/SF_SMG
            ref: master
            jar: SF_SMG1.0.1.jar
          - addon: BetterFarming
            repo: wickidcow/SF_BetterFarming
            ref: main
            jar: SF_BetterFarming1.0.0.jar
          - addon: Magic8Ball
            repo: wickidcow/SF_Magic8Ball
            ref: master
            jar: SF_Magic8Ball1.0.0.jar
          - addon: SlimyTreeTaps
            repo: wickidcow/SF_SlimyTreeTaps
            ref: master
            jar: SF_SlimyTreeTaps1.0.2.jar
    steps:
      - name: Checkout Slimefun Legacy
        uses: actions/checkout@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Publish current Slimefun Legacy API locally
        run: |
          chmod +x gradlew
          ./gradlew publishToMavenLocal -PprojectVersion=MODERNIZED-ADDONS-CI --no-daemon
      - name: Checkout addon
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: addon
      - name: Validate English-only and dependency policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          roots = [Path('addon/src'), Path('addon/README.md'), Path('addon/pom.xml')]
          bad=[]
          for root in roots:
              if not root.exists():
                  continue
              paths=[root] if root.is_file() else [p for p in root.rglob('*') if p.is_file()]
              for path in paths:
                  text=path.read_text(encoding='utf-8', errors='ignore')
                  if re.search(r'[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]', text):
                      bad.append(f'CJK text: {path}')
                  if re.search(r'guizhan', text, re.I):
                      bad.append(f'Forbidden dependency reference: {path}')
          if bad:
              print('\n'.join(bad))
              sys.exit(1)
          PY
      - name: Build against Slimefun Legacy and Paper 26.2+
        working-directory: addon
        run: >-
          mvn -B clean verify
          -Dpaper.version='[26.2.build,)'
          -Dslimefun.groupId='com.github.slimefun'
          -Dslimefun.artifactId='Slimefun'
          -Dslimefun.version='MODERNIZED-ADDONS-CI'
      - name: Verify JAR contents
        shell: bash
        run: |
          set -euo pipefail
          JAR="addon/target/${{ matrix.jar }}"
          test -s "$JAR"
          unzip -tqq "$JAR"
          jar tf "$JAR" | grep -Fxq 'plugin.yml'
          if jar tf "$JAR" | grep -Eqi '(^|/)guizhan|guizhanlib'; then
            echo 'Forbidden utility-library classes are bundled in the addon JAR.' >&2
            exit 1
          fi
          if jar tf "$JAR" | grep -q '^io/github/thebusybiscuit/slimefun4/'; then
            echo 'Slimefun core classes must not be bundled into addon JARs.' >&2
            exit 1
          fi
          mkdir -p dist
          cp "$JAR" "dist/${{ matrix.jar }}"
          sha256sum "dist/${{ matrix.jar }}"
      - name: Upload validated addon JAR
        uses: actions/upload-artifact@v6
        with:
          name: addon-${{ matrix.addon }}
          path: dist/${{ matrix.jar }}
          if-no-files-found: error

  portable-api:
    name: ${{ matrix.target.name }} - ${{ matrix.addon.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        addon:
          - { name: ExtraTools, repo: wickidcow/SF_ExtraTools, ref: master }
          - { name: HotbarPets, repo: wickidcow/SF_HotbarPets, ref: master }
          - { name: SoulJars, repo: wickidcow/SF_SoulJars, ref: master }
          - { name: SMG, repo: wickidcow/SF_SMG, ref: master }
          - { name: BetterFarming, repo: wickidcow/SF_BetterFarming, ref: main }
          - { name: Magic8Ball, repo: wickidcow/SF_Magic8Ball, ref: master }
          - { name: SlimyTreeTaps, repo: wickidcow/SF_SlimyTreeTaps, ref: master }
        target:
          - { name: Gugu-2026.1, group: com.github.SlimefunGuguProject, artifact: Slimefun4, version: '2026.1' }
          - { name: Slimefun4-RC37, group: com.github.Slimefun, artifact: Slimefun4, version: RC-37 }
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ matrix.addon.repo }}
          ref: ${{ matrix.addon.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build compatibility target
        run: >-
          mvn -B clean verify
          -Dpaper.version='[26.2.build,)'
          -Dslimefun.groupId='${{ matrix.target.group }}'
          -Dslimefun.artifactId='${{ matrix.target.artifact }}'
          -Dslimefun.version='${{ matrix.target.version }}'

  united:
    name: United - ${{ matrix.addon.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        addon:
          - { name: ExtraTools, repo: wickidcow/SF_ExtraTools, ref: master }
          - { name: HotbarPets, repo: wickidcow/SF_HotbarPets, ref: master }
          - { name: SoulJars, repo: wickidcow/SF_SoulJars, ref: master }
          - { name: SMG, repo: wickidcow/SF_SMG, ref: master }
          - { name: BetterFarming, repo: wickidcow/SF_BetterFarming, ref: main }
          - { name: Magic8Ball, repo: wickidcow/SF_Magic8Ball, ref: master }
          - { name: SlimyTreeTaps, repo: wickidcow/SF_SlimyTreeTaps, ref: master }
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ matrix.addon.repo }}
          ref: ${{ matrix.addon.ref }}
          path: addon
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/checkout@v6
        with:
          repository: Slimefun-United/Slimefun-United
          path: united
      - name: Publish Slimefun United locally
        working-directory: united
        run: mvn -B -DskipTests install
      - name: Build addon against Slimefun United
        working-directory: addon
        run: >-
          mvn -B clean verify
          -Dpaper.version='[26.2.build,)'
          -Dslimefun.groupId='io.github.slimefun_united'
          -Dslimefun.artifactId='slimefun-united'
          -Dslimefun.version='4.10-SNAPSHOT'

  bundle:
    name: Build AlbionMC addon set and refresh release bundle
    needs: [build-legacy, portable-api, united]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: addon-*
          path: release-jars
          merge-multiple: true
      - name: Verify seven replacement JARs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find release-jars -maxdepth 1 -type f -name '*.jar' | sort)
          test "${#jars[@]}" -eq 7
          printf '%s\n' "${jars[@]}"
          for jar in "${jars[@]}"; do unzip -tqq "$jar"; done
      - name: Download current Slimefun Legacy addon bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p base bundle
          gh release download v4.1.48 --pattern 'SFL_AddonsNDependencies.zip' --dir base
          unzip -q base/SFL_AddonsNDependencies.zip -d bundle
      - name: Replace legacy manual/pinned builds
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            'bundle/SF_ExtraTools vMODIFIED v0.1.jar' \
            'bundle/SF_HotbarPets-MODIFIED.jar' \
            'bundle/SF_SoulJars-MODIFIED.jar' \
            'bundle/SF_SMG vMODIFIED v0.3.jar' \
            'bundle/SF_betterfarming-Build 1 (git d8b712f).jar' \
            'bundle/SF_Magic8Ball-Dev.jar' \
            'bundle/SF_SlimyTreeTaps1.0.1.jar'
          cp release-jars/*.jar bundle/
          mapfile -t jars < <(find bundle -maxdepth 1 -type f -name '*.jar' | sort)
          if [ "${#jars[@]}" -ne 41 ]; then
            echo "Expected 41 addon/dependency JARs, found ${#jars[@]}" >&2
            printf '%s\n' "${jars[@]}" >&2
            exit 1
          fi
          for jar in "${jars[@]}"; do unzip -tqq "$jar"; done
      - name: Build bundle and checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          (cd bundle && zip -q -9 ../SFL_AddonsNDependencies.zip *.jar)
          : > SFL_AddonsNDependencies.sha256
          while IFS= read -r file; do
            sha256sum "bundle/$file" | sed 's#  bundle/#  #'
          done < <(find bundle -maxdepth 1 -type f -name '*.jar' -printf '%f\n' | sort) > SFL_AddonsNDependencies.sha256
          test "$(wc -l < SFL_AddonsNDependencies.sha256)" -eq 41
          sha256sum SFL_AddonsNDependencies.zip
          cat SFL_AddonsNDependencies.sha256
      - name: Publish refreshed v4.1.48 bundle assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v4.1.48 SFL_AddonsNDependencies.zip SFL_AddonsNDependencies.sha256 --clobber
      - name: Upload changed JAR set
        uses: actions/upload-artifact@v6
        with:
          name: AlbionMC-modernized-addon-jars
          path: release-jars/*.jar
          if-no-files-found: error
      - name: Upload refreshed addon bundle
        uses: actions/upload-artifact@v6
        with:
          name: SFL_AddonsNDependencies
          path: |
            SFL_AddonsNDependencies.zip
            SFL_AddonsNDependencies.sha256
          if-no-files-found: error

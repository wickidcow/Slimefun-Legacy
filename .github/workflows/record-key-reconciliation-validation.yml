name: Record Key Reconciliation Validation
on:
  push:
    branches: ['audit/record-key-reconciliation-20261002']
    paths: ['.github/workflows/record-key-reconciliation-validation.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Preserve invariants and prepare the exact original control
        run: |
          set -euo pipefail
          mkdir -p evidence/source evidence/negative evidence/corrected
          python3 scripts/verify_legacy.py . > evidence/source-invariants.log 2>&1
          chmod +x gradlew
          ./gradlew spotlessApply --no-daemon > evidence/format.log 2>&1
          FILE=src/main/java/com/xzavier0722/mc/plugin/slimefun4/storage/common/RecordKey.java
          cp "$FILE" "$RUNNER_TEMP/corrected-RecordKey.java"
          git fetch --depth=1 origin a21f77de30831d3ca69ef92b137771e115014376
          git show a21f77de30831d3ca69ef92b137771e115014376:"$FILE" > "$FILE"
      - name: Require assertion failures from the pre-correction subview
        run: |
          set -euo pipefail
          STATUS=0
          ./gradlew test --tests '*RecordKeyConditionViewTest' --no-daemon --no-build-cache --no-configuration-cache > evidence/negative.log 2>&1 || STATUS=$?
          test "$STATUS" -ne 0
          cp build/test-results/test/TEST-*.xml evidence/negative/
          python3 - <<'PY'
          import json,xml.etree.ElementTree as ET
          from pathlib import Path
          roots=[ET.parse(p).getroot() for p in Path('evidence/negative').glob('TEST-*.xml')]
          totals={k:sum(int(r.attrib[k]) for r in roots) for k in ['tests','failures','errors','skipped']}
          assert totals==dict(tests=8,failures=4,errors=0,skipped=0),totals
          for root in roots:
              for failure in root.iter('failure'):
                  assert failure.get('type')=='org.opentest4j.AssertionFailedError',failure.attrib
          Path('evidence/negative-result.json').write_text(json.dumps(totals,indent=2)+'\n')
          PY
      - name: Restore the fix and verify all RecordKey tests
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/corrected-RecordKey.java" src/main/java/com/xzavier0722/mc/plugin/slimefun4/storage/common/RecordKey.java
          ./gradlew test --tests '*RecordKey*Test' --no-daemon --no-build-cache --no-configuration-cache > evidence/corrected.log 2>&1
          cp build/test-results/test/TEST-*.xml evidence/corrected/
          python3 - <<'PY'
          import json,xml.etree.ElementTree as ET
          from pathlib import Path
          roots=[ET.parse(p).getroot() for p in Path('evidence/corrected').glob('TEST-*.xml')]
          totals={k:sum(int(r.attrib[k]) for r in roots) for k in ['tests','failures','errors','skipped']}
          assert totals==dict(tests=40,failures=0,errors=0,skipped=0),totals
          Path('evidence/corrected-result.json').write_text(json.dumps(totals,indent=2)+'\n')
          PY
          cp src/test/java/com/xzavier0722/mc/plugin/slimefun4/storage/common/RecordKeyConditionViewTest.java evidence/source/
      - name: Prepare metadata without changing implementation or addon pins
        run: |
          set -euo pipefail
          git restore .
          python3 audit-release/prepare_record_release.py
          python3 scripts/verify_legacy.py . > evidence/release-invariants.log 2>&1
          git diff --check
      - name: Stage verified source blobs without updating branches or publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          paths=json.loads(Path('evidence/release-paths.json').read_text())
          records={}
          for name in paths+['src/test/java/com/xzavier0722/mc/plugin/slimefun4/storage/common/RecordKeyConditionViewTest.java']:
              path=Path('evidence/source/RecordKeyConditionViewTest.java') if name.startswith('src/test/') else Path(name)
              data=path.read_bytes()
              sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              result=subprocess.run(['gh','api','--method','POST','repos/wickidcow/Slimefun-Legacy/git/blobs','--input','-'],input=json.dumps(dict(content=data.decode(),encoding='utf-8')),capture_output=True,text=True,check=True)
              assert json.loads(result.stdout)['sha']==sha
              records[name]=sha
          Path('evidence/reviewed-blobs.json').write_text(json.dumps(records,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: record-key-reconciliation-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: error

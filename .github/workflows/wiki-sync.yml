name: Publish Slimefun Legacy Wiki

on:
  push:
    branches:
      - master
    paths:
      - 'docs/wiki/**'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slimefun-legacy-wiki
  cancel-in-progress: true

env:
  # Pinned so the Legacy wiki does not silently drift when upstream documentation changes.
  UPSTREAM_WIKI_REPOSITORY: Slimefun/Wiki
  UPSTREAM_WIKI_REF: 43bf127a5033bbb74fdcb5e51e1eb6f31dd7131c

jobs:
  publish:
    name: Build and sync GitHub Wiki
    runs-on: ubuntu-latest

    steps:
      - name: Check out Slimefun Legacy
        uses: actions/checkout@v4

      - name: Validate Legacy wiki overrides
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/wiki/Home.md
          test -f docs/wiki/_Sidebar.md
          test -f docs/wiki/_Footer.md
          test -f docs/wiki/Upstream-Wiki-Attribution.md

      - name: Build complete Legacy wiki
        shell: bash
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          UPSTREAM_DIR="${RUNNER_TEMP}/slimefun-upstream-wiki"
          BUILD_DIR="${RUNNER_TEMP}/slimefun-legacy-wiki-build"
          rm -rf "${UPSTREAM_DIR}" "${BUILD_DIR}"

          git clone --quiet "https://github.com/${UPSTREAM_WIKI_REPOSITORY}.git" "${UPSTREAM_DIR}"
          git -C "${UPSTREAM_DIR}" checkout --quiet "${UPSTREAM_WIKI_REF}"

          mkdir -p "${BUILD_DIR}"
          rsync -a "${UPSTREAM_DIR}/pages/" "${BUILD_DIR}/"

          if [ -d "${UPSTREAM_DIR}/images" ]; then
            mkdir -p "${BUILD_DIR}/images"
            rsync -a "${UPSTREAM_DIR}/images/" "${BUILD_DIR}/images/"
          fi

          # Legacy-maintained pages always win. Remove case-only upstream collisions first.
          python3 - "${BUILD_DIR}" "docs/wiki" <<'PY'
          from pathlib import Path
          import sys

          build = Path(sys.argv[1])
          overrides = Path(sys.argv[2])
          override_names = {p.name.lower() for p in overrides.glob('*.md')}
          for page in build.glob('*.md'):
              if page.name.lower() in override_names:
                  page.unlink()
          PY

          rsync -a docs/wiki/ "${BUILD_DIR}/"

          # Keep every internal page link inside GitHub's rendered Wiki experience.
          # GitHub's Wiki URLs do not use the source .md suffix. Using full Wiki URLs
          # also guarantees that sidebar/footer/navigation remain visible after a click.
          python3 - "${BUILD_DIR}" "${TARGET_REPOSITORY}" <<'PY'
          from pathlib import Path
          import re
          import sys
          from urllib.parse import unquote

          root = Path(sys.argv[1])
          repository = sys.argv[2]
          target_wiki = f"https://github.com/{repository}/wiki/"

          pages = {
              page.stem.casefold(): page.stem
              for page in root.glob('*.md')
          }

          replacements = {
              "https://github.com/Slimefun/Slimefun4/wiki/": target_wiki,
              "https://raw.githubusercontent.com/TheBusyBiscuit/Slimefun4-Wiki/master/images/": "images/",
              "https://raw.githubusercontent.com/Slimefun/Wiki/master/images/": "images/",
          }

          markdown_link = re.compile(
              r'(?<!!)\[([^\]]+)\]\(([^)\s]+)(?:\s+["\'][^"\']*["\'])?\)'
          )
          html_href = re.compile(r'(<a\s+[^>]*href=["\'])([^"\']+)(["\'])', re.IGNORECASE)

          def wiki_target(target: str):
              if target.startswith(("#", "mailto:", "tel:")):
                  return None

              # Already points to this Wiki: remove an accidental .md suffix.
              if target.startswith(target_wiki):
                  suffix = target[len(target_wiki):]
                  path, sep, fragment = suffix.partition('#')
                  if path.casefold().endswith('.md'):
                      path = path[:-3]
                  return target_wiki + path + (("#" + fragment) if sep else "")

              # External links stay external.
              if target.startswith(("http://", "https://", "//")):
                  return None

              path, sep, fragment = target.partition('#')
              path = path.removeprefix('./')
              decoded = unquote(path)

              if decoded.casefold().endswith('.md'):
                  decoded = decoded[:-3]

              # Only rewrite a relative target when it is an actual published Wiki page.
              key = decoded.casefold()
              if key in pages:
                  rendered = target_wiki + pages[key]
                  if sep:
                      rendered += "#" + fragment
                  return rendered

              return None

          def replace_markdown(match):
              label, target = match.group(1), match.group(2)
              rendered = wiki_target(target)
              if rendered is None:
                  return match.group(0)
              return f"[{label}]({rendered})"

          def replace_html(match):
              rendered = wiki_target(match.group(2))
              if rendered is None:
                  return match.group(0)
              return f"{match.group(1)}{rendered}{match.group(3)}"

          for page in root.rglob('*.md'):
              text = page.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              text = markdown_link.sub(replace_markdown, text)
              text = html_href.sub(replace_html, text)
              page.write_text(text, encoding='utf-8')

          # Guard against the regression that caused links to open source-like .md pages.
          offenders = []
          for page in root.glob('*.md'):
              text = page.read_text(encoding='utf-8')
              for match in markdown_link.finditer(text):
                  target = match.group(2)
                  if target.startswith(("http://", "https://", "#", "mailto:", "tel:")):
                      continue
                  path = unquote(target.partition('#')[0].removeprefix('./'))
                  if path.casefold().endswith('.md') and path[:-3].casefold() in pages:
                      offenders.append(f"{page.name}: {target}")

          if offenders:
              raise SystemExit(
                  "Local .md Wiki links remain and would bypass rendered navigation:\n"
                  + "\n".join(offenders[:50])
              )
          PY

          test -f "${BUILD_DIR}/Home.md"
          test -f "${BUILD_DIR}/_Sidebar.md"
          test -f "${BUILD_DIR}/_Footer.md"
          test -f "${BUILD_DIR}/Elemental-Staves.md"
          test -f "${BUILD_DIR}/Weapons.md"
          test -f "${BUILD_DIR}/Basic-Machines.md"
          test -f "${BUILD_DIR}/Electric-Machines.md"

          echo "WIKI_BUILD_DIR=${BUILD_DIR}" >> "${GITHUB_ENV}"
          echo "Built $(find "${BUILD_DIR}" -maxdepth 1 -name '*.md' | wc -l) wiki pages."

      - name: Publish wiki
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          WIKI_DIR="${RUNNER_TEMP}/slimefun-legacy-wiki"
          rm -rf "${WIKI_DIR}"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "${WIKI_DIR}"
          rsync -a --delete --exclude='.git/' "${WIKI_BUILD_DIR}/" "${WIKI_DIR}/"

          cd "${WIKI_DIR}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
            exit 0
          fi

          git commit -m "Sync Legacy wiki from ${GITHUB_SHA::7}"
          git push origin HEAD

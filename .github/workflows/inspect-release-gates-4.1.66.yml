name: Inspect Exact 4.1.66 Gate State
on:
  push:
    branches: ['audit/finalize-4.1.66-20261002']
    paths: ['.github/workflows/inspect-release-gates-4.1.66.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read complete exact-source workflow and child-job state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import collections,json,subprocess
          from pathlib import Path
          def api(path):return json.loads(subprocess.check_output(['gh','api',path],timeout=60))
          root='repos/wickidcow/Slimefun-Legacy'
          jobs=[]
          for page in (1,2):
              data=api(f'{root}/actions/runs/37064779939/jobs?per_page=100&page={page}&filter=latest')
              jobs+=data['jobs']
          assert len(jobs)==data['total_count']
          assert all(j['head_sha']=='22ae22c4e32fd3b086565922f4427206d0f4b065' for j in jobs)
          rows=[{k:j.get(k) for k in ('id','name','status','conclusion','started_at','completed_at')} for j in jobs]
          active=[j for j in rows if j['status']!='completed' or j['conclusion'] not in ('success','skipped')]
          result=dict(run=37064779939,counts=dict(collections.Counter((j['conclusion'] or j['status']) for j in rows)),outstanding=active)
          Path('evidence/summary.json').write_text(json.dumps(result,indent=2)+'\n')
          Path('evidence/all-jobs.json').write_text(json.dumps(rows,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: exact-master-gate-state-4.1.66
          path: evidence/
          retention-days: 7
          if-no-files-found: error

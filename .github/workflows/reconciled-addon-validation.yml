name: Reconciled Addon Preservation Validation

on:
  push:
    branches: ['work/reconciled-addon-validation-20261001']
    paths: ['.github/workflows/reconciled-addon-validation.yml']

permissions:
  contents: write
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Reconcile the reviewed WorldEdit gate without losing revision97 changes
        run: |
          set -euo pipefail
          mkdir -p evidence
          git fetch --depth=2 origin 7d6e06b4f7dad9060453bc4597df6225dee503fa
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          parent = '7c8320828f7d0f98e80246f2766e7814a8a15eca'
          candidate = '7d6e06b4f7dad9060453bc4597df6225dee503fa'
          names = ['.github/workflows/paper-26.3-full-stack.yml', 'docs/worldedit-runtime-validation.md',
              'scripts/full_stack_runtime_smoke.sh', 'scripts/prepare_worldedit_runtime.py',
              'scripts/test_prepare_worldedit_runtime.py', 'scripts/test_worldedit_java_selection.py',
              'scripts/test_worldedit_stack_integration.py']
          for name in names:
              old = subprocess.run(['git','show',f'{parent}:{name}'],capture_output=True)
              path = Path(name)
              if old.returncode == 0:
                  assert path.read_bytes() == old.stdout, f'Concurrent change requires review: {name}'
              else:
                  assert not path.exists(), f'Unexpected existing file: {name}'
              data = subprocess.check_output(['git','show',f'{candidate}:{name}'])
              path.parent.mkdir(parents=True,exist_ok=True); path.write_bytes(data)
          path = Path('compatibility/sfl-addon-release-matrix.json')
          manifest = json.loads(path.read_text())
          assert manifest['bundle_revision'] == 97 and len(manifest['addons']) == 45
          changes = {
              'wickidcow/SF_FNAmplifications': '2eb07e7bca82d4d7621224e6f9e4942481e7e8f7',
              'wickidcow/SF_LiteXpansion': '4dc69e1ba835b897e2fa38b9eb54bcbcee644abf',
              'wickidcow/SF_MagicExpansion': '61a0ccfa67dcf7c74ffc2aa67bcc2bdfdbbd358e'}
          before = {a['repository']:a['source_commit'] for a in manifest['addons']}
          for addon in manifest['addons']:
              if addon['repository'] in changes:
                  addon['source_commit'] = changes[addon['repository']]
          after = {a['repository']:a['source_commit'] for a in manifest['addons']}
          assert {k for k in before if before[k] != after[k]} == set(changes)
          manifest['bundle_revision'] = 98
          path.write_text(json.dumps(manifest,indent=2)+'\n')
          Path('evidence/integration-files.json').write_text(json.dumps(names+[str(path)],indent=2))
          Path('evidence/selected-addons.json').write_text(json.dumps(changes,indent=2))
          PY
          git diff --check
          python3 -m unittest discover -s scripts -p 'test_*worldedit*.py' -v > evidence/worldedit-tests.log 2>&1
          python3 scripts/verify_legacy.py . > evidence/core-invariants.log 2>&1
      - name: Supply only the exact tested revision97 core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, subprocess, zipfile
          from pathlib import Path
          raw = subprocess.run(['gh','api','repos/wickidcow/Slimefun-Legacy/actions/artifacts/11138864515/zip'],check=True,capture_output=True,timeout=120).stdout
          assert hashlib.sha256(raw).hexdigest() == 'a7941fea94a3d02b4fea402100323e0dbc4b03c45da3f631c87c9b9a0ff9a8de'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              names = [n for n in z.namelist() if n.endswith('.jar')]
              assert len(names) == 1
              core = z.read(names[0])
          assert hashlib.sha256(core).hexdigest() == '90e9f5ecfe306b70f6cf26d8ca7347ed4f65a07c3e9c6667cf42b1988522ba34'
          Path('core.jar').write_bytes(core)
          Path('evidence/core-sha256.txt').write_text(hashlib.sha256(core).hexdigest()+'\n')
          PY
      - name: Full Maven tests for each exact changed addon against the same core
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil, subprocess, sys, xml.etree.ElementTree as ET
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          import compare_addon_slimefun_compatibility
          import compare_addon_slimefun_compatibility_base as compatibility
          changes = json.loads(Path('evidence/selected-addons.json').read_text())
          summary=[]
          for repo, sha in changes.items():
              slug=repo.split('/')[1]
              source=Path('sources')/slug
              report=Path('evidence')/slug; report.mkdir(parents=True)
              subprocess.run(['git','clone','--depth','1',f'https://github.com/{repo}.git',str(source)],check=True,timeout=120)
              subprocess.run(['git','-C',str(source),'fetch','--depth','1','origin',sha],check=True,timeout=120)
              subprocess.run(['git','-C',str(source),'checkout','--detach',sha],check=True)
              assert subprocess.check_output(['git','-C',str(source),'rev-parse','HEAD'],text=True).strip()==sha
              project=(Path('projects')/slug).resolve()
              compatibility.copy_project(source,project)
              assert compatibility.detect_build_system(project)=='maven'
              assert compatibility.patch_maven_dependency(project,'Legacy-Preservation-CI')
              with (report/'build.log').open('w') as log:
                  assert compatibility.install_maven_jar(project=project,jar=Path('core.jar').resolve(),version='Legacy-Preservation-CI',env=dict(os.environ),log=log)==0
                  status=compatibility.stream_maven_command(['mvn','-B','-ntp','-Dpaper.version=1.21.11-R0.1-SNAPSHOT','clean','verify'],cwd=project,env=dict(os.environ),log=log)
              if status:
                  print((report/'build.log').read_text()[-12000:]); raise SystemExit(status)
              xml=list((project/'target/surefire-reports').glob('TEST-*.xml'))
              assert xml, f'No actual XML for {repo}'
              roots=[ET.parse(p).getroot() for p in xml]
              counts={k:sum(int(r.attrib[k]) for r in roots) for k in ['tests','failures','errors','skipped']}
              assert counts['tests']>0 and all(counts[k]==0 for k in ['failures','errors','skipped']), (repo,counts)
              if slug=='SF_FNAmplifications': assert counts['tests']>=39
              if slug=='SF_MagicExpansion': assert counts['tests']==18
              for path in xml: shutil.copy2(path,report/path.name)
              jar=compatibility.find_built_addon_jar(project)
              assert jar is not None
              subprocess.run(['python3','scripts/verify_addon_bytecode.py',str(jar),'--expected-java','21','--report',str(report/'bytecode.json')],check=True)
              row=dict(repository=repo,source_commit=sha,counts=counts,jar=jar.name,sha256=hashlib.sha256(jar.read_bytes()).hexdigest())
              summary.append(row)
              Path('evidence/changed-addon-results.json').write_text(json.dumps(summary,indent=2)+'\n')
          assert len(summary)==3
          PY
      - name: Refresh exact-source evidence without relabeling older checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          path=Path('compatibility/maintained-addon-test-ledger.json')
          ledger=json.loads(path.read_text())
          results={row['repository']:row for row in json.loads(Path('evidence/changed-addon-results.json').read_text())}
          for row in ledger['addons']:
              if row['repository'] not in results: continue
              update=results[row['repository']]; counts=update['counts']
              row.update(source_commit=update['source_commit'],full_build_result='PASS',reported_test_entries=counts['tests'],failures=counts['failures'],errors=counts['errors'],skips=counts['skipped'])
              row['evidence']={'repository':'wickidcow/Slimefun-Legacy','run_id':int(os.environ['GITHUB_RUN_ID']),'artifact_name':'reconciled-addon-evidence','kind':'Full exact-source Maven verify with actual XML and Java21 JAR checks','tested_core_sha256':Path('evidence/core-sha256.txt').read_text().strip()}
              row['coverage']='Permanent project tests; runtime/gameplay coverage remains separately attributable'
              row['setup_notes']=['Only the core compile/test dependency was redirected to the exact revision97 candidate; no tests were skipped.']
          ledger['bundle_revision']=98
          ledger['summary']={'addons':len(ledger['addons']),'full_build_passed':sum(r['full_build_result']=='PASS' for r in ledger['addons']),'reported_test_entries':sum(r['reported_test_entries'] for r in ledger['addons']),'addons_with_reported_tests':sum(r['reported_test_entries']>0 for r in ledger['addons']),'addons_without_reported_tests':sum(r['reported_test_entries']==0 for r in ledger['addons']),'failures':sum(r['failures'] for r in ledger['addons']),'errors':sum(r['errors'] for r in ledger['addons']),'skips':sum(r['skips'] for r in ledger['addons'])}
          ledger['limitations'].append('Revision98 updates only FNAmplifications, LiteXpansion and MagicExpansion from this three-addon exact-core test run; all other evidence retains its original run attribution. The root core hash remains historical; new row evidence records the latest exact core.')
          manifest=json.loads(Path('compatibility/sfl-addon-release-matrix.json').read_text())
          assert {r['repository']:r['source_commit'] for r in ledger['addons']}=={r['repository']:r['source_commit'] for r in manifest['addons']}
          path.write_text(json.dumps(ledger,indent=2)+'\n')
          names=json.loads(Path('evidence/integration-files.json').read_text())+[str(path)]
          blobs={}
          for name in names:
              data=Path(name).read_bytes(); sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              returned=subprocess.run(['gh','api','--method','POST','repos/wickidcow/Slimefun-Legacy/git/blobs','--input','-'],input=json.dumps(dict(content=data.decode(),encoding='utf-8')),capture_output=True,text=True,check=True)
              assert json.loads(returned.stdout)['sha']==sha
              blobs[name]=sha
              target=Path('evidence/reviewed-source')/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          Path('evidence/reviewed-blobs.json').write_text(json.dumps(blobs,indent=2)+'\n')
          Path('evidence/ledger-summary.json').write_text(json.dumps(ledger['summary'],indent=2)+'\n')
          print(ledger['summary'])
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reconciled-addon-evidence
          path: evidence/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

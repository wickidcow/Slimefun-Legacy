name: One-shot Beacon Plus dual power repair

on:
  push:
    branches:
      - fix/beacon-plus-dual-power-and-curios

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/beacon-plus-dual-power-and-curios
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Apply Beacon Plus and Curios repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          def replace_between(text, start_marker, end_marker, replacement, label):
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f"{label}: start marker not found")
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f"{label}: end marker not found")
              return text[:start] + replacement + text[end:]

          root = Path('.')

          # ------------------------------------------------------------------
          # Dual power-source model
          # ------------------------------------------------------------------
          power_mode = root / 'src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusPowerMode.java'
          power_mode.write_text('''package io.github.thebusybiscuit.slimefun4.implementation.items.curios;

import java.util.Locale;
import org.bukkit.Material;

/** Selects the source used to power Beacon Plus field effects. */
enum BeaconPlusPowerMode {
    SLIMEFUN_ENERGY("Slimefun Electricity", Material.REDSTONE_BLOCK),
    BEACON_BLOCKS("Beacon Blocks", Material.IRON_BLOCK);

    private final String displayName;
    private final Material icon;

    BeaconPlusPowerMode(String displayName, Material icon) {
        this.displayName = displayName;
        this.icon = icon;
    }

    String getDisplayName() {
        return displayName;
    }

    Material getIcon() {
        return icon;
    }

    BeaconPlusPowerMode next() {
        return this == SLIMEFUN_ENERGY ? BEACON_BLOCKS : SLIMEFUN_ENERGY;
    }

    static BeaconPlusPowerMode fromStored(String value) {
        if (value == null || value.isBlank()) {
            // Existing Beacon Plus blocks predate this setting and were energy machines.
            return SLIMEFUN_ENERGY;
        }

        String normalized = value.trim().toUpperCase(Locale.ROOT).replace('-', '_').replace(' ', '_');
        return switch (normalized) {
            case "BEACON_BLOCKS", "BLOCKS", "VANILLA", "VANILLA_BLOCKS", "PYRAMID" -> BEACON_BLOCKS;
            case "SLIMEFUN_ENERGY", "SLIMEFUN", "ENERGY", "ELECTRICITY", "ELECTRIC" -> SLIMEFUN_ENERGY;
            default -> SLIMEFUN_ENERGY;
        };
    }
}
''', encoding='utf-8')

          power_source = root / 'src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusPowerSource.java'

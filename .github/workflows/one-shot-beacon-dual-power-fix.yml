name: One-shot Beacon Plus dual power repair

on:
  push:
    branches:
      - 'fix/beacon-plus-dual-power-and-curios'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/beacon-plus-dual-power-and-curios
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Apply source repairs
        run: python3 scripts/one_shot_beacon_dual_power_fix.py

      - name: Format and verify source
        run: |
          chmod +x gradlew
          ./gradlew spotlessApply --no-daemon
          python3 scripts/verify_legacy.py .
          git diff --check

      - name: Build and test
        run: ./gradlew clean build --no-daemon

      - name: Verify Java 21 bytecode target
        run: |
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          python3 scripts/check_bytecode_target.py "$JAR" --expected-java 21

      - name: Verify release artifact
        run: |
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          python3 scripts/verify_release_artifact.py "$JAR" --root .

      - name: Commit repaired source and remove one-shot files
        run: |
          rm -f .github/workflows/one-shot-beacon-dual-power-fix.yml
          rm -f scripts/one_shot_beacon_dual_power_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Beacon Plus dual power and Containment Armor guide"
          git push origin HEAD:fix/beacon-plus-dual-power-and-curios

              'BeaconPlusPowerMode.SLIMEFUN_ENERGY',
              'BeaconPlusPowerMode.BEACON_BLOCKS',
              'createPowerSourceItem',
              'togglePowerSource',
              'addMenuClickHandler(STATUS_SLOT',
          ]
          for marker in required_beacon_markers:
              if marker not in beacon_check:
                  raise SystemExit(f'Missing Beacon Plus repair marker: {marker}')

          runtime_check = runtime_path.read_text(encoding='utf-8')
          if '(entity instanceof LivingEntity || entity instanceof Item)' not in runtime_check:
              raise SystemExit('Gravity Well broad mob handling was not installed')
          if 'return BeaconPlusPowerState.hasPoweredEffect' not in runtime_check:
              raise SystemExit('Persistent runtime effects are not power-gated')

          print('Beacon Plus dual-power, effect and Curios armor repairs applied successfully.')
          PY

      - name: Format and verify source
        run: |
          chmod +x gradlew
          ./gradlew spotlessApply --no-daemon
          python3 scripts/verify_legacy.py .
          git diff --check

      - name: Build and test
        run: ./gradlew clean build --no-daemon

      - name: Verify Beacon Plus effect coverage and menu locks
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re
          from pathlib import Path

          base = Path('src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios')
          effect_source = (base / 'BeaconPlusEffect.java').read_text()
          all_sources = '\n'.join(p.read_text() for p in base.glob('BeaconPlus*.java'))
          beacon = (base / 'BeaconPlus.java').read_text()

          enum_body = effect_source.split('public enum BeaconPlusEffect {', 1)[1].split(';', 1)[0]
          effects = re.findall(r'^\s*([A-Z][A-Z0-9_]*)\(', enum_body, flags=re.M)
          if len(effects) != 30:
              raise SystemExit(f'Expected 30 Beacon Plus effects, found {len(effects)}: {effects}')

          missing = [name for name in effects if f'BeaconPlusEffect.{name}' not in all_sources]
          if missing:
              raise SystemExit(f'Effects without an implementation/configuration reference: {missing}')

          locked_markers = [
              'menu.setPlayerInventoryClickable(false);',
              'menu.setEmptySlotsClickable(false);',
              'menu.addMenuClickHandler(STATUS_SLOT',
              'menu.addMenuClickHandler(POWER_SOURCE_SLOT',
              'menu.addMenuClickHandler(DISABLE_ALL_SLOT',
              'menu.addMenuClickHandler(ACTIVATOR_COVERAGE_SLOT',
              'menu.addMenuClickHandler(CLOSE_SLOT',
          ]
          for marker in locked_markers:
              if marker not in beacon:
                  raise SystemExit(f'Missing menu lock/control handler: {marker}')

          if 'POWER_PULSE_INTERVAL_TICKS = 20' not in beacon:
              raise SystemExit('Beacon field pulse is no longer exactly once per second')

          print('All 30 Beacon Plus effects are represented; controls are locked; field pulse remains 20 ticks.')
          PY

      - name: Commit repaired source and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-beacon-dual-power-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Beacon Plus dual power and Containment Armor guide"
          git push origin HEAD:fix/beacon-plus-dual-power-and-curios

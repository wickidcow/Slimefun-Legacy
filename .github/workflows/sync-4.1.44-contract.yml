name: Sync 4.1.44 Release Contract

on:
  push:
    branches:
      - 'release/4.1.44-beacon-performance'
    paths:
      - '.github/workflows/sync-4.1.44-contract.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: release/4.1.44-beacon-performance

      - name: Synchronize 4.1.44 release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          VERSION = '4.1.44'
          PREVIOUS = '4.1.43'
          PREVIOUS_REF = '0205105fe6c241c4b74edb4418a2542a2bfa963c'

          # Gradle version and human-readable release label.
          gradle = Path('gradle.properties')
          text = gradle.read_text(encoding='utf-8')
          text = text.replace(
              '# Slimefun Legacy 4.1.43 stable release - external model compatibility (release gate 3)\nprojectVersion=4.1.43',
              '# Slimefun Legacy 4.1.44 release candidate - Resonance Beacon Performance\nprojectVersion=4.1.44'
          )
          if 'projectVersion=4.1.44' not in text:
              raise SystemExit('gradle.properties: failed to set projectVersion=4.1.44')
          gradle.write_text(text, encoding='utf-8')

          # Registries with a top-level release marker.
          for raw in (
              'compatibility/addon-compatibility-matrix.json',
              'compatibility/support-contract.json',
              'compatibility/core-api-registry.json',
              'compatibility/cross-fork-api-matrix.json',
          ):
              path = Path(raw)
              data = json.loads(path.read_text(encoding='utf-8'))
              current = data.get('release')
              if current not in (PREVIOUS, VERSION):
                  raise SystemExit(f'{raw}: expected release {PREVIOUS} or {VERSION}, found {current!r}')
              data['release'] = VERSION
              path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # Roll the release-blocking baseline to the public 4.1.43 tag.
          path = Path('compatibility/release-baselines.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['candidate']['version'] = VERSION
          data['previous_stable']['version'] = PREVIOUS
          data['previous_stable']['source'] = {
              'mode': 'git-ref',
              'ref': PREVIOUS_REF,
          }
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # README release line and support statement.
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace(
              'Current release candidate: **4.1.43 — External Model Compatibility**.',
              'Current release candidate: **4.1.44 — Resonance Beacon Performance**.'
          )
          text = text.replace(
              'Slimefun Legacy 4.1.43 is tested primarily against **Paper 26.2 / Minecraft 26.2 on Java 25**.',
              'Slimefun Legacy 4.1.44 is tested primarily against **Paper 26.2 / Minecraft 26.2 on Java 25**.'
          )
          if 'Current release candidate: **4.1.44 — Resonance Beacon Performance**.' not in text:
              raise SystemExit('README.md: release candidate marker was not updated')
          readme.write_text(text, encoding='utf-8')

          # Prepend the release history entry once.
          history = Path('EVERYTHING_THAT_CHANGED.md')
          text = history.read_text(encoding='utf-8')
          heading = '# Slimefun Legacy 4.1.44 — Resonance Beacon Performance'
          if not text.startswith(heading):
              entry = '''# Slimefun Legacy 4.1.44 — Resonance Beacon Performance

4.1.44 turns the Resonance Beacon performance work validated on AlbionMC into a formal release line. The goal is to preserve every Beacon power and existing world while removing repeated work from the one-second ticker path.

## Resonance Beacon runtime

- Added resolved Beacon-state caching so pyramid/profile, configured powers, effective tiers, and range are reused instead of repeatedly rebuilt during normal effect checks.
- Separated Beacon work into independent cadences: energy/lifecycle stays responsive while potion effects, utility effects, maintenance, tile boosts, crop growth, and Gravity Well work run on appropriate schedules.
- Distributed Gravity Well work across four slices to avoid concentrating entity scanning into one ticker pulse.
- Player field-state refresh now follows chunk transitions and explicit Beacon lifecycle/configuration changes instead of recalculating on every block-coordinate movement.
- Peaceful behavior relies on the existing event-driven protections plus explicit reconciliation when a Beacon becomes active or its configuration changes.
- Beam rendering is viewer-aware and bounded, cutting powered visual particle dispatches while leaving gameplay and energy behavior intact.
- Added `/beacon perf` and `/beacon perf reset` for focused runtime timing of state/cache, energy, visuals, player effects, monster effects, Gravity Well, furnace/spawner work, and crops.

## Live production validation

AlbionMC live profiling with seven loaded `BEACON_PLUS` blocks measured:

- pre-optimization sample: **8.17 ms total / 1.17 ms average per Beacon** in a 0.5-second `/sf tick top` window;
- post-optimization samples: **0.48 ms**, **0.73 ms**, and **0.42 ms** total for the same seven Beacon count;
- three-sample post-optimization mean: **0.54 ms total / ~0.078 ms per Beacon**;
- observed reduction versus the 8.17 ms baseline: **about 93%** in Beacon ticker time;
- Slimefun core in those three post-optimization samples averaged **~7.30 ms**, versus **14.56 ms** in the earlier comparison sample.

These are production observations from one server workload, not a universal performance guarantee. Exact cost varies with configured powers, loaded chunks, entities, crops, viewers, hardware, and other plugins.

## Behavior preserved

- `BEACON_PLUS` item/block ID and saved data are unchanged.
- All existing Resonance Beacon powers remain available; Gravity Well remains a Beacon power.
- Existing pyramid requirements, resonance behavior, Extra Range/Extra Power semantics, electric mode, and energy demand remain intact.
- Existing addon-facing Slimefun APIs are unchanged by the Beacon performance work.
- Paper 26.2 remains the primary runtime target, Purpur 26.2 is supported, and Folia 26.2 remains experimental.

---

'''
              history.write_text(entry + text, encoding='utf-8')
          PY

      - name: Verify synchronized release markers
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'projectVersion=4.1.44' gradle.properties
          grep -F 'Current release candidate: **4.1.44 — Resonance Beacon Performance**.' README.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          for raw in (
              'compatibility/addon-compatibility-matrix.json',
              'compatibility/support-contract.json',
              'compatibility/core-api-registry.json',
              'compatibility/cross-fork-api-matrix.json',
          ):
              assert json.loads(Path(raw).read_text())['release'] == '4.1.44', raw
          data = json.loads(Path('compatibility/release-baselines.json').read_text())
          assert data['candidate']['version'] == '4.1.44'
          assert data['previous_stable']['version'] == '4.1.43'
          assert data['previous_stable']['source']['ref'] == '0205105fe6c241c4b74edb4418a2542a2bfa963c'
          PY

      - name: Commit 4.1.44 release preparation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradle.properties README.md EVERYTHING_THAT_CHANGED.md compatibility/
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Release metadata already synchronized.'
            exit 0
          fi
          git commit -m 'Prepare Slimefun Legacy 4.1.44 Resonance Beacon Performance'
          git push origin HEAD:release/4.1.44-beacon-performance

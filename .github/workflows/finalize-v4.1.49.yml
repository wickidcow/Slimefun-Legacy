name: Refresh v4.1.49 Addon Bundle

on:
  push:
    branches:
      - ops/finalize-v4.1.49-20260910
    paths:
      - '.github/workflows/finalize-v4.1.49.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch authoritative addon bundle refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run refresh-addon-bundle.yml --repo wickidcow/Slimefun-Legacy --ref master

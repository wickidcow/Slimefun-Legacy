name: Dispatch v4.1.49 After Baseline Rollover

on:
  push:
    branches:
      - ops/finalize-v4.1.49-20260910
    paths:
      - '.github/workflows/finalize-v4.1.49.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch reproducible release from master
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run reproducible-release.yml --repo wickidcow/Slimefun-Legacy --ref master

name: Delayed Save Replacement Preservation
on:
  push:
    branches: ['audit/delayed-save-replacement-20261001']
    paths: ['.audit/delayed-save/**', '.github/workflows/delayed-save-replacement-validation.yml']
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Apply hash-checked preservation changes
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 .audit/delayed-save/apply.py
          chmod +x gradlew
          ./gradlew spotlessApply --no-daemon > evidence/format.log 2>&1
          git diff --check
          git diff --name-only > evidence/formatted-files.txt
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Prove key-only completion loses newer controller saves
        run: |
          set -euo pipefail
          FILE=src/main/java/com/xzavier0722/mc/plugin/slimefun4/storage/controller/BlockDataController.java
          cp "$FILE" "$RUNNER_TEMP/corrected-controller.java"
          python3 - <<'PY'
          from pathlib import Path
          path=Path('src/main/java/com/xzavier0722/mc/plugin/slimefun4/storage/controller/BlockDataController.java')
          text=path.read_text()
          needle='delayedWriteTasks.remove(key, completedTask)'
          assert text.count(needle)==1
          path.write_text(text.replace(needle,'delayedWriteTasks.remove(key)'))
          PY
          STATUS=0
          ./gradlew test --tests 'com.xzavier0722.mc.plugin.slimefun4.storage.controller.DelayedSaveReplacementTest' --no-daemon --no-build-cache --no-configuration-cache > evidence/negative-control.log 2>&1 || STATUS=$?
          cp "$RUNNER_TEMP/corrected-controller.java" "$FILE"
          mkdir -p evidence/negative-control
          cp build/test-results/test/TEST-*.xml evidence/negative-control/
          test "$STATUS" -ne 0
          python3 - <<'PY'
          import json,xml.etree.ElementTree as ET
          from pathlib import Path
          path=next(Path('evidence/negative-control').glob('TEST-*DelayedSaveReplacementTest.xml'))
          root=ET.parse(path).getroot()
          counts={k:int(root.attrib[k]) for k in ['tests','failures','errors','skipped']}
          assert counts['tests']==15 and counts['failures']>=4 and counts['errors']==counts['skipped']==0,counts
          failed={case.attrib['name'] for case in root.findall('testcase') if case.find('failure') is not None}
          for prefix in ['controllerDueCompletionPreservesReplacement','controllerForcedCompletionPreservesReplacement','controllerRetainsQueuedDeletionAfterAnEarlierWrite','repeatedReplacementsDoNotAccumulateOrDisappear']:
              assert any(name.startswith(prefix) for name in failed),(prefix,failed)
          Path('evidence/negative-control-summary.json').write_text(json.dumps(dict(counts=counts,failed=sorted(failed),scope='Original key-only removal behavior restored in the real controller factory; infrastructure errors are not accepted'),indent=2)+'\n')
          PY
      - name: Full corrected source invariants build tests and artifact verification
        run: |
          set -euo pipefail
          python3 scripts/verify_legacy.py . > evidence/source-invariants.log 2>&1
          ./gradlew clean build -PslimefunDeprecationReport=true --console=plain --no-daemon --no-build-cache --no-configuration-cache 2>&1 | tee evidence/build.log
          python3 scripts/summarize_deprecations.py evidence/build.log --fail-on-warnings --require-successful-build
          JAR="$(find build/libs -maxdepth 1 -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -s "$JAR"
          python3 scripts/check_bytecode_target.py "$JAR" --expected-java 21
          python3 scripts/verify_release_artifact.py "$JAR" --root .
          mkdir -p evidence/tests
          cp build/test-results/test/TEST-*.xml evidence/tests/
          sha256sum "$JAR" > evidence/jar-sha256.txt
          unzip -p "$JAR" git.properties > evidence/git.properties
          python3 - <<'PY'
          from pathlib import Path
          import json,xml.etree.ElementTree as ET
          roots=[ET.parse(p).getroot() for p in Path('evidence/tests').glob('TEST-*.xml')]
          counts={k:sum(int(r.attrib[k]) for r in roots) for k in ['tests','failures','errors','skipped']}
          assert counts['errors']==counts['failures']==0,counts
          added=next(r for r in roots if r.attrib['name'].endswith('.DelayedSaveReplacementTest'))
          assert {k:int(added.attrib[k]) for k in ['tests','failures','errors','skipped']}==dict(tests=15,failures=0,errors=0,skipped=0)
          skipped=[dict(suite=r.attrib['name'],case=c.attrib['name']) for r in roots for c in r.findall('testcase') if c.find('skipped') is not None]
          Path('evidence/results.json').write_text(json.dumps(dict(totals=counts,new_tests=15,skipped=skipped,release_approved=False),indent=2)+'\n')
          PY
      - name: Stage only tested production and permanent regression source objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          names=['src/main/java/com/xzavier0722/mc/plugin/slimefun4/storage/task/DelayedSavingLooperTask.java','src/main/java/com/xzavier0722/mc/plugin/slimefun4/storage/controller/BlockDataController.java','src/test/java/com/xzavier0722/mc/plugin/slimefun4/storage/controller/DelayedSaveReplacementTest.java']
          records={}
          for name in names:
              data=Path(name).read_bytes();sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              result=subprocess.run(['gh','api','--method','POST','repos/wickidcow/Slimefun-Legacy/git/blobs','--input','-'],input=json.dumps(dict(content=data.decode(),encoding='utf-8')),capture_output=True,text=True,check=True)
              assert json.loads(result.stdout)['sha']==sha
              records[name]=sha
              target=Path('evidence/reviewed-source')/name;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          Path('evidence/reviewed-blobs.json').write_text(json.dumps(records,indent=2)+'\n')
          patch=subprocess.check_output(['git','diff','--',*names],text=True)
          Path('evidence/source-change.patch').write_text(patch)
          PY
      - name: Retain failing build reports too
        if: always()
        run: |
          mkdir -p evidence/last-test-results
          if test -d build/test-results/test; then cp build/test-results/test/TEST-*.xml evidence/last-test-results/ || true; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: delayed-save-replacement-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: error

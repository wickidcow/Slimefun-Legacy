name: Reproducible Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Resolve Slimefun Legacy version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^projectVersion=//p' gradle.properties | head -n 1 | tr -d '\r')"
          test -n "$VERSION"
          echo "LEGACY_ARTIFACT_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Slimefun Legacy artifact version: $VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Pin reproducible source identity
        run: |
          echo "SOURCE_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
          echo "Source commit: $GITHUB_SHA"
          echo "Source timestamp: $(git show -s --format=%cI "$GITHUB_SHA")"

      - name: Verify Slimefun Legacy invariants
        run: python3 scripts/verify_legacy.py .

      - name: First clean release build
        run: |
          chmod +x gradlew
          ./gradlew clean shadowJar -PprojectVersion="${LEGACY_ARTIFACT_VERSION}" --no-daemon --no-build-cache --no-configuration-cache
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          cp "$JAR" "$RUNNER_TEMP/Slimefun-first.jar"
          sha256sum "$RUNNER_TEMP/Slimefun-first.jar" | tee "$RUNNER_TEMP/first.sha256"

      - name: Verify first release artifact
        run: |
          python3 scripts/check_bytecode_target.py "$RUNNER_TEMP/Slimefun-first.jar" \
            --expected-java 21 \
            --report "$RUNNER_TEMP/bytecode-first.txt"
          python3 scripts/verify_release_artifact.py "$RUNNER_TEMP/Slimefun-first.jar" \
            --root . \
            --json-report "$RUNNER_TEMP/release-artifact-first.json" \
            --summary "$RUNNER_TEMP/release-artifact-first.md"

      - name: Second clean release build
        run: |
          ./gradlew clean shadowJar -PprojectVersion="${LEGACY_ARTIFACT_VERSION}" --no-daemon --no-build-cache --no-configuration-cache
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          cp "$JAR" "$RUNNER_TEMP/Slimefun-second.jar"
          sha256sum "$RUNNER_TEMP/Slimefun-second.jar" | tee "$RUNNER_TEMP/second.sha256"

      - name: Verify second release artifact
        run: |
          python3 scripts/check_bytecode_target.py "$RUNNER_TEMP/Slimefun-second.jar" \
            --expected-java 21 \
            --report "$RUNNER_TEMP/bytecode-second.txt"
          python3 scripts/verify_release_artifact.py "$RUNNER_TEMP/Slimefun-second.jar" \
            --root . \
            --json-report "$RUNNER_TEMP/release-artifact-second.json" \
            --summary "$RUNNER_TEMP/release-artifact-second.md"

      - name: Require byte-for-byte reproducibility
        run: |
          FIRST_SHA="$(sha256sum "$RUNNER_TEMP/Slimefun-first.jar" | awk '{print $1}')"
          SECOND_SHA="$(sha256sum "$RUNNER_TEMP/Slimefun-second.jar" | awk '{print $1}')"
          {
            echo "# Slimefun Legacy reproducible release verification"
            echo
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- SOURCE_DATE_EPOCH: \`$SOURCE_DATE_EPOCH\`"
            echo "- First SHA-256: \`$FIRST_SHA\`"
            echo "- Second SHA-256: \`$SECOND_SHA\`"
          } > "$RUNNER_TEMP/reproducible-release.md"
          if [[ "$FIRST_SHA" != "$SECOND_SHA" ]]; then
            echo "- Result: **FAIL — clean builds differ**" >> "$RUNNER_TEMP/reproducible-release.md"
            cat "$RUNNER_TEMP/reproducible-release.md" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cmp "$RUNNER_TEMP/Slimefun-first.jar" "$RUNNER_TEMP/Slimefun-second.jar"
          echo "- Result: **PASS — byte-for-byte identical**" >> "$RUNNER_TEMP/reproducible-release.md"
          cat "$RUNNER_TEMP/reproducible-release.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/release-artifact-first.md" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p dist build/release-verification
          cp "$RUNNER_TEMP/Slimefun-first.jar" "dist/SF_Slimefun_Legacy_v${LEGACY_ARTIFACT_VERSION}.jar"
          cp "$RUNNER_TEMP/reproducible-release.md" build/release-verification/
          cp "$RUNNER_TEMP/first.sha256" build/release-verification/
          cp "$RUNNER_TEMP/second.sha256" build/release-verification/
          cp "$RUNNER_TEMP/bytecode-first.txt" build/release-verification/
          cp "$RUNNER_TEMP/bytecode-second.txt" build/release-verification/
          cp "$RUNNER_TEMP/release-artifact-first.json" build/release-verification/
          cp "$RUNNER_TEMP/release-artifact-first.md" build/release-verification/
          cp "$RUNNER_TEMP/release-artifact-second.json" build/release-verification/
          cp "$RUNNER_TEMP/release-artifact-second.md" build/release-verification/
          test -s "dist/SF_Slimefun_Legacy_v${LEGACY_ARTIFACT_VERSION}.jar"

      - name: Upload direct reproducible Slimefun Legacy JAR
        uses: actions/upload-artifact@v7
        with:
          name: SF_Slimefun_Legacy_v${{ env.LEGACY_ARTIFACT_VERSION }}.jar
          path: dist/SF_Slimefun_Legacy_v${{ env.LEGACY_ARTIFACT_VERSION }}.jar
          archive: false
          if-no-files-found: error

      - name: Upload reproducible release evidence
        uses: actions/upload-artifact@v7
        with:
          name: Slimefun-Reproducible-Release-Candidate
          path: build/release-verification/
          if-no-files-found: error

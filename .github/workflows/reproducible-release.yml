name: Reproducible Release Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/reproducible-release.yml'

permissions:
  contents: write

env:
  LEGACY_ARTIFACT_VERSION: "4.1.30"
  RELEASE_TAG: "SlimefunLegacy4.1.30RC2"
  RELEASE_NAME: "Slimefun Legacy 4.1.30 — RC2"

jobs:
  release-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Pin reproducible source identity
        run: |
          echo "SOURCE_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
          echo "Source commit: $GITHUB_SHA"
          echo "Source timestamp: $(git show -s --format=%cI "$GITHUB_SHA")"

      - name: Verify Slimefun Legacy invariants
        run: python3 scripts/verify_legacy.py .

      - name: Record formatting drift without changing release source
        run: |
          chmod +x gradlew
          ./gradlew spotlessApply --no-daemon --no-build-cache --no-configuration-cache
          if ! git diff --quiet; then
            mkdir -p build/release-verification
            git diff --name-only > build/release-verification/spotless-changed-files.txt
            git diff --binary > build/release-verification/spotless-formatting.patch
            {
              echo "# Spotless formatting cleanup recommended"
              echo
              echo "Source commit: \`$GITHUB_SHA\`"
              echo
              echo "Spotless would reformat these tracked files:"
              while IFS= read -r FILE; do
                echo "- \`$FILE\`"
              done < build/release-verification/spotless-changed-files.txt
              echo
              echo "Formatting drift is recorded as release evidence. The release checkout is reset to the exact source commit before building."
            } > build/release-verification/spotless-formatting.md
            cat build/release-verification/spotless-formatting.md >> "$GITHUB_STEP_SUMMARY"
            git reset --hard "$GITHUB_SHA"
          fi
          git diff --quiet

      - name: First clean release build
        run: |
          ./gradlew clean shadowJar -PprojectVersion="${LEGACY_ARTIFACT_VERSION}" --no-daemon --no-build-cache --no-configuration-cache
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          cp "$JAR" "$RUNNER_TEMP/Slimefun-first.jar"
          sha256sum "$RUNNER_TEMP/Slimefun-first.jar" | tee "$RUNNER_TEMP/first.sha256"

      - name: Verify first release artifact
        run: |
          python3 scripts/check_bytecode_target.py "$RUNNER_TEMP/Slimefun-first.jar" \
            --expected-java 21 \
            --report "$RUNNER_TEMP/bytecode-first.txt"
          python3 scripts/verify_release_artifact.py "$RUNNER_TEMP/Slimefun-first.jar" \
            --root . \
            --json-report "$RUNNER_TEMP/release-artifact-first.json" \
            --summary "$RUNNER_TEMP/release-artifact-first.md"

      - name: Second clean release build
        run: |
          ./gradlew clean shadowJar -PprojectVersion="${LEGACY_ARTIFACT_VERSION}" --no-daemon --no-build-cache --no-configuration-cache
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          cp "$JAR" "$RUNNER_TEMP/Slimefun-second.jar"
          sha256sum "$RUNNER_TEMP/Slimefun-second.jar" | tee "$RUNNER_TEMP/second.sha256"

      - name: Verify second release artifact
        run: |
          python3 scripts/check_bytecode_target.py "$RUNNER_TEMP/Slimefun-second.jar" \
            --expected-java 21 \
            --report "$RUNNER_TEMP/bytecode-second.txt"
          python3 scripts/verify_release_artifact.py "$RUNNER_TEMP/Slimefun-second.jar" \
            --root . \
            --json-report "$RUNNER_TEMP/release-artifact-second.json" \
            --summary "$RUNNER_TEMP/release-artifact-second.md"

      - name: Require byte-for-byte reproducibility
        run: |
          FIRST_SHA="$(sha256sum "$RUNNER_TEMP/Slimefun-first.jar" | awk '{print $1}')"
          SECOND_SHA="$(sha256sum "$RUNNER_TEMP/Slimefun-second.jar" | awk '{print $1}')"
          {
            echo "# Slimefun Legacy reproducible release verification"
            echo
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- SOURCE_DATE_EPOCH: \`$SOURCE_DATE_EPOCH\`"
            echo "- First SHA-256: \`$FIRST_SHA\`"
            echo "- Second SHA-256: \`$SECOND_SHA\`"
          } > "$RUNNER_TEMP/reproducible-release.md"
          if [[ "$FIRST_SHA" != "$SECOND_SHA" ]]; then
            echo "- Result: **FAIL — clean builds differ**" >> "$RUNNER_TEMP/reproducible-release.md"
            cat "$RUNNER_TEMP/reproducible-release.md" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cmp "$RUNNER_TEMP/Slimefun-first.jar" "$RUNNER_TEMP/Slimefun-second.jar"
          echo "- Result: **PASS — byte-for-byte identical**" >> "$RUNNER_TEMP/reproducible-release.md"
          cat "$RUNNER_TEMP/reproducible-release.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/release-artifact-first.md" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p dist
          cp "$RUNNER_TEMP/Slimefun-first.jar" "dist/SF_Slimefun_Legacy_v${LEGACY_ARTIFACT_VERSION}.jar"
          test -s "dist/SF_Slimefun_Legacy_v${LEGACY_ARTIFACT_VERSION}.jar"

      - name: Write server-owner release notes
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## Slimefun Legacy 4.1.30 — RC2

          This release candidate is focused on **safer machines, more reliable item/energy handling, and stronger Paper 26.2 compatibility** while keeping the classic Slimefun experience intact.

          ### What changed for server owners

          - **Machines are safer when outputs are full.** Finished machines now wait for room instead of consuming extra power or risking lost output.
          - **Generators and reactors handle fuel more safely.** Fuel amounts, buckets, and recipe byproducts are checked before anything is consumed.
          - **Cargo transfers are more reliable.** Failed transfers now preserve the exact remainder and avoid silently losing items.
          - **Energy networks are more defensive.** Slimefun re-checks live components and avoids unsafe reads/writes across unloaded chunks.
          - **Machine progress and operation state were hardened.** This reduces odd progress-bar behavior and protects running recipes from being changed underneath them.
          - **Androids, tools, magic items, armor, food, combat items, auto-crafters, block utilities, and other gameplay systems received additional correctness checks.**
          - **Old Paper visual-effect APIs were replaced.** This removes removal-pending `STEP_SOUND` / `SMOKE` usage for better Paper 26.2 compatibility.
          - **Guide/runtime handling was hardened** while preserving existing addon-facing behavior.

          ### Compatibility testing

          RC2 passed the full release gate before publication:

          - Build English Slimefun
          - Paper 26.2 Runtime Smoke, including two real server boots
          - Runtime Gameplay Correctness
          - Public API Compatibility against the previous stable release
          - Slimefun addon compatibility testing

          Required Legacy addon checks passed for **BetterChests, FastMachines, SlimeTinkerIE2, and Networks Expansion**. Broader advisory checks also passed for addons including Networks, InfinityExpansion2, MagicExpansion, DynaTech, Supreme, FluffyMachines, FoxyMachines, Gastronomicon, IDreamOfEasy, and others.

          ### Platform

          - **Primary:** Paper 26.2 / Minecraft 1.21.11+
          - **Purpur:** Supported
          - **Folia:** Experimental / secondary target
          - **Recommended runtime:** Java 25
          - **JAR bytecode target:** Java 21

          ### Upgrade notes

          No intentional changes were made to Slimefun item IDs, saved-world formats, database formats, or storage schemas.

          **Before upgrading:** make a backup, replace the old Slimefun Legacy JAR with the attached JAR, and perform a **full server restart**. Do not use `/reload` for this update.

          This is an **RC2 release candidate**, so production server owners should still keep a rollback copy of their previous working JAR while testing.
          EOF

      - name: Upload direct reproducible Slimefun Legacy JAR
        uses: actions/upload-artifact@v7
        with:
          name: SF_Slimefun_Legacy_v${{ env.LEGACY_ARTIFACT_VERSION }}.jar
          path: dist/SF_Slimefun_Legacy_v${{ env.LEGACY_ARTIFACT_VERSION }}.jar
          archive: false
          if-no-files-found: error

      - name: Publish GitHub RC2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          JAR="dist/SF_Slimefun_Legacy_v${LEGACY_ARTIFACT_VERSION}.jar"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --prerelease
            gh release upload "$RELEASE_TAG" "$JAR" --clobber
          else
            gh release create "$RELEASE_TAG" "$JAR" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --prerelease
          fi

      - name: Collect release verification evidence
        if: always()
        run: |
          mkdir -p build/release-verification
          {
            echo "Slimefun Legacy reproducible release evidence"
            echo "Source commit: $GITHUB_SHA"
            echo "Release tag: $RELEASE_TAG"
            echo "Release name: $RELEASE_NAME"
            echo "Workflow status before evidence upload: ${{ job.status }}"
          } > build/release-verification/workflow-status.txt
          for FILE in \
            first.sha256 \
            second.sha256 \
            bytecode-first.txt \
            bytecode-second.txt \
            release-artifact-first.json \
            release-artifact-first.md \
            release-artifact-second.json \
            release-artifact-second.md \
            reproducible-release.md \
            release-notes.md; do
            if [[ -f "$RUNNER_TEMP/$FILE" ]]; then
              cp "$RUNNER_TEMP/$FILE" "build/release-verification/$FILE"
            fi
          done

      - name: Upload reproducible release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Slimefun-Reproducible-Release-Candidate
          path: build/release-verification/
          if-no-files-found: error

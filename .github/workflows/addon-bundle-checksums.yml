name: Publish Addon Bundle Checksums

# Refresh marker: Networks 1.0.18 blueprint recipe collision fix.

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/addon-bundle-checksums.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-slimefun-addon-bundle-checksums
  cancel-in-progress: true

jobs:
  checksums:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download and verify current release bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(sed -n 's/^projectVersion=//p' gradle.properties | head -n 1 | tr -d '\r')"
          TAG="v${VERSION}"
          ASSET='SFL_AddonsNDependencies.zip'
          PACKETEVENTS_ASSET='packetevents-spigot-2.13.0.jar'

          rm -rf bundle work
          mkdir -p bundle work

          EXPECTED_DIGEST="$(gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq ".assets[] | select(.name == \"${ASSET}\") | .digest")"

          if [[ "$EXPECTED_DIGEST" != sha256:* ]]; then
            echo "Release ${TAG} does not expose a SHA-256 digest for ${ASSET}." >&2
            exit 1
          fi

          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET" \
            --dir work

          ACTUAL_SHA="$(sha256sum "work/${ASSET}" | awk '{print $1}')"
          EXPECTED_SHA="${EXPECTED_DIGEST#sha256:}"
          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "Bundle digest mismatch." >&2
            echo "expected ${EXPECTED_SHA}" >&2
            echo "actual   ${ACTUAL_SHA}" >&2
            exit 1
          fi

          unzip -q "work/${ASSET}" -d bundle
          JAR_COUNT="$(find bundle -type f -name '*.jar' | wc -l | tr -d ' ')"
          if [[ "$JAR_COUNT" -lt 1 ]]; then
            echo "No JARs found in ${ASSET}." >&2
            exit 1
          fi

          while IFS= read -r -d '' jar; do
            base="$(basename "$jar")"
            if [[ "$base" == "$PACKETEVENTS_ASSET" ]]; then
              jar tf "$jar" >/dev/null
            elif [[ "$base" == FastAsyncWorldEdit-Paper-*.jar ]]; then
              # FAWE's shaded Paper JAR intentionally has overlapping ZIP components.
              # Strict ZIP/JDK validators reject that layout, even though Paper loads it.
              # For this pinned external dependency, verify it is non-empty and starts
              # with a valid ZIP/JAR signature instead of expanding its entries here.
              test -s "$jar"
              signature="$(head -c 4 "$jar" | od -An -tx1 | tr -d ' \n')"
              case "$signature" in
                504b0304|504b0506|504b0708) ;;
                *)
                  echo "Invalid JAR/ZIP signature for ${base}: ${signature}" >&2
                  exit 1
                  ;;
              esac
            else
              unzip -tqq "$jar"
            fi
          done < <(find bundle -type f -name '*.jar' -print0)

          find bundle -type f -name '*.jar' -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  bundle/#  #' \
            > SFL_AddonsNDependencies.sha256

          test "$(wc -l < SFL_AddonsNDependencies.sha256)" -eq "$JAR_COUNT"
          grep -F 'SF_NetworksExp1.0.18.jar' SFL_AddonsNDependencies.sha256

          {
            echo '## Slimefun Legacy addon bundle checksums'
            echo
            echo "Release: **${TAG}**"
            echo "Bundle SHA-256: \`${ACTUAL_SHA}\`"
            echo "JARs checksummed: **${JAR_COUNT}**"
            echo
            echo 'The manifest uses standard `sha256sum` format and includes every JAR in the release bundle.'
            echo 'Release-backed addons remain independently verified by the authoritative bundle refresh workflow; external runtime dependencies are finalized by the external-dependency workflow.'
          } >> "$GITHUB_STEP_SUMMARY"

          cat SFL_AddonsNDependencies.sha256

      - name: Publish checksum manifest to current release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^projectVersion=//p' gradle.properties | head -n 1 | tr -d '\r')"
          TAG="v${VERSION}"
          gh release upload "$TAG" SFL_AddonsNDependencies.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Upload checksum manifest artifact
        uses: actions/upload-artifact@v7
        with:
          name: SFL_AddonsNDependencies-checksums
          path: SFL_AddonsNDependencies.sha256
          archive: false
          if-no-files-found: error

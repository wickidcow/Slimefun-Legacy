name: Publish Slimefun Legacy 4.1.31 Stable

on:
  push:
    branches:
      - master

permissions:
  contents: write

env:
  TARGET_SHA: 2d5823d232ca5fa5945cd509337c593f2aa94b36
  RELEASE_VERSION: 4.1.31
  RELEASE_TAG: SlimefunLegacy4.1.31

jobs:
  publish-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact merged release source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Pin and verify exact release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          VERSION="$(sed -n 's/^projectVersion=//p' gradle.properties | head -n 1 | tr -d '\r')"
          test "$VERSION" = "$RELEASE_VERSION"
          echo "SOURCE_COMMIT=$TARGET_SHA" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$TARGET_SHA")" >> "$GITHUB_ENV"

      - name: Verify all Slimefun Legacy invariants
        run: python3 scripts/verify_legacy.py .

      - name: First clean stable build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew clean shadowJar -PprojectVersion="$RELEASE_VERSION" --no-daemon --no-build-cache --no-configuration-cache
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          cp "$JAR" "$RUNNER_TEMP/Slimefun-first.jar"

      - name: Verify first stable artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_bytecode_target.py "$RUNNER_TEMP/Slimefun-first.jar" --expected-java 21 --report "$RUNNER_TEMP/bytecode-first.txt"
          python3 scripts/verify_release_artifact.py "$RUNNER_TEMP/Slimefun-first.jar" \
            --root . \
            --json-report "$RUNNER_TEMP/release-artifact-first.json" \
            --summary "$RUNNER_TEMP/release-artifact-first.md"

      - name: Second clean stable build
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean shadowJar -PprojectVersion="$RELEASE_VERSION" --no-daemon --no-build-cache --no-configuration-cache
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          cp "$JAR" "$RUNNER_TEMP/Slimefun-second.jar"

      - name: Verify reproducibility and stage raw release JAR
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_bytecode_target.py "$RUNNER_TEMP/Slimefun-second.jar" --expected-java 21 --report "$RUNNER_TEMP/bytecode-second.txt"
          python3 scripts/verify_release_artifact.py "$RUNNER_TEMP/Slimefun-second.jar" \
            --root . \
            --json-report "$RUNNER_TEMP/release-artifact-second.json" \
            --summary "$RUNNER_TEMP/release-artifact-second.md"
          cmp "$RUNNER_TEMP/Slimefun-first.jar" "$RUNNER_TEMP/Slimefun-second.jar"
          FIRST_SHA="$(sha256sum "$RUNNER_TEMP/Slimefun-first.jar" | awk '{print $1}')"
          SECOND_SHA="$(sha256sum "$RUNNER_TEMP/Slimefun-second.jar" | awk '{print $1}')"
          test "$FIRST_SHA" = "$SECOND_SHA"
          mkdir -p dist
          cp "$RUNNER_TEMP/Slimefun-first.jar" "dist/SF_Slimefun_Legacy_v${RELEASE_VERSION}.jar"
          printf '%s  %s\n' "$FIRST_SHA" "SF_Slimefun_Legacy_v${RELEASE_VERSION}.jar" > "dist/SF_Slimefun_Legacy_v${RELEASE_VERSION}.sha256"
          echo "RELEASE_SHA256=$FIRST_SHA" >> "$GITHUB_ENV"

      - name: Write stable release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Slimefun Legacy 4.1.31 — Stable

          This is the stable Slimefun Legacy 4.1.31 release for modern Paper servers. It includes the latest Core Platform maintenance plus the built-in **Adventurer's Curios** category and a substantially expanded **native Beacon Plus**.

          ### New gameplay and features

          - **Adventurer's Curios** is now built into Slimefun Legacy with Wayfinder's Compass, Echo Lantern, Explorer's Spyglass, Miner's Canary, Dungeon Chalk, Storm Glass, Expedition Journal, and Beacon Plus.
          - **Beacon Plus now has 30 independently toggleable effects.** The historical **Invisible Effect** has been restored to the native implementation.
          - **Player potion effects are visibly applied.** Strength, Regeneration, Resistance, Haste/Fast Digging, Speed, Luck, Water Breathing, and Jump Boost now show normal HUD icons and particles while active.
          - **Beacon Plus status diagnostics** now show `ACTIVE` or `NOT POWERED` and explain whether a missing/invalid beacon pyramid or insufficient stored Energy is preventing the configured effects from running.
          - **Gravity Well is approximately 3x stronger.** Normal pull is 0.30 instead of 0.10; Extra Power pull is 0.42 instead of 0.14. Vertical pull was increased proportionally as well.
          - **Gravity Well and field pulses use a resilient one-second cadence.** The runtime no longer depends on landing on one exact modulo tick, eliminating the observed pattern where several pulls could be followed by a skipped pull.
          - **Beacon Plus is a real Slimefun Energy consumer** with an 8,192 J internal buffer. Normal field work costs 16 J per enabled field effect per one-second pulse.
          - **Extra Power is intentionally expensive:** the first activation on each placed Beacon Plus costs a non-operator 30 XP levels, and while Extra Power is enabled the aggregate field-energy draw increases by exactly **50%**.
          - **Extra Range** adds 20 blocks to the active beacon range.
          - **Activator** can keep This Chunk or a 3x3 area loaded, with hard server-wide safety caps of 64 active Beacon Plus loaders and 256 unique chunks.
          - Event-driven Beacon Plus bonuses such as XP boosting, cooldown reduction, Peaceful, and Immortality now require a recently successful paid energy pulse rather than acting while the beacon is energy-starved.

          ### Server-owner / admin notes

          **Disable one placed Beacon Plus:** right-click it as the owner or an operator and choose **Disable All Effects**. This also turns off that beacon's Activator chunk loading.

          **Disable Beacon Plus globally:** stop the server, edit `plugins/Slimefun/Items.yml`, and set:

          ```yaml
          BEACON_PLUS:
            enabled: false
          ```

          Then perform a full server restart. Do **not** use `/reload`.

          **Disable individual Adventurer's Curios items:** use the same `<ITEM_ID>.enabled: false` pattern in `plugins/Slimefun/Items.yml`. The new IDs are:

          - `ADVENTURERS_WAYFINDERS_COMPASS`
          - `ADVENTURERS_ECHO_LANTERN`
          - `ADVENTURERS_EXPLORERS_SPYGLASS`
          - `ADVENTURERS_MINERS_CANARY`
          - `ADVENTURERS_DUNGEON_CHALK`
          - `ADVENTURERS_STORM_GLASS`
          - `ADVENTURERS_EXPEDITION_JOURNAL`
          - `BEACON_PLUS`

          **Want Beacon Plus but not Extra Power?** Leave **Extra Power** disabled in the Beacon Plus menu. It defaults to OFF and the 30-level unlock cost is not charged until it is deliberately activated. Operators may configure/unlock it without paying XP.

          **Diagnosing effects:** if Strength/Resistance/Regeneration/etc. are enabled but not appearing, open the Beacon Plus menu and check **Beacon Plus Status**. `NOT POWERED` will identify pyramid/activation or Energy shortage as the reason.

          Activator state is persisted under `plugins/Slimefun/adventurers-curios-beacons.properties`. Breaking the beacon, disabling all effects, or shutting Slimefun down releases its plugin chunk tickets.

          ### Compatibility and validation

          - Primary: **Paper 26.2 / Minecraft 26.2 (1.21.11+)**
          - Purpur: supported Paper-based target
          - Folia: experimental/secondary
          - Runtime/build toolchain: **Java 25**
          - Slimefun-owned bytecode target: **Java 21**
          - Protected Legacy API baseline: all 991 protected signatures retained
          - No intentional database-format, storage-schema, or saved-world-format migration is introduced by this release
          - Full Slimefun Legacy invariant suite passed
          - Two independent clean release builds passed artifact verification and were byte-for-byte identical before publication

          ### Upgrade

          Back up worlds, Slimefun data, databases, player data, and addon data. Stop the server, replace the previous Slimefun core JAR with the attached **raw JAR**, make sure only one Slimefun core provider is installed, and start the server normally.

          Recommended post-upgrade checks:

          ```text
          /sf doctor status
          /sf doctor upgrade
          /sf doctor core
          /sf doctor compatibility
          /sf doctor dependencies
          /sf doctor runtime
          /sf doctor integrations
          ```

          The attached `SF_Slimefun_Legacy_v4.1.31.jar` is the direct server JAR; no extraction is required.
          EOF

      - name: Publish normal stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "dist/SF_Slimefun_Legacy_v${RELEASE_VERSION}.jar" \
            "dist/SF_Slimefun_Legacy_v${RELEASE_VERSION}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "Slimefun Legacy ${RELEASE_VERSION} — Stable" \
            --notes-file release-notes.md \
            --latest
          echo "Published stable release $RELEASE_TAG"
          echo "SHA-256: $RELEASE_SHA256"

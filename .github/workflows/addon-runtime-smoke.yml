name: Required Addon Runtime Smoke

on:
  pull_request:
  push:
    branches: [ master, main ]
    paths:
      - 'src/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'compatibility/addon-compatibility-matrix.json'
      - 'compatibility/addon-runtime-smoke-matrix.json'
      - 'scripts/addon_runtime_smoke.sh'
      - 'scripts/build_addon_against_slimefun.py'
      - 'scripts/compare_addon_slimefun_compatibility.py'
      - 'scripts/compare_addon_slimefun_compatibility_base.py'
      - 'scripts/generate_addon_runtime_matrix.py'
      - 'scripts/verify_legacy.py'
      - '.github/workflows/addon-runtime-smoke.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 3'

permissions:
  contents: read

env:
  PAPER_DOWNLOAD_USER_AGENT: "Slimefun-Legacy-CI/required-addon-runtime (https://github.com/wickidcow/Slimefun-Legacy)"

jobs:
  prepare:
    name: Prepare required addon runtime matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      enabled_count: ${{ steps.matrix.outputs.enabled_count }}
      minecraft: ${{ steps.matrix.outputs.minecraft }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate and generate runtime matrix
        id: matrix
        run: |
          python3 scripts/generate_addon_runtime_matrix.py \
            compatibility/addon-runtime-smoke-matrix.json \
            --compatibility-registry compatibility/addon-compatibility-matrix.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Publish matrix summary
        run: |
          {
            echo "## Required addon runtime smoke"
            echo
            echo "Runtime targets: **${{ steps.matrix.outputs.enabled_count }}**"
            echo "Stable Paper/Minecraft target: **${{ steps.matrix.outputs.minecraft }}**"
            echo
            echo 'Every runtime target is cross-validated against the non-advisory `required` addon compatibility tier.'
          } >> "$GITHUB_STEP_SUMMARY"

  build-slimefun:
    name: Build exact Slimefun runtime candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Pin source identity
        run: |
          echo "SOURCE_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_ENV"
      - name: Verify Slimefun Legacy invariants
        run: python3 scripts/verify_legacy.py .
      - name: Build production Slimefun JAR
        run: |
          chmod +x gradlew
          ./gradlew spotlessApply --no-daemon
          ./gradlew clean shadowJar --no-daemon
      - name: Verify Java 21 bytecode target
        run: |
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          python3 scripts/check_bytecode_target.py "$JAR" --expected-java 21
      - uses: actions/upload-artifact@v7
        with:
          name: slimefun-required-addon-runtime-candidate
          path: |
            build/libs/Slimefun-*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error

  addons:
    name: Runtime - ${{ matrix.runtime_plugin }}
    needs: [prepare, build-slimefun]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      PAPER_MINECRAFT_VERSION: ${{ needs.prepare.outputs.minecraft }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/download-artifact@v8
        with:
          name: slimefun-required-addon-runtime-candidate
          path: build/candidate
      - name: Resolve candidate Slimefun JAR
        id: candidate
        shell: bash
        run: |
          JAR="$(find build/candidate -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          test -s "$JAR"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
      - name: Clone exact addon source
        env:
          GIT_TERMINAL_PROMPT: '0'
          ADDON_REPOSITORY: ${{ matrix.repository }}
          ADDON_REF: ${{ matrix.ref }}
          EXPECTED_COMMIT: ${{ matrix.expected_commit }}
        run: |
          set -euo pipefail
          URL="https://github.com/$ADDON_REPOSITORY.git"
          git ls-remote --exit-code "$URL" HEAD >/dev/null
          if [[ -n "$ADDON_REF" ]]; then
            git clone --depth 1 --branch "$ADDON_REF" "$URL" "$RUNNER_TEMP/addon"
          else
            git clone --depth 1 "$URL" "$RUNNER_TEMP/addon"
          fi
          ACTUAL_COMMIT="$(git -C "$RUNNER_TEMP/addon" rev-parse HEAD)"
          echo "Addon repository: $ADDON_REPOSITORY"
          echo "Resolved commit: $ACTUAL_COMMIT"
          if [[ -n "$EXPECTED_COMMIT" && "$ACTUAL_COMMIT" != "$EXPECTED_COMMIT" ]]; then
            echo "Expected pinned commit $EXPECTED_COMMIT but resolved $ACTUAL_COMMIT" >&2
            exit 1
          fi
      - name: Build addon against exact candidate JAR
        id: addon_build
        run: |
          python3 scripts/build_addon_against_slimefun.py \
            "$RUNNER_TEMP/addon" \
            "${{ steps.candidate.outputs.jar }}" \
            "build/addon-runtime-build-${{ matrix.slug }}" \
            --github-output "$GITHUB_OUTPUT"
      - name: Boot addon twice on stable Paper
        run: |
          chmod +x scripts/addon_runtime_smoke.sh
          bash scripts/addon_runtime_smoke.sh \
            "${{ steps.candidate.outputs.jar }}" \
            "${{ steps.addon_build.outputs.jar }}" \
            "${{ matrix.runtime_plugin }}" \
            "build/addon-runtime-smoke-${{ matrix.slug }}"
      - name: Publish runtime evidence
        if: always()
        run: |
          RESULT="build/addon-runtime-smoke-${{ matrix.slug }}/smoke-result.txt"
          if [[ -f "$RESULT" ]]; then
            {
              echo "## ${{ matrix.runtime_plugin }} runtime smoke"
              echo
              echo '```text'
              cat "$RESULT"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: required-addon-runtime-${{ matrix.slug }}
          path: |
            build/addon-runtime-build-${{ matrix.slug }}/report/*.log
            build/addon-runtime-smoke-${{ matrix.slug }}/*.console.log
            build/addon-runtime-smoke-${{ matrix.slug }}/*.normalized.log
            build/addon-runtime-smoke-${{ matrix.slug }}/paper-build.txt
            build/addon-runtime-smoke-${{ matrix.slug }}/smoke-result.txt
          if-no-files-found: warn

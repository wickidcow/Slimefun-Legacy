name: One-shot horizontal Gravity Well retune

on:
  push:
    branches:
      - fix/gravity-well-horizontal-reverse-knockback
    paths:
      - '.github/workflows/one-shot-horizontal-gravity-retune.yml'

permissions:
  contents: write

jobs:
  retune:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/gravity-well-horizontal-reverse-knockback
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Apply horizontal reverse-knockback retune
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          gravity = 'src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusGravity.java'
          replace_exact(
              gravity,
              '/** Pure Gravity Well tuning values, deliberately independent of Bukkit plugin initialization. */',
              '/** Pure Gravity Well tuning values for a controlled horizontal reverse-knockback effect. */',
          )
          replace_exact(gravity, 'static final double NORMAL_PULL = 1.50D;', 'static final double NORMAL_PULL = 0.45D;')
          replace_exact(gravity, 'static final double EXTRA_POWER_PULL = 2.10D;', 'static final double EXTRA_POWER_PULL = 0.63D;')

          runtime = 'src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusRuntime.java'
          replace_exact(
              runtime,
              '        Vector delta = center.toVector().subtract(entity.getLocation().toVector());\n'
              '        if (delta.lengthSquared() < 0.25D) {\n',
              '        Location target = entity.getLocation();\n'
              '        double deltaX = center.getX() - target.getX();\n'
              '        double deltaZ = center.getZ() - target.getZ();\n'
              '        double horizontalDistanceSquared = deltaX * deltaX + deltaZ * deltaZ;\n'
              '        if (horizontalDistanceSquared < 0.25D) {\n',
          )
          replace_exact(
              runtime,
              '        Vector pull = delta.normalize().multiply(BeaconPlusGravity.getPullStrength(power));\n'
              '        pull.setY(Math.max(-1.25D, Math.min(1.25D, pull.getY())));\n'
              '        entity.setVelocity(entity.getVelocity().multiply(0.75D).add(pull));\n',
              '        double scale = BeaconPlusGravity.getPullStrength(power) / Math.sqrt(horizontalDistanceSquared);\n'
              '        Vector currentVelocity = entity.getVelocity();\n'
              '        Vector nextVelocity = new Vector(\n'
              '                currentVelocity.getX() * 0.75D + deltaX * scale,\n'
              '                currentVelocity.getY(),\n'
              '                currentVelocity.getZ() * 0.75D + deltaZ * scale);\n'
              '        entity.setVelocity(nextVelocity);\n',
          )

          test = 'src/test/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusEffectTest.java'
          replace_exact(
              test,
              '    void gravityWellIsFiveTimesStrongerThanLegacyNormalPull() {',
              '    void gravityWellUsesControlledReverseKnockbackStrength() {',
          )
          replace_exact(test, '        assertEquals(1.50D, BeaconPlusGravity.getPullStrength(0));', '        assertEquals(0.45D, BeaconPlusGravity.getPullStrength(0));')
          replace_exact(
              test,
              '        assertEquals(2.10D, BeaconPlusGravity.getPullStrength(1));',
              '        assertEquals(0.63D, BeaconPlusGravity.getPullStrength(1));\n'
              '        assertEquals(\n'
              '                BeaconPlusGravity.getPullStrength(0) * 1.4D,\n'
              '                BeaconPlusGravity.getPullStrength(1),\n'
              '                1.0E-9D);',
          )

          verifier = 'scripts/verify_adventurers_curios.py'
          replace_exact(
              verifier,
              '            "Math.max(-1.25D, Math.min(1.25D, pull.getY()))",\n',
              '            "double horizontalDistanceSquared = deltaX * deltaX + deltaZ * deltaZ",\n'
              '            "currentVelocity.getX() * 0.75D + deltaX * scale",\n'
              '            "currentVelocity.getY()",\n'
              '            "currentVelocity.getZ() * 0.75D + deltaZ * scale",\n',
          )
          replace_exact(verifier, '            "NORMAL_PULL = 1.50D",\n', '            "NORMAL_PULL = 0.45D",\n')
          replace_exact(verifier, '            "EXTRA_POWER_PULL = 2.10D",\n', '            "EXTRA_POWER_PULL = 0.63D",\n')
          replace_exact(
              verifier,
              '            "40%",\n            "No proprietary BeaconPlus runtime classes or source code are copied",\n',
              '            "40%",\n            "horizontal reverse-knockback",\n            "existing Y velocity is preserved",\n            "No proprietary BeaconPlus runtime classes or source code are copied",\n',
          )
          replace_exact(
              verifier,
              '        "- crop and tile-entity work is capped and unloaded chunks are not scanned for normal field effects\\n"\n',
              '        "- crop and tile-entity work is capped and unloaded chunks are not scanned for normal field effects\\n"\n'
              '        "- Gravity Well uses a controlled horizontal reverse-knockback pull and preserves existing Y velocity\\n"\n',
          )

          docs = 'docs/ADVENTURERS_CURIOS.md'
          old_docs = '21. **Gravity Well** — strongly pulls Bukkit mobs, including Endermen and passive/hostile AI mobs, plus loose item entities toward the beacon once per second. Players and armor stands are excluded. Normal pull strength is 1.50 versus the prior 0.30 setting, exactly 5× the previous normal pull; Extra Power raises it to 2.10.'
          new_docs = "21. **Gravity Well** — applies a controlled horizontal reverse-knockback pull toward the beacon once per second to Bukkit mobs, including Endermen and passive/hostile AI mobs, plus loose item entities. Players and armor stands are excluded. Normal horizontal pull strength is 0.45; Extra Power raises it to 0.63. The effect never adds vertical force: each target's existing Y velocity is preserved, so jumping and falling are not cancelled or yanked vertically."
          replace_exact(docs, old_docs, new_docs)
          PY

      - name: Format and verify focused changes
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew spotlessApply --no-daemon
          python3 scripts/verify_adventurers_curios.py .
          ./gradlew test --no-daemon
          if grep -nE 'NORMAL_PULL = 1\.50D|EXTRA_POWER_PULL = 2\.10D|Math\.max\(-1\.25D|exactly 5× the previous normal pull' \
              src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusGravity.java \
              src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusRuntime.java \
              src/test/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusEffectTest.java \
              scripts/verify_adventurers_curios.py \
              docs/ADVENTURERS_CURIOS.md; then
            echo 'Old Gravity Well tuning still present.' >&2
            exit 1
          fi

      - name: Commit clean feature changes and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-horizontal-gravity-retune.yml
          git add \
            docs/ADVENTURERS_CURIOS.md \
            scripts/verify_adventurers_curios.py \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusGravity.java \
            src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusRuntime.java \
            src/test/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusEffectTest.java
          git diff --cached --check
          git commit -m 'Retune Gravity Well to horizontal reverse knockback'
          git push origin HEAD:fix/gravity-well-horizontal-reverse-knockback

name: Prepare Slimefun Legacy 4.1.63
on:
  push:
    branches: ['work/release-4.1.63-preparation-20261001']
    paths: ['.github/workflows/prepare-release-4.1.63.yml']
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 20f7c554b9b3543bc99cd9fd367f0149a784829f
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Integrate only the inspected master change
        run: |
          set -euo pipefail
          mkdir -p evidence inputs
          git fetch origin master
          test "$(git rev-parse origin/master)" = 914aa81e74289a5729ebf8821902e08a7899bb3e
          git config user.name wickidcow
          git config user.email 185013218+wickidcow@users.noreply.github.com
          git merge --no-ff --no-commit 914aa81e74289a5729ebf8821902e08a7899bb3e
          git diff --cached --name-only > evidence/master-files.txt
          test "$(wc -l < evidence/master-files.txt)" -eq 5
      - name: Restore the inspected retry and historical-upgrade tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,io,json,subprocess,zipfile
          from pathlib import Path
          raw=subprocess.run(['gh','api','repos/wickidcow/Slimefun-Legacy/actions/artifacts/11161400547/zip'],check=True,capture_output=True,timeout=120).stdout
          assert hashlib.sha256(raw).hexdigest()=='a5881c54acbfad9f5b7a0c7d757b7959169aa254b36d76b772daf20456f490ee'
          mapping={
            'scripts/paper_family_26_2_runtime_smoke.sh':['8a634f8af6727ce94b3eb349d7b8df0b97744b32','8289c3ed300817e636a10452bf6beca92af928d7'],
            'scripts/paper_26_3_runtime_smoke.sh':['d2649e7f681cac9e1cf049c28a84f3ad93188f1f','86909197533fc457a31ae0cc1ad0267589de6bbc'],
            'scripts/addon_runtime_smoke.sh':['bcb12920587051898f7843f6650af8b30f08d724','53411e44a5b96ac23393d4f00d38be6762dcd81a'],
            'scripts/verify_legacy.py':['d3f0ef91fc084a0d1686584f7b82f30567bc4496','6cceb6a1edb515e902b9a64190d4c982abf2a160'],
            'scripts/legacy_item_upgrade_probe.sh':[None,'fda8fe6a9d98c76d0ddfec575eaa31815c689a46'],
            'scripts/test_runtime_download.py':[None,'74d51fc9bcce2050c7aa4058db74a6dcce9d4e6e'],
            'scripts/paper_runtime_smoke.sh':['68ca65548c206afe5d01c319201a20c2b712796f','936c5e15f25de66f871ba2ce3a501df6d4c9fca5'],
            'scripts/full_stack_runtime_smoke.sh':['088f636aa72de8b194efa638cabb0aac6dcb9594','95ca1d7ad860a4a14ad70be31cf4e11ad07e0690'],
            'scripts/legacy_1_21_11_runtime_smoke.sh':['f33239d040bfed5e7ab6dce6bdedfe4de590056a','074845eb37f55cc7170d1977044ad0fbda24df61'],
            'scripts/proxy_runtime_smoke.sh':['b008fb93d3d867f58926adccfeef77b3863ed724','2ecceeb2f226afab0dde81df3b2aa850e56c416e'],
            'scripts/runtime_download.sh':[None,'9c066f8ba89b265c22b0c010369e47a42d87047a'],
            'scripts/upgrade-fixture/LegacyItemUpgradeProbe.java':[None,'b1d73f6c7e9ef7a390cbdbc7918497f8badba52b'],
            'scripts/upgrade-fixture/plugin.yml':[None,'4c6f00726054bd9badc670d7bbf6312bdd285479']}
          blob=lambda b:hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              for name,(old,new) in mapping.items():
                  path=Path(name)
                  assert (not path.exists()) if old is None else blob(path.read_bytes())==old,name
                  data=archive.read('audit-evidence/tested-source/'+name);assert blob(data)==new,name
                  path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data)
                  if name.endswith('.sh'):path.chmod(0o755)
          Path('evidence/restored-files.json').write_text(json.dumps(mapping,indent=2))
          PY
      - name: Prepare one coordinated version without changing the previous stable baseline
        run: |
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          version='4.1.63';previous='4.1.62';changed=[]
          path=Path('gradle.properties');text=path.read_text();assert 'projectVersion=4.1.62' in text
          path.write_text(text.replace('4.1.62','4.1.63').replace('Paper 26.3 primary compatibility and guide stability','Existing-item preservation and coordinated addon stability'));changed.append(str(path))
          for name in ['compatibility/support-contract.json','compatibility/addon-compatibility-matrix.json','compatibility/cross-fork-api-matrix.json','compatibility/core-api-registry.json']:
              path=Path(name);data=json.loads(path.read_text());assert data['release']==previous;data['release']=version
              path.write_text(json.dumps(data,indent=2)+'\n');changed.append(name)
          path=Path('compatibility/release-baselines.json');data=json.loads(path.read_text());assert data['candidate']['version']==previous
          assert data['previous_stable']['version']=='4.1.61' and data['previous_stable']['source']['ref']=='24a1030f1d4c6c4a928b939150befb4c5adc5b2e'
          data['candidate']['version']=version;path.write_text(json.dumps(data,indent=2)+'\n');changed.append(str(path))
          path=Path('README.md');text=path.read_text();assert 'Development candidate: **4.1.62' in text
          text=text.replace('4.1.62','4.1.63').replace('4.1.63 — Paper 26.3 Primary Compatibility & Guide Stability','4.1.63 — Existing-Item Preservation & Addon Stability')
          path.write_text(text);changed.append(str(path))
          notes='''# Slimefun Legacy 4.1.63

          This release candidate combines the unreleased 4.1.62 compatibility work with the coordinated existing-item and addon-preservation fixes. The previous published stable baseline remains 4.1.61. Do not treat a candidate version or a passing compile as permission to skip backups and staging-server verification.

          ## Existing items and storage

          Preserve item and research IDs, typed persistent keys, owner and backpack identities, machine contents and old item readers. Incomplete inventory reads must not be saved as empty inventories. Stage complete item serialization before database writes and retain recovery guards on failed loads or migrations. Item Doctor presentation repair keeps existing charge and custom metadata rather than rebuilding player items from current templates. New addon-created profiles retain a supplied machine-player name during their initial database write.

          These changes do not globally convert world data, replace the native item writer, enable an optional migration, change ordinary recipes, production speeds, energy costs or transfer priorities. United-to-Legacy upgrades remain relevant; direct reverse compatibility with every United reader is not promised.

          ## Guide and maintained addon bundle

          Retain the current master's child-folder visibility fix alongside the complete preservation branch. Guide recipe browsing, ownership, first-join delivery and cheat-click behavior retain their existing compatibility checks.

          Rebuild all 45 maintained addon JARs from the exact source manifest against this release core. The aggregate SF_Addons_1.21.11-26.3.zip contains installable JARs plus source/hash records, not placeholder plugins. The final manifest and test ledger identify each selected source; any further verified addon refresh is recorded before publication.

          The included preservation work covers Networks storage lookup and transfer behavior; InfinityExpansion2 metadata conversion; Supreme and FinalTECH item/configuration boundaries; SlimeEasy native-floor and profile compatibility; saved progression/preferences in Cultivation, CrystamaeHistoria, Galactifun, SlimeHUD and Advancements; FNAmplifications gem operations; LiteXpansion configurator data; and MagicExpansion complete payment, page selection, strict shop-file saves and identity-bound editor/chat actions.

          ## Runtime and release validation

          Minecraft 1.21.11 is the runtime floor, not an age limit for saved data. Build with Java 25 and retain Java 21 plugin bytecode. Paper/Purpur are primary; Folia and other derivative-server gameplay and addon region safety remain qualified rather than universally certified. Record the actual build channel for 26.3 runtime tests instead of calling a beta server stable.

          Runtime downloads use bounded retries and temporary files without switching build identities or weakening existing metadata/hash checks. The retained historical-item fixture can write real 1.20.6-era item encodings and world items, then check unchanged identities and typed data after supported-server upgrades, restart and explicit automatic-Doctor tests on disposable copies.

          Require the new version's own full core tests, public API checks, canonical 45-addon build, provider-complete restart checks and reproducible-release workflow. Historical tests and mock fixtures remain individually attributed. They do not certify every captured customer world, populated machine, cross-region interaction, crash scenario or future upstream API.

          ## Upgrade procedure

          Stop the server cleanly and back up the entire world and plugin data, including the Slimefun database and addon directories. Test the matching new core and intended addon JARs on a disposable copy first. Replace each existing plugin JAR rather than leaving duplicate old/new copies, and do not install unwanted addons merely because they are in the aggregate ZIP. Keep the same item/addon registrations and migration settings unless deliberately changing them.

          Inspect startup diagnostics and /sf doctor storage recovery before running any optional repair or conversion. An unavailable or unreadable record is a recovery task, not an empty inventory to overwrite. Plugin rollback does not guarantee Minecraft world-version downgrade compatibility.
          '''
          import textwrap
          notes=textwrap.dedent(notes)
          # The initial heading is unindented; normalize only the deliberate block indent.
          notes='\n'.join(line[10:] if line.startswith('          ') else line for line in notes.split('\n'))
          path=Path('docs/releases/4.1.63.md');assert not path.exists();path.write_text(notes);changed.append(str(path))
          path=Path('EVERYTHING_THAT_CHANGED.md');path.write_text(notes+'\n---\n\n'+path.read_text());changed.append(str(path))
          restored=json.loads(Path('evidence/restored-files.json').read_text())
          changed+=list(restored)
          changed+=Path('evidence/master-files.txt').read_text().splitlines()
          changed=sorted(set(changed));assert all(not p.startswith('.audit/') for p in changed)
          subprocess.run(['git','add','--',*changed],check=True)
          Path('evidence/prepared-paths.json').write_text(json.dumps(changed,indent=2))
          tree=subprocess.check_output(['git','write-tree'],text=True).strip();Path('evidence/prepared-tree.txt').write_text(tree+'\n')
          subprocess.run(['git','archive','--format=tar.gz','--output=evidence/prepared-source.tar.gz',tree],check=True)
          PY
          git diff --cached --check
          git diff --cached --stat > evidence/prepared-stat.txt
      - name: Run all retained invariants and the full versioned core build
        run: |
          set -euo pipefail
          export SOURCE_COMMIT="$GITHUB_SHA"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> "$GITHUB_ENV"
          python3 scripts/verify_legacy.py . 2>&1 | tee evidence/invariants.log
          chmod +x gradlew
          ./gradlew spotlessApply --no-daemon --no-build-cache --no-configuration-cache > evidence/format.log 2>&1
          ./gradlew clean build -PslimefunDeprecationReport=true --no-daemon --no-build-cache --no-configuration-cache --console=plain 2>&1 | tee evidence/core-build.log
          python3 scripts/summarize_deprecations.py evidence/core-build.log --fail-on-warnings --require-successful-build
          JAR="$(find build/libs -maxdepth 1 -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          python3 scripts/check_bytecode_target.py "$JAR" --expected-java 21
          python3 scripts/verify_release_artifact.py "$JAR" --root . --expected-source "$GITHUB_SHA"
          cp "$JAR" inputs/Slimefun-Legacy4.1.63-preparation.jar
          mkdir -p evidence/tests
          cp build/test-results/test/TEST-*.xml evidence/tests/
          sha256sum inputs/*.jar > evidence/core-sha256.txt
      - name: Store the validated source tree without updating a branch or publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess,xml.etree.ElementTree as ET
          from pathlib import Path
          roots=[ET.parse(p).getroot() for p in Path('evidence/tests').glob('TEST-*.xml')]
          counts={k:sum(int(r.get(k,0)) for r in roots) for k in ['tests','failures','errors','skipped']}
          assert counts['tests']>=493 and counts['failures']==counts['errors']==0 and counts['skipped']<=1,counts
          Path('evidence/test-summary.json').write_text(json.dumps(counts,indent=2))
          entries=[]
          for name in json.loads(Path('evidence/prepared-paths.json').read_text()):
              content=subprocess.check_output(['git','show',':'+name]).decode()
              mode=subprocess.check_output(['git','ls-files','-s','--',name],text=True).split()[0]
              entries.append(dict(path=name,mode=mode,type='blob',content=content))
          base=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          response=subprocess.run(['gh','api','--method','POST','repos/wickidcow/Slimefun-Legacy/git/trees','--input','-'],input=json.dumps(dict(base_tree=base,tree=entries)),check=True,text=True,capture_output=True)
          result=json.loads(response.stdout)
          assert result['sha']==Path('evidence/prepared-tree.txt').read_text().strip()
          Path('evidence/staged-tree.json').write_text(json.dumps(dict(tree=result['sha'],base='20f7c554b9b3543bc99cd9fd367f0149a784829f',master='914aa81e74289a5729ebf8821902e08a7899bb3e',version='4.1.63',paths=[r['path'] for r in entries],test_counts=counts,published=False),indent=2))
          PY
      - name: Keep actual failure evidence
        if: always()
        run: |
          mkdir -p evidence/latest-tests
          if test -d build/test-results/test; then cp build/test-results/test/TEST-*.xml evidence/latest-tests/ || true; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-4.1.63-preparation-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: release-4.1.63-preparation-core
          path: inputs/
          retention-days: 14
          if-no-files-found: error

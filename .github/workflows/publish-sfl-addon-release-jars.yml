name: Validate verified SF addon JARs

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-sfl-addon-release-jars.yml'
      - 'scripts/verify_published_addon_bundle.py'
      - 'scripts/test_verify_published_addon_bundle.py'
  pull_request:
    paths:
      - '.github/workflows/publish-sfl-addon-release-jars.yml'
      - 'scripts/verify_published_addon_bundle.py'
      - 'scripts/test_verify_published_addon_bundle.py'
  workflow_run:
    workflows: ['Build SF Addons 1.21.11-26.3 Bundle']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-sf-addon-release-jars-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'release' }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate published addon JARs
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run public-name and archive safety regressions
        run: python3 -m unittest discover -s scripts -p 'test_verify_published_addon_bundle.py' -v
      - name: Resolve the latest stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p download
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > download/release.json
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          release = json.loads(Path('download/release.json').read_text())
          assert not release['draft'] and not release['prerelease']
          assert re.fullmatch(r'v[0-9]+(?:\.[0-9]+)+', release['tag_name'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tag=' + release['tag_name'] + '\n')
          PY
      - name: Download and verify the published asset checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'SF_Addons_1.21.11-26.3.zip' --dir download
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          name = 'SF_Addons_1.21.11-26.3.zip'
          release = json.loads(Path('download/release.json').read_text())
          matches = [asset for asset in release['assets'] if asset['name'] == name]
          assert len(matches) == 1 and matches[0]['state'] == 'uploaded'
          digest = matches[0].get('digest')
          assert isinstance(digest, str) and re.fullmatch(r'sha256:[0-9a-f]{64}', digest), 'Published asset has no verifiable SHA-256'
          assert digest == 'sha256:' + hashlib.sha256(Path('download', name).read_bytes()).hexdigest(), 'Published ZIP checksum mismatch'
          PY
      - name: Verify complete JAR membership, names, checksums and archives
        run: python3 scripts/verify_published_addon_bundle.py download/SF_Addons_1.21.11-26.3.zip > download/validation.json
      - name: Publish validation summary
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path('download/validation.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('## Verified published addon bundle\n\n')
              output.write(f"Release: {os.environ['TAG']}\n\n")
              output.write(f"Validated {result['addon_count']} JARs for the declared {result['minimum']} through {result['primary']} range.\n\n")
              output.write('No files were extracted, modified or published. Archive validation is not a new gameplay test.\n')
          PY
      - name: Retain published-asset verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-addon-validation
          path: |
            download/release.json
            download/validation.json
          retention-days: 14
          if-no-files-found: warn

name: Verify Slimefun Legacy 4.1.30C Maintenance Version

on:
  push:
    branches:
      - "feature/adventurers-curios-expansion"

jobs:
  verify-maintenance-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/adventurers-curios-expansion
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Apply maintenance version verifier support
        run: python3 scripts/apply_4130c_version_verifier_fix.py

      - name: Run full Slimefun Legacy verifier
        run: python3 scripts/verify_legacy.py .

      - name: Format and build 4.1.30C
        run: |
          chmod +x gradlew
          ./gradlew spotlessApply --no-daemon
          ./gradlew clean build --no-daemon
          JAR="$(find build/libs -name 'Slimefun-4.1.30C.jar' -print -quit)"
          test -n "$JAR"
          python3 scripts/check_bytecode_target.py "$JAR" --expected-java 21
          python3 scripts/verify_release_artifact.py "$JAR" --root .

      - name: Commit verified verifier changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify_phase1k_release_readiness.py \
            scripts/verify_core_platform_phase1l.py \
            scripts/verify_phase1l_release_artifact.py \
            scripts/verify_core_platform_phase1l_part3.py \
            scripts/verify_core_platform_phase1l_part4.py \
            scripts/verify_release_artifact.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(ci): support 4.1.30 maintenance suffixes"
          git push origin HEAD:feature/adventurers-curios-expansion

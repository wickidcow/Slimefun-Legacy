name: Verify Slimefun Legacy 4.1.30C Maintenance Version

on:
  push:
    branches:
      - "feature/adventurers-curios-expansion"

jobs:
  verify-maintenance-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/adventurers-curios-expansion
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Apply 4.1.30C maintenance metadata
        run: |
          python3 scripts/apply_4130c_version_verifier_fix.py
          python3 scripts/apply_4130c_readme_version.py

      - name: Run full Slimefun Legacy verifier
        id: legacy
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 scripts/verify_legacy.py . > verify-legacy.log 2>&1
          STATUS=$?
          cat verify-legacy.log
          exit $STATUS

      - name: Upload verifier report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-legacy-4130c
          path: |
            verify-legacy.log
            build/reports/
          if-no-files-found: warn

      - name: Fail if Legacy verifier failed
        if: steps.legacy.outcome != 'success'
        run: exit 1

      - name: Format and build 4.1.30C
        run: |
          chmod +x gradlew
          ./gradlew spotlessApply --no-daemon
          ./gradlew clean build --no-daemon
          JAR="$(find build/libs -name 'Slimefun-4.1.30C.jar' -print -quit)"
          test -n "$JAR"
          python3 scripts/check_bytecode_target.py "$JAR" --expected-java 21
          python3 scripts/verify_release_artifact.py "$JAR" --root .

      - name: Commit verified maintenance metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md \
            scripts/verify_phase1k_release_readiness.py \
            scripts/verify_core_platform_phase1l.py \
            scripts/verify_phase1l_release_artifact.py \
            scripts/verify_core_platform_phase1l_part3.py \
            scripts/verify_core_platform_phase1l_part4.py \
            scripts/verify_release_artifact.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(ci): support 4.1.30 maintenance suffixes"
          git push origin HEAD:feature/adventurers-curios-expansion

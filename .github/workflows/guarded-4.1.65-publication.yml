name: Guarded 4.1.65 Publication and Receipt
on:
  push:
    branches: ['audit/publish-4.1.65-20261002']
    paths: ['.github/workflows/guarded-4.1.65-publication.yml', 'audit-publication/publish_4_1_65.py']
permissions:
  contents: write
  actions: write
concurrency:
  group: guarded-publication-4.1.65
  cancel-in-progress: true
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate dispatcher syntax before any remote change
        run: python3 -m py_compile audit-publication/publish_4_1_65.py
      - name: Verify exact merged source, dispatch the unchanged publisher and inspect public assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p publication-evidence published-files
          python3 -u - <<'PY' 2>&1 | tee publication-evidence/dispatcher.log
          import json, os, runpy, subprocess, time
          # The retained artifact verifier reads SOURCE_COMMIT before GITHUB_SHA.
          # Give it the actual merged release identity, never this temporary runner's commit.
          for attempt in range(180):
              pr = json.loads(subprocess.check_output(['gh', 'api', 'repos/wickidcow/Slimefun-Legacy/pulls/311']))
              assert pr['head']['sha'] == '6325bf812db09d6fdc914d7700b8aabf09cd51c1'
              if pr['merged']:
                  break
              assert pr['state'] == 'open'
              time.sleep(10)
          assert pr['merged']
          os.environ['SOURCE_COMMIT'] = pr['merge_commit_sha']
          runpy.run_path('audit-publication/publish_4_1_65.py', run_name='__main__')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: slimefun-4.1.65-publication-receipt
          path: publication-evidence/
          retention-days: 30
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: slimefun-4.1.65-published-files
          path: published-files/
          retention-days: 30
          if-no-files-found: error

name: Build Slimefun Legacy 4.1.31 Beacon Energy Update

on:
  push:
    branches:
      - "feature/adventurers-curios-expansion"

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/adventurers-curios-expansion
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Apply 4.1.31 source update
        run: python3 scripts/apply_4131_beacon_energy.py

      - name: Run full Slimefun Legacy verifier
        run: python3 scripts/verify_legacy.py .

      - name: Format and build
        run: |
          chmod +x gradlew
          ./gradlew spotlessApply --no-daemon
          ./gradlew clean build --no-daemon
          JAR="$(find build/libs -name 'Slimefun-4.1.31.jar' -print -quit)"
          test -n "$JAR"
          python3 scripts/check_bytecode_target.py "$JAR" --expected-java 21
          python3 scripts/verify_release_artifact.py "$JAR" --root .

      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows/apply-4131-beacon-energy.yml scripts/apply_4131_beacon_energy.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(curios): add electric Resonance Beacon operation in 4.1.31"
          git push origin HEAD:feature/adventurers-curios-expansion

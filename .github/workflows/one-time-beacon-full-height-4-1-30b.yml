name: One-time Beacon Full-height 4.1.30B Update

on:
  push:
    branches:
      - feature/adventurers-curios-expansion
    paths:
      - .github/workflows/one-time-beacon-full-height-4-1-30b.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/adventurers-curios-expansion
          fetch-depth: 0

      - name: Apply chunk-column field update
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ROOT = Path('.')
          BASE = ROOT / 'src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios'

          def replace_once(path: Path, old: str, new: str):
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}:\n{old[:240]}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          field = BASE / 'BeaconPlusField.java'
          field.write_text('''package io.github.thebusybiscuit.slimefun4.implementation.items.curios;\n\n/** Shared chunk-aligned horizontal footprint for Resonance Beacon field powers. */\nfinal class BeaconPlusField {\n\n    private static final double CHUNK_SIZE = 16.0D;\n\n    private BeaconPlusField() {}\n\n    static int chunkRadius(double range) {\n        if (!Double.isFinite(range) || range <= 0.0D) {\n            return 0;\n        }\n        return Math.max(0, (int) Math.ceil(range / CHUNK_SIZE) - 1);\n    }\n\n    static ChunkFootprint footprint(int beaconBlockX, int beaconBlockZ, double range) {\n        int radius = chunkRadius(range);\n        int centerChunkX = beaconBlockX >> 4;\n        int centerChunkZ = beaconBlockZ >> 4;\n        return new ChunkFootprint(\n                centerChunkX - radius,\n                centerChunkX + radius,\n                centerChunkZ - radius,\n                centerChunkZ + radius);\n    }\n\n    static boolean contains(\n            int beaconBlockX, int beaconBlockZ, double range, int targetBlockX, int targetBlockZ) {\n        return range > 0.0D\n                && footprint(beaconBlockX, beaconBlockZ, range).containsChunk(targetBlockX >> 4, targetBlockZ >> 4);\n    }\n\n    record ChunkFootprint(int minChunkX, int maxChunkX, int minChunkZ, int maxChunkZ) {\n\n        int widthChunks() {\n            return maxChunkX - minChunkX + 1;\n        }\n\n        int minBlockX() {\n            return minChunkX << 4;\n        }\n\n        int maxBlockXExclusive() {\n            return (maxChunkX + 1) << 4;\n        }\n\n        int minBlockZ() {\n            return minChunkZ << 4;\n        }\n\n        int maxBlockZExclusive() {\n            return (maxChunkZ + 1) << 4;\n        }\n\n        boolean containsChunk(int chunkX, int chunkZ) {\n            return chunkX >= minChunkX && chunkX <= maxChunkX && chunkZ >= minChunkZ && chunkZ <= maxChunkZ;\n        }\n    }\n}\n''', encoding='utf-8')

          runtime = BASE / 'BeaconPlusRuntime.java'
          replace_once(runtime, '''            double range = getRange(block, tiers);\n            Location beaconLocation = block.getLocation().add(0.5D, 0.5D, 0.5D);\n            if (range <= 0.0D || beaconLocation.distanceSquared(target) > range * range) {\n                continue;\n            }\n''', '''            double range = getRange(block, tiers);\n            if (range <= 0.0D\n                    || !BeaconPlusField.contains(\n                            block.getX(), block.getZ(), range, target.getBlockX(), target.getBlockZ())) {\n                continue;\n            }\n''')
          replace_once(runtime, '''    static int getEffectiveTierAtBeacon(Block block, BeaconPlusEffect effect) {\n        return getActiveTiers(block).getOrDefault(effect, 0);\n    }\n''', '''    static int getEffectiveTierAtBeacon(Block block, BeaconPlusEffect effect) {\n        return getActiveTiers(block).getOrDefault(effect, 0);\n    }\n\n    static double getEffectiveRange(Block block) {\n        return getRange(block, getActiveTiers(block));\n    }\n''')

          effects = BASE / 'BeaconPlusRuntimeEffects.java'
          replace_once(effects, 'for (Entity entity : getEntities(block, center, range)) {', 'for (Entity entity : getEntities(block, range)) {')
          replace_once(effects, 'applyTileEntityBoosts(block, center, range, furnaceTier, spawnerTier);', 'applyTileEntityBoosts(block, range, furnaceTier, spawnerTier);')
          replace_once(effects, 'applyCropBoost(block, center, range, cropTier);', 'applyCropBoost(block, range, cropTier);')
          replace_once(effects, '''        Location center = block.getLocation().add(0.5D, 0.5D, 0.5D);\n        for (Entity entity : getEntities(block, center, range)) {\n''', '''        for (Entity entity : getEntities(block, range)) {\n''')
          replace_once(effects, '''    private static Collection<Entity> getEntities(Block block, Location center, double range) {\n        if (Slimefun.getSchedulerService().isFolia()) {\n            List<Entity> result = new ArrayList<>();\n            double rangeSquared = range * range;\n            for (Entity entity : block.getChunk().getEntities()) {\n                if (entity.getLocation().distanceSquared(center) <= rangeSquared) {\n                    result.add(entity);\n                }\n            }\n            return result;\n        }\n        return block.getWorld().getNearbyEntities(center, range, range, range);\n    }\n''', '''    private static Collection<Entity> getEntities(Block block, double range) {\n        List<Entity> result = new ArrayList<>();\n        for (Chunk chunk : getLoadedChunksInField(block, range)) {\n            for (Entity entity : chunk.getEntities()) {\n                result.add(entity);\n            }\n        }\n        return result;\n    }\n''')
          replace_once(effects, '''    private static void applyTileEntityBoosts(\n            Block beaconBlock, Location center, double range, int furnaceTier, int spawnerTier) {\n        int inspected = 0;\n        double rangeSquared = range * range;\n        for (Chunk chunk : getLoadedChunksInRange(beaconBlock, range)) {\n            for (BlockState state : chunk.getTileEntities()) {\n                if (++inspected > MAX_TILE_ENTITIES_PER_PULSE) {\n                    return;\n                }\n                if (state.getLocation().distanceSquared(center) > rangeSquared) {\n                    continue;\n                }\n''', '''    private static void applyTileEntityBoosts(\n            Block beaconBlock, double range, int furnaceTier, int spawnerTier) {\n        int inspected = 0;\n        for (Chunk chunk : getLoadedChunksInField(beaconBlock, range)) {\n            for (BlockState state : chunk.getTileEntities()) {\n                if (++inspected > MAX_TILE_ENTITIES_PER_PULSE) {\n                    return;\n                }\n''')
          old_crop = '''    private static void applyCropBoost(Block beaconBlock, Location center, double range, int tier) {\n        ThreadLocalRandom random = ThreadLocalRandom.current();\n        int horizontal = Math.max(1, (int) Math.floor(range));\n        int samples = CROP_SAMPLES_PER_PULSE + (tier - 1) * 16;\n        for (int i = 0; i < samples; i++) {\n            int x = center.getBlockX() + random.nextInt(-horizontal, horizontal + 1);\n            int z = center.getBlockZ() + random.nextInt(-horizontal, horizontal + 1);\n            int y = center.getBlockY() + random.nextInt(-8, 9);\n            if (y < beaconBlock.getWorld().getMinHeight() || y >= beaconBlock.getWorld().getMaxHeight()) {\n                continue;\n            }\n            if (!beaconBlock.getWorld().isChunkLoaded(x >> 4, z >> 4)) {\n                continue;\n            }\n            if (Slimefun.getSchedulerService().isFolia()\n                    && (x >> 4 != beaconBlock.getX() >> 4 || z >> 4 != beaconBlock.getZ() >> 4)) {\n                continue;\n            }\n            Block target = beaconBlock.getWorld().getBlockAt(x, y, z);\n            if (target.getLocation().distanceSquared(center) > range * range) {\n                continue;\n            }\n            if (target.getBlockData() instanceof Ageable ageable && ageable.getAge() < ageable.getMaximumAge()) {\n                ageable.setAge(Math.min(ageable.getMaximumAge(), ageable.getAge() + tier));\n                target.setBlockData(ageable, false);\n            }\n        }\n    }\n\n    private static List<Chunk> getLoadedChunksInRange(Block beaconBlock, double range) {\n        List<Chunk> chunks = new ArrayList<>();\n        if (Slimefun.getSchedulerService().isFolia()) {\n            chunks.add(beaconBlock.getChunk());\n            return chunks;\n        }\n        int centerChunkX = beaconBlock.getX() >> 4;\n        int centerChunkZ = beaconBlock.getZ() >> 4;\n        int chunkRadius = Math.max(0, (int) Math.ceil(range / 16.0D));\n        World world = beaconBlock.getWorld();\n        for (int x = centerChunkX - chunkRadius; x <= centerChunkX + chunkRadius; x++) {\n            for (int z = centerChunkZ - chunkRadius; z <= centerChunkZ + chunkRadius; z++) {\n                if (world.isChunkLoaded(x, z)) {\n                    chunks.add(world.getChunkAt(x, z));\n                }\n            }\n        }\n        return chunks;\n    }\n'''
          new_crop = '''    private static void applyCropBoost(Block beaconBlock, double range, int tier) {\n        List<Chunk> chunks = getLoadedChunksInField(beaconBlock, range);\n        if (chunks.isEmpty()) {\n            return;\n        }\n        ThreadLocalRandom random = ThreadLocalRandom.current();\n        World world = beaconBlock.getWorld();\n        int samples = CROP_SAMPLES_PER_PULSE + (tier - 1) * 16;\n        for (int i = 0; i < samples; i++) {\n            Chunk chunk = chunks.get(random.nextInt(chunks.size()));\n            int x = (chunk.getX() << 4) + random.nextInt(16);\n            int z = (chunk.getZ() << 4) + random.nextInt(16);\n            int y = random.nextInt(world.getMinHeight(), world.getMaxHeight());\n            Block target = world.getBlockAt(x, y, z);\n            if (target.getBlockData() instanceof Ageable ageable && ageable.getAge() < ageable.getMaximumAge()) {\n                ageable.setAge(Math.min(ageable.getMaximumAge(), ageable.getAge() + tier));\n                target.setBlockData(ageable, false);\n            }\n        }\n    }\n\n    private static List<Chunk> getLoadedChunksInField(Block beaconBlock, double range) {\n        List<Chunk> chunks = new ArrayList<>();\n        if (Slimefun.getSchedulerService().isFolia()) {\n            chunks.add(beaconBlock.getChunk());\n            return chunks;\n        }\n        BeaconPlusField.ChunkFootprint footprint =\n                BeaconPlusField.footprint(beaconBlock.getX(), beaconBlock.getZ(), range);\n        World world = beaconBlock.getWorld();\n        for (int x = footprint.minChunkX(); x <= footprint.maxChunkX(); x++) {\n            for (int z = footprint.minChunkZ(); z <= footprint.maxChunkZ(); z++) {\n                if (world.isChunkLoaded(x, z)) {\n                    chunks.add(world.getChunkAt(x, z));\n                }\n            }\n        }\n        return chunks;\n    }\n'''
          replace_once(effects, old_crop, new_crop)

          visual = BASE / 'BeaconPlusAreaVisualizer.java'
          replace_once(visual, ''' * <p>This is deliberately not a 29th beacon power. It stores one display toggle on the placed Slimefun block and\n * renders a sparse three-ring wireframe at the exact runtime effect radius. Rendering is packet-only, does not load\n * chunks, and is scheduled on each viewing player's scheduler for Folia safety.\n''', ''' * <p>This is deliberately not a 29th beacon power. It stores one display toggle on the placed Slimefun block and\n * renders the exact chunk-aligned square footprint used by field powers. The preview follows each viewer's current\n * Y level because the field covers the full world height. Rendering is packet-only and never loads chunks.\n''')
          replace_once(visual, '''    private static final int MENU_SLOT = 45;\n    private static final int RING_POINTS = 24;\n    private static final long RENDER_INTERVAL_TICKS = 40L;\n    private static final double VIEW_MARGIN = 48.0D;\n    private static final int EXTRA_RANGE_PER_TIER = 10;\n''', '''    private static final int MENU_SLOT = 45;\n    private static final int GRID_POINT_STEP = 8;\n    private static final int VIEW_MARGIN_CHUNKS = 3;\n    private static final int MAX_PARTICLES_PER_VIEWER = 512;\n    private static final long RENDER_INTERVAL_TICKS = 40L;\n''')
          old_render = '''        double range = getEffectiveRange(block);\n        if (range <= 0.0D) {\n            return;\n        }\n\n        UUID worldId = world.getUID();\n        double centerX = block.getX() + 0.5D;\n        double centerY = block.getY() + 0.5D;\n        double centerZ = block.getZ() + 0.5D;\n        double viewerRange = range + VIEW_MARGIN;\n        double viewerRangeSquared = viewerRange * viewerRange;\n\n        for (Player player : Bukkit.getOnlinePlayers()) {\n            Slimefun.getSchedulerService().runFor(player, () -> {\n                if (!player.isOnline() || !player.getWorld().getUID().equals(worldId)) {\n                    return;\n                }\n                Location viewer = player.getLocation();\n                double dx = viewer.getX() - centerX;\n                double dy = viewer.getY() - centerY;\n                double dz = viewer.getZ() - centerZ;\n                if (dx * dx + dy * dy + dz * dz > viewerRangeSquared) {\n                    return;\n                }\n                renderWireframe(player, centerX, centerY, centerZ, range);\n            });\n        }\n    }\n\n    private static void renderWireframe(Player player, double centerX, double centerY, double centerZ, double radius) {\n        int minHeight = player.getWorld().getMinHeight();\n        int maxHeight = player.getWorld().getMaxHeight();\n        for (int index = 0; index < RING_POINTS; index++) {\n            double angle = Math.PI * 2.0D * index / RING_POINTS;\n            double cos = Math.cos(angle) * radius;\n            double sin = Math.sin(angle) * radius;\n\n            spawn(player, centerX + cos, centerY, centerZ + sin, minHeight, maxHeight);\n            spawn(player, centerX + cos, centerY + sin, centerZ, minHeight, maxHeight);\n            spawn(player, centerX, centerY + sin, centerZ + cos, minHeight, maxHeight);\n        }\n    }\n\n    private static void spawn(Player player, double x, double y, double z, int minHeight, int maxHeight) {\n        if (y < minHeight || y >= maxHeight) {\n            return;\n        }\n        player.spawnParticle(Particle.END_ROD, x, y, z, 1, 0.0D, 0.0D, 0.0D, 0.0D);\n    }\n\n    private static double getEffectiveRange(Block block) {\n        BlockState state = block.getState();\n        if (!(state instanceof Beacon beacon) || beacon.getTier() <= 0) {\n            return 0.0D;\n        }\n        double importedOverride = BeaconPlusLegacyDataStore.getImportedOverriddenRange(block.getLocation());\n        double range = importedOverride > 0.0D ? importedOverride : Math.max(0.0D, beacon.getEffectRange());\n        int extraRangeTier = BeaconPlusRuntime.getEffectiveTierAtBeacon(block, BeaconPlusEffect.EXTRA_RANGE);\n        return extraRangeTier > 0 ? range + EXTRA_RANGE_PER_TIER * extraRangeTier : range;\n    }\n'''
          new_render = '''        double range = BeaconPlusRuntime.getEffectiveRange(block);\n        if (range <= 0.0D) {\n            return;\n        }\n\n        BeaconPlusField.ChunkFootprint footprint = Slimefun.getSchedulerService().isFolia()\n                ? BeaconPlusField.footprint(block.getX(), block.getZ(), 1.0D)\n                : BeaconPlusField.footprint(block.getX(), block.getZ(), range);\n        UUID worldId = world.getUID();\n\n        for (Player player : Bukkit.getOnlinePlayers()) {\n            Slimefun.getSchedulerService().runFor(player, () -> {\n                if (!player.isOnline() || !player.getWorld().getUID().equals(worldId)) {\n                    return;\n                }\n                Location viewer = player.getLocation();\n                int viewerChunkX = viewer.getBlockX() >> 4;\n                int viewerChunkZ = viewer.getBlockZ() >> 4;\n                if (viewerChunkX < footprint.minChunkX() - VIEW_MARGIN_CHUNKS\n                        || viewerChunkX > footprint.maxChunkX() + VIEW_MARGIN_CHUNKS\n                        || viewerChunkZ < footprint.minChunkZ() - VIEW_MARGIN_CHUNKS\n                        || viewerChunkZ > footprint.maxChunkZ() + VIEW_MARGIN_CHUNKS) {\n                    return;\n                }\n                double renderY = Math.max(\n                        world.getMinHeight() + 0.15D,\n                        Math.min(world.getMaxHeight() - 0.15D, Math.floor(viewer.getY()) + 0.15D));\n                renderChunkGrid(player, footprint, renderY);\n            });\n        }\n    }\n\n    private static void renderChunkGrid(\n            Player player, BeaconPlusField.ChunkFootprint footprint, double y) {\n        int minX = footprint.minBlockX();\n        int maxX = footprint.maxBlockXExclusive();\n        int minZ = footprint.minBlockZ();\n        int maxZ = footprint.maxBlockZExclusive();\n        int width = maxX - minX;\n        int gridLines = footprint.widthChunks() + 1;\n        long estimated = 2L * gridLines * (width / GRID_POINT_STEP + 1L);\n        int step = estimated > MAX_PARTICLES_PER_VIEWER ? 16 : GRID_POINT_STEP;\n        int sent = 0;\n\n        for (int x = minX; x <= maxX; x += 16) {\n            for (int z = minZ; z <= maxZ; z += step) {\n                spawn(player, x, y, z);\n                if (++sent >= MAX_PARTICLES_PER_VIEWER) {\n                    return;\n                }\n            }\n        }\n        for (int z = minZ; z <= maxZ; z += 16) {\n            for (int x = minX; x <= maxX; x += step) {\n                spawn(player, x, y, z);\n                if (++sent >= MAX_PARTICLES_PER_VIEWER) {\n                    return;\n                }\n            }\n        }\n    }\n\n    private static void spawn(Player player, double x, double y, double z) {\n        player.spawnParticle(Particle.END_ROD, x, y, z, 1, 0.0D, 0.0D, 0.0D, 0.0D);\n    }\n'''
          replace_once(visual, old_render, new_render)
          old_menu = '''        boolean enabled = isEnabled(block.getLocation());\n        double range = getEffectiveRange(block);\n        ItemStack item = new ItemStack(Material.SPYGLASS);\n        ItemMeta meta = item.getItemMeta();\n        meta.setDisplayName((enabled ? ChatColor.GREEN : ChatColor.GRAY) + "Show Effect Area");\n        meta.setLore(java.util.List.of(\n                ChatColor.GRAY + "Shows a sparse particle outline of the",\n                ChatColor.GRAY + "Resonance Beacon's actual effect radius.",\n                "",\n                ChatColor.GRAY + "Status: " + (enabled ? ChatColor.GREEN + "ON" : ChatColor.RED + "OFF"),\n                ChatColor.GRAY + "Current radius: "\n                        + (range > 0.0D ? ChatColor.AQUA.toString() + (int) Math.floor(range) + " blocks" : ChatColor.RED + "Dormant"),\n                "",\n                ChatColor.DARK_GRAY + "Display only • visible to nearby players",\n                ChatColor.DARK_GRAY + "Does not load chunks or change beacon powers",\n                "",\n                ChatColor.YELLOW + "Click to toggle"));\n'''
          new_menu = '''        boolean enabled = isEnabled(block.getLocation());\n        double range = BeaconPlusRuntime.getEffectiveRange(block);\n        BeaconPlusField.ChunkFootprint footprint = Slimefun.getSchedulerService().isFolia()\n                ? BeaconPlusField.footprint(block.getX(), block.getZ(), 1.0D)\n                : BeaconPlusField.footprint(block.getX(), block.getZ(), range);\n        ItemStack item = new ItemStack(Material.SPYGLASS);\n        ItemMeta meta = item.getItemMeta();\n        meta.setDisplayName((enabled ? ChatColor.GREEN : ChatColor.GRAY) + "Show Effect Area");\n        meta.setLore(java.util.List.of(\n                ChatColor.GRAY + "Shows the exact chunk-aligned square",\n                ChatColor.GRAY + "covered by Resonance Beacon field powers.",\n                "",\n                ChatColor.GRAY + "Status: " + (enabled ? ChatColor.GREEN + "ON" : ChatColor.RED + "OFF"),\n                ChatColor.GRAY + "Effect footprint: "\n                        + (range > 0.0D\n                                ? ChatColor.AQUA.toString() + footprint.widthChunks() + "x" + footprint.widthChunks() + " chunks"\n                                : ChatColor.RED + "Dormant"),\n                ChatColor.GRAY + "Vertical reach: " + ChatColor.AQUA + "Full world height",\n                "",\n                ChatColor.DARK_GRAY + "Particle grid follows your current Y level",\n                ChatColor.DARK_GRAY + "Display only • never loads extra chunks",\n                "",\n                ChatColor.YELLOW + "Click to toggle"));\n'''
          replace_once(visual, old_menu, new_menu)

          docs = ROOT / 'docs/ADVENTURERS_CURIOS.md'
          replace_once(docs, '''Extra Range adds 10 blocks per tier. Extra Power can raise supported field powers further, still capped at Tier III.\n\nActivator coverage is derived from its effective tier:\n''', '''Extra Range adds 10 blocks per tier. Extra Power can raise supported field powers further, still capped at Tier III.\n\nField powers use a **chunk-aligned square footprint** derived from the beacon's effective range. Every covered chunk is affected from the world's minimum build height through its maximum build height, so there is no vertical distance limit. Normal field powers still never load chunks on their own. The **Show Effect Area** control renders the exact covered chunk grid as a flat square at each viewer's current Y level.\n\nActivator coverage is derived from its effective tier:\n''')
          replace_once(docs, '- Normal field powers never load chunks.\n', '- Normal field powers cover full-height chunk columns but never load chunks.\n')

          verifier = ROOT / 'scripts/verify_adventurers_curios.py'
          replace_once(verifier, '''        "runtime": base + "BeaconPlusRuntime.java",\n        "runtime_effects": base + "BeaconPlusRuntimeEffects.java",\n''', '''        "runtime": base + "BeaconPlusRuntime.java",\n        "runtime_effects": base + "BeaconPlusRuntimeEffects.java",\n        "field": base + "BeaconPlusField.java",\n''')
          replace_once(verifier, '''        for token in ("MAX_TILE_ENTITIES_PER_PULSE = 96", "CROP_SAMPLES_PER_PULSE = 48", "repairInventory("):\n            req(token in runtime_effects, f"Bounded Resonance Beacon effects invariant missing: {token}", failures)\n''', '''        for token in ("MAX_TILE_ENTITIES_PER_PULSE = 96", "CROP_SAMPLES_PER_PULSE = 48", "repairInventory(", "getLoadedChunksInField"):\n            req(token in runtime_effects, f"Bounded Resonance Beacon effects invariant missing: {token}", failures)\n        field = read(root, files["field"])\n        for token in ("chunkRadius", "ChunkFootprint", "containsChunk", "widthChunks"):\n            req(token in field, f"Full-height chunk field invariant missing: {token}", failures)\n        req("distanceSquared(target)" not in runtime, "Resonance Beacon field must not retain a vertical/spherical distance limit", failures)\n''')
          replace_once(verifier, '''        "- Activator remains reference-counted and hard-capped\\n"\n''', '''        "- field powers use full-height chunk-aligned square footprints without loading chunks\\n"\n        "- Activator remains reference-counted and hard-capped\\n"\n''')

          gradle = ROOT / 'gradle.properties'
          replace_once(gradle, 'projectVersion=4.1.30\n', 'projectVersion=4.1.30B\n')
          PY

      - name: Remove one-time workflow from final source
        run: rm .github/workflows/one-time-beacon-full-height-4-1-30b.yml

      - name: Validate source and build
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_adventurers_curios.py .
          python3 scripts/verify_legacy.py .
          chmod +x gradlew
          ./gradlew spotlessApply test shadowJar --no-daemon

      - name: Commit final update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Make Resonance Beacon fields full-height chunk squares"
          git push origin HEAD:feature/adventurers-curios-expansion

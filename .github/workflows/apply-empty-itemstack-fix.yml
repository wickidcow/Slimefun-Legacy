name: Apply Empty ItemStack Storage Fix

on:
  push:
    branches:
      - doctor-legacy-machine-migration
    paths:
      - .github/workflows/apply-empty-itemstack-fix.yml

permissions:
  contents: write

jobs:
  patch-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: doctor-legacy-machine-migration
          fetch-depth: 1

      - name: Apply exact controller guards
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/com/xzavier0722/mc/plugin/slimefun4/storage/controller/BlockDataController.java')
          text = path.read_text(encoding='utf-8')
          old = '        if (item == null) {\n'
          new = '        if (item == null || item.getType().isAir() || item.getAmount() <= 0) {\n'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 inventory null guards, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit narrow storage fix
        run: |
          if git diff --quiet; then
            echo "No controller change produced" >&2
            exit 1
          fi
          git config user.name "wickidcow"
          git config user.email "185013218+wickidcow@users.noreply.github.com"
          git add src/main/java/com/xzavier0722/mc/plugin/slimefun4/storage/controller/BlockDataController.java
          git commit -m "Storage: delete effectively empty inventory slots"
          git push origin HEAD:doctor-legacy-machine-migration

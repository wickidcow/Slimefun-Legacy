name: One-shot Beacon Plus area and Gravity tuning

on:
  push:
    branches:
      - 'fix/gravity-well-strength-range'
    paths:
      - '.github/workflows/one-shot-gravity-well-tune.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tune:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out tuning branch
        uses: actions/checkout@v6
        with:
          ref: fix/gravity-well-strength-range
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Apply shared effect-area and Gravity Well tuning
        run: |
          python3 scripts/one_shot_gravity_well_tune.py
          python3 scripts/one_shot_gravity_well_test_isolation.py

      - name: Format only intended Java changes
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew spotlessApply --no-daemon

          git diff --name-only > "$RUNNER_TEMP/changed-files.txt"

          while IFS= read -r path; do
            case "$path" in
              src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlus.java|\
              src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusChunkMode.java|\
              src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusEffect.java|\
              src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusFieldArea.java|\
              src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusGravity.java|\
              src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusManager.java|\
              src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusPowerState.java|\
              src/main/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusRuntime.java|\
              src/test/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusChunkModeTest.java|\
              src/test/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusEffectTest.java|\
              src/test/java/io/github/thebusybiscuit/slimefun4/implementation/items/curios/BeaconPlusFieldAreaTest.java|\
              scripts/one_shot_gravity_well_tune.py|\
              scripts/one_shot_gravity_well_test_isolation.py|\
              .github/workflows/one-shot-gravity-well-tune.yml)
                ;;
              *)
                git show "HEAD:$path" > "$path"
                ;;
            esac
          done < "$RUNNER_TEMP/changed-files.txt"

          git diff --check

      - name: Build and run complete test suite
        run: ./gradlew clean build --no-daemon -x spotlessCheck

      - name: Verify focused Beacon Plus regressions
        shell: bash
        run: |
          for test in BeaconPlusEffectTest BeaconPlusFieldAreaTest BeaconPlusChunkModeTest BeaconPlusPowerModeTest; do
            file="build/test-results/test/TEST-io.github.thebusybiscuit.slimefun4.implementation.items.curios.${test}.xml"
            test -f "$file"
            grep -q 'failures="0"' "$file"
          done

      - name: Verify Java 21 bytecode
        run: |
          JAR="$(find build/libs -name 'Slimefun-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$JAR"
          python3 scripts/check_bytecode_target.py "$JAR" --expected-java 21

      - name: Commit tuned source and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-gravity-well-tune.yml
          rm -f scripts/one_shot_gravity_well_tune.py
          rm -f scripts/one_shot_gravity_well_test_isolation.py
          rm -f .git/index.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Expand Beacon Plus effect area and strengthen Gravity Well"
          git push origin HEAD:fix/gravity-well-strength-range

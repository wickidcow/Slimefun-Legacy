name: Preserve Addon Followup Evidence and Source Locks

on:
  push:
    branches: ['work/addon-stability-audit-r96-20260930']
    paths: ['.github/workflows/preservation-followup-consolidation.yml']

permissions:
  contents: write
  actions: read

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 7c8320828f7d0f98e80246f2766e7814a8a15eca
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify completed runs, actual XML and every runtime archive before selecting sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import concurrent.futures,hashlib,io,json,subprocess,xml.etree.ElementTree as ET,zipfile
          from pathlib import Path
          base='7c8320828f7d0f98e80246f2766e7814a8a15eca'
          core_hash='90ae41d7dc78a92d53803802c81877bbac01f3ac4f7be8b72005597d3ade0853'
          repo='wickidcow/Slimefun-Legacy'
          def api(path):
              return subprocess.run(['gh','api',path],capture_output=True,check=True,timeout=90).stdout
          def archive(artifact,digest):
              raw=api(f'repos/{repo}/actions/artifacts/{artifact}/zip')
              assert hashlib.sha256(raw).hexdigest()==digest,artifact
              return zipfile.ZipFile(io.BytesIO(raw))
          pr=json.loads(api(f'repos/{repo}/pulls/292'))
          assert pr['head']['sha']==base and pr['state']=='open' and not pr['merged']
          for run_id,head in [(36809109648,'c57913990b22489daf38b5c85445cf879bd7cd92'),(36810744968,'333a4d7f5f48185de4c28ac0dc02aefbb6d8baa7')]:
              run=json.loads(api(f'repos/{repo}/actions/runs/{run_id}'))
              assert run['head_sha']==head and run['conclusion']=='success',run_id
          changes=[
              dict(repository='wickidcow/SF_Galactifun',old='bd7311f9f300b946be604d6be74256340bfd3892',new='82bdf5254b42a14f38c98590a8b6ebf708c5be22',tests=25,new_tests=13,run_id=36809109648,artifact_id=11139406150,digest='58170ad2d826a78eace026d9c8893444a6e5559a5918294240fa3817d25e527c',jar_sha256='975d192d3fe6387afe52d61d87c615d8a02274c828a1cf7a0d48d1fa89e0d197',coverage='13 new real YAML/filesystem tests plus 12 existing tests; 24 actual old-addon upgrade/restart/failure-control server cycles'),
              dict(repository='wickidcow/SF_SlimeHUD',old='0f1bfce0723e1494ee56f744e305c61344a2dc0b',new='351e69c4e9889ac386a3db099c62d66d2b6caff3',tests=20,new_tests=20,run_id=36809109648,artifact_id=11138454797,digest='5ca83d5cdba649af265893299e6be27fcf471e162f2bd61109c0b825139259a1',jar_sha256='79ae9610eae37ca8c807f87cd81f3fd86f672219b6028cd60f36f012545cde4e',coverage='20 new real YAML/filesystem/store tests; 24 actual old-addon upgrade/restart/failure-control server cycles'),
              dict(repository='wickidcow/SF_SlimefunAdvancements',old='f743082a18b1bbee1c1283145731996508e4a99a',new='279446eaac5bb7bbb2599a10b5637fa8c87b36f0',tests=14,new_tests=14,run_id=36810744968,artifact_id=11138763684,digest='144e1d9ecc8cd90ae083c5a4bd03f289d09fc0540f75d4d12e734ab529603c4d',jar_sha256='baf71de690f00b5a44a855cd0ca1958cd2d3040d2a96704a27b8278e4d365317',coverage='14 new production JSON merge/writer tests; 18 actual old-addon producer, missing-definition, restoration/reward and restart/control server cycles')]
          for row in changes:
              with archive(row['artifact_id'],row['digest']) as z:
                  files=[n for n in z.namelist() if n.endswith('.xml') and '/tests/' in '/'+n]
                  total={k:0 for k in ['tests','failures','errors','skipped']}
                  for name in files:
                      root=ET.fromstring(z.read(name))
                      for key in total:total[key]+=int(root.get(key,'0'))
                  assert total==dict(tests=row['tests'],failures=0,errors=0,skipped=0),(row['repository'],files,total)
          specs=[
              (11139436728,'228fa0b9b08b284d3533e86d6af06b830d88773fe08e73a34365913345f42b00','Galactifun','1.21.11',8),
              (11139127554,'436fb5f3bf6f23b7418a4072ea16a7d2eba353017c39b28e32e1fb8e1ffd162c','Galactifun','26.2',8),
              (11138647231,'9341d7b9e00a4cfca4fdbcf68efcf338b1c0ea541e671c5e2d70fc3a4c80d03f','Galactifun','26.3',8),
              (11139072669,'3dd120dd8c9224b52e97f6d0430ae211185b12251f56dd53170b90b74faa0bf3','SlimeHUD','1.21.11',8),
              (11139082564,'628ba4ee379e01ffc41d7620c454f92b4cc0947d574276bf2d5e28d856e81e86','SlimeHUD','26.2',8),
              (11139296769,'a46d766ccfd517c85bbb9516abcfc9014a3f9d955ad9ee803ed0e1c204a052db','SlimeHUD','26.3',8),
              (11139717648,'674dcc7d54d4fb9955fa76036cbe09d4b2e8b3e08a60e9b251953f53042ea80a','SlimefunAdvancements','1.21.11',6),
              (11139294292,'b1316d2f90b1f15044034949f88f31e3ba54f8645cbfc4fe2cbb53249245cec7','SlimefunAdvancements','26.2',6),
              (11139727558,'40166c4e91f7fd22f0293a57dec9484632fa3575096543d05c473882f33444aa','SlimefunAdvancements','26.3',6)]
          def runtime(spec):
              artifact,digest,addon,version,count=spec
              with archive(artifact,digest) as z:
                  paths=[n for n in z.namelist() if n.endswith('/runtime-results.json') or n=='runtime-results.json']
                  assert len(paths)==1
                  result=json.loads(z.read(paths[0]))
                  assert result['minecraft']==version and len(result['cycles'])==count
                  assert all(c['status']=='PASS' for c in result['cycles'])
                  assert result['inputs']['jars']['Slimefun-Legacy-Core.jar']==core_hash
                  selected=next(r for r in changes if r['repository'].endswith('SF_'+addon))
                  jar_name='advancements-new.jar' if addon=='SlimefunAdvancements' else addon.lower()+'-new.jar'
                  assert result['inputs']['jars'][jar_name]==selected['jar_sha256']
                  assert sum(1 for n in z.namelist() if n.endswith('.log') and '.normalized.' not in n)==count
                  return dict(artifact_id=artifact,sha256=digest,addon=addon,minecraft=version,cycles=count,build=result['paper_build'],channel=result['channel'])
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              runtimes=list(pool.map(runtime,specs))
          assert sum(r['cycles'] for r in runtimes)==66
          manifest_path=Path('compatibility/sfl-addon-release-matrix.json')
          ledger_path=Path('compatibility/maintained-addon-test-ledger.json')
          manifest=json.loads(manifest_path.read_text());ledger=json.loads(ledger_path.read_text())
          assert manifest['bundle_revision']==ledger['bundle_revision']==96
          original_manifest=json.loads(json.dumps(manifest));original_ledger=json.loads(json.dumps(ledger))
          by_repo={r['repository']:r for r in manifest['addons']};entries={r['repository']:r for r in ledger['addons']}
          assert len(by_repo)==len(entries)==45 and set(by_repo)==set(entries)
          for row in changes:
              assert by_repo[row['repository']]['source_commit']==entries[row['repository']]['source_commit']==row['old']
              by_repo[row['repository']]['source_commit']=row['new']
              entry=entries[row['repository']]
              entry['source_commit']=row['new']
              entry['full_build_result']='PASS'
              entry['reported_test_entries']=row['tests']
              entry['failures']=entry['errors']=entry['skips']=0
              entry['evidence']=dict(repository=repo,run_id=row['run_id'],artifact_id=row['artifact_id'],sha256=row['digest'],kind='Full exact-core project build and actual XML; separate verified server persistence controls',core_source_commit=base,core_sha256=core_hash,jar_sha256=row['jar_sha256'])
              entry['coverage']=row['coverage']
              entry['runtime_evidence']=[r for r in runtimes if r['addon']==row['repository'].removeprefix('wickidcow/SF_')]
          manifest['bundle_revision']=ledger['bundle_revision']=97
          rows=ledger['addons']
          ledger['summary']=dict(addons=len(rows),full_build_passed=sum(r['full_build_result']=='PASS' for r in rows),reported_test_entries=sum(r['reported_test_entries'] for r in rows),addons_with_reported_tests=sum(r['reported_test_entries']>0 for r in rows),addons_without_reported_tests=sum(r['reported_test_entries']==0 for r in rows),failures=sum(r['failures'] for r in rows),errors=sum(r['errors'] for r in rows),skips=sum(r['skips'] for r in rows))
          assert ledger['summary']==dict(addons=45,full_build_passed=45,reported_test_entries=274,addons_with_reported_tests=14,addons_without_reported_tests=31,failures=0,errors=0,skips=0)
          ledger['preservation_followup']=dict(core_parent=base,tested_core_sha256=core_hash,new_test_entries=47,actual_server_cycles=66,scope=[r['repository'] for r in changes])
          ledger['limitations'].append('Revision97 adds three exact-source followup builds on core7c832082; other rows retain their original core/run evidence. This is not one new all45 full-suite run.')
          changed={r['repository'] for r in changes}
          for old,new in zip(original_manifest['addons'],manifest['addons']):
              if old['repository'] not in changed:assert old==new
          for old,new in zip(original_ledger['addons'],ledger['addons']):
              if old['repository'] not in changed:assert old==new
          assert all(by_repo[r['repository']]['source_commit']==r['source_commit'] for r in rows)
          manifest_path.write_text(json.dumps(manifest,indent=2)+'\n')
          ledger_path.write_text(json.dumps(ledger,indent=2)+'\n')
          output=Path('consolidated-evidence');output.mkdir()
          (output/'verification.json').write_text(json.dumps(dict(base=base,changes=changes,runtime=runtimes,summary=ledger['summary']),indent=2)+'\n')
          print(ledger['summary'])
          PY
      - name: Verify every retained core source invariant with the revised selection
        run: |
          set -euo pipefail
          python3 scripts/verify_legacy.py . > consolidated-evidence/source-invariants.log 2>&1
          git diff --check
          git diff --stat
      - name: Stage only verified JSON blobs; do not move refs or publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          files={}
          for name in ['compatibility/sfl-addon-release-matrix.json','compatibility/maintained-addon-test-ledger.json']:
              data=Path(name).read_bytes()
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              response=subprocess.run(['gh','api','--method','POST','repos/wickidcow/Slimefun-Legacy/git/blobs','--input','-'],input=json.dumps(dict(content=data.decode(),encoding='utf-8')),capture_output=True,text=True,check=True)
              assert json.loads(response.stdout)['sha']==expected
              files[name]=expected
              target=Path('consolidated-evidence/reviewed-source')/name
              target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          Path('consolidated-evidence/reviewed-blobs.json').write_text(json.dumps(files,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preservation-followup-consolidation
          path: consolidated-evidence/
          retention-days: 14
          if-no-files-found: warn

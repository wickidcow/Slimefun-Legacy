name: One-time Fix 4.1.30B Verification

on:
  push:
    branches:
      - feature/adventurers-curios-expansion
    paths:
      - .github/workflows/one-time-fix-4-1-30b-verifiers.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/adventurers-curios-expansion
          fetch-depth: 0

      - name: Fix version documentation and formatting-safe verifier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = 'Current development release: **4.1.30 — Core Platform Phase 1L (Release Lifecycle & Upgrade Safety)**. ·'
          new = 'Current development release: **4.1.30B — Core Platform Phase 1L (Release Lifecycle & Upgrade Safety)**. ·'
          if old not in text:
              raise SystemExit('README development-release marker not found')
          text = text.replace(old, new, 1)
          old = 'Slimefun Legacy 4.1.30 is tested primarily against **Paper 26.2 / Minecraft 26.2 on Java 25**.'
          new = 'Slimefun Legacy 4.1.30B is tested primarily against **Paper 26.2 / Minecraft 26.2 on Java 25**.'
          if old not in text:
              raise SystemExit('README tested-version marker not found')
          readme.write_text(text.replace(old, new, 1), encoding='utf-8')

          verifier = Path('scripts/verify_guide_runtime_correctness.py')
          text = verifier.read_text(encoding='utf-8')
          anchor = '''    profile = read(\n        root,\n        "src/main/java/io/github/thebusybiscuit/slimefun4/api/player/PlayerProfile.java",\n    )\n'''
          replacement = anchor + '    profile_compact = "".join(profile.split())\n'
          if anchor not in text:
              raise SystemExit('Profile verifier anchor not found')
          text = text.replace(anchor, replacement, 1)

          original_needle = '"pendingProfileCallbacks.computeIfAbsent(uuid, ignored -> new CopyOnWriteArrayList<>()).add(callback);"'
          compact_needle = '"pendingProfileCallbacks.computeIfAbsent(uuid,ignored->newCopyOnWriteArrayList<>()).add(callback);"'

          first = '''    require(\n        profile,\n        ''' + original_needle + ''',\n        "profile callback queuing",\n    )\n'''
          first_new = '''    require(\n        profile_compact,\n        ''' + compact_needle + ''',\n        "profile callback queuing",\n    )\n'''
          if first not in text:
              raise SystemExit('Profile callback verifier block not found')
          text = text.replace(first, first_new, 1)

          second = '''    require_before(\n        profile,\n        ''' + original_needle + ''',\n        "if (loadingProfiles.add(uuid))",\n        "callback queued before profile-load ownership",\n    )\n'''
          second_new = '''    require_before(\n        profile_compact,\n        ''' + compact_needle + ''',\n        "if(loadingProfiles.add(uuid))",\n        "callback queued before profile-load ownership",\n    )\n'''
          if second not in text:
              raise SystemExit('Profile callback ordering verifier block not found')
          verifier.write_text(text.replace(second, second_new, 1), encoding='utf-8')
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-fix-4-1-30b-verifiers.yml

      - name: Verify the two repaired gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_guide_runtime_correctness.py .
          python3 scripts/verify_release_4_1_18.py .

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md scripts/verify_guide_runtime_correctness.py .github/workflows/one-time-fix-4-1-30b-verifiers.yml
          git diff --cached --check
          git commit -m "Fix 4.1.30B release verification"
          git push origin HEAD:feature/adventurers-curios-expansion

name: Versioned 4.1.63 Historical Upgrade Validation
on:
  push:
    branches: ['work/release-4.1.63-preparation-20261001']
    paths: ['.github/workflows/versioned-historical-upgrade-validation.yml']
permissions:
  contents: read
  actions: read
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - software: paper
            minecraft: '1.21.11'
            java: '21'
          - software: paper
            minecraft: '26.2'
            java: '25'
          - software: paper
            minecraft: '26.3'
            java: '25'
          - software: purpur
            minecraft: '1.21.11'
            java: '21'
          - software: purpur
            minecraft: '26.3'
            java: '25'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ff3bdf8ca1cdfaf569acfcf2b3696b50541cf738
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Verify the actual versioned core and immutable historical fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs evidence
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,io,json,subprocess,zipfile
          def api(p):return subprocess.run(['gh','api',p],check=True,capture_output=True,timeout=120).stdout
          core=api('repos/wickidcow/Slimefun-Legacy/actions/artifacts/11173590470/zip')
          assert hashlib.sha256(core).hexdigest()=='b7063bad34f14092e08113add70861f6df54b9cb82f46dc4c13cc394f3bdc523'
          with zipfile.ZipFile(io.BytesIO(core)) as z:
              assert z.testzip() is None
              props=z.read('git.properties').decode()
              assert 'git.build.version=4.1.63' in props and 'git.source.commit=4611ec98f707acd901a7fc5f8267ec3477f54bdd' in props
              Path('evidence/core-git.properties').write_text(props)
          Path('inputs/core.jar').write_bytes(core)
          fixture=api('repos/wickidcow/Slimefun-Legacy/actions/artifacts/11161016157/zip')
          assert hashlib.sha256(fixture).hexdigest()=='7bd7b94213f3213d5de793f1dbb963c0739ff8a0f134773fb863a7a617228c2a'
          with zipfile.ZipFile(io.BytesIO(fixture)) as z:
              names=[n for n in z.namelist() if n.endswith('fixture-1.20.6.tar.gz')];assert len(names)==1
              data=z.read(names[0]);Path('inputs/fixture.tar.gz').write_bytes(data)
          Path('evidence/provenance.json').write_text(json.dumps(dict(core_artifact=11173590470,core_sha256=hashlib.sha256(core).hexdigest(),core_version='4.1.63',core_head='ff3bdf8ca1cdfaf569acfcf2b3696b50541cf738',historical_fixture_artifact=11161016157,historical_fixture_sha256=hashlib.sha256(data).hexdigest(),fixture_origin='Generated by real Paper1.20.6 writer; not a captured customer world',published=False),indent=2))
          PY
      - name: Exercise both passive preservation and explicit automatic Doctor paths
        env:
          SERVER_SOFTWARE: ${{ matrix.software }}
          SERVER_MINECRAFT_VERSION: ${{ matrix.minecraft }}
        run: |
          set -euo pipefail
          bash scripts/legacy_item_upgrade_probe.sh read build/versioned-upgrade inputs/core.jar inputs/fixture.tar.gz 2>&1 | tee evidence/runtime.log
          python3 - <<'PY'
          from pathlib import Path
          import json
          evidence=Path('build/versioned-upgrade/evidence')
          for name in ['upgraded-first.json','upgraded-second.json','automatic-first.json','automatic-second.json']:
              path=evidence/name;assert path.is_file(),name
              json.loads(path.read_text())
          assert all('LEGACY_UPGRADE_PROBE_FAIL' not in p.read_text() for p in evidence.glob('*.log'))
          Path('evidence/result.json').write_text(json.dumps(dict(result='PASS',cycles=4,passive_starts=2,automatic_doctor_starts=2,assertions='All retained fixture assertions; no modification of original item-byte fixtures'),indent=2))
          PY
      - name: Preserve actual logs and source identity
        if: always()
        run: |
          if test -d build/versioned-upgrade/evidence; then cp -r build/versioned-upgrade/evidence evidence/server; fi
          sha256sum scripts/legacy_item_upgrade_probe.sh scripts/upgrade-fixture/LegacyItemUpgradeProbe.java > evidence/probe-source-sha256.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: versioned-upgrade-${{ matrix.software }}-${{ matrix.minecraft }}
          path: evidence/
          retention-days: 14
          if-no-files-found: error

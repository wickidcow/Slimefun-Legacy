name: Revision 106 JEG Floor Build Correction
on:
  push:
    branches: ['audit/reconcile-addon-r106']
    paths: ['.github/workflows/r106-jeg-floor-correction.yml']
permissions:
  contents: write
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 4df8de0cc8c31c8600ed1161a729ce30e177cc34
          path: tools
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: echo "FLOOR_JAVA=$JAVA_HOME/bin/java" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Install permanent guard sources and require old workflow failure
        run: |
          mkdir -p evidence tools/tests/runtime
          cp audit-r106/JegClipboardLinkageProbe.java tools/tests/runtime/
          cp audit-r106/test_jeg_bundle_floor.py tools/scripts/
          set +e
          python3 tools/scripts/test_jeg_bundle_floor.py > evidence/original-workflow-tests.log 2>&1
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          grep -Fq 'FAILED (failures=7)' evidence/original-workflow-tests.log
          (cd tools && python3 ../audit-r106/apply-jeg-floor.py)
          python3 tools/scripts/test_jeg_bundle_floor.py > evidence/corrected-workflow-tests.log 2>&1
          python3 tools/scripts/verify_legacy.py tools > evidence/core-invariants.log 2>&1
          git -C tools diff --check
      - name: Verify exact core and original JEG binary control
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p candidate-core originals
          python3 - <<'PY'
          import hashlib,io,subprocess,zipfile
          from pathlib import Path
          def artifact(ident,sha):
              raw=subprocess.run(['gh','api',f'repos/wickidcow/Slimefun-Legacy/actions/artifacts/{ident}/zip'],capture_output=True,check=True,timeout=120).stdout
              assert hashlib.sha256(raw).hexdigest()==sha
              return zipfile.ZipFile(io.BytesIO(raw))
          with artifact(11207535252,'4f0cc9e39964cc2e62bc58b8a2821909ca353f95613ef4814a737e581ac60815') as z:
              core=z.read('Slimefun-Legacy4.1.64.jar')
          assert hashlib.sha256(core).hexdigest()=='316b308139e90981ed037d82ddc57b62b354d8e0a41804d5ebf3bb2b8f896d80'
          Path('candidate-core/Slimefun-Legacy-candidate.jar').write_bytes(core)
          with artifact(11208575293,'8639ab3bf6070c71f92658624585a635c65f826707f52e91763f60b3093f3be8') as z:
              with zipfile.ZipFile(io.BytesIO(z.read('SF_Addons_1.21.11-26.3.zip'))) as b:
                  original=b.read('SF_JustEnoughGuide2.1.70.jar')
          assert hashlib.sha256(original).hexdigest()=='7aaf171134e2a08c7d86003331a75bdbf571f7d8afc978b0e84978106b984686'
          Path('originals/jeg.jar').write_bytes(original)
          PY
      - name: Execute the exact proposed floor-build step against the selected source
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/wickidcow/SF_JustEnoughGuide.git addon
          git -C addon fetch --depth 1 origin 89ce9a8b0e8ef9d1939256f1d80917af63e439e2
          git -C addon checkout --detach 89ce9a8b0e8ef9d1939256f1d80917af63e439e2
          python3 - <<'PY'
          from pathlib import Path
          text=Path('tools/.github/workflows/build-sfl-addons-compat-bundle.yml').read_text()
          step=text.split('      - name: Rebuild JEG against the supported API floor\n',1)[1].split('      - name:',1)[0]
          body=step.split('        run: |\n',1)[1]
          lines=body.splitlines()
          assert all(not line or line.startswith('          ') for line in lines)
          script='\n'.join(line[10:] for line in lines)+'\n'
          Path('evidence/exact-jeg-floor-step.sh').write_text(script)
          PY
          bash evidence/exact-jeg-floor-step.sh > evidence/floor-build.log 2>&1
          "$FLOOR_JAVA" -cp "report-native-floor/linkage-classes:addon/target/SF_JustEnoughGuide2.1.70.jar:$(cat report-native-floor/classpath.txt)" JegClipboardLinkageProbe > evidence/java21-corrected.log 2>&1
          grep -Fxq 'JEG_CLIPBOARD_FLOOR_PASS methods=2 scenarios=6' evidence/java21-corrected.log
          set +e
          "$FLOOR_JAVA" -cp "report-native-floor/linkage-classes:originals/jeg.jar:$(cat report-native-floor/classpath.txt)" JegClipboardLinkageProbe > evidence/java21-original.log 2>&1
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          grep -Fq 'NoSuchMethodError' evidence/java21-original.log
          grep -Fq 'TextComponent$Builder.build()' evidence/java21-original.log
          python3 tools/scripts/verify_addon_bytecode.py addon/target/SF_JustEnoughGuide2.1.70.jar --expected-java 21 --report evidence/bytecode.json
          sha256sum candidate-core/Slimefun-Legacy-candidate.jar originals/jeg.jar addon/target/SF_JustEnoughGuide2.1.70.jar > evidence/jar-hashes.txt
          cp -r report-native-floor evidence/
      - name: Stage only checked build and permanent guard files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          names=['.github/workflows/build-sfl-addons-compat-bundle.yml','scripts/verify_legacy.py','scripts/test_jeg_bundle_floor.py','tests/runtime/JegClipboardLinkageProbe.java']
          records={}
          for name in names:
              data=Path('tools',name).read_bytes();sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              result=subprocess.run(['gh','api','--method','POST','repos/wickidcow/Slimefun-Legacy/git/blobs','--input','-'],input=json.dumps(dict(content=data.decode(),encoding='utf-8')),capture_output=True,text=True,check=True)
              assert json.loads(result.stdout)['sha']==sha
              records[name]=sha
              out=Path('evidence/reviewed-source',name);out.parent.mkdir(parents=True,exist_ok=True);out.write_bytes(data)
          Path('evidence/reviewed-blobs.json').write_text(json.dumps(records,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: revision106-jeg-floor-correction-evidence
          path: evidence/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: revision106-jeg-floor-corrected-jar
          path: addon/target/SF_JustEnoughGuide2.1.70.jar
          retention-days: 14
          if-no-files-found: error

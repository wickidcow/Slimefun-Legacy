name: WorldEdit and Addon Modernization Validation

on:
  push:
    branches: ['work/worldedit-modernization-validation']

permissions:
  contents: read

jobs:
  inspect-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect exact publisher-listed floor binaries
        run: |
          python3 - <<'PY'
          import hashlib, io, json, struct, urllib.parse, urllib.request, zipfile
          from pathlib import Path
          def get(url):
              request = urllib.request.Request(url, headers={'User-Agent':'Slimefun-Legacy-Compatibility/1.0'})
              with urllib.request.urlopen(request, timeout=45) as response:
                  return response.read(64*1024*1024)
          query = urllib.parse.urlencode({'game_versions': json.dumps(['1.21.11']), 'loaders':json.dumps(['bukkit'])})
          versions = json.loads(get('https://api.modrinth.com/v2/project/worldedit/version?' + query))
          inspected = []
          Path('evidence').mkdir()
          for version in versions[:15]:
              file = next(f for f in version['files'] if f['primary'] and f['filename'].startswith('worldedit-bukkit-'))
              data = get(file['url'])
              assert hashlib.sha512(data).hexdigest() == file['hashes']['sha512']
              with zipfile.ZipFile(io.BytesIO(data)) as jar:
                  assert jar.testzip() is None
                  major = struct.unpack('>H', jar.read('com/sk89q/worldedit/bukkit/WorldEditPlugin.class')[6:8])[0]
                  core_major = struct.unpack('>H', jar.read('com/sk89q/worldedit/world/block/BlockStateHolder.class')[6:8])[0]
              inspected.append({'version':version['version_number'], 'id':version['id'], 'major':major, 'core_major':core_major})
              print(inspected[-1])
              if max(major, core_major) <= 65:
                  Path('evidence/worldedit-java21-version.json').write_text(json.dumps(version, indent=2))
                  break
          else:
              raise RuntimeError('No verified Java21 entry point among bounded publisher-listed candidates')
          Path('evidence/inspected-versions.json').write_text(json.dumps(inspected, indent=2))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: worldedit-java21-dependency
          path: evidence/
          if-no-files-found: error
          retention-days: 14

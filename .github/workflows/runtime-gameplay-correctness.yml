name: Runtime Gameplay Correctness

on:
  pull_request:
    paths:
      - 'src/main/**'
      - 'src/test/**'
      - 'scripts/verify_core_correctness.py'
      - 'scripts/verify_guide_runtime_correctness.py'
      - 'scripts/verify_runtime_gameplay_correctness.py'
      - '.github/workflows/runtime-gameplay-correctness.yml'
  push:
    branches:
      - master
      - main
      - 'agent/runtime-gameplay-correctness'
    paths:
      - 'src/main/**'
      - 'src/test/**'
      - 'scripts/verify_core_correctness.py'
      - 'scripts/verify_guide_runtime_correctness.py'
      - 'scripts/verify_runtime_gameplay_correctness.py'
      - '.github/workflows/runtime-gameplay-correctness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correctness:
    name: Verify gameplay invariants and focused runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Verify existing core-correctness invariants
        run: python3 scripts/verify_core_correctness.py .

      - name: Verify guide runtime correctness
        run: python3 scripts/verify_guide_runtime_correctness.py .

      - name: Verify runtime gameplay transaction invariants
        run: python3 scripts/verify_runtime_gameplay_correctness.py .

      - name: Run enchantment-machine runtime tests
        run: |
          chmod +x gradlew
          ./gradlew test --tests io.github.thebusybiscuit.slimefun4.implementation.items.electric.machines.enchanting.EnchantmentMachineRuntimeTest --no-daemon

      - name: Publish correctness summary
        if: always()
        run: |
          {
            echo '## Runtime / gameplay correctness'
            echo
            echo '- Guide runtime diagnostics and GuideHistory ownership checked'
            echo '- Machine cancellation and transaction ordering checked'
            echo '- AContainer energy/progress/output lifecycle checked'
            echo '- Auto Enchanter / Auto Disenchanter timing tests executed'
          } >> "$GITHUB_STEP_SUMMARY"

# Albion English defaults.
# The in-plugin auto-updater is disabled because it would replace this English
# fork with an untranslated upstream build. Use the included GitHub sync workflow instead.
options:
  auto-update: false
  chat-prefix: '&a&lSlimefun &7> '
  armor-update-interval: 10
  enable-armor-effects: true
  enable-radiation: true
  radiation-update-interval: 1
  radiation-grace-period: 15
  rainbow-armor-update-interval: 3
  auto-save-delay-in-minutes: 10
  legacy-ore-washer: false
  legacy-dust-washer: false
  legacy-ore-grinder: true
  # Force all players to use the server's English language.
  language: en
  enable-translations: false
  log-duplicate-block-entries: true
  burn-players-when-radioactive: true
  drop-excess-sf-give-items: false
  backup-data: true
  drop-block-creative: true
  bypass-environment-check: false
  bypass-item-length-check: false
  max-gps-waypoints: 21

guide:
  # Show vanilla recipes in the Slimefun guide.
  show-vanilla-recipes: true
  # Give the guide when a player joins for the first time.
  receive-on-first-join: true
  # Include hidden groups in guide search results.
  show-hidden-item-groups-in-search: false
  contributor-heads:
    # Contributor/founder heads are cosmetic. Keep external Mojang profile/skin lookups
    # disabled by default so opening the guide can never depend on a remote profile service.
    # Cached textures can still be displayed safely.
    resolve-online: false
    # Applies to both username-to-UUID and UUID-to-skin requests when online resolution is enabled.
    # Values above 30 seconds are capped at 30 by Slimefun Legacy.
    lookup-timeout-seconds: 8
    # GitHub or Minecraft usernames in this list never receive remote skin lookups and
    # always use a generic player-head icon in the contributors/founders menu.
    blocked-names: []

researches:
  # Creative players can unlock researches without paying.
  free-in-creative-mode: true
  # Display fireworks when a research is unlocked.
  enable-fireworks: true
  # Use Vault currency instead of experience levels.
  use-money-unlock: false
  # Experience-level to currency conversion rate.
  currency-cost-convert-rate: 25.0
  # Skip the research-learning animation.
  disable-learning-animation: false

URID:
  info-delay: 3000
  custom-ticker-delay: 10
  enable-tickers: true

networks:
  max-size: 200
  cargo-ticker-delay: 0
  enable-visualizer: true
  delete-excess-items: false

# HeadLimiter-style protection against extremely dense machine chunks.
# DISABLED by default: enabling this only refuses NEW player placements.
# Existing machines, inventories, network connections and tickers are not modified.
# The count includes ticking machines from Slimefun and compatible addons
# (Networks, Supreme, InfinityExpansion2, etc.), including UniversalBlock tickers.
# Slimefun cables, passive storage, decorative blocks and vanilla blocks are not counted.
machine-limiter:
  enabled: false
  # Maximum registered ticking Slimefun machines in any single 16x16 chunk.
  # Set this to suit your server; the invalid/unset value fallback is 256.
  max-ticking-machines-per-chunk: 256
  # Optional permission: slimefun.machine-limiter.bypass (OP by default).
  # Leave false to enforce the limit even for operators.
  allow-bypass-permission: false

talismans:
  use-actionbar: true

metrics:
  auto-update: false

backpack:
  # Allow a backpack to open while its owner is offline.
  allow-open-when-owner-offline: true

research-ranks:
  - Chicken
  - Cow
  - Spider
  - Villager
  - Beginner
  - Clumsy Student
  - Unskilled Student
  - Incompetent Student
  - Student
  - Clumsy Apprentice
  - Apprentice
  - Skilled Apprentice
  - Upcoming Mage
  - Excellent Mage
  - Young Magician
  - Incompetent Magician
  - Common Magician
  - Magician
  - Proficient Magician
  - Skilled Magician
  - Accustomed Magician
  - Great Magician
  - Clumsy Wizard
  - Wizard
  - Common Wizard
  - Skilled Wizard
  - Great Wizard
  - Impressive Wizard
  - Young Master
  - Clumsy Master
  - Upcoming Master
  - Competent Master
  - Master
  - Skilled Master
  - Excellent Master
  - Great Master
  - Proficient Master
  - The Chosen One

# Albion stability safeguards
stability:
  # Runtime protection is intentionally scoped to failing callbacks. Healthy Slimefun machines,
  # cargo networks, energy networks and addon APIs keep their normal execution paths.
  machine-circuit-breaker-cooldown-seconds: 300
  machine-circuit-breaker-failure-threshold: 4
  ticker-lifecycle-log-cooldown-seconds: 60
  # Emergency backpressure for already overloaded machine chunks.
  # Disabled by default: enabling it processes only a rotating, fair subset
  # of registered tickers per 0.5-second Slimefun cycle in each loaded chunk.
  # It intentionally reduces machine/transport throughput but never deletes
  # or pauses any stored machine permanently; every ticker gets another turn.
  # This is a callback COUNT limit, not a hard millisecond watchdog.
  chunk-ticker-budget:
    enabled: false
    max-tickers-per-chunk-per-cycle: 512
  # Optional external adapters (for example Rebar/Pylon) are isolated independently from Slimefun core.
  external-integration-failure-threshold: 3
  external-integration-cooldown-seconds: 120
  item-doctor:
    # Repairs only visible names and lore. Slimefun IDs, PDC/NBT, enchantments,
    # attributes, custom model data, inventory contents, and functional state are preserved.
    enabled: true
    repair-player-on-join: true
    repair-opened-inventories: true
    repair-chunks-on-load: true
    # Pickup recovery repairs every safely recoverable presentation field immediately.
    # If addon lore contains unknown state, the English name is still repaired independently.
    repair-picked-up-items: true
    # If an addon has been removed, Doctor can still replace a Chinese display name with
    # an English name derived from the stored Slimefun ID. Lore is never guessed or removed.
    repair-orphaned-item-names: true
    # Number of top-level inventories or dropped items processed per server tick
    # during /slimefun doctor scan or repair confirm.
    inventories-per-tick: 12

# Slimefun Legacy Addons configuration.
#
# Adventurer's Curios and related Slimefun Legacy addon-style gameplay settings live here.
# Core Slimefun4 settings remain in config.yml.
# Fresh installs default Curiosities OFF. Existing enabled installations are migrated and stay enabled.
# This schema version changes only when configSFLAddons.yml itself needs a one-time migration.
# Normal Slimefun Legacy updates do not rewrite this file just because the plugin version changed.
config-version: 2

enabled: false

# Optional Slimefun Legacy resource-pack sender.
# This setting is independent of the Curiosities/additions "enabled" switch above.
#
# ---------------------------------------------------------------------------
# Slimefun Legacy resource-pack safety guide (config-version 1)
#
# ENABLING THE LEGACY PACK ON AN EXISTING SERVER:
# 1) Make a full backup and keep players offline / use maintenance mode.
# 2) Leave resource-pack.enabled: false while auditing.
# 3) Run: /sf doctor item-models enable-pack scan
# 4) If the audit is correct, run: /sf doctor item-models enable-pack confirm
# 5) Run /sf doctor status and wait for pending database writes to reach 0.
# 6) Stop the server normally.
# 7) Set resource-pack.enabled: true, then start the server.
# 8) Verify with: /sf doctor item-models enable-pack scan
#
# DISABLING THE LEGACY PACK SENDER:
# 1) Set resource-pack.enabled: false and restart normally.
# 2) STOP THERE if another pack manager (ItemsAdder/Oraxen/etc.) still supplies
#    the matching Slimefun models. Do NOT strip model data just because this sender is off.
# 3) The sender toggle NEVER rewrites item-models.yml or stored ItemStacks.
# 4) Servers specifically recovering from the historical v4.1.52 forced model migration
#    should use /sf doctor item-models rollback-v52 and follow Doctor's printed steps.
# 5) Never manually zero model mappings and mass-edit items without a backup and Doctor audit.
# ---------------------------------------------------------------------------
# Leave disabled when ItemsAdder or another plugin already manages the server pack.
# IMPORTANT: Before enabling this on an existing server, run /sf doctor item-models scan
# and review any reported model-data conflicts before changing item-model mappings.
# If storage/machine matching broke after Slimefun Legacy v4.1.52, first run
# /sf doctor item-models rollback-v52 and follow the recovery instructions it prints.
# If an established server intentionally wants to adopt Legacy's bundled item models, run
# /sf doctor item-models enable-pack scan, then /sf doctor item-models enable-pack confirm.
# Enabling the sender alone never rewrites existing 0 item-model mappings.
# Slimefun Legacy resource-pack ownership mode (config-version 2)
# auto     = backwards-compatible; infer intent from resource-pack.enabled.
# legacy   = Slimefun Legacy sends the configured ZIP.
# external = ItemsAdder/Oraxen/proxy/server pack sends a combined pack.
# none     = no Slimefun-textured pack is intentionally in use.
#
# ownership-mode controls delivery ownership only. It never rewrites item-models.yml or stored items.
# EXTERNAL is valid with Legacy sender OFF and Slimefun model mappings ON.
# NONE is the only explicit mode saying Slimefun textures are intentionally not used.
resource-pack:
  ownership-mode: auto
  enabled: false
  # RECOMMENDED (GitHub): https://github.com/wickidcow/SFL_RP_Official/releases/latest/download/SlimefunLegacyRP.zip
  # The retired Modrinth/default Legacy URLs are migrated here automatically on upgrade.
  # Server owners may still replace this with any custom direct HTTP(S) ZIP URL.
  url: 'https://github.com/wickidcow/SFL_RP_Official/releases/latest/download/SlimefunLegacyRP.zip'
  # Optional 40-character SHA-1 of the exact ZIP.
  sha1: ''
  required: false
  prompt: 'Slimefun Legacy resource pack'

SlimefunLegacyAddition:
  # Built-in ports of the historical addons. Disable either module here if you do not want its
  # items registered. If the matching standalone plugin is installed, Legacy skips its built-in copy.
  ExtraGear:
    enabled: true
  ExtraTools:
    enabled: true
  Magic8Ball:
    # Registers the historical Magic 8 Ball addon inside Slimefun Legacy.
    # This built-in copy is skipped automatically when a standalone Magic 8 Ball plugin is present.
    enabled: true

  PoweredBeacon:
    # Master switch for the Resonance Beacon runtime. The item remains registered for data safety.
    enabled: true

    # Global safety switch for the Activator power's Paper chunk tickets.
    # /beacon enable|disable changes this at runtime and preserves each beacon's Activator selection.
    chunk-loading-enabled: true

    # Optional per-beacon Slimefun Energy Network operation. Existing/native/imported beacons default OFF.
    # A player can toggle electric operation from the Resonance Beacon GUI. When ON, powers pause
    # if the internal buffer cannot pay the once-per-second pulse cost; Activator tickets are released.
    electric-operation:
      enabled: true
      capacity: 4096
      base-joules-per-pulse: 16
      tier-joules-per-pulse: 4
      activator-tier-surcharge-joules-per-pulse: 16

    # Unlocks are permanent per beacon owner. EXPERIENCE means Minecraft experience levels.
    # MONEY uses Vault and the active economy provider. Individual powers can override this.
    progression:
      max-tier: 3
      payment-mode: EXPERIENCE
      creative-bypass-cost: true
      operator-can-sponsor-upgrades: false

    # Exact compatibility with BeaconPlus WORLD storage.
    # Each world gets: <world>/BeaconData/<chunkX>.<chunkZ>.json
    # Existing folders can be copied directly without converting the JSON layout.
    BeaconData:
      enabled: true
      storage-type: WORLD
      folder-name: BeaconData
      import-existing: true
      mirror-native-beacons: true
      bootstrap-legacy-activators: true
      honor-overridden-range: true

    # Physical pyramid resonance. The completed base layers and the average mineral value
    # cap the highest purchased tier that can actually run.
    pyramid:
      material-power:
        IRON_BLOCK: 1.0
        GOLD_BLOCK: 2.0
        EMERALD_BLOCK: 3.0
        DIAMOND_BLOCK: 4.0
        NETHERITE_BLOCK: 5.0
      tier-requirements:
        1:
          min-pyramid-tier: 1
          min-average-material-power: 1.0
        2:
          min-pyramid-tier: 2
          min-average-material-power: 3.0
        3:
          min-pyramid-tier: 3
          min-average-material-power: 4.0

    # Set enabled: false to remove a power from player use server-wide.
    # payment-mode can be INHERIT, EXPERIENCE or MONEY.
    powers:
      furnace-booster:
        enabled: true
        payment-mode: INHERIT
        experience-costs: { tier-1: 5, tier-2: 15, tier-3: 20 }
        money-costs: { tier-1: 200.0, tier-2: 600.0, tier-3: 800.0 }
      strength:

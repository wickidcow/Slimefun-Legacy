# Slimefun Legacy Addons configuration.
#
# Adventurer's Curios and related Slimefun Legacy addon-style gameplay settings live here.
# Core Slimefun4 settings remain in config.yml.
# Fresh installs default Curiosities OFF. Existing enabled installations are migrated and stay enabled.

enabled: false

SlimefunLegacyAddition:
  PoweredBeacon:
    # Master switch for the Resonance Beacon runtime. The item remains registered for data safety.
    enabled: true

    # Global safety switch for the Activator power's Paper chunk tickets.
    # /beacon enable|disable changes this at runtime and preserves each beacon's Activator selection.
    chunk-loading-enabled: true

    # Optional per-beacon Slimefun Energy Network operation. Existing/native/imported beacons default OFF.
    # A player can toggle electric operation from the Resonance Beacon GUI. When ON, powers pause
    # if the internal buffer cannot pay the once-per-second pulse cost; Activator tickets are released.
    electric-operation:
      enabled: true
      capacity: 4096
      base-joules-per-pulse: 16
      tier-joules-per-pulse: 4
      activator-tier-surcharge-joules-per-pulse: 16

    # Unlocks are permanent per beacon owner. EXPERIENCE means Minecraft experience levels.
    # MONEY uses Vault and the active economy provider. Individual powers can override this.
    progression:
      max-tier: 3
      payment-mode: EXPERIENCE
      creative-bypass-cost: true
      operator-can-sponsor-upgrades: false

    # Exact compatibility with BeaconPlus WORLD storage.
    # Each world gets: <world>/BeaconData/<chunkX>.<chunkZ>.json
    # Existing folders can be copied directly without converting the JSON layout.
    BeaconData:
      enabled: true
      storage-type: WORLD
      folder-name: BeaconData
      import-existing: true
      mirror-native-beacons: true
      bootstrap-legacy-activators: true
      honor-overridden-range: true

    # Physical pyramid resonance. The completed base layers and the average mineral value
    # cap the highest purchased tier that can actually run.
    pyramid:
      material-power:
        IRON_BLOCK: 1.0
        GOLD_BLOCK: 2.0
        EMERALD_BLOCK: 3.0
        DIAMOND_BLOCK: 4.0
        NETHERITE_BLOCK: 5.0
      tier-requirements:
        1:
          min-pyramid-tier: 1
          min-average-material-power: 1.0
        2:
          min-pyramid-tier: 2
          min-average-material-power: 3.0
        3:
          min-pyramid-tier: 3
          min-average-material-power: 4.0

    # Set enabled: false to remove a power from player use server-wide.
    # payment-mode can be INHERIT, EXPERIENCE or MONEY.
    powers:
      furnace-booster:
        enabled: true
        payment-mode: INHERIT
        experience-costs: { tier-1: 5, tier-2: 15, tier-3: 20 }
        money-costs: { tier-1: 200.0, tier-2: 600.0, tier-3: 800.0 }
      strength:
        enabled: true
        payment-mode: INHERIT
        experience-costs: { tier-1: 5, tier-2: 15, tier-3: 20 }

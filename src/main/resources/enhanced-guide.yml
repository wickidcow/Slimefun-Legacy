# Slimefun Legacy Native Enhanced Guide
# This provides a JEG-style player experience without replacing Slimefun internals through reflection.
enabled: true

titles:
  survival: "&2&lSlimefun Legacy Guide"
  cheat: "&c&lSlimefun Legacy Guide &4(Cheat Mode)"
  search: "&2&lSearch &8- &f%query%"
  bookmarks: "&6&lBookmarked Items"

features:
  bookmarks: true
  smart-search: true
  display-item-id: true
  display-addon: true

  # Adds a JEG-style "Machine Recipes" button through the Phase 4 provider API.
  # Core AContainer machines, RecipeDisplayItem implementations and FastMachines
  # are supported automatically. Addons can register structured providers without
  # reflection or a hard dependency on the enhanced guide implementation.
  machine-recipes:
    enabled: true

  # Phase 4.1A: safely moves a selected core AContainer recipe from the
  # player's inventory into the placed machine's real input slots. The machine
  # still performs its own validation, energy use, timing and output handling.
  machine-input-fill:
    enabled: true
    target-range: 6
    maximum-sets: 64
    close-guide-on-success: true

  # Adds a protected button to supported recipe pages. It prepares ingredients in
  # nearby core crafting structures but never performs the final craft.
  recipe-fill:
    enabled: true
    target-range: 6
    maximum-sets: 64
    session-seconds: 120
    close-guide-on-success: true

    # Supports Grind Stone, Smeltery, Ore Crusher, Compressor and Pressure Chamber.
    unordered-machines: true

    ancient-altar:
      enabled: true

      # Safely moves the center catalyst into the selected hotbar slot when possible.
      # Disable this to only populate the eight pedestals.
      prepare-catalyst-in-hand: true

      # Prevents guide preparation while an altar activation animation may still be running.
      activation-lock-seconds: 15

    missing-report:
      maximum-lore-lines: 4
      show-sub-recipe-hints: true

# Layout markers:
# B = background, b = back, T = settings, R = smart search, S = search
# C/c = bookmarks, G = item group, i = item, P = previous page, N = next page
format:
  main:
    - "BTBBBBRSB"
    - "GGGGGGGGG"
    - "GGGGGGGGG"
    - "GGGGGGGGG"
    - "GGGGGGGGG"
    - "BPBBCBBNB"

  group:
    - "BbBBBBRSB"
    - "iiiiiiiii"
    - "iiiiiiiii"
    - "iiiiiiiii"
    - "iiiiiiiii"
    - "BPBBCBBNB"

  search:
    - "BbBBBBRSB"
    - "iiiiiiiii"
    - "iiiiiiiii"
    - "iiiiiiiii"
    - "iiiiiiiii"
    - "BPBBCBBNB"

  bookmarks:
    - "BbBBBBRSB"
    - "iiiiiiiii"
    - "iiiiiiiii"
    - "iiiiiiiii"
    - "iiiiiiiii"
    - "BPBBBBBNB"
